  <!-- Theme (styles.css): light or dark before first paint, so the page never flashes. A stored
       "theme" key wins; otherwise follow the OS. try/catch: blocked storage still renders light. -->
  <script>
    try {
      var storedTheme = localStorage.getItem("theme");
      var theme = storedTheme === "light" || storedTheme === "dark"
        ? storedTheme
        : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      if (theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
    } catch (e) { /* storage or matchMedia unavailable: light */ }
  </script>
