# config/grains/lakeflow_job_reliability.yml -- P3-JOBHEALTH. Grain = the query's own key columns
# ONLY; the generator prepends window_days (DEC-24). One row per job with at least one completed
# run (an end row) in the window: the body GROUPs its end-row-deduplicated runs BY
# (workspace_id, job_id) in job_totals and JOINs every other per-job CTE on that same pair (each
# one row per pair by construction: GROUP BY or a QUALIFY ROW_NUMBER() = 1), so the pair is unique
# by construction.
lakeflow_job_reliability:
  - workspace_id
  - job_id
