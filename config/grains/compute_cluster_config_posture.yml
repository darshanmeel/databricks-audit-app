# config/grains/compute_cluster_config_posture.yml -- P3-POSTURE. Grain = the query's own key
# columns ONLY; the generator prepends window_days (DEC-24). One row per live (non-deleted)
# cluster: the body dedupes system.compute.clusters with ROW_NUMBER() OVER (PARTITION BY
# cluster_id ORDER BY change_time DESC) WHERE rn = 1 AND delete_time IS NULL, the same SCD2 shape
# classic_clusters_config_current uses (config/grains/compute_snapshots.yml) -- cluster_id is a
# globally-unique GUID, so no workspace_id is needed in the grain.
compute_cluster_config_posture: [cluster_id]
