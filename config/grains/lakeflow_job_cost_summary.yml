# config/grains/lakeflow_job_cost_summary.yml -- P3-JOBCOST. Grain = the query's own key columns
# ONLY; the generator prepends window_days (DEC-24). One row per job with at least one run counted
# by lakeflow_job_run_cost's own attribution in the window: the body GROUPs its per-run run_usage
# CTE BY (workspace_id, job_id) in job_totals and LEFT JOINs latest_jobs on that same pair (one row
# per pair via QUALIFY ROW_NUMBER() = 1), so the pair is unique by construction.
lakeflow_job_cost_summary:
  - workspace_id
  - job_id
