# Per-check materiality floors -- shape: {<query_id>: {column, min, unit, label}}.
# Applied by the app AT READ TIME (app/core/materiality.py): a CRITICAL/WARN row whose named column
# sits under `min` reads OK instead and is flagged below_floor, so counts, the worst status, the
# sort order and money sums all ignore it; NOT_ASSESSED/OK rows are never touched. The row's own
# exported `status` column is never rewritten. A query_id with no entry here, or whose named column
# the built table does not carry, behaves exactly as before. A USD `min` is PER 30 DAYS: at 7d/90d
# it scales with the window (min * window_days / 30) so a shorter window does not flag rows a
# 30-day view would call immaterial, and vice versa. Tunable here without a re-export or a dbt
# rebuild -- see app/core/config.py's load_materiality()/save_materiality().
#
# A query already gated on this same size/count inside its own SQL (e.g. cost_by_job's
# :min_dbus_per_day, cost_daily_spikes' :min_spend_usd) is left out here -- a config floor there
# would be structurally redundant with the header's own :warn_*/:crit_* param. A governance/
# existence check (a broad grant, an unmasked PII column, a stale job) is left out too -- those
# matter at any size. A check whose own status is already based on this same column (so the floor
# would just override the check's own WARN/CRITICAL split) is left out as well -- raise warn_*/
# crit_* in config/thresholds.yml instead if one of those is noisy.

