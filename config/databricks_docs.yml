# config/databricks_docs.yml -- Databricks documentation links for the Guide tab (GUIDE-SPEC 3.4).
# Only Databricks pages. URLs are never written in .jsx; app/core/databricks_docs.py loads this file.
# URL rule: the same relative path on each cloud (checked on 30+ pages). AWS https://docs.databricks.com/aws/en/<path>,
# Azure https://learn.microsoft.com/en-us/azure/databricks/<path>, GCP https://docs.databricks.com/gcp/en/<path>.
# One known exception: OpenSharing (aws path delta-sharing/, azure and gcp path opensharing/).
#
# Fields: key, title, aws, azure, gcp, anchor (no '#'), verified (true = every URL was opened;
# a list = only those clouds were opened), what (<=120 chars), enable (<=120 chars), note,
# and on concepts: areas, queries, guide_sections. Tables may carry guide_sections too.
# A link shows for a cloud only when that cloud is verified; else the AWS page, marked '(AWS page)'.
# Checked 2026-09-25: the researcher opened 59 entries; the review opened 10 more URLs
# (7 Azure concept pages, 2 per-view information_schema pages, the system tables overview).

version: 1
default_cloud: aws
default_enable: "An admin grants USE CATALOG on system, then USE SCHEMA and SELECT on the schema."

