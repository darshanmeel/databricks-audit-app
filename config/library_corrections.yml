- id: access_classified_unmasked-mask-name-unaliased
  query_id: access_classified_unmasked
  problem: 'The MASK_NAME column came through the SELECT with no column alias.'
  effect: 'Small, cosmetic: the column reached the app under a non-standard, undocumented name rather than
    a predictable snake_case one, which any code reading it by name had to work around -- and the
    actual case it surfaced under could differ by engine (DuckDB folds unquoted identifiers; Spark
    is case-preserving on the literal reference).'
  status: fixed
  fix: 'Fixed (T-75B, commit a529718): added an explicit `cm.mask_name AS mask_name` alias, so the
    output column name is deterministic regardless of engine. Bundled with the column_masks
    join-columns fix, see that entry above.'
  item: T-75B

- id: access_dead_table_candidates-lineage-caveat-wrong
  query_id: access_dead_table_candidates
  problem: The caveat says 'a SELECT whose result is never written to another table emits no lineage row
    at all', implying a read-only query is invisible to this check. But system.access.table_lineage does
    record a row for a read with no write target (source_table_name set, target NULL), and this query's
    own source_tables CTE already keeps any row with source_table_name IS NOT NULL, regardless of whether
    a target was ever written.
  effect: 'A table read only outside Unity Catalog lineage can look unused here; check before dropping it.'
  status: not_fixed
  fix: 'Correct the caveat to state plainly that a read with no write target IS captured (source_table_name
    set, target NULL) -- the real blind spot is narrower: an access Unity Catalog''s lineage capture never
    observed at all, not a plain read-only SELECT.'
  item: null
- id: query_costly_statements_grouped-distinct-warehouses-null-caveat
  query_id: query_costly_statements_grouped
  problem: 'The caveat said distinct_warehouses counts NULL as its own bucket, but the query''s
    COUNT(DISTINCT ...) ignores NULL, as COUNT(DISTINCT) always does.'
  effect: 'The caveat had the direction backwards for any serverless-touching fingerprint (NULL
    warehouse_id): a fingerprint seen only on serverless reads distinct_warehouses = 0, and a mixed
    fingerprint undercounts, not the "NULL is its own bucket" behavior the caveat claimed.'
  status: fixed
  fix: 'Fixed (T-75B, commit a529718): rewrote the caveat with the correct direction; also added a note
    stating unredacted statement_text requires the databricks_pii_access group, and that every
    redacted row otherwise collapses onto one shared fingerprint per statement_type (documentation
    only, no SQL change -- the larger redacted-statement-pooling defect itself is the separate
    register entry below, still not fixed).'
  item: T-75B

- id: lakeflow_long_running_runs-cold-start-pointer-wrong
  query_id: lakeflow_long_running_runs
  problem: 'The header''s investigate_if still told a reader with a high wait_share_pct to "use
    lakeflow_phase_cold_start''s task-level view there" -- but lakeflow_phase_cold_start is
    run-level (one row per job/run), not task-level; there is no task-level phase breakdown anywhere
    in this library.'
  effect: 'A reader following that pointer to break down which TASK inside a long run spent its time in
    setup/queue/execution would not find that view at lakeflow_phase_cold_start -- it only has a
    run-level total.'
  status: fixed
  fix: 'Fixed (T-75B, commit a529718): corrected the pointer to describe lakeflow_phase_cold_start as
    the run-level p95 view of the same setup/queue breakdown, and noted it now folds the same
    multi-task 0-sentinel this query already falls back to wall clock for.'
  item: T-75B

- id: lakeflow_workload_mix_hours-execution-zero-for-multitask
  query_id: lakeflow_workload_mix_hours
  problem: 'execution_s_total sums job_run_timeline.execution_duration_seconds at the RUN level. Per
    Databricks'' own documentation (confirmed for the sibling
    lakeflow_phase_cold_start/lakeflow_job_queue_time queries in this library), that run-level phase
    column is populated only for legacy single-task jobs and logs a literal 0 for every multi-task
    job -- it is not a real measurement of zero execution time.'
  effect: 'execution_s_total read as 0 for every multi-task job''s rows, which are the majority of runs on
    most accounts -- a reader using this query''s own workload mix to gauge how much execution time
    a run_type/trigger_type/day combination actually used would see a number that means "not
    reported", not "no execution time", with nothing in the header saying so.'
  status: fixed
  fix: 'Fixed (T-75B, commit a529718): added a caveat sentence naming the multi-task 0-sentinel. No SQL
    change -- this inventory query does NOT fold it to NULL the way its two siblings
    (lakeflow_phase_cold_start, lakeflow_job_queue_time) now do, because it is a pure SUM with no
    status band to protect from the bias a fold would otherwise correct for.'
  item: T-75B

- id: compute_serving_endpoint_cost_status-retention-lookback-not-checked
  query_id: compute_serving_endpoint_cost_status
  problem: tracking_status reads 'usage tracking likely OFF' whenever an endpoint has spend but zero rows
    in system.serving.endpoint_usage across the full :retention_days lookback (default 90). The query
    never checks whether the account's own endpoint_usage history actually reaches back :retention_days
    -- it always judges the full window regardless of how much history exists.
  effect: On an account (or workspace) whose endpoint_usage retention or onboarding history is shorter
    than :retention_days, a genuinely-tracked endpoint that simply has not accumulated :retention_days
    of history yet reads WARN 'tracking off' instead of NOT_ASSESSED -- the same lookback-vs-capture-window
    gap this library already names for lakeflow_stale_zombie_jobs.
  status: fixed
  fix: 'A retention_history CTE now reads each workspace''s own earliest captured endpoint_usage
    request_time, so not_assessed_reason=insufficient_retention_history (NOT_ASSESSED) fires only
    when some history exists but is shorter than :retention_days, leaving a workspace with no
    history at all correctly reading WARN "tracking off".'
  item: P4-FIXES28
- id: cost_account_prices_raw-header-implied-wrong-comparison
  query_id: cost_account_prices_raw
  problem: Alongside cost_actual_vs_list_by_sku's now-corrected header, this raw price-history inventory's
    own header did not yet state DEC-66.1's single price basis, so a reader could not tell which of the
    two list-price columns (pricing.default, the pre-promotion rate, vs pricing.effective_list.default,
    DEC-66.1's basis) the rest of this app actually prices with.
  effect: A reader relying on this inventory to sanity-check another finding's dollar figure could not
    tell which of the two raw price columns matched what the rest of the app reports, without cross-referencing
    the SQL of every dollar-computing query.
  status: fixed
  fix: 'Fixed (T-69A, commit ad6d6cf): the header now states DEC-66.1''s basis explicitly (confidence_note:
    ''DEC-66.1 fixes the basis this app uses everywhere: the effective list price ... pricing.default
    ... is collected here raw for reference''), and points to pricing_list_prices_raw for the effective-list
    rate this app actually prices with.'
  item: T-69A
- id: lakeflow_jobs_no_timeout-null-bucket-unused
  query_id: lakeflow_jobs_no_timeout
  problem: The query computes jobs_timeout_null (jobs whose timeout_seconds is NULL, which the header's
    own confidence_note says is ambiguous before early Dec 2025 -- 'no timeout' vs 'not yet populated')
    and emits it as its own column, but the status CASE never references it -- only jobs_no_timeout (NULL
    OR 0) drives the band.
  effect: A workspace whose jobs simply predate timeout_seconds being populated reads exactly the same
    WARN/CRITICAL band as one with genuinely no-timeout jobs -- the header's own promised 'not assessed
    - column not yet populated' degradation can never fire, because nothing in the SQL branches on jobs_timeout_null.
  status: fixed
  fix: 'jobs_timeout_null now splits into jobs_timeout_null_not_populated and
    jobs_timeout_null_after_population by a per-workspace population_floor_time, and NOT_ASSESSED
    fires only when the not-populated bucket is at least :null_bucket_material_share (default 0.5)
    of jobs_no_timeout.'
  item: P4-FIXES28
- id: lakeflow_job_tasks_no_timeout-null-bucket-unused
  query_id: lakeflow_job_tasks_no_timeout
  problem: 'Same defect as lakeflow_jobs_no_timeout: tasks_timeout_null is computed and emitted, but the
    status CASE bands only on tasks_no_timeout (NULL OR 0) and never references tasks_timeout_null.'
  effect: A workspace whose tasks predate timeout_seconds being populated (before late Nov 2025) reads
    the same WARN/CRITICAL band as one with genuinely untimed tasks -- the header's promised degradation
    for a short-history account can never fire.
  status: fixed
  fix: 'Same population-floor split as lakeflow_jobs_no_timeout (tasks_timeout_null_not_populated
    / tasks_timeout_null_after_population), gating NOT_ASSESSED only once the not-populated bucket is
    at least :null_bucket_material_share (new param, default 0.5) of tasks_no_timeout.'
  item: P4-FIXES28
- id: lakeflow_tasks_near_timeout-null-bucket-unused
  query_id: lakeflow_tasks_near_timeout
  problem: The query computes runs_no_task_timeout and runs_exec_null as degradation buckets and emits
    both, but the status CASE bands only on runs_near_timeout + runs_over_timeout and never references
    either NULL-bucket column.
  effect: A task whose runs mostly predate timeout_seconds or execution_duration_seconds being populated
    (both late Nov 2025) reads the same OK/WARN/CRITICAL band as one where every run was genuinely measured
    -- the header's own promised 'not assessed' degradation for missing data can never fire.
  status: fixed
  fix: 'status now reads NOT_ASSESSED when runs_no_task_timeout or runs_exec_null is at least
    :null_bucket_material_share (new param, default 0.5) of a task''s runs, instead of silently
    excluding them with no signal.'
  item: P4-FIXES28
- id: lakeflow_tasks_near_timeout-zero-timeout-not-a-gap
  query_id: lakeflow_tasks_near_timeout
  problem: runs_no_task_timeout counted timeout_seconds IS NULL OR = 0 together, treating an explicit
    0-second (deliberately no bound configured) timeout the same as a NULL (not yet populated) one.
  effect: A task whose timeout was deliberately left unset (0) was pooled into the same "not yet
    populated" degradation bucket as genuine missing data, muddying the NOT_ASSESSED signal and
    making a deliberate no-bound setting look like a data gap.
  status: fixed
  fix: 'A 0-second timeout is now its own explicit runs_no_timeout_bound column ("no bound
    configured", not a gap); runs_no_task_timeout is now NULL-only ("not yet populated").'
  item: P4-FIXES28
- id: lakeflow_tasks_near_timeout-near-over-double-counted
  query_id: lakeflow_tasks_near_timeout
  problem: runs_near_timeout (execution >= :near_timeout_ratio of the configured timeout) had no upper
    bound, so it already included every run counted in runs_over_timeout (execution >= the timeout
    itself).
  effect: status's (runs_near_timeout + runs_over_timeout) counted every over-timeout run TWICE, so
    WARN could fire on as few as 2 genuinely over-timeout runs at the default :warn_near_timeout_runs = 3.
  status: fixed
  fix: 'runs_near_timeout is now >= :near_timeout_ratio AND < the timeout (exclusive of
    runs_over_timeout), so the sum double-counts nothing.'
  item: P4-FIXES28
- id: lakeflow_failed_jobs_wasted_dbus-not-assessed-branch-unreachable
  query_id: lakeflow_failed_jobs_wasted_dbus
  problem: The status CASE opens with WHEN r.failed_runs IS NULL THEN 'NOT_ASSESSED', but failed_runs
    is COUNT(DISTINCT ...) (never NULL) and the outer query already filters WHERE r.failed_runs > 0 --
    so failed_runs is never NULL by the time the CASE runs, and this branch can never fire.
  effect: The header nowhere claims a NOT_ASSESSED verdict is possible on this finding, so this is dead
    code rather than a wrong verdict a reader sees -- but it is exactly the same never-fires defect this
    register already discloses for the other four lakeflow headers.
  status: fixed
  fix: 'Fixed (P4-05): the unreachable branch is gone; NOT_ASSESSED now fires, with a
    reason (no_billing_rows, no_run_id_in_billing, unpriced), when the failures cannot be priced.'
- id: compute_idle_node_ratio-money-basis-was-pre-promotion
  query_id: compute_idle_node_ratio
  problem: Before T-69A, this query priced its net_dbus/est_usd_list column at pricing.default (the pre-promotion
    sticker list rate) instead of pricing.effective_list.default (the effective, post-promotion list price)
    -- one of 14 vendored queries that mixed the two bases across the library.
  effect: Any list-price dollar estimate this query reported used the pre-promotion rate while the rest
    of the app (DEC-66.1) used the post-promotion effective-list rate -- two different 'list price' numbers
    for the same usage, depending only on which query a reader happened to be looking at.
  status: fixed
  fix: 'Fixed (T-69A, commit ad6d6cf): now prices at pricing.effective_list.default (DEC-66.1''s one basis,
    the effective post-promotion list price) throughout, with a price_basis column (free / priced / unpriced)
    added so the UI can tell a real $0 (a FREE_USAGE SKU) apart from a pricing-coverage gap.'
