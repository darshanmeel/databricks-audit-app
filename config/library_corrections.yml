  item: T-66A
- id: cost_by_job-bands-on-volume-not-waste
  query_id: cost_by_job
  problem: status bands purely on SUM(usage_quantity) per (workspace, job) per day against :warn_job_dbus_per_day
    / :crit_job_dbus_per_day -- a magnitude threshold with no efficiency, idle, or waste signal at all.
  effect: A large, legitimately busy, well-utilized resource reads CRITICAL for the same reason a genuinely
    wasteful one would -- being big -- so a CRITICAL row here does not by itself mean the resource is
    wasteful, only that it is large; a reader has to cross-check an idle/efficiency finding before acting
    on it.
  status: fixed
  fix: 'read_this/investigate_if now state plainly that status is a spend-magnitude rank, not a
    waste or efficiency signal, and point to lakeflow_job_compute_pressure / compute_idle_node_ratio
    for the efficiency cross-check; the band itself is unchanged.'
  item: P4-FIXES28
- id: cost_by_job-dbus-only-no-money
  query_id: cost_by_job
  problem: The query priced nothing -- SUM(usage_quantity) is a DBU count, not a dollar figure.
  effect: A reader had no way to compare this ranking's dollar impact against any other cost_* query
    without pricing it themselves.
  status: fixed
  fix: 'Added usd_list and price_basis, priced and disclosed the same way every other cost_* query
