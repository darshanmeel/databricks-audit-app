  fix: 'Added est_wasted_usd_list and nothing_delivered so a pipeline reads CRITICAL only when it
    billed DBUs and delivered nothing all window (an in-flight or continuous pipeline reads
    NOT_ASSESSED instead), while a large, delivering pipeline still reads WARN on size alone,
    never CRITICAL.'
  item: P4-FIXES28
- id: access_pii_propagation_untagged-any-tag-counts-as-governed
  query_id: access_pii_propagation_untagged
  problem: The TARGET side is judged 'untagged' by an anti-join against any_tagged_column, which is EVERY
    column carrying ANY governance tag at all (system.information_schema.column_tags), not specifically
    a sensitivity/PII tag -- confirmed at the CTE's own comment ('Every column that carries ANY governance
    tag').
  effect: A target column tagged with an unrelated governance tag (e.g. an ownership or lifecycle tag,
    not a sensitivity tag) reads as governed and is excluded from this finding, even though it carries
    no sensitivity classification at all -- the propagation gap this query exists to catch is silently
    missed on any target that happens to carry some other tag.
  status: fixed
  fix: Target now anti-joins against sensitive_tags (the same sensitivity-specific set the source
    side already used) instead of any_tagged_column, so only a sensitivity tag on the target counts
    as governed.
  item: P4-FIXES28
- id: access_pii_outside_tables-untagged-flagged-without-signal
  query_id: access_pii_outside_tables
  problem: Every untagged managed volume reads WARN, and every untagged EXTERNAL volume reads CRITICAL,
    purely from the absence of any tag (COALESCE(vt.tag_count, 0) = 0) -- there is no positive signal
    that the volume actually holds sensitive/PII data, only that nobody has tagged it for anything.
  effect: 'Untagged volumes and schemas count even when they hold nothing sensitive; the count is an upper bound.'
  status: not_fixed
  fix: State this design choice plainly in the header (an untagged file store is treated as CRITICAL/WARN
    by policy, not because sensitive data was confirmed) -- the query's own caveats already frame an untagged
    volume as a deliberate blind spot -- or add a secondary signal before banding.
- id: access_admin_role_change_events-token-iplist-workspace-scope-missing
  query_id: access_admin_role_change_events
  problem: Category (5), token and IP-access-list changes, only matches service_name = 'accounts' (generateDbToken,
    revokeDbToken, changeDbTokenAcl, createIpAccessList, updateIpAccessList, deleteIpAccessList). Categories
    (1)-(3) each also match the equivalent service_name = 'workspace' actions, but category (5) has no
    workspace-scoped branch at all.
  effect: A workspace-scoped token or IP-access-list change (if Databricks logs one under service_name
    = 'workspace' rather than 'accounts', the same split categories 1-3 already account for) would be
    invisible to this query -- never counted toward event_count/failed_event_count for that category,
    understating admin/security activity the header's own read_this promises to catch.
  status: fixed
  fix: Added an unconfirmed (5b) branch matching service_name = 'workspace' AND action_name RLIKE
    '(?i)token|ipaccesslist', plus a workspace_token_iplist_actions column listing every action_name
    it actually matched so a reader can confirm each one before trusting it.
  item: P4-FIXES28
- id: access_login_concentration-no-workspace-id
  query_id: access_login_concentration
  problem: This query has no workspace_id column at all (confirmed against its own SELECT) -- system.access.audit/information_schema
    rows are account- or metastore-wide here with no per-row workspace attribution surfaced.
  effect: The app's workspace filter (DEC-60, the account's own workspace picker) has nothing to filter
    this query's rows on -- selecting one workspace still shows this finding's full, account-wide rows,
    which can read as if the filter applies here when it silently does not.
  status: fixed
  fix: Added workspace_id to the SELECT/GROUP BY; distinct_source_ips stays computed account-wide
    in the principal_ips CTE since a principal's login spread is not scoped to one workspace.
