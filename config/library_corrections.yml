- id: lakeflow_pipeline_cost-bands-on-size-not-waste
  query_id: lakeflow_pipeline_cost
  problem: status bands purely on d.net_pipeline_dbus (the pipeline's total DBUs in the window) against
    :warn_pipeline_dbus / :crit_pipeline_dbus -- a magnitude threshold with no efficiency or idle signal.
  effect: A large, busy, well-utilized pipeline reads CRITICAL for the same reason a genuinely wasteful
