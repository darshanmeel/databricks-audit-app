- id: cost_cloud_infra-net-billed-cost-misleading-name
  query_id: cost_cloud_infra
  problem: The dollar column was named net_billed_cost, but it is not billed cost at all -- system.billing.cloud_infra_cost
    does not exist in this workspace, so the query estimates dollar cost as usage_quantity x list_prices.pricing.*.default;
    the name implied a real invoiced figure.
  effect: A reader summing or trusting net_billed_cost as this account's actual cloud-infra invoice would
    be trusting a list-price estimate that was never billed to the account at that rate.
  status: fixed
  fix: 'Fixed (T-69A, commit ad6d6cf): the column is renamed net_list_cost, matching the naming convention
    every other list-price-estimate column in this library uses, and priced at pricing.effective_list.default
    (DEC-66.1).'
  item: T-69A
- id: classic_clusters_config_current-identity-masking-collision
  query_id: classic_clusters_config_current
  problem: owned_by was masked with no unmasked key.
  effect: Two different cluster owners that shared a masked prefix could not be told apart when routing
    a cluster-hygiene finding to the right owner.
  status: fixed
  fix: 'Fixed (T-66A, commits f5bc411/1fb9ab6): masked in-SQL to DEC-66.3''s display format instead --
    the principal''s real id when the row carries one (e.g. a *_user_id column on the same row), otherwise
    the first 8 lowercase hex characters of sha256(lower(trim(identity))), plus a space and the first
    two characters of the raw identity plus ''***''; a value already shaped like a service-principal UUID
    passes through unchanged, and NULL / ''__REDACTED__'' are kept as-is. Two different people no longer
    collide on the same masked value.'
