version: 1
entries:
- id: cost_actual_vs_list_by_sku-ratio-backwards
  query_id: cost_actual_vs_list_by_sku
  problem: It banded CRITICAL when pricing.default / pricing.effective_list.default >= :crit_realization_ratio
    (0.90). effective_list is the promotional price, or the list price when there is no promotion, so
    that ratio is always >= 1 and every priced SKU read CRITICAL.
  effect: Every priced SKU this query looked at read CRITICAL, regardless of whether the account was actually
    paying under list -- the finding's read_this/healthy text described the opposite of what the SQL computed.
  status: fixed
  fix: 'Fixed (T-69A, commit ad6d6cf): the query now always reads NOT_ASSESSED, with not_assessed_reason
    ''no_negotiated_rate_source'' -- no negotiated-rate source exists anywhere in system.billing.usage/list_prices/attributed_usage,
    so an actual-vs-list comparison can never be computed from this data. The misleading second price
    column is dropped; only net_list_cost (the effective list price, DEC-66.1) remains, for reference.'
  item: T-69A
- id: lakeflow_failed_jobs_wasted_dbus-whole-job-not-failed-share
  query_id: lakeflow_failed_jobs_wasted_dbus
  problem: 'The header says est_usd_list turns the failed-run DBU proxy into a dollar figure, but the SELECT
    emitted only the job''s WHOLE est_usd_list, not the failed share of it.'
  effect: 'The "wasted $" figure this query reported overstated failed-run cost: it was the job''s total
    spend, not spend apportioned to the runs that actually failed -- up to failed-run-share x too
    high (e.g. a job failing 1 of 10 runs showed its FULL job cost as "wasted", not 1/10th).'
  status: fixed
  fix: 'Fixed (T-75B, commit a529718): added est_wasted_usd_list = est_usd_list * (failed_runs /
    distinct_runs) -- the SAME ratio already used for wasted_dbus_proxy. est_usd_list is unchanged
    (the job''s WHOLE list cost); read_this/caveats now say so plainly and point to
    est_wasted_usd_list as the apportioned figure. The integrator pass also wired the app''s own UI
    (tab_registry.jsx''s dollarCol, tab_jobs.jsx''s tile/chart/JOB_DIAG_FIELDS) to the new column --
    T-75B''s own claim that "no app change needed" was wrong (T-75B review must_fix 9). Superseded
    by the per-run measurement in P4-05.'
  item: T-75B
- id: lakeflow_failed_jobs_wasted_dbus-false-no-run-id-claim
  query_id: lakeflow_failed_jobs_wasted_dbus
  problem: 'The header said billing usage carries job_id but not run_id, so wasted DBUs were
    apportioned across the whole job by its failed-run share. system.billing.usage does carry
    usage_metadata.job_run_id (lakeflow_job_run_cost already reads it).'
  effect: 'The "wasted" figure was a proxy - the job''s whole spend times its failed-run share - so
    a cheap failed run on an expensive job (or the reverse) was mis-costed, and failed attempts that
    were later repaired were not counted at all.'
  status: fixed
  fix: 'Fixed (P4-05, measured part): each failed run''s own usage is priced by
    (workspace_id, job_id, job_run_id); failed attempts of runs later repaired are shared by attempt
    time and labelled; usage with no run id is shown as est_unattributed_usd_list and never spread;
    a job whose billing carries no run id reads NOT_ASSESSED.'
  item: P4-05

- id: cost_networking_egress-unit-caveat-wrong
  query_id: cost_networking_egress
  problem: The caveats say usage_unit is bytes or hours, never DBU. On billing data we've reviewed, NETWORK_BYTE
    usage on the serverless inference SKU is actually priced in DBU.
  effect: A reader who trusts the caveat and rolls this query's rows up as DBU-only, ignoring rows the
    caveat implies are non-DBU, silently drops real DBU-denominated rows.
  status: fixed
  fix: 'The caveat no longer claims usage_unit is always bytes or hours. usd_list is now priced by
    joining list_prices on each row''s own (sku_name, cloud, usage_unit) instead of assuming a unit,
    and price_basis discloses free/priced/unpriced.'
  item: P4-FIXES28
- id: cost_genai_token_gpu-unit-caveat-wrong
  query_id: cost_genai_token_gpu
  problem: 'Same caveat defect as cost_networking_egress: the header says TOKEN/GPU rows are not DBU-denominated,
    but TOKEN rows we''ve reviewed are DBU.'
  effect: A caveat-trusting rollup of this query's rows can misclassify real DBU spend as non-DBU.
  status: fixed
  fix: 'The caveat no longer claims TOKEN/GPU rows are never DBU-denominated. usd_list is now priced
    by joining list_prices on each row''s own (sku_name, cloud, usage_unit) instead of assuming a
    unit, and price_basis discloses free/priced/unpriced.'
  item: P4-FIXES28
- id: cost_dollarized_by_sku_day-null-cost-is-not-always-a-gap
  query_id: cost_dollarized_by_sku_day
  problem: The header says a NULL cost is always a priced-coverage gap, never a real $0. But *_FREE_USAGE
    SKUs have no list_prices row precisely because they are free, so their NULL cost is not a gap at all.
  effect: A reader who treats every NULL cost here as 'we don't have a price for this' over-counts the
    coverage gap and can miss that some of the NULLs are free usage that legitimately costs $0.
  status: fixed
  fix: 'Fixed (T-69A, commit ad6d6cf): a price_basis column (free / priced / unpriced) was added alongside
    net_list_cost so a reader can tell a real $0 (a FREE_USAGE SKU, no list_prices row by design) apart
    from a genuine pricing-coverage gap (a non-free SKU with no matching price row) without guessing from
    a bare NULL.'
  item: T-69A
- id: cost_cloud_infra-null-cost-is-not-always-a-gap
  query_id: cost_cloud_infra
  problem: 'Same free-usage-SKU defect as cost_dollarized_by_sku_day: NULL cost is documented as always
    a coverage gap, but free-usage SKUs have no price by design.'
  effect: Overstates the priced-coverage gap on this query's own rows by the same free-usage share.
  status: fixed
  fix: 'Fixed (T-69A, commit ad6d6cf): a price_basis column (free / priced / unpriced) was added alongside
    net_list_cost (renamed from net_billed_cost) so a reader can tell a real $0 (a FREE_USAGE SKU) apart
    from a genuine pricing-coverage gap without guessing from a bare NULL.'
  item: T-69A
- id: cost_dbsql_allocation_gap-empty-attributed-side-not-flagged
  query_id: cost_dbsql_allocation_gap
  problem: The header promises NOT_ASSESSED only when the attributed_usage table itself is absent. When
    the table exists but has zero rows in the window, the query still runs and shows only the raw side,
    with no NOT_ASSESSED signal.
  effect: A reader can mistake 'nothing was ever attributed in this window' for a verified finding, when
    in fact the attributed side was never populated for this window at all.
  status: fixed
  fix: 'Added a window-wide coverage_status column (repeated on every row) that reads NOT_ASSESSED
    when the "attributed" source_kind has zero rows anywhere in the window, so an unpopulated
    attributed side is no longer indistinguishable from "nothing was ever attributed".'
  item: P4-FIXES28
- id: cost_serving_mode_by_endpoint-whole-window-vs-daily-threshold
  query_id: cost_serving_mode_by_endpoint
  problem: 'The header defines its thresholds as PER-DAY amounts, and read_this describes the grain as
    endpoint + day + usage_type. But the SELECT/GROUP BY carried no usage_date, so the query
    actually compared a WHOLE-WINDOW total against a per-day threshold.'
  effect: 'The whole-window total is LARGER than any single day''s cost, so the old query OVERstated the
    daily rate and flagged too easily (false flags), not too leniently: at a 7-day window an
    endpoint spending only about 1/7 of the per-day threshold per day could reach WARN/CRITICAL
    (about 1/90 at 90 days).'
  status: fixed
  fix: 'Fixed (T-73, commits 638db60/294ffec): added u.usage_date to the SELECT and GROUP BY, matching
    the header''s own "endpoint + day + usage_type" grain and the sibling
    cost_vector_search_spend''s own shape. The review-fix round corrected the caveat''s direction
    (the first commit''s caveat had the bug''s effect backwards -- said it understated the daily
    rate when it actually overstated it); no further SQL change was needed.'
  item: T-73

- id: compute_serving_endpoint_cost_status-entity-fan-out-and-order-by
  query_id: compute_serving_endpoint_cost_status
  problem: 'read_this promises one row per billed endpoint, but the query LEFT JOINs every served entity the
    endpoint has ever had, with no delete-time or config-version filter, so one endpoint can produce
    several rows. Its ORDER BY CASE on status also binds to an ambiguous column, and the row cap is
    applied AFTER that fan-out join, so it can cut rows unpredictably.'
  effect: '"Count of endpoints in each cost status" is not actually a count of endpoints -- it is inflated
    by however many served-entity versions each endpoint has accumulated, and the capped page can
    silently drop real endpoints.'
  status: fixed
  fix: 'entity_agg now rolls every served entity up to one row per (workspace_id, endpoint_id)
    instead of fanning out one row per served entity, and the final ORDER BY''s status CASE now
    binds to the query''s own status column instead of the ambiguous LEFT-JOINed one.'
  item: P4-FIXES28

- id: access_vector_search_traffic-endpoint-name-always-null
  query_id: access_vector_search_traffic
  problem: The query reads request_params['endpoint_name'] to key its rows, but the vectorSearch query/scan
    audit events we've reviewed do not carry that key at all -- it reads NULL on every row.
  effect: Traffic from this query can never be tied to a specific billed vector-search endpoint; every
    row collapses under a NULL key.
  status: fixed
  fix: Added vector_search_key = COALESCE(request_params['index_name'], request_params['endpoint_name'])
    as the real grouping key; endpoint_name is kept (now MAX'd per group) for compatibility and
    distinct_index_names added as supporting context.
  item: P4-FIXES28
- id: lakeflow_phase_cold_start-zero-treated-as-measurement
  query_id: lakeflow_phase_cold_start
  problem: 'Databricks logs a literal 0 in the run-level phase-duration columns for every multi-task job
    (the phase is simply not populated at the run level for those jobs). This query treated that 0
    as a real cold-start measurement of 0 seconds rather than as "not reported".'
  effect: 'Multi-task jobs read as having a perfect (0-second) cold start, which was not a measurement --
    it silently pulled any average or "healthy" band toward a number the data never actually
    supported.'
  status: fixed
  fix: 'Fixed (T-75B, commits a529718/054ecd2): setup/queue/execution/cleanup are now read as CASE WHEN
    run_duration_seconds > 0 THEN <phase> END (not a blind NULLIF(...,0), which the review round
    found would also fold a GENUINE 0-second phase on a legacy single-task run into "not reported",
    biasing p95 upward). rows_setup_null counts both true-NULL and the folded multi-task case; a
    NOT_ASSESSED gate fires when no run in the window has run_duration_seconds > 0. confidence
    downgraded to needs_confirmation; caveats state the trade-off plainly.'
  item: T-75B

- id: lakeflow_job_queue_time-zero-treated-as-measurement
  query_id: lakeflow_job_queue_time
  problem: 'The same 0-as-measurement defect as lakeflow_phase_cold_start: the run-level queue-time phase
    column read 0 for every multi-task job run, and the query treated that as a true zero-second
    queue wait rather than "not reported".'
  effect: 'Multi-task jobs read as never queuing, which understated real queuing pressure and could hide it
    from the Jobs tab entirely.'
  status: fixed
  fix: 'Fixed (T-75B, commits a529718/054ecd2): same CASE WHEN run_duration_seconds > 0 THEN
    queue_duration_seconds END fold as lakeflow_phase_cold_start (not a blind NULLIF(...,0), which
    would also fold a genuine 0-second queue on a legacy single-task run into "not reported");
    runs_queue_null counts both true-NULL and the folded case; the job-level run_duration_seconds >
    0 NOT_ASSESSED gate is unchanged. confidence_note/caveats rewritten.'
  item: T-75B

- id: lakeflow_job_tasks_no_timeout-no-parent-job-check
  query_id: lakeflow_job_tasks_no_timeout
  problem: 'The query never checks whether the parent job still exists or is deleted -- it counts tasks with
    no timeout regardless of whether the owning job row is current.'
  effect: 'Tasks belonging to a deleted or otherwise missing job are counted as live no-timeout risk,
    inflating the finding''s row count with tasks nobody can act on.'
  status: fixed
  fix: 'Joins the latest system.lakeflow.jobs row per (workspace_id, job_id) and excludes tasks
    whose parent job is deleted or missing from tasks_no_timeout; those tasks are counted separately
    in the new orphaned_parent_tasks column instead of silently inflating the risk count.'
  item: P4-FIXES28

- id: task_cluster_utilization-swap-before-idle
  query_id: task_cluster_utilization
  problem: COALESCE(eff_swap_peak,0) > 0 is checked, and fires, before the idle-utilization branch. Any
    nonzero swap at all -- however small -- forces CRITICAL (MEMORY_PRESSURE), ahead of the idle check
    that would otherwise apply.
  effect: A cluster with a trivial, harmless amount of swap reads CRITICAL for memory pressure instead
    of being judged on its actual utilization, which can crowd out the real idle/undersized verdict the
    tile is meant to give.
  status: fixed
  fix: 'Fixed (T-72, commit 0639616): judges p90 worker/driver swap against a new :crit_swap_pct param
    (default 10) instead of any-swap-at-all, matching lakeflow_job_compute_pressure''s own swap rule --
    added to the profile CTE with a new worker_swap_p90_pct output column.'
  item: T-72
- id: query_costly_statements_grouped-redacted-statements-pooled
  query_id: query_costly_statements_grouped
  problem: 'The query has no branch for a ''<REDACTED>'' or NULL statement_text. Every redacted statement in
    the window pools into ONE fingerprint (labelled by MAX(statement_type)), rather than being
    treated as unreadable.'
  effect: 'When statement_text is redacted (the snapshot principal lacks databricks_pii_access), a large
    number of genuinely different statements collapse into a single pooled row, which can read as
    one dominant CRITICAL shape that is really an artefact of redaction, not of one query pattern.'
  status: fixed
  fix: 'A redacted statement is now keyed by its own statement_id (concat(''statement:'', statement_id)),
    never pooled with another redacted statement or with a real shape - the same keying
    query_task_statement_breakdown already uses. is_redacted marks these rows.'
  item: P4-FIXES28

- id: query_cache_coldstart-unweighted-average-diluted
  query_id: query_cache_coldstart
  problem: read_io_cache_percent is averaged unweighted (plain AVG) across all statements in a group,
    including non-scan statements that report a legitimate 0. The header's own NOT_ASSESSED branch for
    'nothing was scanned' is unreachable as written.
  effect: Groups with many non-scan statements get an average diluted toward 0 by statements the cache-hit
    question does not even apply to, which can push a group to CRITICAL as an artefact of its statement
    mix rather than real cache-cold-start pain.
  status: fixed
  fix: 'Added read_io_cache_percent_weighted_avg, a read_bytes-weighted average over statements with
    read_bytes > 0 that were not a result-cache hit (NULL-safe on from_result_cache); status now bands
    on the weighted figure and reads NOT_ASSESSED when scanned_query_count = 0. The original
    read_io_cache_percent_avg is kept unchanged for compatibility; warehouse_name and
    scanned_query_count were also added.'
  item: P4-FIXES28
- id: query_queuing_waits-null-plus-null-falls-to-ok
  query_id: query_queuing_waits
  problem: 'The band was built from SUM(a) + SUM(b), which is NULL (not a comparable value) whenever either
    sum is NULL. The CASE expression then fell through to its OK branch by default.
    SERVERLESS_COMPUTE rows report both wait sums as NULL, so they read OK without ever being
    measured. The caveat did not mention this.'
  effect: 'Every serverless-compute row in this finding read as a clean OK, when in fact queuing was never
    actually measured for it -- a NOT_ASSESSED case disguised as a pass (97 rows on the real account
    this review evidence is drawn from).'
  status: fixed
  fix: 'Fixed (T-75B, commits a529718/054ecd2): a first CASE branch now returns NOT_ASSESSED whenever
    EITHER raw SUM is NULL. The review-fix round further corrected the still-measured case:
    CRITICAL/WARN now band on COALESCE(SUM,0) + COALESCE(SUM,0) so a single reported bucket can
    still flag CRITICAL/WARN on its own, before the either-NULL NOT_ASSESSED check. The caveat now
    states plainly that NULL and 0 are never treated the same.'
  item: T-75B

- id: query_task_statement_breakdown-no-duration-floor
  query_id: query_task_statement_breakdown
  problem: The CRITICAL band has no minimum duration floor, so a short statement inside a slightly-longer
    task can be flagged CRITICAL purely because of the share of task time it occupies, not because it
    is slow in absolute terms.
  effect: Short, practically-irrelevant statements can dominate the CRITICAL count, crowding out genuinely
    slow statements a reader should prioritize.
  status: fixed
  fix: 'Added :min_stmt_ms (default 60000ms): a shape below it cannot band WARN/CRITICAL on share alone
    and reads NOT_ASSESSED with not_assessed_reason below_duration_floor instead.'
  item: P4-FIXES28
- id: query_pruning_effectiveness-no-volume-floor-daily-grain
  query_id: query_pruning_effectiveness
  problem: The query has no minimum read-volume floor, and it bands per single day even though its own
    header says one day is not a reliable signal on its own.
  effect: A large share of this query's CRITICAL rows, in our review, came from tiny single-day groups
    rather than a real recurring pruning problem -- the finding is dominated by noise rather than signal.
  status: fixed
  fix: 'Added a :min_read_bytes floor (a day below it reads NOT_ASSESSED) and days_seen/days_flagged,
    a per-(workspace, compute_type, warehouse, identity, statement_type) recurrence count across the
    window; a CRITICAL day below :min_recurring_flagged_days flagged days is capped to WARN instead of
    standing alone. warehouse_name was also added.'
  item: P4-FIXES28
- id: audit_self_cost-undocumented-marker-and-wildcard-escape
  query_id: audit_self_cost
  problem: 'The query relies on statement_text containing a specific marker string, matched with ILIKE
    ''%databricks_audit%'' -- but the header never documented that this app must emit that marker,
    and this app''s own snapshot query builder does not emit it. ILIKE also treated ''_'' as a
    single-character wildcard, which the query did not escape.'
  effect: 'As written, this finding cannot actually identify this app''s own audit-query cost on any
    account, because nothing ever writes the marker it looks for -- and the unescaped wildcard would
    over-match any statement whose text merely resembled the marker (e.g. any "databricksXaudit" for
    any single character X).'
  status: fixed
  fix: 'Partially fixed (T-75B, commits a529718/054ecd2): the wildcard is now escaped -- ILIKE
    ''%databricks!_audit%'' ESCAPE ''!'' (the review round found ESCAPE ''\'' does not parse on
    Databricks SQL, whose string-literal lexer treats a backslash as its own escape; ''!'' works
    identically on both DuckDB and Databricks SQL). The header now documents the escape and states
    plainly that this app issues no such marker itself today, so the finding still cannot produce a
    real audit-self-cost verdict on any account -- having the snapshot''s own statement builder
    actually emit the marker remains undone and unplanned.'
  item: T-75B

- id: node_timeline_utilization-order-by-keeps-least-busy
  query_id: node_timeline_utilization
  problem: 'ORDER BY avg_cpu_pct ASC LIMIT :top_n kept only the LEAST-busy groups once the cap bound.'
  effect: 'When the row cap was reached, the finding structurally read as "everything is idle" -- the
    busiest groups, which would read OK, were the ones the cap discarded first, so WARN counts were
    a lower bound rather than a true count.'
  status: fixed
  fix: 'Fixed (T-75B, commits a529718/054ecd2): rows are now ordered CASE status WHEN ''WARN'' THEN 0
    WHEN ''NOT_ASSESSED'' THEN 1 ELSE 2 END, avg_cpu_pct ASC, so the cap discards OK rows before
    WARN ones (no CRITICAL exists on this id). The review round wrapped the UNION ALL in a derived
    table so DuckDB can bind ORDER BY to that expression. :top_n''s default was also raised from 200
    to 100000 directly in the query header (not a thresholds.yml override, per DEC-66.2/66.6), and
    the caveat now names the old truncation risk.'
  item: T-75B

- id: lakeflow_jobs_on_all_purpose-null-vs-empty-and-cap-order
  query_id: lakeflow_jobs_on_all_purpose
  problem: 'The header promised to catch a NULL OR EMPTY compute_ids list, but the "dropped" CTE only tested
    compute_ids IS NULL. Separately, the row cap was applied AFTER the UNION of the placement and
    NOT_ASSESSED-summary branches, and the summary rows sorted last, so they were the first rows the
    cap cut.'
  effect: 'Jobs whose compute_ids was an empty list (rather than NULL) were missed by the "dropped" check
    (EXPLODE() of an empty array yields zero rows, so the run vanished from BOTH branches), and on a
    large account the NOT_ASSESSED summary explaining what the cap hid could itself be silently cut
    by that same cap -- once the cap bound, a flagged (WARN/CRITICAL) placement could be cut before
    an OK one.'
  status: fixed
  fix: 'Fixed (T-75B, commits a529718/054ecd2): dropped/task_compute now test compute_ids IS NULL OR
    size(compute_ids) = 0 (both branches; label reworded "null or empty compute_ids"). Rows are
    ordered CASE status WHEN ''CRITICAL'' THEN 0 WHEN ''WARN'' THEN 1 WHEN ''NOT_ASSESSED'' THEN 2
    ELSE 3 END, est_usd_list_share DESC before LIMIT. The review round wrapped the UNION ALL in a
    derived table so DuckDB can bind ORDER BY to that expression, and :top_n''s default was raised
    from 500 to 100000 directly in the query header (not a thresholds.yml override, per
    DEC-66.2/66.6).'
  item: T-75B

- id: access_views_inventory-alphabetical-cap-drops-catalogs
  query_id: access_views_inventory
  problem: 'This was an unbounded inventory ordered alphabetically with a default LIMIT of 500.'
  effect: 'On an account with many catalogs, the alphabetical order plus the cap could drop entire catalogs
    from the inventory whole -- in review, well over a hundred views were missing on one real
    account purely because of alphabetical position, not because they didn''t exist.'
  status: fixed
  fix: 'Fixed (T-75B, commits a529718/054ecd2): :top_n''s default is now 100000, set directly in the
    query header (the review round replaced a first-pass thresholds.yml override with this, per
    DEC-66.2/66.6 -- a plain default-value change, not a fix that needed a thresholds.yml override),
    and the caveat names the old truncation risk.'
  item: T-75B

- id: compute_warehouse_autoscale_churn-counts-starts-and-stops
  query_id: compute_warehouse_autoscale_churn
  problem: 'The query counts every SCALED_UP and SCALED_DOWN event, including a warehouse''s first 0->1
    start and its 1->0 stop -- these are not autoscaling churn between running clusters, they are
    ordinary starts and stops.'
  effect: 'The "churn rate" this query reports is really a start/stop frequency for warehouses that never
    ran more than one cluster, and its rung-1 action ("widen min/max clusters") cannot help a
    warehouse whose max_clusters is already 1 -- the suggested fix does not apply to the rows it is
    attached to.'
  status: fixed
  fix: 'churn_events now counts only SCALED_UP/SCALED_DOWN transitions between two already-nonzero
    cluster counts, treating a transition from/to 0 as its own start_event/stop_event rather than
    churn, and status bands on churn_events per observed hour instead of total scaling events.'
  item: P4-FIXES28

- id: sql_warehouse_events_activity-no-row-for-silent-warehouse
  query_id: sql_warehouse_events_activity
  problem: The query reads only warehouse_events. A current, non-deleted warehouse with zero events in
    the window produces NO ROW at all, even though read_this/investigate_if both promise this query detects
    dormancy.
  effect: A warehouse that is silently still billed but had no activity events in the window is invisible
    to this query -- it is not flagged, it simply never appears, which is the opposite of the dormancy
    detection the header promises.
  status: fixed
  fix: 'The warehouse key set is now current (non-deleted) system.compute.warehouses rows UNION
    warehouses seen in events, LEFT JOINed to warehouses (name, first-seen time), events, and a new
    system.billing.usage join, so a current warehouse with zero events in the window still produces
    one row (event_type NULL) and a deleted or never-captured warehouse keeps its event rows instead
    of disappearing. The zero-event row reads CRITICAL only when it also billed zero DBUs in the
    window (genuinely dormant); NOT_ASSESSED if it billed while silent or was first seen inside the
    window. Grain change: rows now carry workspace_id, previously absent from this query''s output.'
  item: P4-FIXES28
- id: access_admin_role_change_events-no-action-allow-list
  query_id: access_admin_role_change_events
  problem: 'The only filter was a service-name filter (accounts/accountsAccessControl/unityCatalog). There
    was no allow-list of which ACTIONS actually count as a role or permission change -- ordinary
    reads, credential vending and token logins under those same services all counted too.'
  effect: 'In review, more than half of the rows this query flagged as "admin role changes" were not role
    changes at all, which drowned out the real signal on the Governance tab and in the Overview
    governance line.'
  status: fixed
  fix: 'Fixed (T-73, commits 638db60/294ffec): rewrote the WHERE clause as an explicit (service_name,
    action_name) allow-list across 5 categories -- admin-role/group-membership changes,
    permission/grant changes, workspace security-conf edits, cluster-policy edits,
    token/IP-access-list changes -- sourced from Databricks'' own audit-log/diagnostic-log-reference
    documentation, and added workspace_id to the SELECT/GROUP BY. The review-fix round added the
    missing account-admin-grant, account-owner-transfer, workspace role/permission-assignment,
    share-permission-change and settings-API-edit actions the first pass had left out, added a
    separate failed_event_count (denied attempts no longer count the same as a success), and removed
    the unverified "more than half" claim from the caveat. confidence downgraded to
    needs_confirmation since the allow-list is not yet live-cross-checked. A residual gap (category
    5''s workspace-scoped branch) remains its own register entry, below.'
  item: T-73

- id: access_runas_escalation-volume-not-escalation
  query_id: access_runas_escalation
  problem: The query bands CRITICAL/WARN purely on the VOLUME of run-as events per (pair, service, action),
    not on whether the delegation itself looks like an escalation (e.g. a service principal or automation
    acting as a more-privileged human).
  effect: In our review, the large majority of this query's flagged rows are simply automation that runs
    often, not a real escalation pattern -- volume measures how much delegated automation runs, not whether
    it is risky.
  status: fixed
  fix: Bands now on delegation_kind (service-principal vs human shape) and newly_seen_pair (checked
    against this table's full retention) instead of raw event count; a known pair of any kind is OK,
    only a newly seen human-involving pair is CRITICAL.
  item: P4-FIXES28
- id: po_data_skipping_backfill-wrong-gain-key
  query_id: po_data_skipping_backfill
  problem: '''No gain from this optimization'' is judged from operation_metrics[''new_data_skipping_columns''],
    a key that real DATA_SKIPPING_COLUMN_SELECTION events we reviewed do not populate at all.'
  effect: The query's WARN band for 'ran with no gain' can fire as a false positive purely because it
    is reading a metrics key that is never actually set, not because the optimization truly had no effect.
  status: fixed
  fix: Judges gain from added_data_skipping_columns instead of new_data_skipping_columns (the latter
    is never populated by real events, kept only for reference); returns NOT_ASSESSED when added,
    removed and new are all NULL (the event carries no gain information at all).
  item: P4-FIXES28
- id: access_grants_inventory-inherited-not-excluded
  query_id: access_grants_inventory
  problem: 'The caveat said inherited privileges are excluded from the count. The query reads
    information_schema.table_privileges, which lists inherited grants too (with inherited_from set)
    -- it does not filter them out.'
  effect: 'The grant counts this query reports include inherited privileges the caveat told a reader NOT to
    expect, which overstated how many privileges were explicitly granted at this object.'
  status: fixed
  fix: 'Fixed (T-75B, commit a529718): rewrote the caveat to state the true pooling behavior -- TABLE
    scope pools explicit and inherited grants together (inherited_from is not filtered); CATALOG
    scope has no inherited_from column at all, so an inherited catalog grant is invisible here, not
    zero. No SQL change (the simpler of two offered fixes; the still-true
    ownership-derived-privilege gap is unchanged).'
  item: T-75B

- id: access_table_lineage_blast_radius-path-access-pools-to-null
  query_id: access_table_lineage_blast_radius
  problem: 'The GROUP BY omitted source_table_full_name/target_table_full_name, so every path-based, JDBC,
    or otherwise-unresolved access (both NULL) pooled into ONE fake "UNKNOWN" edge sharing one
    distinct_principals count -- while the caveat claimed path access was not captured at all.'
  effect: 'Unrelated path-based accesses by many different principals could combine into a CRITICAL
    blast-radius verdict that no single real edge earned; on a real account both WARN rows were
    exactly such pooled artefacts.'
  status: fixed
  fix: 'Fixed (T-75B, commit a529718): added WHERE source_table_full_name IS NOT NULL OR
    target_table_full_name IS NOT NULL, matching access_column_lineage_sensitive_reach''s own
    pattern; rewrote the caveat to describe the exclusion.'
  item: T-75B

- id: access_login_concentration-distinct-ip-always-0-or-1
  query_id: access_login_concentration
  problem: 'COUNT(DISTINCT source_ip_address) sat inside a GROUP BY that already included source_ip_address
    -- so within any one group there was at most one distinct IP, and the column could only ever
    read 0 or 1.'
  effect: 'The distinct_source_ips signal this finding exists to surface (a principal logging in from many
    locations) was structurally incapable of reading above 1, silently disabling that part of the
    check.'
  status: fixed
  fix: 'Fixed (T-75B, commits a529718/054ecd2): added a principal_ips CTE keyed on the raw (pre-mask)
    identity alone, computing COUNT(DISTINCT source_ip_address) over the WHOLE window, then LEFT
    JOINed back onto the query''s own principal+ip+service+action grain. The review round changed
    that join to the portable `IS NOT DISTINCT FROM` (the original `a = b OR (a IS NULL AND b IS
    NULL)` form is not hash-joinable on Spark). read_this/caveats rewritten to describe the
    corrected semantics.'
  item: T-75B

- id: access_column_lineage_sensitive_reach-no-sensitivity-input
  query_id: access_column_lineage_sensitive_reach
  problem: The query_id and header promise a sensitivity-aware reach measurement, but the SQL has no sensitivity
    input at all (no join to column_tags or data_classification) -- it is a plain column-lineage fan-out
    count.
  effect: Every row reads OK because nothing sensitive is ever actually checked -- in a real account this
    was the single largest table this query produced, and none of it says anything about sensitive-data
    reach.
  status: fixed
  fix: Joined system.information_schema.column_tags onto the source column (the same tag-name
    heuristic access_pii_propagation_untagged uses), collapsed to one row per column first so a
    multi-tagged column can't double-count an edge, added source_sensitivity_tags, and downgraded
    confidence to needs_confirmation since the join depends on that same heuristic.
  item: P4-FIXES28
- id: access_classified_unmasked-column-masks-join-columns-wrong
  query_id: access_classified_unmasked
  problem: 'The join to information_schema.column_masks used cm.CATALOG_NAME/cm.SCHEMA_NAME, following the
    published docs -- but the live system table actually exposes
    table_catalog/table_schema/table_name (the same columns this library''s own
    access_column_masks_inventory query already uses), so the join failed to bind.'
  effect: 'On a real workspace the query errored with a binder error rather than ever running, so this
    finding could never produce a real is_unmasked verdict -- it only ever surfaced as NOT_ASSESSED
    via the error path.'
  status: fixed
  fix: 'Fixed (T-75B, commit a529718): joined on
    cm.table_catalog/cm.table_schema/cm.table_name/cm.column_name, matching the live schema
    (DEC-53). Bundled with the mask_name aliasing fix, see that entry below.'
  item: T-75B

- id: lakeflow_stale_zombie_jobs-null-last-run-reads-warn
  query_id: lakeflow_stale_zombie_jobs
  problem: 'A job with a NULL last_run_start reads WARN, and the stale/retention-day lookback is judged even
    when the snapshot''s own capture window is shorter than that lookback.'
  effect: 'A job that simply has no run history captured in this snapshot (rather than one that is truly
    stale) can be flagged WARN, and a lookback judged against a too-short capture window understates
    how much evidence backs the verdict.'
  status: fixed
  fix: 'A NULL last_run_start now reads NOT_ASSESSED (not_assessed_reason
    too_young_to_call_stale) whenever this workspace''s own captured job_run_timeline history
    (capture_floor_days) is shorter than :stale_days, or the job''s own create_time is more recent
    than :stale_days ago; otherwise a NULL last_run_start still reads WARN as before, never escalated
    to CRITICAL. Added create_time and capture_floor_days columns.'
  item: P4-FIXES28

- id: lakeflow_never_started_runs-narrow-match
  query_id: lakeflow_never_started_runs
  problem: The query only matches zero-length run periods as 'never started'. It is not yet confirmed
    (pending a live-account check) whether this also captures INVALID_RUN_CONFIGURATION runs, which may
    never start for a different reason and not produce a zero-length period.
  effect: If INVALID_RUN_CONFIGURATION runs do not produce a zero-length period, this query undercounts
    jobs that never actually started, in a way that is not currently visible from the finding alone.
  status: fixed
  fix: 'Added a second, separately-reported signature -- an INVALID_RUN_CONFIGURATION run with
    no matching row in job_task_run_timeline -- unioned (never summed) into never_started_runs
    alongside the original zero-length-period match. Still UNCONFIRMED against a live account
    (confidence: needs_confirmation): read never_started_runs_zero_length and
    never_started_runs_invalid_config_no_tasks separately until confirmed.'
  item: P4-FIXES28
- id: lakeflow_job_ownership_orphans-flags-service-principal-runas
  query_id: lakeflow_job_ownership_orphans
  problem: jobs_owner_mismatch is counted as creator_user_name <> run_as_user_name, with no distinction
    for WHY they differ. A job a human creates and deliberately sets to run as a service principal --
    the recommended production pattern -- counts as a mismatch exactly the same as an orphaned or abandoned
    job.
  effect: Well-governed workspaces that correctly run production jobs as a service principal are pushed
    toward CRITICAL by this query, while a job that is created AND still runs as the same human (the actually
    risky pattern for production) reads as healthy. The verdict points the wrong way on the question it
    claims to answer.
  status: fixed
  fix: 'Fixed (T-72, commit 0639616): rewritten in place. run_as is now judged SERVICE_PRINCIPAL (an application-id
    UUID shape, the same heuristic access_runas_escalation uses), HUMAN (anything else known) or missing.
    A HUMAN run-as is now the risk signal (weighted double when the job is also scheduled, by trigger_type),
    a SERVICE_PRINCIPAL run-as reads healthy regardless of schedule, and a missing creator_user_name or
    run_as_user_name is its own risk signal. Params renamed warn_orphan_jobs/crit_orphan_jobs -> warn_ownership_risk_jobs/crit_ownership_risk_jobs
    to match.'
  item: T-72
- id: access_admin_role_change_events-identity-masking-collision
  query_id: access_admin_role_change_events
  problem: The actor identity is masked to concat(substr(actor,1,2), '****@****') with no unmasked key
    anywhere in the row. Two different people whose identity happens to share its first two characters
    mask to the exact same value.
  effect: 'Any chart or tile that groups this query''s rows by the masked actor (e.g. an ''admin role
    changes by actor'' bar) can silently merge multiple real people into one bar, and ''Worst: xx****@****''
    can name a fabricated composite actor rather than any one real person.'
  status: fixed
  fix: 'Fixed (T-66A, commits f5bc411/1fb9ab6): masked in-SQL to DEC-66.3''s display format instead --
    the principal''s real id when the row carries one (e.g. a *_user_id column on the same row), otherwise
    the first 8 lowercase hex characters of sha256(lower(trim(identity))), plus a space and the first
    two characters of the raw identity plus ''***''; a value already shaped like a service-principal UUID
    passes through unchanged, and NULL / ''__REDACTED__'' are kept as-is. Two different people no longer
    collide on the same masked value.'
  item: T-66A
