- id: lakeflow_failed_runs-no-job-id
  query_id: lakeflow_failed_runs
  problem: The query's grain is (workspace_id, run_type, trigger_type, result_state, termination_code)
    -- job_id is read from job_run_timeline in an inner CTE but dropped before the final SELECT, so no
    output row can be tied to a specific job.
  effect: This finding can never be scoped to one job -- the app's own job focus panel (tab_jobs.jsx JOB_DIAG_SPECS)
    has to treat it as unscoped and show it account-wide, so a reader investigating one job's failures
    cannot filter this query down to that job the way every other per-job diagnostic check can be.
  status: fixed
  fix: 'job_id is now carried through to the final SELECT/GROUP BY (grain now workspace_id,
    job_id, run_type, trigger_type, result_state, termination_code), with job_name and
    workspace_name added via LEFT JOIN.'
  item: P4-FIXES28
- id: lakeflow_failed_jobs_wasted_dbus-bands-on-raw-failure-count
  query_id: lakeflow_failed_jobs_wasted_dbus
  problem: The status band's failed_runs half fires on a raw count (>= :warn_failed_runs / :crit_failed_runs)
    with no normalization against distinct_runs -- a job with 3 failed runs out of 3 total bands identically
    to one with 3 failed runs out of 3,000.
  effect: A high-volume job with a tiny failure rate can flag WARN/CRITICAL on failure count alone, at
    the same threshold as a job that fails almost every time it runs -- the wasted_dbus_proxy half of
    the band is at least ratio-aware, but the failed_runs half is not, so the count alone can drive a
    misleading verdict on a job that runs very often.
  status: fixed
  fix: 'Fixed (P4-05): the band is now the failure RATE (final attempt failed / runs) or the
    possible-waste dollars, above a :min_waste_usd floor - a raw failure count no longer flags a
    high-volume job by itself.'
- id: compute_serving_endpoint_cost_status-no-wasted-dollar-figure
  query_id: compute_serving_endpoint_cost_status
  problem: The query already classified a confirmed-idle billed endpoint as status=CRITICAL ('idle waste'),
    but never put a dollar figure on that waste -- est_usd_list only ever showed the endpoint's whole
    spend, busy or not, so a reader had to cross-reference status and est_usd_list by hand to see what
    was actually wasted.
  effect: A person scanning for wasted serving spend could not read the wasted dollar amount off one
    column. A first attempt at adding one (P3-WASTEUSD's original commit) also put the endpoint's WHOLE
    spend on every one of its served-entity rows, so any screen summing the new column over rows would
    have over-counted an idle endpoint's waste by however many served entities it had.
  status: fixed
  fix: 'Fixed (P3-WASTEUSD, commits 78eaa37/2fcd087): added est_wasted_usd_list, mirroring the status
    CASE''s own CRITICAL condition -- the endpoint''s whole ROUND(est_usd_list,2) when confirmed idle,
    NULL (not 0) where idle cannot be confirmed (Vector Search, an endpoint missing from served_entities,
    or spend with usage tracking off), and 0 for real (even if low) traffic. The review-fix round then
    found and fixed the served-entity fan-out double-count: the CRITICAL amount is now divided by
    COUNT(*) OVER (PARTITION BY workspace_id, endpoint_key) so an endpoint serving several entities has
    its waste split evenly across its rows and a sum over rows counts it once, not once per served entity.
    The app''s own Waste tab/Overview tile were wired to the new column via WASTE_ITEMS (P3-WASTEUSD
    review-fix commit 2fcd087, confirmed reached by P3-UI-POSTURE-GOV''s own commit bd61f0a).'
  item: P3-WASTEUSD
- id: instance_pools_idle_capacity-no-honest-dollar-overlay-possible
  query_id: instance_pools_idle_capacity
  problem: The query has no dollar figure for the standing min_idle_instances floor -- a reader can rank
    pools by raw min_idle_instances count but not by likely $ waste.
  effect: 'Shows idle instances, not dollars; the VM bill is not in the export.'
  status: not_fixed
  fix: 'P3-WASTEUSD tried a directional overlay (est_wasted_usd_list = est_usd_list * min_idle_instances
    / max_capacity, commit 78eaa37) and its own review caught the real defect: idle pool instances bill
    no DBUs at all (only untracked cloud-provider VM cost, which no system table in this snapshot
    carries) -- est_usd_list on this query is entirely real, in-use cluster DBU spend, so scaling it by
    a configured capacity ratio mislabeled genuine work as waste (a pool with min_idle_instances ==
    max_capacity would have read 100% of its real spend as "wasted"). The review-fix round (commit
    2fcd087) removed the column and every header addition entirely, restoring the query to its exact
    pre-P3-WASTEUSD (T-69A) content -- net zero change to the shipped file. No dollar overlay exists
    for this query today because none can be honestly derived from data this snapshot captures; a real
    fix would need cloud billing data this app does not collect.'
