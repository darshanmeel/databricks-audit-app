# GENERATED-ish (hand-written, T-05-owned; not regenerated by any tool). Shared project config
# every generated model (T-06 onward) and every fixture build (T-07 onward) relies on.
name: 'databricks_audit'
version: '1.0.0'
config-version: 2

profile: 'databricks_audit'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
analysis-paths: ["analyses"]

target-path: "target"
log-path: "logs"

# F12: this repo's dbt runs (tools/dbt_run.py, tools/verify_databricks.py, every test in
# tests/test_dbt_skeleton.py and friends) should not send anonymous usage events on every build.
flags:
  send_anonymous_usage_stats: false

clean-targets:
  - "target"
  - "logs"

# vars: windows [7,30,90], env_patterns; thresholds and as_of_date/as_of_ts default to empty so
# `dbt parse` never fails for a var no --vars flag supplied yet (PLAN.md 5.1).
vars:
  windows: [7, 30, 90]
  thresholds: {}
  as_of_date: null
  as_of_ts: null
  # T-63 (DEC-60): tag_aliases is config/tag_aliases.yml's `top_tags` keys, fed by
  # tools/dbt_run.py's own load_tag_aliases() (same pattern as `thresholds` above); share_floor
  # is config/settings.yml's `tag_share_floor`. Both default empty/harmless here so `dbt parse`
  # never fails for a var no --vars flag supplied yet (same reasoning as `thresholds: {}`) --
  # dbt/models/dims/int_workspace_tag_hints.sql is the sole consumer of either var.
  tag_aliases: {}
  share_floor: 0.6
  # config/settings.yml's privacy.mask_user_identities, fed by tools/dbt_run.py. Off here so
  # `dbt parse` never fails for a var no --vars flag supplied yet; dbt/macros/mask_user.sql is the
  # sole consumer.
  mask_user_identities: false
  # Word-boundary word lists for T-23's dbt/macros/classify_env.sql dispatch (PLAN.md D11). This
  # task only declares the var; classify_env.sql (T-23) is the sole consumer.
  env_patterns:
    prod: [prod, prd, production, live]
    # DEC-49: stag alone never word-boundary-matches "staging" or "stage" (e.g. acme-staging
    # classified unknown on both engines) -- staging and stage added, stag kept.
    uat: [uat, test, qa, stag, staging, stage, sandbox, sit, nonprod, preprod]
    dev: [dev, devel]

# Generated finding models land in custom schemas findings/dims/seeds (paired with
# dbt/macros/generate_schema_name.sql, so the app always reads findings.f_<qid> /
# dims.dim_workspace regardless of which target built them).
models:
  databricks_audit:
    findings:
      +schema: findings
      +materialized: table
    dims:
      +schema: dims
      +materialized: table

seeds:
  databricks_audit:
    +schema: seeds
