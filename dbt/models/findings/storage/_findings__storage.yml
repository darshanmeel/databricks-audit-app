- name: f_po_failure_reasons
  description: 'One row = one table x workspace_id (the workspace whose compute ran the operation) x failure
    reason (`operation_status`, e.g. ''FAILED: INTERNAL_ERROR'') in the window. estimated_dbus_spent sums
    usage_quantity where usage_unit = ESTIMATED_DBU on the failed operations only - DBUs spent on work
    that did not complete (shared clusters are apportioned, so treat it as an estimate). reason/fix translate
    operation_status into plain language for the three values Databricks documents; anything else falls
    back to a generic reason/fix. is_other=true is the one pooled row for every status=OK row ranked below
    :top_n by failed_operations (every other column NULL on that row, pooled_count says how many); it
    always reads status OK.'
  meta:
    query_id: po_failure_reasons
    title: Predictive optimization failures by table and reason, with estimated DBUs spent
    domain: storage
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - po_not_enabled
    reads:
    - system.storage.predictive_optimization_operations_history
    requires: SELECT on system.storage; Public Preview (system.storage.predictive_optimization_ operations_history),
      regional, 180-day retention - if the table is not enabled for this metastore, this check errors
      and reads not assessed (system table not enabled) until it is.
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_failed_ops
      default: 5
      meaning: failed operations for a table+workspace+reason in the window that flags WARN
    - name: crit_failed_ops
      default: 20
      meaning: that flags CRITICAL
    - name: top_n
      default: 50
      meaning: how many status=OK table+workspace+reason rows, ranked by failed_operations descending,
        are kept as their own row before the rest are pooled into one is_other=true row - every WARN/CRITICAL
        row is always kept as its own row, never pooled
    confidence: needs_confirmation
    confidence_note: 'the operation_status enum values (including the embedded-colon ''FAILED: ...'' strings)
      and usage_unit=''ESTIMATED_DBU'' are the same ones po_maintenance_cost_by_table already confirms
      against a live account, but this query itself has not yet run live. The reason/fix plain-language
      copy below is new and not yet read back to a user.'
    healthy: OK - failed_operations under :warn_failed_ops for that table+workspace+reason (still worth
      a look, not yet urgent).
    investigate_if: WARN - failed_operations at/above :warn_failed_ops. CRITICAL - at/above :crit_failed_ops.
    actions:
    - for PRIVATE_LINK_SETUP_ERROR, fix the private link / network path between the metastore and this
      table's storage (network config);
    - for AUTO_TTL_COLUMN_DOES_NOT_EXIST_ERROR, point auto-TTL at a column that exists or drop the auto-TTL
      setting (config);
    - for INTERNAL_ERROR, retry - if it keeps failing, open a support ticket with operation_type and time
      (support).
    next:
    - query_id: po_maintenance_cost_by_table
      if: this table's full maintenance cost, successes included
    caveats: 'operation_status is an enum of SUCCESSFUL or a literal ''FAILED: <REASON>'' string (embedded
      colon - do not split on the first colon). usage_quantity is ESTIMATED_DBU, not dollars, and can
      lag the operation row by up to 24 hours while billing populates - the start_time < current_date()
      guard drops today''s rows but not yesterday''s still-populating values. system.storage.predictive_optimization_operations_history
      is Public Preview, regional, and retains 180 days - do not set :period_days beyond that and expect
      rows. reason/fix cover the three operation_status values Databricks'' own docs list; an account-specific
      value not listed here still gets a generic reason/fix, never an empty string. The :warn_failed_ops/
      :crit_failed_ops bands are counted per (table, workspace, reason) - a table failing from two workspaces
      in the window gets two rows, each banded on its own workspace''s failure count, not the table''s
      account-wide total. POOLING - the is_other row (workspace_id NULL, since it can pool rows from more
      than one workspace) only ever pools rows that were ALREADY status=OK on their own, and it always
      reads status OK itself, however many failed operations the pooled total holds - it never hides a
      WARN/CRITICAL row, which always keeps its own row regardless of :top_n.'
    sql_url: app/queries/app/storage/po_failure_reasons.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 ELSE 2 END, is_other, failed_operations
      DESC
  columns:
