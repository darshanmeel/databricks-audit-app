    investigate_if: total_deleted_bytes = 0 (no reclaim) with vacuum_estimated_dbu at/above :warn_noop_dbu
      (WARN) or :crit_noop_dbu (CRITICAL) - field heuristic; note this query only covers tables that WERE
      successfully vacuumed - a table missing entirely from this result may simply never run VACUUM, which
      is a coverage gap you can only see by pairing this against storage_breakdown_analyze's vacuumable_bytes
      for the same table.
    actions:
    - for zero-reclaim tables, check whether Predictive Optimization VACUUM is running on a schedule shorter
      than your actual delete/update cadence (free);
    - lengthen the VACUUM interval or disable automatic VACUUM for tables that rarely delete data (config);
    - for large tables with genuinely high churn, confirm delta.deletedFileRetentionDuration is not set
      so short that VACUUM runs (and costs DBU) far more often than needed (config/spend, see table_props_time_travel_config).
    next:
    - query_id: storage_breakdown_analyze
      if: pair reclaimed bytes against vacuumable_bytes still on disk for the same table
    - query_id: table_props_time_travel_config
      if: check the retention config driving VACUUM eligibility
    caveats: 'VACUUM exposes exactly 2 documented operation_metrics subfields - number_of_deleted_files
      and amount_of_data_deleted_bytes - both map<string,string> so both are CAST to BIGINT here. Databricks
      Delta VACUUM has no fail-safe: deleted files are gone, not recoverable, so a large total_deleted_bytes
      is not itself a red flag, it just means VACUUM did its job. This query only returns tables with
      at least one SUCCESSFUL VACUUM in the window - a table that never runs VACUUM at all will not appear
      here; use storage_breakdown_analyze''s vacuumable_bytes to spot that coverage gap instead. The :warn_noop_dbu/:crit_noop_dbu
      no-reclaim band is judged per (table, workspace) - a table vacuumed from two workspaces in the window
      gets two rows, each banded on its own workspace''s DBU and reclaimed bytes, not the table''s account-wide
      total. system.storage.predictive_optimization_operations_history is Public Preview and regional.
      Rows exist only where Predictive Optimization is enabled (default-on for accounts created on/after
      2024-11-11, older accounts still rolling out) and only for UC managed tables, so PO-disabled tables
      and all external tables never appear here regardless of VACUUM activity.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/storage/po_vacuum_reclaimed_bytes.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 WHEN 'OK' THEN 2 ELSE 3 END, vacuum_estimated_dbu
      DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - catalog_name
        - schema_name
        - table_id
        - table_name
- name: f_storage_growth
  description: One row = one table with at least one snapshot in the window. growth_bytes/growth_pct compare
    its first and last snapshot in the window - bytes only, no dollars (table_metrics_ history has no
    cost figure to attach; pair with storage_po_coverage/storage_small_files for a fuller picture, or
    cost_monthly_actuals for account-wide storage spend). dropped_in_window and no_owner are plain flags,
    independent of the growth verdict. Rows are capped inside every window_days block by the body's LIMIT
    :top_n (default 100000, threshold 'top_n').
  meta:
    query_id: storage_growth
    title: Fastest-growing tables, tables dropped in the window, tables with no owner
    domain: storage
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    reads:
    - system.storage.table_metrics_history
    requires: SELECT on system.storage; system.storage.table_metrics_history must be enabled for this
      metastore - if it is not, this check errors and reads not assessed (system table not enabled) until
      it is turned on.
    params:
    - name: period_days
      default: 30
      meaning: rolling window compared start to end
    - name: warn_growth_pct
      default: 20
      meaning: percent growth over the window that flags WARN
    - name: crit_growth_pct
      default: 50
      meaning: percent that flags CRITICAL
    - name: min_growth_bytes
      default: 1073741824
      meaning: growth_bytes below which a percent-growth verdict never fires (default = 1 GiB) - a table
        going from 1 KB to 2 KB is technically "+100%" but too small to matter
    - name: top_n
      default: 100000
      meaning: row cap - far above any account's real table count, ordered worst (fastest-growing) first
        so a cut row is always the least urgent
    confidence: needs_confirmation
    confidence_note: active_bytes, table_owner and table_dropped_time come from a live DESCRIBE of this
      table on an account that has it enabled, but this query has not yet run live end to end. Confirm
      on your account that a table you know grew a lot this month shows a matching growth_pct, and that
      a recently dropped table shows dropped_in_window=TRUE.
    healthy: OK - growth_pct below :warn_growth_pct, or growth_bytes below :min_growth_bytes, and not
      dropped in the window.
    investigate_if: WARN - growth_pct at/above :warn_growth_pct on at least :min_growth_bytes of real
      growth, or the table was dropped in the window (a drop worth a look, not a failure - flagged rather
      than hidden, at any size). CRITICAL - growth_pct at/above :crit_growth_pct on at least :min_growth_bytes.
    actions:
    - for fast growers, check retention/partitioning and whether old data should be archived or deleted
      (free/config);
    - for no_owner tables, set a table owner so someone is accountable for its lifecycle (config);
    - for a table dropped in the window, confirm the drop was intentional (free).
    next:
    - query_id: storage_small_files
      if: is a fast grower also fragmenting
    - query_id: storage_po_coverage
      if: is it missing predictive optimization
    - query_id: po_failure_reasons
      if: predictive optimization is on but not keeping up with its growth
    caveats: growth_pct is NULL when first_bytes is 0 (a table with no bytes at the start of the window
      - division avoided, not an error); such a table still reads its plain growth_bytes and flags are
      then judged on dropped_in_window alone. A table with only one snapshot in the window has first_snapshot_date
      = last_snapshot_date and growth_bytes = 0. table_dropped_time is compared to the window's own start,
      not to :period_days from each table's own first_snapshot. catalog/schema/table name, table_owner
      and table_dropped_time come from the table's LAST snapshot in the window, not its first - a table
      dropped mid-window carries the drop time that actually applies, and a rename/owner change mid-window
      shows the current name/owner, not a stale one from the start of the window.
    sql_url: app/queries/app/storage/storage_growth.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 ELSE 2 END, growth_bytes DESC NULLS
      LAST
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - table_id
- name: f_storage_po_coverage
  description: 'Two sections in one result, told apart by `section`. catalog_summary - one row per catalog:
    tables_total/tables_without_po/bytes_total/bytes_without_po and their percentages. largest_table_without_po
    - up to :top_n tables (by active_bytes) with predictive optimization off, biggest first; a to-do list,
    always WARN on its own regardless of its catalog''s status - check that catalog''s own catalog_summary
    row for the account-wide severity.'
  meta:
    query_id: storage_po_coverage
    title: Predictive optimization coverage by catalog, and the largest tables missing it
    domain: storage
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - po_not_enabled
    reads:
    - system.storage.table_metrics_history
    requires: SELECT on system.storage; system.storage.table_metrics_history must be enabled for this
      metastore - if it is not, this check errors and reads not assessed (system table not enabled) until
      it is turned on.
    params:
    - name: period_days
      default: 30
      meaning: rolling window used to find each table's latest snapshot
    - name: warn_pct_bytes_without_po
      default: 20
      meaning: percent of a catalog's bytes without predictive optimization that flags WARN
    - name: crit_pct_bytes_without_po
      default: 50
      meaning: percent that flags CRITICAL
    - name: top_n
      default: 50
      meaning: largest tables without predictive optimization to list individually - a to-do list, not
        every table missing it
    confidence: needs_confirmation
    confidence_note: predictive_optimization_enabled and active_bytes come from a live DESCRIBE of this
      table on an account that has it enabled, but this query has not yet run live end to end. Confirm
      on your account that a catalog you turned predictive optimization on for reads 0% bytes_without_po,
      and that a catalog you never touched reads close to 100%.
    healthy: OK (catalog_summary only) - pct_bytes_without_po below :warn_pct_bytes_without_po.
    investigate_if: CRITICAL (catalog_summary) - pct_bytes_without_po at/above :crit_pct_bytes_without_po.
      WARN (catalog_summary) - at/above :warn_pct_bytes_without_po. largest_table_without_po rows are
      always WARN - work through them regardless of the catalog's own status.
    actions:
    - turn on predictive optimization at the catalog level (ALTER CATALOG ... SET PREDICTIVE OPTIMIZATION
      ON) so every table in it is covered going forward (config);
    - or turn it on per table for just the largest offenders in largest_table_without_po first (config);
    - after turning it on, check po_failure_reasons for that table in case operations are failing rather
      than simply never having run (free).
    next:
    - query_id: po_failure_reasons
      if: is predictive optimization on but failing for these tables
    - query_id: storage_small_files
      if: are the largest tables without it also fragmented
    - query_id: storage_growth
      if: are they also growing fast
    caveats: catalog_summary's percentages are over tables with a snapshot inside :period_days days only
      - a catalog with no recent snapshot for any of its tables is silently absent, not a real 0%. largest_table_without_po
      rows repeat none of catalog_summary's own columns (NULL there) and vice versa - never sum pct_bytes_without_po
      or active_bytes_of_table across sections, only within one. A table dropped before the window's end
      is excluded outright from both sections.
    sql_url: app/queries/app/storage/storage_po_coverage.sql
    order_by: CASE c.section WHEN 'catalog_summary' THEN 0 ELSE 1 END, CASE status WHEN 'CRITICAL' THEN
      0 WHEN 'WARN' THEN 1 ELSE 2 END, c.pct_bytes_without_po DESC NULLS LAST, c.active_bytes_of_table
      DESC NULLS LAST
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - section
        - catalog_name
        - schema_name
        - table_id
        - table_name
- name: f_storage_small_files
  description: One row = one table (catalog.schema.table), at its latest snapshot inside :period_days
    days. avg_file_size_mb = active_bytes / active_files. status flags a table with more than :warn_min_files
    active files AND a small avg_file_size_mb - many small files add open/seek overhead per read and bloat
    the file listing even when total size is small. Rows are capped inside every window_days block by
    the body's LIMIT :top_n (default 100000, threshold 'top_n').
  meta:
    query_id: storage_small_files
    title: Tables with too many small files - slow scans, inflated listing cost
    domain: storage
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    reads:
    - system.storage.table_metrics_history
    requires: SELECT on system.storage; system.storage.table_metrics_history must be enabled for this
      metastore - if it is not, this check errors and reads not assessed (system table not enabled) until
      it is turned on.
    params:
    - name: period_days
      default: 30
      meaning: rolling window used to find each table's latest snapshot (a table with no snapshot in the
        window is not scored)
    - name: warn_min_files
      default: 1000
      meaning: active file count above which a table is scored at all
    - name: warn_max_avg_mb
      default: 32
      meaning: average file size in MB under which WARN fires (with :warn_min_files also met)
    - name: crit_max_avg_mb
      default: 8
      meaning: average file size in MB under which CRITICAL fires (with :warn_min_files also met)
    - name: top_n
      default: 100000
      meaning: row cap - far above any account's real table count, ordered worst (most files) first so
        a cut row is always the least urgent
    confidence: needs_confirmation
    confidence_note: column names (active_bytes, active_files, table_owner, table_dropped_time, table_type)
      come from a live DESCRIBE of this table on an account that has it enabled, but this query has not
      yet run live end to end. Confirm on your account that a table you know has many small files (frequent
      small-batch or streaming writes with no compaction) shows CRITICAL or WARN here, and that avg_file_size_mb
      matches DESCRIBE DETAIL's own numFiles/sizeInBytes.
    healthy: OK - active_files at/below :warn_min_files, or avg_file_size_mb at/above :warn_max_avg_mb.
    investigate_if: CRITICAL - more than :warn_min_files active files and avg_file_size_mb under :crit_max_avg_mb.
      WARN - more than :warn_min_files active files and avg_file_size_mb under :warn_max_avg_mb (and not
      already CRITICAL).
    actions:
    - run OPTIMIZE on the table to compact small files (spend);
    - turn on predictive optimization at the table or catalog level so Databricks compacts automatically
      going forward (config - see storage_po_coverage for tables missing it);
    - for a table with a high write rate, consider liquid clustering instead of a fixed partitioning scheme
      (redesign/spend).
    next:
    - query_id: storage_po_coverage
      if: is predictive optimization already off for this table
    - query_id: storage_growth
      if: is this table also growing fast - more small files coming
    - query_id: po_failure_reasons
      if: predictive optimization is on but failing to compact it
    caveats: One row per table_id, its single latest snapshot_date within :period_days days - a table
      with no snapshot in that window (dropped, or metrics not yet captured for it) is silently absent;
      widen :period_days if a known table is missing. Bytes and files only; this carries no cost figure
      (table_metrics_history has none) - pair with storage_growth for the same table's size trend. A table
      dropped before the window's end (table_dropped_time IS NOT NULL) is excluded outright, not scored.
    sql_url: app/queries/app/storage/storage_small_files.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 ELSE 2 END, l.active_files DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - table_id
- name: f_storage_target_table_discovery
  description: One row = a fully-qualified table. The target_table column is ready to paste into the :target_table
    param of the three per-table queries; table_type excludes VIEW rows only (table_type <> 'VIEW', so
    MANAGED, EXTERNAL, and any other non-VIEW type pass through). Use this to find tables eligible for
    time-travel configuration, UniFORM conversion, or Iceberg migration.
  meta:
    query_id: storage_target_table_discovery
    title: Table discovery for per-table analysis - candidates for time-travel and Iceberg migration
    domain: storage
    tier: standard
    stars: false
    origin: app
    windowed: false
    is_finding: false
    empty_if: []
    reads:
    - system.information_schema.tables
    requires: SELECT on system.information_schema; Unity Catalog required
    params: []
    confidence: needs_confirmation
    confidence_note: table_catalog, table_schema, table_name, table_type are standard information_schema
      columns; data_source_format is plausible but unverified until confirmed in your own workspace. The
      per-table queries (table_props_time_travel_config, storage_breakdown_analyze, iceberg_uniform_metadata)
      require running against each table discovered here.
    healthy: n/a - inventory
    investigate_if: n/a - inventory
    actions: []
    next:
    - query_id: table_inventory_type
      if: for a catalog-wide summary by type and format
    - query_id: po_maintenance_cost_by_table
      if: to cross-check which tables qualify for Predictive Optimization
    caveats: information_schema is privilege-aware - you see only tables/views your credentials can access,
      so this list is a floor, not the whole metastore. data_source_format (DELTA vs ICEBERG) is plausible
      but unverified until confirmed in your workspace. This carries no size columns; pair with storage_breakdown_analyze
      for actual bytes. Ported from the MIT-licensed reference (c) 2026 darshanmeel.
    sql_url: app/queries/app/storage/storage_target_table_discovery.sql
    order_by: table_catalog, table_schema, table_name
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - table_catalog
        - table_schema
        - table_name
- name: f_storage_unused_table_cost
  description: 'One row is one MANAGED or EXTERNAL table that never appeared as a lineage source in the
    window, priced. It was never read (the same candidate list access_dead_table_candidates produces).
    active_gb is that table''s latest active-bytes snapshot inside the window; est_storage_usd_month prices
    it at :storage_usd_per_gb_month. po_upkeep_usd_window is its own Predictive Optimization DBUs in the
    window at the blended account-wide list rate (price_basis discloses whether that rate could be derived
    at all, or reads no_size for a table with no size on record). est_total_usd_month is est_storage_usd_month
    plus the upkeep scaled from the window to a 30-day month - the one number to sort or budget on. days_since_altered
    / days_since_last_write read the table''s own last DDL change and the last time anything wrote to
    it (a lineage TARGET) on record, NULL when neither ever happened. Only the largest :top_n tables by
    est_total_usd_month keep their own row; is_other=true marks a single pooled row for the rest (workspace-free
    columns all NULL, pooled_count = how many), and always reads status=OK - see caveats. A table with
    no size on record is still listed, status OK and price_basis no_size: unused, but not priced.'
  meta:
    query_id: storage_unused_table_cost
    title: Unused tables - storage and upkeep cost
    domain: storage
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - po_not_enabled
    - lineage_inference_only
    - retention_window
    - privilege_scoped
    reads:
    - system.information_schema.tables
    - system.access.table_lineage
    - system.storage.table_metrics_history
    - system.storage.predictive_optimization_operations_history
    - system.billing.usage
    - system.billing.list_prices
    requires: SELECT on system.information_schema, system.access, system.storage and system.billing; system.access.table_lineage
      is GA; information_schema requires Unity Catalog; system.storage.table_metrics_history and system.storage.predictive_optimization_operations_history
      must be enabled for this metastore - if either is not, this check errors and reads not assessed
      (system table not enabled) until it is turned on
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days for the lineage-source rule (same rule as access_dead_table_candidates)
        and for the Predictive Optimization upkeep window
    - name: storage_usd_per_gb_month
      default: 0.02
      meaning: declared $/GB-month used to estimate the cloud storage bill for a table's active bytes
        - roughly Azure hot-tier blob storage, an estimate of the cloud storage bill, never a Databricks
        billing figure, and changeable in config/thresholds.yml
    - name: crit_usd_month
      default: 100
      meaning: est_total_usd_month at/above which CRITICAL
    - name: warn_usd_month
      default: 20
      meaning: at/above which WARN
    - name: top_n
      default: 500
      meaning: largest tables by est_total_usd_month kept as their own row before the rest are pooled
        into one is_other=true row
    confidence: needs_confirmation
    confidence_note: 'New app-owned query, not yet run live. The dead-table rule (a MANAGED/EXTERNAL table
      that never appears as a lineage SOURCE in the window) is the exact same rule access_dead_table_candidates
      already uses. The Predictive Optimization upkeep $ is new: that history table carries no sku_name
      of its own to join to list_prices per row, so this query derives one account-wide $/DBU rate from
      system.billing.usage rows with billing_origin_product = ''PREDICTIVE_OPTIMIZATION'' in the same
      window (still the same effective-list-price join every priced check here uses, DEC-66.1) and applies
      that one rate to each table''s own DBU count. Confirm on your account that a table you know is unused
      shows up here, that its active_gb matches a manual DESCRIBE DETAIL, and that a table with real Predictive
      Optimization activity in the window shows a non-zero po_upkeep_usd_window.'
    healthy: status OK - est_total_usd_month below :warn_usd_month. This list is already filtered to unused
      tables, so a low-dollar OK row, not an empty result, is the healthy signal to look for.
    investigate_if: 'CRITICAL - est_total_usd_month at/above :crit_usd_month. WARN - at/above :warn_usd_month.
      NOT_ASSESSED - read not_assessed_reason: ''po_upkeep_unpriced'' when the table has real Predictive
      Optimization DBUs in the window but the account had no priced PREDICTIVE_OPTIMIZATION usage to derive
      a rate from (upkeep, and so the total, unknown).'
    actions:
    - cross-check the table against system.access.audit, query.history and a manual DESCRIBE DETAIL before
      touching anything, same as access_dead_table_candidates (free);
    - if genuinely unused, drop it (or move it to a to-be-deleted schema for a cooling-off period) to
      stop paying both its storage and its upkeep every month (spend);
    - if it must be kept, turn off Predictive Optimization on it specifically to stop the upkeep $ while
      leaving the storage $ alone (config).
    next:
    - query_id: access_dead_table_candidates
      if: the same candidate list without the dollars
    - query_id: storage_po_coverage
      if: is Predictive Optimization even on for this table's catalog
    - query_id: po_maintenance_cost_by_table
      if: this table's own Predictive Optimization operations and any FAILED ones
    caveats: Inherits every caveat access_dead_table_candidates documents for the dead-table rule itself
      (lineage undercounts reads with no captured source; a candidate to cross-check, never a DROP recommendation
      on its own; system/information_schema excluded by exact name; a view-mediated read still counts
      as a source read). SIZE - active_gb is the latest snapshot inside :period_days, not the true current
      size if the table has not been snapshotted recently; a table dropped before the window's end is
      excluded, same as storage_growth. UPKEEP RATE - po_upkeep_usd_window prices every table's own DBUs
      at ONE blended account-wide $/DBU rate (see confidence_note), not a per-table price - two tables
      with the same DBU count always get the same upkeep dollars. SCALING - est_total_usd_month scales
      the window's own upkeep dollars to 30 days (upkeep * 30 / :period_days); it never rescales or forecasts
      est_storage_usd_month, which is already a monthly rate. POOLING - is_other=true always reads status=OK,
      however large the combined dollars, and only ever pools rows that were already priced (never a WARN/CRITICAL
      row, and never a NOT_ASSESSED or no_size row, which always keeps its own row regardless of :top_n
      since there is no dollar figure to pool it on). table_owner is raw unless privacy.mask_user_identities
      is on (off by default), same as access_dead_table_candidates. The current day is excluded from every
      window here, same as every other check in this app.
    sql_url: app/queries/app/storage/storage_unused_table_cost.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 WHEN 'NOT_ASSESSED' THEN 2 ELSE 3
      END, is_other, est_total_usd_month DESC NULLS LAST, table_catalog, table_schema, table_name
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - table_catalog
        - table_schema
        - table_name
- name: f_table_inventory_type
  description: One row = a catalog + schema + table_type + data_source_format combination, with the count
    of tables/views matching it. table_type tells you managed vs external vs view; data_source_format
    (when it resolves) flags DELTA vs ICEBERG. EXTERNAL tables are not eligible for Predictive Optimization,
    so a high EXTERNAL count here caps how much of po_maintenance_cost_by_table's coverage can ever reach
    100%.
  meta:
    query_id: table_inventory_type
    title: Table and view inventory by type and format
    domain: storage
    tier: deep
    stars: false
    origin: vendored
    windowed: false
    is_finding: false
    empty_if:
    - privilege_scoped
    reads:
    - system.information_schema.tables
    requires: SELECT on system.information_schema; Unity Catalog required
    params: []
    confidence: needs_confirmation
    confidence_note: Only table_type (MANAGED/EXTERNAL/VIEW) is verbatim-confirmed against Databricks
      docs; table_catalog, table_schema, and data_source_format are plausible information_schema column
      names but unverified until you run this in your own workspace and confirm they resolve.
    healthy: n/a - inventory
    investigate_if: n/a - inventory
    actions: []
    next:
    - query_id: iceberg_uniform_metadata
      if: drill into EXTERNAL / non-DELTA tables to confirm UniForm
    - query_id: po_maintenance_cost_by_table
      if: cross-check PO coverage against the EXTERNAL count here
    caveats: information_schema is privilege-aware - you only see tables/views your own credentials can
      access, so counts here are a floor, not the whole metastore. This carries no size columns; pair
      with storage_breakdown_analyze for actual bytes. data_source_format (DELTA vs ICEBERG) helps identify
      Iceberg candidates, but its presence and exact name are unverified until confirmed in your workspace.
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/storage/table_inventory_type.sql
    order_by: table_catalog, table_schema, table_type
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - table_catalog
        - table_schema
        - table_type
        - data_source_format
