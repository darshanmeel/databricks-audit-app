- name: f_po_maintenance_cost_by_table
  description: 'One row = a table x operation_type (CLUSTERING/VACUUM/etc) x operation_status combo over
    the window. estimated_dbu is the DBUs Predictive Optimization spent maintaining that table for that
    operation type - the columns that matter are operation_status (SUCCESSFUL vs a ''FAILED: INTERNAL_ERROR''
    row, note the embedded colon) and estimated_dbu; a table with FAILED rows means maintenance is not
    actually completing even though you may be paying for the attempts.'
  meta:
    query_id: po_maintenance_cost_by_table
    title: Predictive Optimization maintenance cost and status by table
    domain: storage
    tier: standard
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - po_not_enabled
    - preview_unavailable
    - ingestion_lag
    reads:
    - system.storage.predictive_optimization_operations_history
    requires: SELECT on system.storage; Public Preview (system.storage.predictive_optimization_operations_history),
      regional, 180-day retention
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_maint_dbu
      default: 20
      meaning: estimated maintenance DBUs per table+operation+status group over the window that flags
        WARN
    - name: crit_maint_dbu
      default: 100
      meaning: that flags CRITICAL (a FAILED operation_status always flags CRITICAL regardless of these)
    confidence: confirmed
    confidence_note: 'usage_quantity as ESTIMATED_DBU, the operation_status enum values (including the
      ''FAILED: INTERNAL_ERROR'' string with its embedded colon), and the up-to-24h billing-population
      lag are verified against Databricks docs.'
    healthy: no FAILED rows for the table, and estimated_dbu under :warn_maint_dbu per operation+status
      group over the window (field heuristic - tune :warn_maint_dbu for your account).
    investigate_if: any operation_status LIKE 'FAILED%' row (CRITICAL - maintenance is not completing
      on that table), or estimated_dbu at/above :warn_maint_dbu (WARN) / :crit_maint_dbu (CRITICAL) -
      field heuristic.
    actions:
    - for FAILED rows, check the table for the underlying error (schema drift, concurrent writers, permissions)
      before anything else (free);
    - for high-DBU SUCCESSFUL tables, check po_clustering_activity / po_vacuum_reclaimed_bytes for that
      table_id to see which operation type is driving the cost (free/config);
    - if a large table's maintenance cost is structural, consider a partitioning/clustering redesign,
      or exclude it from automatic PO and schedule maintenance in an off-peak window instead (spend/redesign).
    next:
    - query_id: po_clustering_activity
      if: drill into CLUSTERING rows for a specific table
    - query_id: po_vacuum_reclaimed_bytes
      if: drill into VACUUM rows for a specific table
    caveats: 'usage_quantity is ESTIMATED_DBU, not dollars - sum only, never average or otherwise combine
      across rows. operation_status is an enum of SUCCESSFUL or the literal string ''FAILED: INTERNAL_ERROR''
      (note the embedded colon - do not split on the first colon when parsing). Grouping by operation_status
      is what lets you compute a per-table success rate. usage_quantity can lag the operation row by up
      to 24 hours while billing populates - the start_time < current_date() guard drops today''s rows
      but NOT yesterday''s still-populating values, so treat the most recent day of this window as provisional.
      system.storage.predictive_optimization_operations_history is Public Preview, regional, and retains
      180 days - do not set :period_days beyond that and expect rows. No rows does not mean zero maintenance
      cost: Predictive Optimization must be enabled (ON by default only for accounts created on/after
      2024-11-11; older accounts are still rolling out) and this table covers only UC managed tables,
      so external tables and PO-disabled tables never appear.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/storage/po_maintenance_cost_by_table.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 WHEN 'OK' THEN 2 ELSE 3 END, estimated_dbu
