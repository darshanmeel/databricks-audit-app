        - window_days
        - day
        - workspace_id
        - compute_type
        - warehouse_id
        - execution_status
        - statement_type
        - executed_by
- name: f_query_failed_statements_grouped
  description: One row = one warehouse's FAILED or CANCELED statements in the window that share an error_class
    and a source. statements is how many; first_seen/last_seen bound them; sample_statement_id is the
    group's most recent statement; error_message_sample is a de-identified shape of that sample's error.
    source_kind/source_id name the dashboard, Genie space, alert, job, notebook, saved query or pipeline
    the statements came from, NULL for ad-hoc SQL with no captured source.
  meta:
    query_id: query_failed_statements_grouped
    title: Failed and canceled statements grouped by error and source
    domain: performance
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - preview_unavailable
    - compute_scope_gap
    reads:
    - system.query.history
    requires: SELECT on system.query; GA (system.query.history is generally available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_statements
      default: 10
      meaning: FAILED statements in one group at/above which it reads WARN
    - name: crit_statements
      default: 50
      meaning: the same that reads CRITICAL
    confidence: needs_confirmation
    confidence_note: 'execution_status and error_message are already read this way by query_failed_queries_daily;
      the leading [ERROR_CLASS] extraction and the source_kind/source_id grouping (query_top_by_cost''s
      own query_source precedence) are new. Confirm on your account: 1) a warehouse you know has failing
      jobs shows a matching statements count and a readable error_class; 2) a canceled statement never
      counts toward status.'
    healthy: status = OK - a CANCELED group (a cancel is not a failure), or a FAILED group under :warn_statements.
    investigate_if: status = WARN or CRITICAL - a FAILED group at/above :warn_statements (WARN) or :crit_statements
      (CRITICAL) - field heuristic; a high count sharing one error_class and source points at one systemic
      cause, not scattered flakiness.
    actions:
    - read error_message_sample for the shape of the failure and check the source job, notebook or dashboard
      for the un-redacted detail (free);
    - fix the query, permission or schema problem error_class points to, or add a retry/backoff on the
      calling job (config);
    - if failures cluster on one warehouse, check whether it is undersized or out of capacity for the
      source's load (spend).
    next:
    - query_id: query_failed_queries_daily
      if: the same failures by day, user and error
    - query_id: query_top_by_cost
      if: the same source's cost, if it also runs successfully elsewhere
    caveats: FAILED and CANCELED only - a CANCELED group always reads OK (canceling a runaway query is
      often the fix, not the problem) but is still shown, so a "cancel storm" stays visible even though
      it never flags. error_class is the leading [ERROR_CLASS] token of error_message (`^\[([A-Za-z0-9_.]+)\]`,
      built via concat/chr so Java regex on Databricks does not read the literal `[` as a nested character
      class); a message with no such prefix, or a blank error_message (redacted under customer-managed
      keys - see query_failed_queries_daily), reads 'unclassified'. source_kind/source_id follow query_top_by_cost's
      own query_source precedence (saved query, dashboard, legacy dashboard, Genie space, alert, job,
      notebook, pipeline), NULL for ad-hoc SQL with no captured source. error_message_sample is de-valued
      the same way as query_failed_queries_daily (emails and single-quoted literals stripped) and taken
      from the group's most recent statement (sample_statement_id). Regional (query.history). No identities
      are emitted.
    sql_url: app/queries/app/performance/query_failed_statements_grouped.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 ELSE 2 END, statements DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - warehouse_id
        - execution_status
        - error_class
        - source_kind
        - source_id
- name: f_query_local_spillage
  description: One row = a day + warehouse + user whose queries spilled to local disk. The column that
    matters is spilled_local_bytes_sum - bytes a shuffle/sort/join had to write to local SSD because it
    did not fit in memory. Steady spill on the same warehouse means under-provisioned memory or a skewed
    query, not a one-off.
  meta:
    query_id: query_local_spillage
    title: Queries spilling to local disk
    domain: performance
    tier: standard
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - preview_unavailable
    - compute_scope_gap
    reads:
    - system.query.history
    requires: SELECT on system.query; GA (system.query.history is generally available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_spill_gb
      default: 1
      meaning: daily local-spill GB per warehouse that flags WARN
    - name: crit_spill_gb
      default: 10
      meaning: daily local-spill GB that flags CRITICAL
    confidence: confirmed
    confidence_note: Columns verified against system.query.history in a live workspace.
    healthy: spilled_local_bytes_sum below :warn_spill_gb GB/day per warehouse (field heuristic - tune
      :warn_spill_gb for your account).
    investigate_if: spilled_local_bytes_sum at/above :warn_spill_gb GB/day (WARN) or :crit_spill_gb GB/day
      (CRITICAL) - field heuristic; sustained daily spill on the same warehouse is the real signal.
    actions:
    - rewrite the query to cut shuffle - broadcast the small side, filter earlier, avoid exploding joins
      (free);
    - raise shuffle partitions or enable disk caching, or move the workload to a warehouse with more memory
      per node (config);
    - size up to a memory-optimized node type or a larger warehouse (spend).
    next:
    - query_id: query_shuffle_write_amplification
      if: shuffle_read_bytes_sum is also high
    - query_id: query_costly_statements
      if: you want the exact statements behind a spilling warehouse
    caveats: LOCAL spill ONLY. Databricks system tables expose no spilled_remote_bytes column, so remote
      spill (disk-to-object-store) is NOT assessed - read "no rows" as "not measured", never as "no spill".
      Spill is a within-warehouse memory-pressure signal and carries no dollar figure. executed_by is
      masked in-SQL to DEC-66.3's identity format (executed_by_user_id, or when that is NULL the first
      8 hex chars of sha2(lower(trim(executed_by)), 256), + a space + the first 2 chars of the raw identity
      + '***'; NULL/'__REDACTED__' and a service-principal GUID are kept as-is). Classic-cluster spills
      can be absent from system.query.history, so this leans toward serverless / DBSQL workloads. history
      is per-region.
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/performance/query_local_spillage.sql
    order_by: spilled_local_bytes_sum DESC
  columns:
