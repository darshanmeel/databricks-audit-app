- name: f_audit_self_cost
  description: One row = a workspace + statement type describing how many queries this audit itself issued
    and how long they ran. The columns that matter are query_count and total_duration_secs - how much
    of your own query-history footprint running this audit adds.
  meta:
    query_id: audit_self_cost
    title: Cost of running this audit itself
    domain: performance
    tier: lite
    stars: false
    origin: vendored
    windowed: true
    is_finding: false
    empty_if:
