- name: f_query_cache_coldstart
  description: One row = a day + warehouse whose queries were checked for cache reuse. The column that
    drives status is read_io_cache_percent_weighted_avg (a read_bytes-weighted average over statements
    that actually scanned data) - not the plain, unweighted read_io_cache_percent_avg kept alongside it
    for reference. waiting_for_compute_ms_sum (cumulative cold-start/provisioning wait) is a separate
    signal. scanned_query_count is how many of query_count actually scanned bytes; a day with a low weighted
    average and a high low_io_cache_count is spending compute re-reading data it should be caching.
  meta:
    query_id: query_cache_coldstart
    title: Result-cache hit rate and IO-cache cold-start latency
    domain: performance
    tier: standard
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - preview_unavailable
    - compute_scope_gap
    reads:
    - system.query.history
    - system.compute.warehouses
    requires: SELECT on system.query AND system.compute; GA (system.query.history is generally available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_io_cache_pct
      default: 50
      meaning: byte-weighted read_io_cache_percent below which a day+warehouse flags WARN, and the per-query
        low-cache threshold
    - name: crit_io_cache_pct
      default: 20
      meaning: byte-weighted read_io_cache_percent below which it flags CRITICAL
    confidence: confirmed
    confidence_note: Columns verified against system.query.history in a live workspace.
    healthy: read_io_cache_percent_weighted_avg at/above :warn_io_cache_pct (field heuristic - tune :warn_io_cache_pct
      for your account).
    investigate_if: read_io_cache_percent_weighted_avg below :warn_io_cache_pct (WARN) or below :crit_io_cache_pct
      (CRITICAL) - field heuristic.
    actions:
    - re-run a representative query back-to-back to confirm it is actually cold rather than just infrequently
      reused (free);
    - pin hot tables to a warehouse that stays warm between runs, or extend the warehouse's auto-stop
      timeout to avoid cold starts between queries (config);
    - move latency-sensitive workloads to a warehouse that never idles down, such as a dedicated always-on
      warehouse (spend).
    next:
    - query_id: query_queuing_waits
      if: waiting_for_compute_ms_sum is also high
    - query_id: query_local_spillage
      if: the same warehouse also spills
    caveats: 'There are two distinct cache signals here and they are NOT one combined percentage: from_result_cache
      is a boolean (did this exact query hit the result cache) while read_io_cache_percent is the share
      of scanned bytes served from disk/IO cache - do not average or add them together. read_io_cache_percent_avg
      is a PLAIN unweighted average across every statement in the group, including non-scan statements
      that legitimately report 0 - it dilutes toward 0 for reasons unrelated to real cache-cold-start
      pain and is kept only for reference; read_io_cache_percent_weighted_avg is a read_bytes-weighted
      average over statements with read_bytes > 0 that were not themselves a result-cache hit, and is
      what status actually bands on. A day+warehouse where nothing scanned data (scanned_query_count =
      0) reads NOT_ASSESSED, never OK, and read_io_cache_percent_weighted_avg is NULL. waiting_for_compute_duration_ms
      is cold-start latency from warehouse provisioning; compilation_duration_ms is metadata/optimizer-bound
      time - the two measure different things and should not be conflated. warehouse_name is the latest
      name for warehouse_id from system.compute.warehouses (SCD2, latest row by change_time) and is NULL
      for a deleted warehouse or a NULL warehouse_id (serverless). This table is regional, so a workspace
      with warehouses in multiple regions needs one run per region to see the full picture. system.query.history
      only records queries run on SQL warehouses or serverless compute; queries on classic all-purpose
      and job clusters are never captured, so these cache metrics omit any classic-cluster workload entirely
      rather than showing it as zero.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/performance/query_cache_coldstart.sql
    order_by: read_io_cache_percent_weighted_avg ASC NULLS LAST
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - day
        - workspace_id
        - compute_type
        - warehouse_id
- name: f_query_costly_statements
  description: One row = one heavy FINISHED statement. execution_duration_ms is the column that matters
    (Databricks has no per-query dollar column; warehouse DBUs are allocated in proportion to it, so ranking
    by it ~= ranking by cost within one warehouse). pct_of_warehouse_exec_ms shows how much of that warehouse's
    total execution time this single statement ate; statement_fingerprint groups repeat shapes. Rows are
    capped inside every window_days block by the body's LIMIT :top_n (default 1000, threshold 'top_n').
  meta:
    query_id: query_costly_statements
    title: Heaviest individual SQL statements (with per-warehouse framing)
    domain: performance
    tier: standard
    stars: true
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - compute_scope_gap
    - preview_unavailable
    reads:
    - system.query.history
    requires: SELECT on system.query; GA
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_wh_share
      default: 0.1
      meaning: fraction of a warehouse's total execution time one statement must eat to flag WARN
    - name: crit_wh_share
      default: 0.25
      meaning: same for CRITICAL
    - name: top_n
      default: 1000
      meaning: row cap
    confidence: confirmed
    confidence_note: system.query.history columns verified in a live workspace.
    healthy: no single statement dominates its warehouse - pct_of_warehouse_exec_ms below :warn_wh_share
      (field heuristic - tune for your account).
    investigate_if: pct_of_warehouse_exec_ms at/above :warn_wh_share (WARN) or :crit_wh_share (CRITICAL)
      - one statement shape eating a large share of a warehouse's execution time (field heuristic).
    actions:
    - tune the statement - add filters / partition pruning, avoid full scans, cache reused CTEs (free);
    - route heavy recurring shapes to a right-sized dedicated warehouse or schedule them off-peak (config);
    - scale the warehouse up/out only after tuning, if the statement is genuinely large (spend).
    next:
    - query_id: query_costly_statements_grouped
      if: to roll repeat shapes up by fingerprint
    - query_id: query_pruning_effectiveness
      if: read_files far exceeds pruned_files
    - query_id: query_local_spillage
      if: spilled_local_bytes is high
    caveats: 'Databricks has NO per-query dollar column; warehouse DBUs are allocated in proportion to
      execution_duration_ms, so ranking by execution_duration_ms approximates cost ONLY WITHIN one warehouse
      - a longer statement on a bigger warehouse is not necessarily costlier than a shorter one elsewhere,
      which is exactly why pct_of_warehouse_exec_ms frames each statement against its own warehouse. Serverless
      rows carry warehouse_id NULL and are pooled into one NULL-warehouse partition. PRIVACY: executed_by
      is masked in-SQL to DEC-66.3''s identity format (executed_by_user_id, or when that is NULL the first
      8 hex chars of sha2(lower(trim(executed_by)), 256), + a space + the first 2 chars of the raw identity
      + ''***''; NULL/''__REDACTED__'' and a service-principal GUID are kept as-is), and statement_text
      has emails and single-quoted string literals stripped so only the query SHAPE (identifiers / structure)
      - never data values - is returned. statement_fingerprint = sha2 of that de-valued text, so identical
      shapes share a fingerprint; it is not reversible to the original query. system.query.history captures
      only SQL-warehouse and serverless statements - queries run on classic all-purpose/job clusters are
      NOT recorded at all, so a heavy classic-compute workload is entirely invisible to this ranking (absence
      here is not proof of no heavy statements).'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/performance/query_costly_statements.sql
    order_by: b.execution_duration_ms DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - statement_id
- name: f_query_costly_statements_grouped
  description: One row = one distinct statement SHAPE (statement_fingerprint) run one or more times in
    one workspace, OR one redacted statement that could not be grouped into a shape at all (is_redacted
    = true, keyed by its own statement_id). total_exec_ms (cumulative execution time across every run)
    is the column that matters - a cheap statement run 10,000 times can outweigh one heavy query. runs
    and avg_exec_ms tell you whether to fix the shape or its frequency. Rows are capped inside every window_days
    block by the body's LIMIT :top_n (default 500, threshold 'top_n').
  meta:
    query_id: query_costly_statements_grouped
    title: Heaviest SQL statement shapes, rolled up by fingerprint
    domain: performance
    tier: standard
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - compute_scope_gap
    - privilege_scoped
    reads:
    - system.query.history
    requires: SELECT on system.query; GA
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_total_hours
      default: 1
      meaning: cumulative execution hours for a single shape that flags WARN
    - name: crit_total_hours
      default: 5
      meaning: same for CRITICAL
    - name: top_n
      default: 500
      meaning: row cap
    confidence: confirmed
    confidence_note: system.query.history columns verified in a live workspace; the sibling of query_costly_statements.
    healthy: total_exec_ms below :warn_total_hours hours over the window (field heuristic - tune for your
      account).
    investigate_if: total_exec_ms at/above :warn_total_hours (WARN) or :crit_total_hours (CRITICAL) cumulative
      hours - a hot repeated shape (field heuristic). High runs + low avg_exec_ms means fix the caller
      (frequency / caching); high avg_exec_ms means tune the statement. A CRITICAL is_redacted row is
      one statement, not a repeated shape - runs is always 1 for it.
    actions:
    - cache or materialize the result when the same shape reruns with the same inputs, and dedupe callers
      (free);
    - batch / schedule the repeated shape, or move it to a right-sized warehouse (config);
    - scale only the genuinely heavy shapes, after tuning (spend).
    next:
    - query_id: query_costly_statements
      if: to see the individual runs behind a fingerprint
    - query_id: query_pruning_effectiveness
      if: a hot shape scans far more files than it prunes
    caveats: 'statement_fingerprint groups statements whose SHAPE matches after de-valuing literals, so
      two queries that differ only in string / number literals collapse to one fingerprint (intended).
      PRIVACY: sample_statement_text is de-valued (emails and single-quoted literals stripped) and the
      fingerprint is a sha2 of that text - not reversible to the original query. A statement whose text
      is redacted (NULL or ''<REDACTED>'') has no text to fingerprint on shape - it is kept as its own
      row, keyed by statement_id (concat(''statement:'', statement_id)), not pooled with any other redacted
      statement or shape; is_redacted marks these rows so a reader can tell "one shape, many runs" apart
      from "one redacted statement, one run". Cumulative execution time approximates cost only loosely
      ACROSS warehouses of different sizes (Databricks has no per-query dollar column; see query_costly_statements
      for per-warehouse framing). Serverless rows carry warehouse_id NULL; COUNT(DISTINCT warehouse_id)
      IGNORES those NULL rows entirely per standard SQL semantics (it does NOT count NULL as its own bucket)
      - a fingerprint seen only on serverless compute therefore reads distinct_warehouses = 0, and a fingerprint
      mixing serverless and warehouse runs undercounts the number of distinct compute contexts it actually
      ran on. Reading unredacted statement_text requires the snapshot principal to be an account admin
      or a member of the databricks_pii_access group (or the workspace equivalent); otherwise every statement_text
      here reads ''<REDACTED>'' and is_redacted = true for that row. system.query.history only captures
      statements run on SQL warehouses or serverless compute; work on classic all-purpose/job clusters
      is never recorded, so a heavy shape running on classic compute will not appear here at all. workspace_id
      is added to the SELECT and GROUP BY so the app''s workspace filter can narrow this check; a shape
      (or redacted statement_id) that ran in more than one workspace now gets one row per workspace instead
      of one pooled row, so runs/total_exec_ms/distinct_warehouses are scoped to a single workspace each
      - narrower, not wrong, but no longer a cross-workspace total.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/performance/query_costly_statements_grouped.sql
    order_by: total_exec_ms DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - statement_fingerprint
- name: f_query_failed_queries_daily
  description: One row = a day + warehouse + status + statement_type of failed or canceled queries, broken
    out by who ran them. The columns that matter are query_count (how many failed or were canceled that
    day) and error_message_sample (a de-identified shape of the most recent error) - a repeated high count
    on the same warehouse/statement_type points to a systemic issue (bad credentials, a broken job, schema
    drift), not one-off flakiness.
  meta:
    query_id: query_failed_queries_daily
    title: Failed and canceled queries by day
    domain: performance
    tier: standard
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - preview_unavailable
    - compute_scope_gap
    reads:
    - system.query.history
    requires: SELECT on system.query; GA (system.query.history is generally available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_failed_count
      default: 5
      meaning: failed/canceled query count per day+warehouse+statement_type that flags WARN
    - name: crit_failed_count
      default: 20
      meaning: '... that flags CRITICAL'
    confidence: confirmed
    confidence_note: The execution_status enum (FINISHED/FAILED/CANCELED) and error_message behavior under
      customer-managed keys were verified against system.query.history in a live workspace.
    healthy: query_count below :warn_failed_count per day+warehouse+statement_type (field heuristic -
      tune :warn_failed_count for your account).
    investigate_if: query_count at/above :warn_failed_count (WARN) or :crit_failed_count (CRITICAL) -
      field heuristic; a spike concentrated on one warehouse or statement_type is the real signal.
    actions:
    - read error_message_sample for the shape of the failure and check the source job/notebook logs for
      the un-redacted detail (free);
    - fix the query, permission, or schema issue it points to, or add a retry/backoff on the calling job
      (config);
    - if failures cluster around an unstable warehouse (capacity errors), resize it or move the workload
      to a more resilient one (spend).
    next:
    - query_id: query_costly_statements
      if: you want the individual failed statements
    - query_id: query_queuing_waits
      if: failures cluster with queuing or cold-start
    caveats: execution_status here is FINISHED/FAILED/CANCELED - only FAILED and CANCELED rows are included,
      so a spike in CANCELED does not necessarily mean anything broke, it may mean users are cancelling
      long-running queries. error_message is empty under customer-managed keys (CMK), so MAX() returns
      blank for those rows even though a failure happened - read a blank error_message_sample as "redacted
      by your key policy," not "no detail available." Some environments still need the query-history schema
      explicitly enabled by an account admin before rows appear here - if this returns zero rows and you
      know queries have failed, confirm system.query.history is enabled for your metastore before concluding
      there were no failures. This table is regional. Classic/all-purpose clusters are not captured here
      - only SQL-warehouse and serverless statements are.
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/performance/query_failed_queries_daily.sql
    order_by: query_count DESC
  columns:
