    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - day
        - workspace_id
        - compute_type
        - warehouse_id
        - executed_by
- name: f_query_per_query_estimate_lane
  description: One row = one finished, non-cached query on a SQL warehouse or serverless compute. The
    columns that matter are execution_duration_ms (used to allocate warehouse DBU cost across queries)
    and waiting_for_compute_duration_ms (should be netted out before allocating, since it is provisioning
    wait, not query work). There is no per-query dollar or DBU column here - use this as the weighting
    input for spreading system.billing.usage's hourly warehouse DBU total across the queries that ran
    in that hour, not as a cost figure on its own.
  meta:
    query_id: query_per_query_estimate_lane
    title: Per-query duration and bytes for cost-estimate allocation
    domain: performance
    tier: deep
    stars: false
    origin: vendored
    windowed: true
    is_finding: false
    empty_if:
    - schema_not_enabled
    - preview_unavailable
    - compute_scope_gap
    reads:
    - system.query.history
    requires: SELECT on system.query; GA (system.query.history is generally available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    confidence: confirmed
    confidence_note: Columns verified against system.query.history in a live workspace; this query returns
      raw per-statement rows for per-statement cost allocation, not an aggregate.
    healthy: n/a - inventory
    investigate_if: n/a - inventory
    actions: []
    next:
    - query_id: query_costly_statements
      if: for the same per-query granularity with pruning/shuffle/spill signals attached
    - query_id: cost_dollarized_by_sku_day
      if: for the aggregate dollar figure this table feeds into
    caveats: This is an ESTIMATE-LANE INPUT ONLY - there is no per-query DBU or dollar column anywhere
      in system tables. To turn this into a dollar estimate, allocate system.billing.usage's hourly warehouse
      DBU total across the queries that ran in that hour, weighted by execution_duration_ms (net of waiting_for_compute_duration_ms),
      optionally further weighted by total_task_duration_ms or read_bytes, and reconcile so the per-query
      estimates sum back to the metered DBU for that hour. Serverless rows have warehouse_id NULL and
      are excluded here - serverless cost has to be attributed by job_id instead, from a different table.
      There is no query_hash column, so you cannot group same-shape queries together from this table alone.
      The result set can be large - narrow :period_days or add a duration threshold if you are running
      this ad hoc. This table is regional while billing data is global, so any dollar attribution you
      build on top of this is only valid within one region at a time. Classic clusters are absent from
      this table entirely.
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/performance/query_per_query_estimate_lane.sql
    order_by: usage_hour, warehouse_id, statement_id
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - statement_id
- name: f_query_provenance_by_source
  description: One row = a workspace + compute + identity + source_kind (job, dashboard, legacy_dashboard,
    notebook, alert, genie, sql_editor, or other) describing where queries came from. The columns that
    matter are source_kind (which surface issued the query) and query_count - a workspace dominated by
    "other" or split evenly between ad-hoc (sql_editor/notebook) and scheduled (job) sources tells you
    whether spend is coming from production pipelines or exploratory work.
  meta:
    query_id: query_provenance_by_source
    title: Query volume and duration by source (job, dashboard, notebook, ad-hoc)
    domain: performance
    tier: standard
    stars: false
    origin: vendored
    windowed: true
    is_finding: false
    empty_if:
    - schema_not_enabled
    - preview_unavailable
    - compute_scope_gap
    - privilege_scoped
    reads:
    - system.query.history
    requires: SELECT on system.query; GA (system.query.history is generally available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    confidence: needs_confirmation
    confidence_note: The nested query_source struct's dotted-path access (query_source.job_info.job_id,
      query_source.dashboard_id, etc.) and the single-winner CASE precedence used to pick one source_kind
      per query are not verified verbatim against a live workspace. The subfield names themselves are
      confirmed, but Databricks' own documentation says multiple subfields can be populated on the same
      query simultaneously and are not execution-ordered, so this CASE is a heuristic, not authoritative
      attribution. Confirm the struct path resolves in your workspace, and consider emitting all non-null
      source flags instead of a single winner if you need exact attribution.
    healthy: n/a - inventory
    investigate_if: n/a - inventory
    actions: []
    next:
    - query_id: query_workload_mix_hours
      if: for the same volume broken out by hour-of-day instead of source
    - query_id: query_per_query_estimate_lane
      if: to turn this volume into a cost estimate
    caveats: 'Each query_source subfield is NULL when that entity was not involved in the query, so a
      row''s source_kind reflects only the first non-null subfield in the CASE precedence order above
      (job, then dashboard, then legacy_dashboard, then notebook, then alert, then genie, then sql_editor)
      - not necessarily the only surface involved in that query. Provenance only covers Databricks-native
      entities (jobs, dashboards, notebooks, alerts, Genie spaces, the SQL editor); anything issuing SQL
      from outside these (a third-party BI tool, a raw API call) will show up as "other." If your workspace
      rejects grouping by a doubly-nested subfield like job_info.job_id, extract it into a scalar in a
      subquery before grouping. executed_by is masked in-SQL to DEC-66.3''s identity format (executed_by_user_id,
      or when that is NULL the first 8 hex chars of sha2(lower(trim(executed_by)), 256), + a space + the
      first 2 chars of the raw identity + ''***''; NULL/''__REDACTED__'' and a service-principal GUID
      are kept as-is); identity_type is a coarse user/service_principal/unknown split derived from the
      raw identity, not a verified directory lookup. If you need exact run-as attribution for service
      principals, also check executed_as / executed_as_user_id, which this query does not select. NEEDS
      CONFIRMATION: nested-struct dotted-path access + CASE attribution precedence are UNVERIFIED. Confirm
      the struct path resolves and decide whether to emit ALL non-null source flags rather than a single
      CASE winner (simultaneous population is documented). system.query.history only captures queries
      run on SQL warehouses or serverless compute, so any job, notebook, or ad-hoc query executed on classic
      all-purpose or job clusters is entirely absent here, systematically undercounting those source_kinds.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/performance/query_provenance_by_source.sql
    order_by: workspace_id, compute_type, source_kind
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - compute_type
        - warehouse_id
        - identity_type
        - executed_by
        - source_kind
        - job_id
        - dashboard_id
        - notebook_id
- name: f_query_pruning_effectiveness
  description: One row = a day + warehouse + identity + statement_type whose queries pruned or read files
    during a scan. The columns that matter are pruned_files_sum and read_files_sum - together they give
    pruning_ratio (pruned / (pruned + read)); a low ratio on a repeating group means partition or file
    layout, or the query's own predicates, are not letting Databricks skip files it should be skipping.
    days_seen and days_flagged say, for that same (workspace, compute_type, warehouse, identity, statement_type)
    pattern across the whole window, how many days were observed and how many flagged WARN or CRITICAL
    - a CRITICAL day that is a one-off (days_flagged below :min_recurring_flagged_days) reads WARN instead,
    since one bad day is not the recurring-pattern signal this query exists to surface.
  meta:
    query_id: query_pruning_effectiveness
    title: File-pruning effectiveness per query group
    domain: performance
    tier: standard
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - preview_unavailable
    - compute_scope_gap
    - privilege_scoped
    reads:
    - system.query.history
    - system.compute.warehouses
    requires: SELECT on system.query AND system.compute; GA (system.query.history is generally available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_prune_ratio
      default: 0.5
      meaning: pruning ratio (pruned_files / (pruned_files + read_files)) below which a day flags WARN
    - name: crit_prune_ratio
      default: 0.2
      meaning: '... below which it flags CRITICAL'
    - name: min_read_bytes
      default: 1073741824
      meaning: minimum read_bytes_sum a day must have before it is judged on its own - below it the day
        reads NOT_ASSESSED
    - name: min_recurring_flagged_days
      default: 2
      meaning: number of flagged days the same (workspace, compute_type, warehouse, identity, statement_type)
        pattern must show in the window before a CRITICAL day is trusted alone - a one-off flagged day
        is capped at WARN
    confidence: confirmed
    confidence_note: Columns verified against system.query.history in a live workspace.
    healthy: pruning_ratio at/above :warn_prune_ratio (field heuristic - tune :warn_prune_ratio for your
      account), or the day's read_bytes_sum is below :min_read_bytes (too little volume to judge, reads
      NOT_ASSESSED).
    investigate_if: pruning_ratio below :warn_prune_ratio (WARN) or below :crit_prune_ratio (CRITICAL)
      - field heuristic; a CRITICAL day only stays CRITICAL when days_flagged reaches :min_recurring_flagged_days
      for that pattern, otherwise it is capped to WARN. A stable low ratio on the same table/warehouse
      combination over several days is the real signal, not one bad day.
    actions:
    - check whether your WHERE/JOIN predicates actually align with the table's partition, Z-order, or
      liquid-clustering columns (free);
    - run OPTIMIZE / re-cluster the table on the columns these queries filter by (config);
    - if the table is still poorly organized after re-clustering, repartition or rewrite it with a layout
      that matches the query pattern (spend - a rewrite cost).
    next:
    - query_id: query_local_spillage
      if: the same warehouse also spills, pointing to under-provisioned memory on top of poor pruning
    - query_id: query_shuffle_write_amplification
      if: the same reads are also shuffle-heavy
    caveats: Pruning effectiveness here is pruned_files / (pruned_files + read_files) - there is no total-partition
      denominator and no per-table rollup in system tables, so this is per-statement-group only, never
      "percent of your table pruned." read_partitions is a POST-pruning count (partitions actually read
      after pruning), not partitions pruned - do not read it as the inverse of pruned_files. The WHERE
      clause only includes rows where pruning or reading actually happened, guarding out non-scan statements;
      whether Databricks reports NULL or 0 for these counters on a non-scan statement is undocumented,
      so treat a missing row as "not a scan," not "perfect pruning." A day below :min_read_bytes reads
      NOT_ASSESSED rather than being banded on too little volume to mean anything - most CRITICAL rows
      on a small account came from tiny single-day groups, not a real recurring pruning problem, before
      this floor existed. days_seen/days_flagged are computed per (workspace_id, compute_type, warehouse_id,
      executed_by, statement_type) across the WHOLE window, not just the current day, so they are stable
      across every row of the same pattern. warehouse_name is the latest name for warehouse_id from system.compute.warehouses
      (SCD2, latest row by change_time) and is NULL for a deleted warehouse or a NULL warehouse_id (serverless).
      This table is regional. system.query.history only captures queries run on SQL warehouses or serverless
      compute; queries on classic all-purpose or job clusters never appear here, so poor pruning on those
      clusters is entirely invisible to this analysis.
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/performance/query_pruning_effectiveness.sql
    order_by: e.pruning_ratio ASC NULLS LAST
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - day
        - workspace_id
        - compute_type
        - warehouse_id
        - executed_by
        - statement_type
- name: f_query_queuing_waits
  description: One row = a day + warehouse whose queries waited before or during execution. The columns
    that matter are avg_wait_ms (the average combined wait of statements that waited at all - CRITICAL/WARN
    is judged on this, not the day's raw total, so one busy warehouse with many small waits does not outrank
    a warehouse with one genuinely long wait) and, for scale, waiting_at_capacity_ms_sum (queued because
    the warehouse was already at max concurrency/scale) and waiting_for_compute_ms_sum (compute was still
    provisioning - cold start). A warehouse that shows up here repeatedly on the same day-of-week/hour
    pattern is under-sized or under-scheduled for its load, not just unlucky once.
  meta:
    query_id: query_queuing_waits
    title: Queries queued for capacity or compute provisioning
    domain: performance
    tier: standard
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - compute_scope_gap
    reads:
    - system.query.history
    requires: SELECT on system.query; GA (system.query.history is generally available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_queue_secs
      default: 60
      meaning: a day+warehouse's average combined queued-for-capacity + waiting-for-compute seconds, across
        its own statements that waited at all, that flags WARN
    - name: crit_queue_secs
      default: 600
      meaning: the same average that flags CRITICAL
    confidence: confirmed
    confidence_note: Columns verified against system.query.history in a live workspace.
    healthy: avg_wait_ms below :warn_queue_secs seconds (field heuristic - tune :warn_queue_secs for your
      account).
    investigate_if: avg_wait_ms at/above :warn_queue_secs seconds (WARN) or :crit_queue_secs seconds (CRITICAL)
      - field heuristic; waits that recur on the same warehouse are the real signal, not a single spike.
    actions:
    - check whether the wait clusters at specific hours before changing anything, e.g. against query_workload_mix_hours
      (free);
    - raise the warehouse's max clusters/scaling limit, or keep it warm through the busy window with a
      longer auto-stop (config);
    - split the workload onto a second warehouse, or size up the existing one, if concurrency is structurally
      too high for one warehouse (spend).
    next:
    - query_id: query_workload_mix_hours
      if: to see if waits line up with a load spike by hour
    - query_id: query_local_spillage
      if: the same warehouse also spills once queries do get compute
    caveats: 'There are only two queue buckets in system tables: waiting_at_capacity_duration_ms (queued
      because the warehouse was at capacity) and waiting_for_compute_duration_ms (compute was still being
      provisioned / cold start) - there is no separate "repair" or "retry" bucket, so a query that failed
      and retried shows up as ordinary duration, not as a distinct wait category. AVG_WAIT_MS is judged
      PER STATEMENT, not per day: a "statement that waited" is one whose COALESCE(waiting_at_capacity_duration_ms,
      0) + COALESCE(waiting_for_compute_duration_ms, 0) is greater than 0; avg_wait_ms is the SUM of that
      combined wait across those statements divided by how many of them there are. A busy warehouse with
      many statements each waiting a second or two now reads on that typical wait, not on the day''s summed
      total - the old day-total sum flagged CRITICAL on 1,000 one-second waits (1,000 seconds summed)
      even though no single statement waited long. SUM() ignores NULL rows but returns NULL itself when
      EVERY row in a (day, warehouse) group is NULL for that column. NOT_ASSESSED is checked only when
      avg_wait_ms does not already clear CRITICAL/WARN, and triggers when EITHER bucket''s raw SUM is
      NULL across the whole group (SERVERLESS_COMPUTE rows, for example, can report both buckets NULL
      for the whole day) - so a group where only one bucket is ever reported (the other genuinely never
      captured) still reads NOT_ASSESSED here rather than a silent false OK on the reported bucket alone,
      unless the reported bucket''s own average already clears a status band, which is judged first and
      is never masked by this. A 0 (a real, observed zero-second wait) is NOT the same as this NULL case:
      a statement that never waited at all is simply not counted in avg_wait_ms''s numerator or denominator,
      and a group where every statement''s wait was genuinely 0 has no "statement that waited" (avg_wait_ms
      is NULL, reading OK), never NOT_ASSESSED. This query does NOT assume NULL means 0. system.query.history
      only captures queries run on SQL warehouses or serverless compute; queries on classic all-purpose
      or job clusters are never recorded, so a workload that runs largely on classic clusters can look
      queue-free here even when it isn''t.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/performance/query_queuing_waits.sql
    order_by: (waiting_at_capacity_ms_sum + waiting_for_compute_ms_sum) DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - day
        - workspace_id
        - compute_type
        - warehouse_id
- name: f_query_shuffle_write_amplification
  description: 'One row = a day + warehouse + identity + statement_type whose queries shuffled data or
    wrote files. Two independent signals live in this row: shuffle_read_bytes_sum (a shuffle-heavy or
    skewed-join signal) and written_files_sum versus written_bytes_sum (write amplification - lots of
    small files instead of a few well-sized ones). Check both; a query can be shuffle-heavy without writing
    anything, or write badly without shuffling.'
  meta:
    query_id: query_shuffle_write_amplification
    title: Shuffle-heavy queries and small-file write amplification
    domain: performance
    tier: standard
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - preview_unavailable
    - compute_scope_gap
    reads:
    - system.query.history
    requires: SELECT on system.query; GA (system.query.history is generally available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_shuffle_gb
      default: 50
      meaning: daily shuffle_read_bytes per group that flags WARN
    - name: crit_shuffle_gb
      default: 200
      meaning: '... that flags CRITICAL'
    - name: warn_avg_file_mb
      default: 32
      meaning: average written-file size in MB below which a group flags WARN (small-file amplification)
    - name: crit_avg_file_mb
      default: 8
      meaning: '... below which it flags CRITICAL'
    confidence: confirmed
    confidence_note: Columns verified against system.query.history in a live workspace.
    healthy: shuffle_read_bytes_sum below :warn_shuffle_gb GB/day AND average written-file size at/above
      :warn_avg_file_mb MB (field heuristics - tune :warn_shuffle_gb / :warn_avg_file_mb for your account).
    investigate_if: shuffle_read_bytes_sum at/above :warn_shuffle_gb GB (WARN) or :crit_shuffle_gb GB
      (CRITICAL), OR average written-file size below :warn_avg_file_mb MB (WARN) or :crit_avg_file_mb
      MB (CRITICAL) - field heuristics; either signal alone is enough to flag the row.
    actions:
    - for shuffle, check the join/aggregation for a skewed key or a missing broadcast hint; for small
      files, check whether the write has a narrow partition-by or a streaming micro-batch producing many
      tiny files (free);
    - tune shuffle partitions and the broadcast-join threshold, or enable auto-compaction / optimized
      writes on the target table (config);
    - run OPTIMIZE to compact existing small files, or move the write to a warehouse with more memory
      to reduce spill-driven shuffle (spend).
    next:
    - query_id: query_local_spillage
      if: the same warehouse also spills - shuffle and spill often co-occur
    - query_id: query_pruning_effectiveness
      if: small files hurt pruning too, on the read side
    caveats: shuffle_read_bytes is a shuffle-heavy / skewed-join signal, not a cost figure. written_files
      versus written_rows/written_bytes is what tells you about write amplification (many small files
      instead of a few well-sized ones) - neither column alone is meaningful, only their ratio. The WHERE
      clause only includes rows that actually shuffled or wrote something, so a quiet day for a warehouse
      means no matching rows here, not zero activity. This table is regional. Classic-cluster statements
      are absent from system.query.history entirely, so this leans toward SQL-warehouse and serverless
      workloads.
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/performance/query_shuffle_write_amplification.sql
    order_by: shuffle_read_bytes_sum DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - day
        - workspace_id
        - compute_type
        - warehouse_id
        - executed_by
        - statement_type
- name: f_query_task_statement_breakdown
  description: One row = one statement SHAPE inside one task run of one job run that lasted at least :warn_run_hours
    - plus one row per task run for which NO statement could be seen (status NOT_ASSESSED, not_assessed_reason
    says why). The columns that matter are task_key with share_of_task_pct (how much of that task's observed
    seconds this one shape consumed), stmt_rank_in_task (worst-first within the task) and task_sql_share_pct
    (how much of the task's time is explained by captured SQL at all - low means the time went to non-Spark
    Python, waiting, or compute this table cannot see). run_tasks_not_assessed / run_tasks_seen say, on
    every row of a run, how many of that run's task runs (a retried task counts twice) are invisible here,
    and run_unattributed_statements how many of the run's statements exist but could not be pinned to
    a task. A shape is the statement text with every string AND numeric literal replaced by ? (shape_fingerprint);
    statement_fingerprint is the string-literal-only recipe query_costly_statements uses, kept so a shape
    can be looked up in query_costly_statements_grouped. statement_text_devalued never carries a data
    value.
  meta:
    query_id: query_task_statement_breakdown
    title: Inside a long job run, the SQL statements per task that burned the time
    domain: performance
    tier: standard
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - preview_unavailable
    - compute_scope_gap
    - no_activity
    - ingestion_lag
    reads:
    - system.query.history
    - system.lakeflow.job_run_timeline
    - system.lakeflow.job_task_run_timeline
    - system.lakeflow.jobs
    - system.compute.clusters
    requires: 'SELECT on system.query, system.lakeflow AND system.compute; system.query.history is Public
      Preview per its doc page (records land within ~1 hour), the lakeflow and compute tables are GA.
      statement_text reads <REDACTED> unless you are an account admin or in the databricks_pii_access
      account group - the query still works, per statement instead of per shape (see caveats). SCOPE LIMIT:
      system.query.history records statements run on SQL warehouses and serverless compute ONLY - a task
      that ran on a classic all-purpose or job cluster has NO statements in it and comes back NOT_ASSESSED
      here, never OK (system.compute.clusters is read only to tell those tasks apart)'
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_run_hours
      default: 2
      meaning: run wall-clock hours at/above which a run is examined (the same bound as lakeflow_long_running_runs,
        so the two compose)
    - name: warn_stmt_share
      default: 0.3
      meaning: fraction of a task's observed seconds one statement shape must consume to flag WARN
    - name: crit_stmt_share
      default: 0.6
      meaning: same for CRITICAL
    - name: settle_hours
      default: 1
      meaning: hours after a task's last observed row during which its statements may still be landing
        in query.history (the doc says ~1 hour) - a task younger than that is never banded OK
    - name: top_n
      default: 10
      meaning: statement shapes kept per task, worst-first
    - name: min_stmt_ms
      default: 60000
      meaning: a shape's own total_ms must reach this before it can band WARN/CRITICAL on share alone
        - below it the shape reads NOT_ASSESSED regardless of share
    confidence: needs_confirmation
    confidence_note: 'Every column and struct field used (query_source.job_info.job_id / job_run_id /
      job_task_run_id, compute.type / warehouse_id, job_task_run_timeline.compute_ids and its compute
      array, the *_duration_seconds columns) was checked against a live system-catalog schema dump of
      this account taken 2026-07-07, and the join keys, the <REDACTED> behaviour, the zero-valued run
      durations and the compute scope were checked against the Databricks doc pages on 2026-09-21 - but
      the query itself has NOT been executed on a workspace. Confirm on your account: 1) for a task you
      know ran SQL on serverless or a warehouse, its statements land on the task row (task_key set), not
      on an UNATTRIBUTED row - the doc''s own example carries job_info.job_run_id NULL with job_task_run_id
      set, which is why the join is keyed on job_task_run_id = job_task_run_timeline.run_id; 2) a task
      you know ran on a classic job cluster shows task_compute_kind = CLASSIC_CLUSTER and status NOT_ASSESSED;
      3) task_sql_share_pct is plausible for a pure-SQL task (near 100).'
    healthy: every task of a long run is covered (run_tasks_not_assessed = 0), nothing is still landing
      (sql_may_be_incomplete = false) and no single statement shape at/above :min_stmt_ms consumes :warn_stmt_share
      or more of its task's observed seconds - the time is spread over many shapes, so the fix is the
      task's design (volume, serial chaining), not one query - field heuristic.
    investigate_if: 'share_of_task_pct at/above :warn_stmt_share (WARN) or :crit_stmt_share (CRITICAL),
      for a shape whose total_ms reaches :min_stmt_ms - one statement shape owns the task, so tune that
      statement first (field heuristic; tune the two shares and the floor for your account). NOT_ASSESSED
      rows are not a pass, read not_assessed_reason: classic_cluster_not_in_query_history means the task''s
      SQL is structurally invisible here (use task_cluster_utilization for the shape of the problem and
      the Spark UI for the statement); statements_may_still_be_landing means the task is in flight or
      ended less than :settle_hours ago; task_seconds_unknown means the task''s own duration could not
      be established; below_duration_floor means the shape''s own total_ms is under :min_stmt_ms - too
      short in absolute terms to prioritize, whatever its share of a short task; no_statements_captured
      means the task ran on covered compute yet wrote nothing to query.history (non-Spark work such as
      pandas or model training, or a task whose SQL sits on this run''s UNATTRIBUTED rows); task_not_executed
      means the task was SKIPPED or BLOCKED and never ran.'
    actions:
    - open the CRITICAL / WARN shape's sample_statement_id in the SQL query history UI (paste it into
      the Statement ID filter), read its query profile, and fix the usual suspects the counters point
      at - spilled_local_bytes (memory / sort), shuffle_read_bytes (join order / broadcast), read_bytes
      with no pruning (missing partition / clustering filter), waiting_for_compute_ms (warehouse start
      or serverless spin-up), total_task_ms far above total_ms (the statement is wide, not slow - fine
      unless it spills) (free);
    - if many shapes each take a small share but statement_count is high, cut the loop that issues them
      - batch it, or cache the CTE they share (free / config);
    - for classic_cluster_not_in_query_history tasks decide whether to move the task to serverless so
      its SQL lands in query.history next time, or turn on cluster log delivery to a Unity Catalog volume
      so the Spark event log outlives the cluster (config / spend).
    next:
    - query_id: task_cluster_utilization
      if: for the NOT_ASSESSED classic-cluster tasks - CPU / memory shape of the cluster over the task's
        window
    - query_id: lakeflow_long_running_runs
      if: for the run-level picture this query zooms into
    - query_id: query_costly_statements_grouped
      if: the same statement_fingerprint dominates several jobs
    - query_id: query_local_spillage
      if: spilled_local_bytes is high
    - query_id: query_pruning_effectiveness
      if: read_bytes is high and the statement should have pruned
    caveats: 'SCOPE - system.query.history records statements run on SQL warehouses and serverless compute
      for notebooks and jobs; nothing run on a classic all-purpose or job cluster is in it, whatever the
      language. On serverless, Databricks documents that SQL AND Python (Spark DataFrame) queries are
      recorded, so a serverless task with no rows did non-Spark work (pandas, model training, pure Python)
      or is still landing; note that for Python cells the recorded statement_text is only the LAST line
      of the cell. A task with no statements is therefore NEVER reported as clean: it is a NOT_ASSESSED
      row, and task_compute_kind says which case it is. task_compute_kind is derived structurally, not
      from an enum: CLASSIC_CLUSTER when the task''s first compute id exists in system.compute.clusters
      (all-purpose, job and pipeline clusters - never serverless or warehouses), SQL_WAREHOUSE when the
      task''s compute struct carries a warehouse_id, SERVERLESS_OR_UNRECORDED when no compute id was recorded
      (serverless tasks record none, and neither do rows from before compute_ids was populated in early
      Dec 2025), UNRESOLVED when an id was recorded but is not in system.compute.clusters (a warehouse
      id on a pre-Dec-2025 row, a cluster deleted before Oct 2023, or a compute type this heuristic does
      not know); task_compute_type_raw carries the untouched compute[0].type value so you can see the
      real vocabulary. JOIN KEY - the doc''s own example of a job-run statement has job_info.job_run_id
      NULL and job_info.job_task_run_id populated, so statements are pinned to a task run through job_task_run_id
      = job_task_run_timeline.run_id, and job_info.job_run_id is used only as the fallback for statements
      with no task run id; those become UNATTRIBUTED rows (task_key NULL) whose share is measured against
      the RUN''s seconds, ranked and capped by :top_n in one bucket per run (or per stmt_task_run_id when
      the statement names a task run the timeline does not know), and kept so the SQL is not lost. The
      nested query_source.job_info.* path is extracted to plain scalar columns in the stmts subquery before
      any join or GROUP BY, because query_provenance_by_source reports that grouping by a doubly-nested
      field is not verified; the field names are confirmed by the schema dump and the doc. DURATIONS -
      the doc states that run_duration_seconds and the other phase columns on job_run_timeline are populated
      only for legacy single-task jobs and log 0 for every multi-task job, so a 0 is treated as "not reported"
      and the run falls back to wall clock between its first and last observed rows; task seconds are
      execution_duration_seconds where populated (end row only, since early Dec 2025, 0 treated the same
      way), else wall clock, measured to current_timestamp() for a task in flight. A run that started
      BEFORE the window is measured from its first in-window row and only its in-window statements are
      counted, so its seconds and shares are lower bounds - keep :period_days comfortably wider than your
      longest run. STATEMENTS - query.history holds only terminated statements (FINISHED / FAILED / CANCELED),
      so a statement still executing has no row yet and records land within about an hour: sql_may_be_incomplete
      marks every row of a task that is in flight or ended less than :settle_hours ago, and such a task
      is never banded OK - a shape already over the bar still flags. Statements inside one task can run
      concurrently, so shares within a task can add up past 100 and share_of_task_pct reads as "share
      of the task''s wall clock this shape was busy", not a decomposition. total_ms is the statement''s
      wall clock excluding result fetch (compile + waits + execution, per the doc) and is the numerator
      of every share; execution_ms is the engine time query_costly_statements ranks by; total_task_ms
      is CPU time summed across all cores. All execution statuses are kept - a statement that ran two
      hours and then FAILED still burned the time - and statements_not_finished counts the non-FINISHED
      runs of a shape; from_result_cache hits are kept too (they cost ~0 ms). SHAPES - shape_fingerprint
      masks emails, single-quoted literals AND bare numbers (so WHERE batch_id = 17 and = 18 are one shape,
      and lists of ? collapse to one ?); statement_fingerprint is the string-literal-only recipe shared
      with query_costly_statements, taken from the first statement of the shape, and literal_variants_in_shape
      says how many distinct such fingerprints the shape spans. When statement_text is <REDACTED> (the
      default for non-admins since Aug 2026) no shape can be built: text_redacted = true, every statement
      is its own row keyed by statement_id, and the share and band are per statement - still honest, just
      not grouped. Like lakeflow_long_running_runs this query keeps the current day so a run in flight
      is examined. Runs are bounded on RUN wall clock with :warn_run_hours exactly as lakeflow_long_running_runs
      does; set it to 0 to see every run. :top_n caps SHAPES PER TASK (or per UNATTRIBUTED bucket), not
      rows in total. query.history is scanned only for the long runs (a semi-join on their run and task-run
      ids), so the cost scales with the runs examined, not with the workspace. job_name comes from system.lakeflow.jobs
      (SCD2, latest row per job, deleted jobs kept) which one-time SUBMIT_RUN / WORKFLOW_RUN executions
      never write to - those runs show job_name NULL. PRIVACY: statement_text_devalued has emails replaced
      by <email> and every literal by ?, both fingerprints are hashes, and no executed_by / run_as identity
      is selected at all. There are no dollars here; price the run with cost_by_job. DURATION FLOOR -
      a shape below :min_stmt_ms total_ms cannot band WARN/CRITICAL even at 100% share_of_task_pct, because
      a short statement inside a slightly-longer task would otherwise read as the worst possible band
      purely from the task being short, not from the statement being slow; such a shape reads NOT_ASSESSED
      (''below_duration_floor'') instead.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/performance/query_task_statement_breakdown.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 WHEN 'NOT_ASSESSED' THEN 2 ELSE 3
      END, share_of_task_pct DESC, workspace_id, job_id, job_run_id, task_key, task_run_id, stmt_task_run_id,
      stmt_rank_in_task
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - job_run_id
        - task_run_id
        - stmt_task_run_id
        - shape_fingerprint
- name: f_query_top_by_cost
  description: 'One row is one group of SQL-warehouse statements that cost about the same thing. group_kind
    says how they were grouped: the same statement text by hash when it is readable, otherwise everything
    from the same saved query, dashboard, Genie space, alert, job, notebook or pipeline (a job group is
    keyed by job_id alone, every task folded in), or - failing that - one ad-hoc bucket, text hidden,
    per warehouse and user. source_kind/source_id name the group''s real origin (dashboard, Genie space,
    alert, job, notebook, saved query or pipeline id from query_source) even when group_kind is "text
    hash" - NULL only when the group is genuinely ad-hoc with no captured source. runs and top_user say
    who ran it and how often; est_cost_usd_list is this group''s share of its warehouse''s billed dollars
    in the window, each statement''s share split across every billed hour it overlaps (not just its start
    hour) by total_task_duration_ms (falling back to execution_duration_ms where the first is not captured);
    share_of_warehouse_cost is the same figure as a fraction of the warehouse''s own total. sample_statement_id
    is the group''s latest statement; p50_duration_ms/ p95_duration_ms are that group''s execution-time
    spread. from_result_cache_share close to 1 means most of the group''s runs were already free (served
    from the result cache). read_files and pruned_files are the files its runs read and the files they
    skipped by pruning; read_files / (read_files + pruned_files) is the share of candidate files it had
    to read. Rows are capped inside every window_days block by the body''s LIMIT :top_n (default 5000,
    threshold ''top_n'').'
  meta:
    query_id: query_top_by_cost
    title: Top queries by cost
    domain: performance
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - compute_scope_gap
    - privilege_scoped
    - no_activity
    reads:
    - system.query.history
    - system.billing.usage
    - system.billing.list_prices
    requires: 'SELECT on system.query and system.billing; GA. SCOPE: SQL warehouses only - a statement
      with no compute.warehouse_id (serverless, or a classic Lakeflow pipeline) cannot be priced from
      warehouse billing and is excluded'
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_cost_usd
      default: 50
      meaning: dollars a group must reach in the window to flag WARN
    - name: crit_cost_usd
      default: 200
      meaning: the same for CRITICAL
    - name: warn_share_frac
      default: 0.2
      meaning: the group's share of its warehouse's own window cost, 0-1, that flags WARN at any dollar
        amount
    - name: crit_share_frac
      default: 0.4
      meaning: the same for CRITICAL
    - name: top_n
      default: 5000
      meaning: row cap - keep only the top groups by cost
    confidence: needs_confirmation
    confidence_note: 'The billing join (system.billing.usage x system.billing.list_prices at the effective
      list rate) is the same shape compute_warehouse_idle_minutes and query_per_query_estimate_lane already
      read on a live workspace; the query_source struct paths are query_provenance_by_source''s own (itself
      needs_confirmation there); the de-valued-text sha2 hash is query_costly_statements_grouped''s. Splitting
      each billed hour''s dollars across the statements that overlap it by total_task_duration_ms (a statement
      spanning several hours gets a share of each), then rolling that up by text hash or origin, is new
      and has NOT run on a live workspace. Confirm on your account: 1) for one warehouse and window, the
      SUM of every group''s est_cost_usd_list is at or below that warehouse''s own est_usd_list in compute_warehouse_idle_minutes
      for the same window; 2) a dashboard or job group_id/source_id matches the real dashboard/job id
      shown in the workspace UI; 3) the "ad-hoc, text hidden" group appears only when statement_text reads
      ''<REDACTED>'' for that account (no PII-access role on the snapshot principal).'
    healthy: status = OK - below :warn_cost_usd and below :warn_share_frac of its warehouse's window cost
      (field heuristic).
    investigate_if: status = WARN or CRITICAL - the group's est_cost_usd_list is at/above :warn_cost_usd
      (WARN) or :crit_cost_usd (CRITICAL), or its share_of_warehouse_cost is at/above :warn_share_frac
      (WARN) or :crit_share_frac (CRITICAL) of its warehouse's own window cost, whichever band is worse.
    actions:
    - open the source by name first - the dashboard, job, notebook or saved query group_id - and check
      whether it needs to run this often (free);
    - when group_kind is "text hash" and from_result_cache_share is low, look for a cache or materialization
      it could reuse, and whether it is pruning the files it reads (config);
    - schedule it less often, or move it off a shared warehouse onto one sized for it (spend).
    next:
    - query_id: query_costly_statements
      if: the individual runs behind a hot text hash
    - query_id: query_provenance_by_source
      if: the fuller source breakdown this group_kind is drawn from
    - query_id: query_per_query_estimate_lane
      if: the row-level duration and bytes this cost split is built from
    - query_id: compute_warehouse_idle_minutes
      if: the warehouse's own total spend for the same window
    caveats: 'DOLLARS ARE AN ESTIMATE - system tables carry no per-query dollar column. Each SQL warehouse''s
      billed usage is priced by the hour at the effective list rate (DEC-66.1, the same join compute_warehouse_idle_minutes
      uses). A statement that spans more than one billed hour has its weight (total_task_duration_ms,
      or execution_duration_ms where the first is not captured) SPLIT ACROSS EVERY HOUR IT OVERLAPS, in
      proportion to how many of that hour''s milliseconds the statement''s own [start_time, end_time)
      covers (end_time falls back to update_time, then start_time) - a statement that starts and ends
      in the same billed hour gets that hour''s full weight outright; a 3-hour query is priced in every
      one of those hours, not billed whole to its start hour while the rest go unpriced. Each hour''s
      dollars are then split across every statement''s share of that hour''s total weight; an hour with
      billed usage but no statement, or a statement-hour with no billed usage, contributes no dollars
      either way, so the sum of every group''s est_cost_usd_list for a warehouse can sit below that warehouse''s
      own total spend. SCOPE: only statements with compute.warehouse_id set are priced here - serverless
      SQL and classic Lakeflow pipeline statements carry no warehouse_id and are excluded; their cost
      has to be attributed a different way, from job or pipeline usage. GROUPING: statement_text reads
      ''<REDACTED>'' for every row unless the snapshot principal is an account admin or a member of the
      databricks_pii_access group; on such an account every group falls back to its query_source origin,
      or, absent one, one "ad-hoc, text hidden" bucket per warehouse and user (executed_by, masked the
      same way as query_provenance_by_source). Text hashing de-values the same way as query_costly_statements_grouped
      (emails and single-quoted literals stripped before hashing), so two statements that differ only
      in a literal collapse into one group; a job group is keyed by job_id ALONE - every task run of that
      job folds into one group, even across separate job runs. Origin precedence when more than one query_source
      field is populated at once (undocumented by Databricks) is: saved query, dashboard, legacy dashboard,
      Genie space, alert, job, notebook, pipeline - the same order query_provenance_by_source uses. SOURCE_KIND/
      SOURCE_ID follow that same query_source precedence, independent of group_kind - a "text hash" group
      still names its real dashboard/job/notebook/etc. origin here when one is captured, NULL only for
      a genuinely ad-hoc statement with no query_source at all; PRIVACY: sample_statement_id and a saved-query/dashboard/Genie/alert/job/notebook/pipeline
      group_id or source_id name a Databricks entity, never a person; the only person-identifying fields
      here are top_user and an ad-hoc group''s group_id, masked to DEC-66.3''s format when masking is
      turned on. distinct_users counts a group''s runs with no captured identity at all (executed_by NULL)
      as one user, not zero. sample_statement_id is the group''s latest run, so it still opens in Databricks''
      query history; p50_duration_ms/p95_duration_ms are percentiles of execution_duration_ms across the
      group''s own runs. status is judged on est_cost_usd_list and share_of_warehouse_cost only; a group
      on an unpriced or unbilled warehouse gets a NULL dollar figure, a NULL share, and reads OK. Rows
      are capped to the top :top_n by est_cost_usd_list.'
    sql_url: app/queries/app/performance/query_top_by_cost.sql
    order_by: est_cost_usd_list DESC NULLS LAST, a.runs DESC, a.workspace_id, a.warehouse_id, a.group_kind,
      a.group_id
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - warehouse_id
        - group_kind
        - group_id
        - statement_type
- name: f_query_warehouse_pressure
  description: 'One row = one SQL warehouse (workspace_id, warehouse_id) with at least one statement in
    the window. The columns that matter are pressure (MEMORY, CAPACITY, MEMORY_AND_CAPACITY or NONE),
    scaling_hint (the lever: SCALE_UP, SCALE_OUT, KEEP_WARM, SCALE_UP_THEN_OUT, SCALE_UP_THEN_WARM or
    NONE) and pressure_reason (the row''s own numbers behind the verdict). Memory pressure is spill_time_pct
    - the share of the warehouse''s execution time spent in statements that spilled at least :min_stmt_spill_mb
    MB to local disk - or spilled_local_gb_max_day, the worst single day''s spill; concurrency pressure
    is capacity_wait_pct, the share of total statement time spent queued because the warehouse was at
    capacity. at_ceiling says whether "more clusters" is even the knob: TRUE means the warehouse has no
    autoscale range (min_clusters >= max_clusters, so it always runs at its maximum) or some warehouse_events
    row in the window showed max_clusters running, FALSE means no event in the window showed max_clusters
    running (read as autoscale lag - keep a cluster warm), NULL means unseen. cold_start_wait_pct is context
    only; query_cache_coldstart is the cold-start finding. Rows are capped inside every window_days block
    by the body''s LIMIT :top_n (default 100000, threshold ''top_n'').'
  meta:
    query_id: query_warehouse_pressure
    title: SQL warehouse pressure - memory-bound (statements spill) or concurrency-bound (statements queue
      at capacity), with the scaling lever for each
    domain: performance
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - compute_scope_gap
    - no_activity
    - ingestion_lag
    reads:
    - system.query.history
    - system.compute.warehouses
    - system.compute.warehouse_events
    requires: 'SELECT on system.query and system.compute; GA. SCOPE LIMIT: system.query.history holds
      SQL-warehouse, serverless and classic Lakeflow pipeline statements only, and only SQL-warehouse
      statements carry a warehouse_id, so this query judges SQL warehouses and nothing else'
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: min_queries
      default: 20
      meaning: statements in the window below which a warehouse is NOT_ASSESSED
    - name: min_stmt_spill_mb
      default: 100
      meaning: the local spill, in MB (10^6 bytes), one statement must reach to count as a spilling statement
        in spill_time_pct and spilling_query_count (the GB columns and the worst day still add every spilled
        byte)
    - name: warn_spill_time_pct
      default: 10
      meaning: percent of the warehouse's execution time spent in statements that spilled at least :min_stmt_spill_mb
        MB to local disk that flags WARN (the 10 percent band query_costly_statements uses for one statement's
        share of its warehouse)
    - name: crit_spill_time_pct
      default: 25
      meaning: the same share that flags CRITICAL (its 25 percent band)
    - name: warn_spill_gb
      default: 1
      meaning: the worst single day's local spill in GB for the warehouse that flags WARN (the query_local_spillage
        thresholds, applied to the whole warehouse's day)
    - name: crit_spill_gb
      default: 10
      meaning: the same that flags CRITICAL
    - name: warn_queue_time_pct
      default: 5
      meaning: percent of total statement time spent queued at capacity that flags WARN
    - name: crit_queue_time_pct
      default: 20
      meaning: the same that flags CRITICAL
    - name: top_n
      default: 100000
      meaning: row cap - far above any account's warehouse count, because this is a verdict per warehouse
    confidence: needs_confirmation
    confidence_note: 'Every column read here is one a vendored query already reads on a live workspace
      (query_local_spillage and query_queuing_waits on system.query.history, sql_warehouse_config_current
      on system.compute.warehouses, compute_warehouse_autoscale_churn on system.compute.warehouse_events),
      and the compute.type values, the warehouse_id scope and the size-versus-clusters sizing advice were
      checked against the Databricks doc pages on 2026-09-23 - but the verdict bands and the time-weighting
      are new and the query has NOT been executed on a workspace. Confirm on your account: 1) for a warehouse
      you know queues, capacity_wait_pct is non-zero and max_cluster_count_seen matches the peak cluster
      count the warehouse monitoring page shows; 2) max_clusters on the latest system.compute.warehouses
      row is the autoscale ceiling the warehouse runs with today; 3) execution, compilation and the two
      waits roughly add up to total_duration_ms for a sample of statements (that split is not documented).'
    healthy: pressure = NONE - spill_time_pct below :warn_spill_time_pct, the worst day's local spill
      below :warn_spill_gb GB and capacity_wait_pct below :warn_queue_time_pct (field heuristic; every
      threshold is a header param).
    investigate_if: 'MEMORY - spill_time_pct at/above :warn_spill_time_pct (WARN) or :crit_spill_time_pct
      (CRITICAL), or the worst day''s local spill at/above :warn_spill_gb GB (WARN) or :crit_spill_gb
      GB (CRITICAL): statements on this warehouse do not fit in its memory, so the lever is size; CAPACITY
      - capacity_wait_pct at/above :warn_queue_time_pct (WARN) or :crit_queue_time_pct (CRITICAL): statements
      queue because every cluster is busy, so the lever is clusters at the ceiling or a warm cluster below
      it; MEMORY_AND_CAPACITY - both. status is the worse of the two bands (field heuristic). NOT_ASSESSED
      (fewer than :min_queries statements) is not a pass: read not_assessed_reason.'
    actions:
    - 'MEMORY (SCALE_UP) - find the spilling statements in query_local_spillage and cut their shuffle:
      broadcast the small side, filter earlier, avoid exploding joins; CAPACITY - check with query_workload_mix_hours
      whether the queueing clusters at a few hours before changing the warehouse (free);'
    - CAPACITY below the ceiling (KEEP_WARM) - raise min_clusters so a second cluster is already running
      when the load arrives, or route the heaviest recurring shapes to their own warehouse (config);
    - 'MEMORY - scale up: a larger warehouse_size gives every cluster more memory per statement; CAPACITY
      at the ceiling (SCALE_OUT) - scale out: raise max_clusters so concurrent statements stop queueing,
      or a larger size if the queued statements are themselves heavy; MEMORY_AND_CAPACITY at the ceiling
      or with the ceiling unseen (SCALE_UP_THEN_OUT) - size first, then clusters; MEMORY_AND_CAPACITY
      below the ceiling (SCALE_UP_THEN_WARM) - size first, then raise min_clusters so a second cluster
      is already running when the load arrives (spend).'
    next:
    - query_id: query_local_spillage
      if: MEMORY - the spilling days and users
    - query_id: query_queuing_waits
      if: CAPACITY - the day-by-day queue
    - query_id: query_costly_statements
      if: for the statements that eat the warehouse's execution time
    - query_id: sql_warehouse_config_current
      if: for warehouse_size, min_clusters and max_clusters - not for a deleted warehouse, which it drops
    - query_id: compute_warehouse_autoscale_churn
      if: at_ceiling is FALSE - how the warehouse scales
    - query_id: query_cache_coldstart
      if: cold_start_wait_pct is high
    - query_id: query_workload_mix_hours
      if: to see whether the queueing clusters at a few hours
    caveats: 'SCOPE - system.query.history records statements run on SQL warehouses (compute.type WAREHOUSE),
      serverless compute (SERVERLESS_COMPUTE) and classic Lakeflow pipelines (CLASSIC_COMPUTE) only, and
      compute.warehouse_id is populated only for WAREHOUSE (cluster_id is never populated). Serverless
      and classic-pipeline statements are therefore EXCLUDED here - no size or cluster knob exists for
      them, and query_task_statement_breakdown covers serverless job statements - while statements on
      classic all-purpose or job clusters are never recorded at all, so a workload that runs on classic
      clusters is invisible here; its machine-level pressure is lakeflow_job_compute_pressure''s (compute_scope_gap).
      LOCAL spill ONLY, as in query_local_spillage: system tables expose no spilled_remote_bytes column,
      so remote spill is NOT assessed - read a warehouse without MEMORY as "no local spill measured",
      never as "no spill". There are only two queue buckets, as in query_queuing_waits: waiting_at_capacity_duration_ms
      (queued because the warehouse was at capacity) and waiting_for_compute_duration_ms (compute still
      provisioning - cold start). NULL is treated as 0 (both mean "no wait"), an assumption rather than
      a documented guarantee, and capacity_wait_pct and cold_start_wait_pct divide by total_duration_ms
      on the assumption that it adds up the two waits, compilation and execution - that additive split
      is not documented, so read the shares as close, not exact. The memory verdict is TIME-WEIGHTED:
      spill_time_pct weighs every statement by its execution time, so a warehouse where few statements
      spill can still be memory-bound when those statements are the long ones (spill_query_pct, the count
      share, is context only), and the worst single day''s local spill (the query_local_spillage thresholds)
      catches a rare but huge spill that a share would dilute. A statement counts as spilling only once
      its local spill reaches :min_stmt_spill_mb MB: below that floor its execution time stays out of
      spill_time_pct (a long statement that spilled a few MB is not a warehouse short of memory), while
      spilled_local_gb_sum and the worst day still add every spilled byte. Above the floor the statement''s
      WHOLE execution time counts, so read spill_time_pct beside spilled_local_gb_sum. The floor is a
      field default, not calibrated per warehouse size. The worst day is summed over every user of the
      warehouse, while query_local_spillage bands one user''s day, so its rows can all sit below the band
      for a warehouse flagged here. A warehouse under :min_queries statements is NOT_ASSESSED even when
      its worst day reaches the spill bands - read spilled_local_gb_max_day on those rows. Every band
      is judged on the unrounded share; the percentages are rounded only for display, and pressure_reason
      quotes the threshold of the band the row reached (a CRITICAL memory clause names :crit_spill_time_pct
      and :crit_spill_gb, a WARN one the warn values; likewise for the queue) and, on a NONE row, writes
      a share that rounds up to its threshold as "just under" it. MEMORY_AND_CAPACITY reads SCALE_UP_THEN_WARM
      when at_ceiling is FALSE - the warehouse queued below its maximum, so the step after size is a warm
      cluster (raise min_clusters), not a higher max_clusters - and SCALE_UP_THEN_OUT otherwise, at_ceiling
      NULL included, as CAPACITY reads SCALE_OUT. cold_start_wait_pct is context, never a verdict - query_cache_coldstart
      is the cold-start finding. at_ceiling compares the most clusters seen running at any warehouse_events
      event in the window (max_cluster_count_seen; cluster_count is clusters running at event time) against
      the latest max_clusters, except that a warehouse with no autoscale range (min_clusters >= max_clusters)
      is TRUE from its configuration alone - it cannot add a cluster, so KEEP_WARM (raise min_clusters)
      is impossible and its lever is max_clusters, and its reason names the range instead of an event
      count; system.compute.warehouse_events may be absent or silent for a warehouse, so at_ceiling NULL
      means unseen, not below the ceiling, and a CAPACITY warehouse with at_ceiling NULL reads as SCALE_OUT.
      at_ceiling is WINDOW-WIDE: a ceiling reached on one day labels queueing on any other day of the
      window, and a cluster count carried in from before the window with no new event in it is not seen
      (a warehouse that sat at max_clusters from before the window and only scaled down during it reads
      FALSE) - read FALSE as "no event showed the ceiling", and check compute_warehouse_autoscale_churn
      before raising min_clusters. Config (warehouse_type, warehouse_size, min_clusters, max_clusters,
      auto_stop_minutes) comes from system.compute.warehouses, SCD2 - the latest row per warehouse_id,
      so a warehouse resized during the window shows its last shape, and a deleted warehouse is KEPT (warehouse_deleted
      TRUE) because its statements are still in the window; a warehouse with no config row keeps NULL
      config columns. The statement window excludes the current day (start_time < current_date()), like
      every vendored performance query, and the warehouse_events window covers the same days, so an event
      from today is not counted. history is per-region - run per metastore region. No identities are emitted,
      so nothing is masked, and there is no dollar figure here: pressure is time and bytes, never cost.
      Scale up here means a larger warehouse_size / more memory per worker and scale out means more clusters
      / more workers; Databricks'' own warehouse_events logs SCALED_UP when a warehouse ADDS A CLUSTER,
      so do not read that event name as this query''s scale-up. Thresholds and caveats are inherited from
      query_local_spillage, query_queuing_waits and query_costly_statements.'
    sql_url: app/queries/app/performance/query_warehouse_pressure.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 WHEN 'NOT_ASSESSED' THEN 2 ELSE 3
      END, spill_time_pct DESC, capacity_wait_pct DESC, workspace_id, warehouse_id
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - warehouse_id
- name: f_query_workload_mix_hours
  description: One row = a day + hour-of-day + compute + statement_type + identity slice of your query
    workload. The columns that matter are query_count and total_duration_ms_sum - stack these by hour
    to see when your workload actually peaks, and whether that peak lines up with warehouse auto-scaling
    or scheduled auto-stop.
  meta:
    query_id: query_workload_mix_hours
    title: Workload mix by hour of day
    domain: performance
    tier: standard
    stars: false
    origin: vendored
    windowed: true
    is_finding: false
    empty_if:
    - schema_not_enabled
    - compute_scope_gap
    - privilege_scoped
    reads:
    - system.query.history
    requires: SELECT on system.query; GA (system.query.history is generally available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    confidence: confirmed
    confidence_note: Columns verified against system.query.history in a live workspace.
    healthy: n/a - inventory
    investigate_if: n/a - inventory
    actions: []
    next:
    - query_id: query_queuing_waits
      if: a peak hour also shows queuing
    - query_id: compute_warehouse_autoscale_churn
      if: to check whether autoscaling tracks this hourly pattern
    caveats: This is a day x hour-of-day x compute x statement_type x identity histogram - group further
      at your own risk, the cardinality is already high. produced_rows (rows returned to the caller) is
      a different thing from read_rows (rows scanned) - do not conflate them. Only SQL-warehouse and serverless
      compute are covered; classic all-purpose clusters are not. This table is regional. The current,
      still-in-progress day is excluded, so today will always look artificially quiet.
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/performance/query_workload_mix_hours.sql
    order_by: day, hour_of_day, workspace_id, compute_type, warehouse_id
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - day
        - workspace_id
        - hour_of_day
        - compute_type
        - warehouse_id
        - statement_type
        - executed_by
