    - preview_unavailable
    - compute_scope_gap
    reads:
    - system.query.history
    requires: SELECT on system.query; GA (system.query.history is generally available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    confidence: confirmed
    confidence_note: Measured magnitude - query count and runtime are directly observable columns in system.query.history;
      Databricks exposes no per-query DBU column, so the dollar cost of running this audit stays "not
      assessed" by design, not by omission.
    healthy: n/a - inventory
    investigate_if: n/a - inventory
    actions: []
    next:
    - query_id: query_costly_statements
      if: you want to see the audit's own queries ranked individually
    - query_id: query_workload_mix_hours
      if: to see how the audit's load compares to the rest of your workload
    caveats: 'This is the INVERSE of self-exclusion - it deliberately INCLUDES this audit''s own queries
      so you can see what running it cost. Queries are matched by a text marker embedded in every query
      this audit issues, so this only catches queries whose statement_text contains that marker; anything
      that strips or rewrites statement_text before it reaches system tables will fall out of this count.
      The marker is matched literally: ''_'' is a LIKE/ILIKE wildcard (matches any single character),
      so the ''_'' inside "databricks_audit" is escaped with ! via ESCAPE ''!'' below (a backslash escape
      does NOT parse on Databricks SQL - Spark''s string-literal lexer treats a backslash inside a string
      literal as its own escape, so ESCAPE ''\'' is an unterminated literal there; ''!'' is an ordinary
      character on both engines, so it works identically on DuckDB and Databricks SQL) - without it, statement_text
      could match on an unrelated character in that position and over-count (a coincidental match). This
      app issues no such marker itself (see tools/snapshot.py) - a marker-embedding convention is the
      caller''s own contract to fulfil if they want this query populated. system.query.history has short
      ingest latency, so the most recent minutes of a run still in flight may not be reflected yet - the
      totals here are cumulative across every audit run inside :period_days, not just the latest one.
      There is no upper bound on start_time, so today''s already-landed queries are included even while
      the run continues. Databricks does not expose a per-query DBU column, so this reports COUNT and
      runtime (magnitude) only - the dollar cost is "not assessed" unless you separately supply a DBU
      rate. system.query.history only captures queries run on SQL warehouses or serverless compute; if
      this audit executes on a classic all-purpose or job cluster its queries are never recorded here,
      so the count would understate or entirely miss the audit''s own footprint.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/performance/audit_self_cost.sql
    order_by: workspace_id, statement_type
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - statement_type
- name: f_perf_daily_by_resource
  description: One row = one day's activity for one SQL warehouse (its statements), job (its runs and
    task runs) or pipeline (its updates). resource_key is workspace_id:resource_id. runs counts statements,
    job runs or pipeline updates started that day; failed counts statements that ended FAILED, runs whose
    final result was FAILED, ERROR or TIMED_OUT, or updates that FAILED; total_s is their summed duration
    and queued_s their summed wait (a statement waiting at capacity or for compute, a single-task job
    run in the job queue). exec_s is execution time (statements, or job task runs); spilled_gb is what
    statements spilled to local disk. For a warehouse, slot_wait_s is the part of queued_s spent waiting
    for a free slot at capacity and provision_s the part spent waiting for compute to start; shuffle_gb,
    read_gb and cache_read_gb are the data its statements shuffled, read, and read from the disk cache
    (read bytes times read_io_cache_percent); result_cache_runs counts statements answered from the result
    cache. provision_s adds every statement's wait, so 100 statements waiting the same 5 s read 500 s;
    provision_clock_s is the clock time at least one statement waited (each wait runs from the statement's
    start; overlapping waits merged), counted on the day the wait began. starts counts the warehouse's
