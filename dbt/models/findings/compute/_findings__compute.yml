    - system.query.history
    - system.billing.usage
    - system.billing.list_prices
    requires: SELECT on system.compute, system.query and system.billing; GA
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_long_autostop_minutes
      default: 10
      meaning: auto_stop_minutes at/above which a daily auto-stop count is worth flagging
    - name: warn_daily_autostops
      default: 5
      meaning: auto-stops in one day at/above which that day reads WARN
    - name: crit_daily_autostops
      default: 10
      meaning: the same that reads CRITICAL
    - name: warn_daily_restarts
      default: 5
