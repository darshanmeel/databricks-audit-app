    The columns that matter are warehouse_size, min_clusters/max_clusters (autoscaling bounds), and auto_stop_minutes
    (how long the warehouse waits before suspending).
  meta:
    query_id: sql_warehouse_config_current
    title: SQL warehouse configuration (current)
    domain: compute
    tier: lite
    stars: false
    origin: vendored
    windowed: false
    is_finding: false
    empty_if: []
    reads:
    - system.compute.warehouses
    requires: SELECT on system.compute; GA
    params: []
    confidence: confirmed
    confidence_note: Columns verified against system.compute.warehouses in a live workspace, cross-checked
      against the full column list (see caveats for a vendor-doc miscount).
    healthy: n/a - inventory
    investigate_if: n/a - inventory
    actions: []
    next:
    - query_id: compute_warehouse_idle_gaps
      if: to see this warehouse's actual RUNNING idle tail against its auto_stop_minutes
    - query_id: compute_warehouse_autoscale_churn
      if: to see if min_clusters/max_clusters is causing thrash
    - query_id: sql_warehouse_events_activity
