    query_id: compute_warehouse_autostop_churn
    title: SQL warehouse auto-stop churn - frequent auto-stops with a long wait, or frequent cold-start
      restarts
    domain: compute
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - no_activity
    reads:
