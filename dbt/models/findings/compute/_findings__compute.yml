    investigate_if: status = the worst single day's status - WARN or CRITICAL per the same :warn_daily_autostops
      / :crit_daily_autostops thresholds. cold_start_risk_days > 0 on its own is informational, not a
      status band - a bursty warehouse that already auto-stops within policy still needs the fix, but
      is not double-counted into a worse verdict here.
    actions:
    - lower auto_stop_minutes for the warehouse - serverless can go to 5 minutes in the UI (1 via the
      API), classic/pro minimum is 10 minutes (free);
    - for cold_start_risk, move the workload to serverless (starts in seconds) or consolidate several
      bursty jobs onto one shared warehouse so it restarts less often (config).
    next:
    - query_id: compute_warehouse_config_posture
      if: see auto_stop_minutes and whether it is already flagged
    - query_id: compute_warehouse_idle_minutes
      if: the same warehouse's idle minutes across the whole window, not just at auto-stop
    - query_id: compute_warehouse_cache_reuse
      if: whether staying warm actually pays off for this warehouse
    caveats: 'An auto-stop is derived, not a documented event field: a STOPPED event counts only when
      it lands at least auto_stop_minutes (minus 1 minute of rounding slack) after the later of the last
      query finished and the warehouse''s own last STARTING/RUNNING event, using system.query.history
      within the window plus 2 days of look-back so a stop early in the window can still find its last
      query. A STOPPED event with neither a prior query nor a prior STARTING/RUNNING event found is left
      unclassified and excluded from autostop_count - it may be a manual stop, a forced stop, or a genuine
      auto-stop whose last query and start both fell outside the look-back; this query does not tell those
      apart. Each STOPPED event''s idle-from time is the later (GREATEST) of two running MAX(...) OVER
      (PARTITION BY workspace_id, warehouse_id ORDER BY t, event_rank) columns - one tracking the last
      query finish, one tracking the last STARTING/RUNNING event - over one timeline of query-finish times,
      start events and stop events, not a per-stop correlated subquery re-scanning all of query.history
      or warehouse_events. prior_start carries each warehouse''s last STARTING/RUNNING event from BEFORE
      the window into that same timeline (unbounded look-back, its own true timestamp, positioned at the
      window start) - without it, the first stop in the window whose real start event fell before it would
      have no last_start_at at all, and idle_wait_minutes would fall back to a query that can be hours
      older than the actual, unseen restart. Carrying the last START/RUNNING event this way keeps idle
      time from ever crossing a stop-then-restart-then-stop boundary: a warehouse that restarts on a new
      day with no query before its next stop is idle only since that restart, never since a query on some
      earlier day. PRICE follows compute_warehouse_idle_minutes''s own approach: the warehouse''s DBUs
      at the effective list price (DEC-66.1) divided by its up minutes over the whole window gives one
      dollar-per-minute rate, applied to each day''s own auto-stop idle minutes; an unpriced or unbilled
      warehouse keeps its counts with a NULL dollar figure. UP MINUTES use compute_warehouse_idle_minutes''
      own state logic: the window is [window start, today) in epoch seconds, the state at the window''s
      start is carried in from the last event before it, an event tie at the same timestamp is broken
      by state_rank (STARTING, RUNNING, SCALED_*, STOPPING, STOPPED), and a warehouse still up at the
      window''s end is counted up to the window''s end - the same LEAD(...) ORDER BY (t, state_rank) segments,
      not a plain per-event-type LEAD with no tie-break and no carry-in. cold_start_risk counts STARTING
      events only and never applies to serverless (which has no meaningful cold start). WORST DAY - ranked
      by status (CRITICAL, WARN, OK), then autostop_count, then est_wasted_usd_list, all descending; a
      tie keeps the most recent day.'
    sql_url: app/queries/app/compute/compute_warehouse_autostop_churn.sql
    order_by: CASE r.status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 ELSE 2 END, total_est_wasted_usd_list
      DESC NULLS LAST, r.warehouse_id
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - warehouse_id
- name: f_compute_warehouse_cache_reuse
  description: One row = one SQL warehouse over the window. from_result_cache_pct is the share of its
    queries Databricks served straight from the result cache. repeated_statement_pct is the share of its
    queries whose exact statement text (hashed) also ran at least once more on the same warehouse - a
    second, independent signal for "this warehouse serves repeat work" that does not depend on the result
    cache actually firing. median_gap_minutes is the typical time between one query finishing and the
    next starting on that warehouse - a long gap next to a long auto_stop_minutes is spending idle minutes
    between infrequent queries.
  meta:
    query_id: compute_warehouse_cache_reuse
    title: SQL warehouse result-cache reuse - does staying warm actually pay off
    domain: compute
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - no_activity
    reads:
    - system.query.history
    - system.compute.warehouses
    requires: SELECT on system.query and system.compute; GA
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: min_queries_for_verdict
      default: 10
      meaning: queries in the window below which a warehouse reads OK regardless of cache share - too
        little signal
    - name: warn_low_cache_share_pct
      default: 5
      meaning: from_result_cache share below which a warehouse counts as low
    confidence: needs_confirmation
    confidence_note: 'from_result_cache and read_io_cache_percent are documented system.query.history
      columns this app has not read before. Confirm on your own account: 1) a warehouse you know serves
      many repeat dashboards/queries shows a high from_result_cache_pct; 2) a warehouse with a long auto-stop
      and genuinely one-off queries shows a low share here.'
    healthy: status = OK - fewer than :min_queries_for_verdict queries in the window (too little signal),
      or from_result_cache_pct at/above :warn_low_cache_share_pct.
    investigate_if: 'status = WARN - from_result_cache_pct below :warn_low_cache_share_pct with auto_stop_minutes
      ABOVE the warehouse''s own type minimum (serverless: 5 minutes; classic/pro: 10 minutes) - there
      is room to lower it and the warehouse is not using the repeat-query benefit staying warm would buy.
      A warehouse already AT its type''s minimum never reads WARN on auto-stop alone, however low its
      cache share - there is nothing left to lower. Never CRITICAL: low cache reuse is a heuristic (a
      unique-query workload always has a low share, not a config mistake), not a confirmed problem.'
    actions:
    - 'lower auto_stop_minutes to the type''s minimum (serverless: 5 minutes in the UI, 1 via the API;
      classic/pro: 10 minutes) - a low cache-reuse warehouse loses little from a shorter wait (free);'
    - if repeated_statement_pct is high but from_result_cache_pct is low, check for a changing filter
      or timestamp in the statement text that busts the cache on otherwise-identical queries (free) -
      a warehouse already at its type's floor with this pattern gets no cheaper from auto-stop, so this
      is the one action left for it.
    next:
    - query_id: compute_warehouse_config_posture
      if: see auto_stop_minutes and whether it is already flagged
    - query_id: compute_warehouse_idle_minutes
      if: this warehouse's measured idle minutes and dollars over the same window
    - query_id: compute_warehouse_autostop_churn
      if: how often it actually auto-stops
    caveats: from_result_cache and read_io_cache_percent are read directly from system.query.history with
      no further attribution - a query can be served from cache for reasons unrelated to this warehouse's
      own auto-stop (a dashboard querying an unchanged table, for instance). This is a correlation between
      a low cache-reuse rate and a long auto-stop, not proof the auto-stop caused the low rate. repeated_statement_pct
      counts a statement as a duplicate by its exact SHA-256 text hash - two statements that differ only
      by a literal (a date filter, an id) are never matched, so this understates true repeat-workload
      volume; from_result_cache_pct is Databricks' own judgment and does not have that limitation. No
      dollar figure is computed here - compute_warehouse_idle_ minutes already prices this warehouse's
      idle time; duplicating that estimate here would double- count it.
    sql_url: app/queries/app/compute/compute_warehouse_cache_reuse.sql
    order_by: CASE status WHEN 'WARN' THEN 0 ELSE 1 END, from_result_cache_pct ASC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - warehouse_id
- name: f_compute_warehouse_config_posture
  description: One row = the latest known configuration for one SQL warehouse that has not been deleted
    - the same grain and dedupe as sql_warehouse_config_current, with a posture verdict added. The columns
    that matter are status (worst flag wins) and reasons (every flag that fired, in one line).
  meta:
    query_id: compute_warehouse_config_posture
    title: SQL warehouse setup risk - auto-stop left off or too high, CLASSIC type where Pro/Serverless
      is available, running on the Preview channel
    domain: compute
    tier: standard
    stars: false
    origin: app
    windowed: false
    is_finding: true
    empty_if: []
    reads:
    - system.compute.warehouses
    requires: SELECT on system.compute; GA
    params:
    - name: max_autostop_minutes
      default: 60
      meaning: minutes above which a warehouse's auto-stop is flagged as too high (NULL or 0 is flagged
        as off, at any value)
    confidence: needs_confirmation
    confidence_note: 'Columns and the SCD2 latest-row-per-warehouse_id shape are the ones sql_warehouse_config_current
      already confirms against a live system-catalog schema dump. Two things are NOT confirmed on a real
      account: 1) warehouse_channel''s exact stored spelling - the Databricks REST API''s channel enum
      is CHANNEL_NAME_CURRENT / CHANNEL_NAME_PREVIEW, but this system table''s own value has only been
      checked against this app''s own fixtures, never a live dump, so flag_preview_channel matches both
      CHANNEL_NAME_PREVIEW and the bare ''PREVIEW'' spelling the API also uses elsewhere, to fail safe
      either way rather than silently missing a real account that stores the shorter form; 2) that warehouse_type
      = ''CLASSIC'' is the only non-Pro/Serverless value on that column today (Databricks'' own warehouse-type
      docs describe CLASSIC vs PRO, with Serverless controlled separately) - verify against your account''s
      actual warehouse_type values before trusting the classic_type flag.'
    healthy: status = OK - no flag fired. Field heuristic; :max_autostop_minutes is an approximation,
      tune it for your account's typical query cadence.
    investigate_if: status = WARN - auto-stop off or above :max_autostop_minutes, warehouse_type is CLASSIC,
      or warehouse_channel is the Preview channel. Read reasons for the exact combination; more than one
      flag can fire on the same row. This query has no CRITICAL band - none of its flags is a governance
      bypass the way an unmasked cluster access mode is (see compute_cluster_config_posture), they are
      cost/support-tier risks.
    actions:
    - lower or set auto_stop_minutes on the flagged warehouse so it suspends when idle (free);
    - move the warehouse off the Preview channel onto Current unless the preview feature is deliberately
      being evaluated (config);
    - move a CLASSIC warehouse to Pro or Serverless SQL for faster start-up and Unity-Catalog-native governance
      (spend).
    next:
    - query_id: sql_warehouse_config_current
      if: full configuration
    - query_id: compute_warehouse_idle_gaps
      if: this warehouse's actual idle tail against its auto_stop_minutes
    - query_id: compute_warehouse_autoscale_churn
      if: it is also thrashing clusters
    - query_id: query_warehouse_pressure
      if: it is also under memory or capacity pressure
    - query_id: compute_cluster_config_posture
      if: the classic-cluster half of this same posture check
    caveats: 'SCD snapshot: this returns the latest row per warehouse_id, so a deleted warehouse (delete_time
      NOT NULL) is excluded - the same filter sql_warehouse_config_current uses. warehouse_size enum includes
      5X_LARGE (Beta, PRO/SERVERLESS channel only - sql_warehouse_config_current''s own confirmed caveat)
      but warehouse_size itself is not judged here, only warehouse_type/warehouse_channel/auto_stop_minutes.
      The Preview-channel flag is a support-tier signal, not a defect: a workspace running a warehouse
      on Preview on purpose (to try a new feature early) should expect this WARN and can ignore it once
      confirmed intentional - there is no "deliberately on preview" column to suppress it automatically.
      auto_stop_minutes NULL or 0 is treated as "auto-stop is off" (a warehouse that never suspends keeps
      billing DBUs indefinitely); this is the same off-or-above-a-cap shape compute_cluster_config_posture
      uses for cluster auto-termination, kept consistent across both posture queries on purpose. warehouse_name
      is masked to the existing 2-char-prefix mask and created_by to the DEC-66.3 identity format (`<id>
      <first 2 chars>***`, a hash-derived id when the source row carries no real user id, service-principal
      GUIDs passed through unchanged) - both copied verbatim from sql_warehouse_config_current''s / classic_clusters_
      config_current''s own existing masks, not reinvented. tags is a map, not read here. Regional - run
      per metastore region. No dollars here: this is a configuration posture check, not a cost query;
      price the flagged warehouse with compute_warehouse_idle_gaps or the relevant cost_by_* query.'
    sql_url: app/queries/app/compute/compute_warehouse_config_posture.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 WHEN 'OK' THEN 2 ELSE 3 END, warehouse_id
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - warehouse_id
- name: f_compute_warehouse_idle_gaps
  description: One row = one SQL warehouse's time spent RUNNING, STARTING and STOPPED over the window.
    The columns that matter are running_seconds (total contiguous RUNNING time - RUNNING, SCALED_UP, or
    SCALED_DOWN with clusters left running - a mix of active query time and the idle tail before auto-stop,
    since per-query activity is deliberately not joined into this query) and max_running_gap_seconds (the
    single longest contiguous RUNNING period - an unusually long one usually means the warehouse never
    triggered its own auto-stop for a long time).
  meta:
    query_id: compute_warehouse_idle_gaps
    title: SQL warehouse idle tail before auto-stop
    domain: compute
    tier: standard
    stars: true
    origin: vendored
    windowed: true
    is_finding: true
    empty_if: []
    reads:
    - system.compute.warehouse_events
    - system.billing.usage
    - system.billing.list_prices
    requires: SELECT on system.compute, system.billing; GA
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_idle_hours
      default: 4
      meaning: hours of a single continuous RUNNING stretch that flags WARN
    - name: crit_idle_hours
      default: 24
      meaning: hours that flags CRITICAL
    confidence: needs_confirmation
    confidence_note: 'The event-type enum, event columns and the cost-rollup join were verified against
      system.compute.warehouse_events and system.billing.usage/list_prices in a live workspace. The event
      side now uses compute_warehouse_idle_minutes'' own state-segment logic (bounds, carry-in, state_rank
      tie-break, the last segment closed at the window end) in place of a plain per-event LEAD, which
      has not itself run on a live workspace yet. Confirm on your own account: 1) running_seconds for
      a warehouse you watched matches the time its monitoring page shows it running; 2) a warehouse still
      RUNNING with no STOPPED event yet shows running time up to now, not a NULL/zero gap.'
    healthy: status = OK (max_running_gap_seconds below :warn_idle_hours hours) - field heuristic; tune
      :warn_idle_hours / :crit_idle_hours to your typical auto_stop_minutes settings.
    investigate_if: status = WARN or CRITICAL (a single RUNNING stretch at or above :warn_idle_hours /
      :crit_idle_hours) - field heuristic. status = NOT_ASSESSED means this warehouse had zero RUNNING-type
      events in the window (running_seconds=0, no contiguous running period to measure), which this query
      still surfaces rather than dropping, since an unused warehouse is itself worth a look.
    actions:
    - lower auto_stop_minutes on the warehouse in sql_warehouse_config_current so it suspends sooner after
      the last query (free);
    - route the warehouse's workload onto a shared/Serverless warehouse if it is mostly idle between bursts
      (config);
    - downsize warehouse_size if the long RUNNING stretch reflects genuinely low, steady load rather than
      a stuck auto-stop (spend).
    next:
    - query_id: sql_warehouse_config_current
      if: to check this warehouse's auto_stop_minutes
    - query_id: sql_warehouse_events_activity
      if: for the raw event-type breakdown
    - query_id: compute_warehouse_autoscale_churn
      if: the same warehouse is also thrashing clusters up/down
    caveats: 'Authoritative 6-value event_type enum for system.compute.warehouse_events is SCALED_UP,
      SCALED_DOWN, STOPPING, RUNNING, STARTING, STOPPED (SCALING_UP/SCALING_DOWN are undocumented and
      ignored). RUNNING TIME is computed with compute_warehouse_idle_minutes'' own state-segment logic:
      the window is [today - :period_days, today) in whole UTC days, matching the cost rollup below rather
      than an uncapped `current_timestamp() - INTERVAL :period_days DAYS`; the state at the window''s
      start is carried in from the last event before it; an event tie at the same timestamp is broken
      by state_rank (STARTING, RUNNING, SCALED_*, STOPPING, STOPPED, the last one holds); "running" is
      RUNNING, SCALED_UP, or SCALED_DOWN with cluster_count > 0 (a SCALED_DOWN to 0 clusters is a stop);
      each event''s state holds until the next event, or the window''s end for the last one - a warehouse
      still RUNNING at the window''s end is counted up to the window''s end, never left as an open/NULL
      gap. max_running_gap_seconds is the longest CONTIGUOUS running period - consecutive running-type
      events (RUNNING, then a SCALED_UP/DOWN, then RUNNING again, with no down-state gap between them)
      merge into one period, not the single longest per-event LEAD gap. This query still returns a row
      for a warehouse with warehouse_events activity but zero RUNNING-type events (running_seconds=0),
      rather than dropping it - the LEFT JOIN to the cost rollup never filters out a warehouse_id, so
      idle/unused warehouses stay visible here too. Per-event query activity is NOT joined into this query
      on purpose (that join fans out at day grain and overstates query counts) - keep this query event-only,
      and read running_seconds as "time RUNNING", not "time definitely idle". system.compute.warehouse_events
      carries no DBU/$ by itself; net_dbus/est_usd_list come from the separate cost rollup below, over
      the SAME [today - :period_days, today) span as the event side. net_dbus is exact billed DBUs (usage_unit=''DBU'');
      est_usd_list is an ESTIMATE AT THE EFFECTIVE LIST PRICE (usage_quantity x list_prices.pricing.effective_list.default
      - DEC-66.1) - NOT your negotiated invoice rate (not available in any system table) and excludes
      cloud infra/egress cost; treat est_usd_list as directional. Cost is attributed by warehouse_id (billing
      ID) over the :period_days window (per-warehouse), not per event/idle-gap - the cost rollup is pre-aggregated
      before the join, so rows here are never multiplied by it. warehouse_id is a globally-unique GUID,
      so the rollup is keyed on warehouse_id alone (workspace_id dropped) to match this query''s warehouse-only
      grain. price_basis is ''unpriced'' when any non-free-usage SKU billed to this warehouse had no matching
      list_prices row (net_dbus/est_usd_list then understate cost), ''free'' when every matched SKU is
      a FREE_USAGE SKU (a real $0), and ''priced'' otherwise.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/compute/compute_warehouse_idle_gaps.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 WHEN 'OK' THEN 2 ELSE 3 END, max_running_gap_seconds
      DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - warehouse_id
- name: f_compute_warehouse_idle_minutes
  description: 'One row = one SQL warehouse (workspace_id, warehouse_id) that ran or was billed in the
    window. counted_idle_minutes is the time the warehouse was running while no query was running, counting
    only stretches longer than :idle_gap_seconds seconds. est_wasted_usd_list prices those minutes at
    what this warehouse actually cost per running cluster-minute in the window. It is POSSIBLE waste.
    A pause of :idle_gap_seconds seconds or less between two queries is normal and is never counted. A
    longer pause counts in full: a 5-minute pause is 5 minutes. The idle time is split into before the
    first query (start_gap_minutes), between queries (between_queries_minutes), after the last query until
    the warehouse stopped (stop_tail_minutes, the auto-stop wait), and running periods with no query at
    all (no_query_minutes). waste_reason says it in one line. AUTO-STOP WHAT-IF: autostop_N_idle_minutes
    and autostop_N_cold_starts replay the window''s gaps between queries under an auto-stop of N minutes
    (1, 2, 5, 10, 30, and now = auto_stop_minutes): a gap up to N minutes stays idle, a longer one idles
    N minutes and then the next query waits for a cold start. Compare a setting with now: fewer idle minutes,
    more cold starts. usd_per_cluster_minute prices an idle minute on this warehouse.'
  meta:
    query_id: compute_warehouse_idle_minutes
    title: SQL warehouse idle minutes - running with no query for more than a minute (possible waste)
    domain: compute
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - no_activity
    reads:
    - system.compute.warehouse_events
    - system.query.history
    - system.billing.usage
    - system.billing.list_prices
    - system.compute.warehouses
    requires: 'SELECT on system.compute, system.query and system.billing; GA. SCOPE: SQL warehouses only
      - classic, pro and serverless. Serverless compute for notebooks and jobs has no warehouse and bills
      per use, so it has no idle time to measure here'
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: idle_gap_seconds
      default: 60
      meaning: a stretch with no query running counts as possible waste only when it lasts longer than
        this many seconds - an admin changes it in config/thresholds.yml, for example to 120
    - name: min_idle_minutes
      default: 30
      meaning: counted idle minutes in the window below which the idle share alone never flags
    - name: warn_idle_pct
      default: 30
      meaning: percent of running time counted idle that flags WARN
    - name: crit_idle_pct
      default: 60
      meaning: the same that flags CRITICAL
    - name: warn_waste_usd
      default: 20
      meaning: possible waste in dollars that flags WARN at any idle share
    - name: crit_waste_usd
      default: 200
      meaning: the same that flags CRITICAL
    confidence: needs_confirmation
    confidence_note: 'Every column read here is one this app already reads on a live workspace (warehouse_events
      in compute_warehouse_idle_gaps and compute_warehouse_autoscale_churn; query.history start_time and
      compute.warehouse_id in query_warehouse_pressure; usage_metadata. warehouse_id in compute_warehouse_idle_gaps),
      but this query has not yet run on one. Confirm on your account: 1) for a warehouse you watched,
      running_minutes matches the time its monitoring page shows it running; 2) a serverless warehouse
      reads warehouse_kind = serverless (the warehouse_type value SERVERLESS is not yet confirmed); 3)
      est_usd_list matches that warehouse''s list-price spend in cost_by_compute_resource over the same
      days.'
    healthy: status = OK - counted idle is below :warn_idle_pct percent of running time, or below :min_idle_minutes
      minutes in the window, and under :warn_waste_usd of possible waste (field heuristic).
    investigate_if: 'status = WARN or CRITICAL - at least :min_idle_minutes idle minutes and at least
      :warn_idle_pct (WARN) or :crit_idle_pct (CRITICAL) percent of running time idle, or possible waste
      at/above :warn_waste_usd (WARN) or :crit_waste_usd (CRITICAL) dollars at any share, so a large idle
      cost on a busy warehouse is flagged too; an unpriced warehouse is judged on minutes and share only
      (field heuristic). A large stop_tail_minutes means auto-stop waits too long after the last query.
      A large between_queries_minutes or no_query_minutes means the warehouse is kept up for sparse work.
      NOT_ASSESSED is not a pass: read not_assessed_reason and waste_reason.'
    actions:
    - when stop_tail_minutes dominates, lower auto_stop_minutes on the warehouse - it cannot go below
      the lowest auto-stop Databricks allows for the warehouse type, so part of each tail stays (free);
    - move sparse, bursty workloads onto one shared warehouse, or schedule them together, so fewer warehouses
      sit up between queries (config);
    - move a bursty classic or pro warehouse to serverless, which starts in seconds, so a short auto-stop
      does not cost a long cold start (spend).
    next:
    - query_id: compute_warehouse_config_posture
      if: to see auto_stop_minutes and whether it is flagged
    - query_id: query_cache_coldstart
      if: before lowering auto-stop - how often statements already wait for a cold start
    - query_id: compute_warehouse_idle_gaps
      if: the single longest unbroken running stretch
    - query_id: query_warehouse_pressure
      if: the warehouse is also queueing or spilling
    caveats: 'RUNNING TIME comes from system.compute.warehouse_events. STARTING, RUNNING, SCALED_UP and
      SCALED_DOWN leave the warehouse up. STOPPING and STOPPED leave it down. A SCALED_DOWN with cluster_count
      0 is a stop. STARTING time is up (it is in the rate''s denominator) but never idle, because it is
      cold start. Events that share a timestamp are ordered STARTING, RUNNING, SCALED_*, STOPPING, STOPPED,
      and the last one is the state that holds. The undocumented SCALING_UP and SCALING_DOWN values are
      ignored. The WINDOW is whole UTC days from current_date() minus :period_days up to, not including,
      today. The state at the window''s start comes from the last event before it. When no earlier event
      was captured (a snapshot no longer than the window), the time before the warehouse''s first event
      in the window is not counted (start_state_known = FALSE), and billed usage before that event''s
      hour is left out of the rate. A warehouse still running at the end of the window is counted up to
      the window''s end (open_at_window_end = TRUE). BUSY TIME is every statement on the warehouse in
      system.query.history, any status, from start_time to end_time (update_time when end_time is NULL),
      with overlapping statements merged. A warehouse with statements in no row of the window''s query
      history reads idle for all its running time; a snapshot with no query history at all reads NOT_ASSESSED
      (no_query_history). The 60-SECOND RULE: a stretch with no query running counts only when it lasts
      longer than :idle_gap_seconds seconds, and then counts in full; a stretch exactly :idle_gap_seconds
      seconds long does not count. PRICE: the warehouse''s own DBUs in system.billing.usage (usage_metadata.warehouse_id)
      at the effective list price (DEC-66.1), divided by its up cluster-minutes (minutes up times clusters
      running), gives a dollar rate per cluster-minute; est_wasted_usd_list is the counted idle cluster-minutes
      times that rate. Weighting by clusters keeps a multi-cluster warehouse''s busy peaks from inflating
      the price of its idle minutes. It is an estimate at list price, not your invoice, and it excludes
      the cloud VM bill of classic warehouses. est_usd_list is the warehouse''s whole spend in the window,
      shown for scale; it is NOT waste. LOWER BOUND: idle clusters inside busy time (a second cluster
      not yet scaled down while one query runs) are not counted, and neither is the time before the first
      captured event. An unpriced or unbilled warehouse keeps its minutes and verdict, and its dollar
      figure is NULL with the reason in waste_reason. Idle time and failed-statement cost (cost_failed_statement_waste)
      never overlap: one is time with no statement running, the other is statement time. Regional: warehouse_events
      and query.history hold the snapshot''s region only. No identities are emitted.'
    sql_url: app/queries/app/compute/compute_warehouse_idle_minutes.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 WHEN 'NOT_ASSESSED' THEN 2 ELSE 3
      END, est_wasted_usd_list DESC NULLS LAST, counted_idle_minutes DESC NULLS LAST, workspace_id, warehouse_id
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - warehouse_id
- name: f_instance_events_idle_active
  description: One row = a workspace + node_type + availability_type + instance state + event_type combination
    and how many events/instances hit it over the window. The columns that matter are state (INSTANCE_READY
    = idle, INSTANCE_PLACED = in use) and instance_count - a node_type with a large INSTANCE_READY instance_count
    relative to its INSTANCE_PLACED instance_count is spending a lot of launches sitting idle before being
    used, but this query counts events, not idle minutes, so treat it as a screening signal, not a precise
    duration.
  meta:
    query_id: instance_events_idle_active
    title: Classic-instance idle-vs-active event mix
    domain: compute
    tier: lite
    stars: false
    origin: vendored
    windowed: true
    is_finding: false
    empty_if:
    - preview_unavailable
    - compute_scope_gap
    reads:
    - system.compute.instance_events
    requires: SELECT on system.compute; Public Preview (system.compute.instance_events may be empty or
      disabled per workspace)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    confidence: needs_confirmation
    confidence_note: system.compute.instance_events is Public Preview and may be empty or disabled in
      your workspace; if so, treat "no rows" as "not populated", not "no idle instances". Columns are
      confirmed, but a true idle-vs-active MINUTES calculation needs a per-instance windowed lead/lag
      over event_time (INSTANCE_READY vs INSTANCE_PLACED) that is not implemented here - this query only
      summarizes event COUNTS, a coarser signal.
    healthy: n/a - status not computed (see caveats); as a heuristic, INSTANCE_READY instance_count well
      below INSTANCE_PLACED instance_count for the same node_type/availability_type is the healthy shape.
    investigate_if: n/a - status not computed (see caveats); as a heuristic, INSTANCE_READY instance_count
      at or above INSTANCE_PLACED instance_count for the same node_type/availability_type over the window
      is worth a look - field heuristic, not an authoritative threshold.
    actions:
    - cross-check the worst node_type/availability_type combos here against auto_termination_minutes in
      classic_clusters_config_current and lower it (free);
    - shift the workload onto instance pools sized closer to actual concurrent demand, or onto Spot/preemptible
      where availability_type allows (config);
    - if the same node_type is idle-heavy account-wide, right-size or retire that node type (spend).
    next:
    - query_id: classic_clusters_config_current
      if: to see auto_termination_minutes for clusters using this node_type
    - query_id: instance_pools_idle_capacity
      if: these instances are pool-managed
    caveats: 'PUBLIC PREVIEW - this table may be empty or disabled in your workspace; read "no rows" as
      "not populated", never as "no idle instances". state enum: INSTANCE_LAUNCHING / INSTANCE_READY (idle)
      / INSTANCE_PLACED (in use) / INSTANCE_TERMINATED. event_type enum: INSTANCE_LAUNCHING / STATE_TRANSITION.
      availability_type enum: ON_DEMAND/SPOT (AWS/Azure), ON_DEMAND/PREEMPTIBLE (GCP). cluster_id is populated
      ONLY when state=INSTANCE_PLACED (not selected by this query, but relevant if you extend it). Regional
      - run per metastore region. A true idle-vs-active MINUTES measure requires a per-instance windowed
      lead/lag over event_time (READY vs PLACED) whose exact form is not implemented here and is needs_confirmation;
      this query only aggregates event and instance COUNTS, which will not tell you how long any single
      instance sat idle, only how often idle-state events occurred. No status column is computed for this
      reason - use the healthy/investigate_if heuristics above as a manual read. Scope is CLASSIC compute
      only: SQL-warehouse placement events and all serverless instances are excluded, so idle serverless
      or SQL-warehouse capacity is invisible here and never appears as an idle instance.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/compute/instance_events_idle_active.sql
    order_by: event_count DESC, instance_count DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - node_type
        - availability_type
        - state
        - event_type
- name: f_instance_pools_idle_capacity
  description: One row = the latest known configuration for one instance pool that has not been deleted,
    plus its compute spend over :period_days. The column that matters is min_idle_instances - the number
    of instances this pool keeps warm and idle at all times, which bills regardless of whether anything
    is using them.
  meta:
    query_id: instance_pools_idle_capacity
    title: Instance pool idle-capacity floor (min_idle_instances)
    domain: compute
    tier: standard
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - preview_unavailable
    reads:
    - system.compute.instance_pools
    - system.billing.usage
    - system.billing.list_prices
    requires: SELECT on system.compute, system.billing; Public Preview (system.compute.instance_pools
      may be empty or disabled per workspace)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days for the cost rollup (this is a config snapshot with no time window
        of its own)
    - name: warn_min_idle_instances
      default: 5
      meaning: standing idle-instance floor that flags WARN
    - name: crit_min_idle_instances
      default: 20
      meaning: standing idle-instance floor that flags CRITICAL
    confidence: needs_confirmation
    confidence_note: system.compute.instance_pools is Public Preview and may be empty or disabled in your
      workspace; the columns themselves are confirmed.
    healthy: status = OK (min_idle_instances below :warn_min_idle_instances) - field heuristic; tune for
      your account's pool sizes.
    investigate_if: 'status = WARN or CRITICAL (min_idle_instances at or above :warn_min_idle_instances
      / :crit_min_idle_instances) - field heuristic. Also worth a look regardless of status: idle_instance_autotermination_minutes
      NULL or 0, which means instances above the floor never get reclaimed.'
    actions:
    - lower min_idle_instances to match actual concurrent start-up demand (free);
    - set or lower idle_instance_autotermination_minutes so instances above the floor get reclaimed instead
      of idling indefinitely (config);
    - if est_usd_list is high and demand is genuinely bursty, move the workload to Serverless compute
      instead of a warm pool (spend).
    next:
    - query_id: classic_clusters_config_current
      if: to see which clusters draw from this pool via driver_instance_pool_id/worker_instance_pool_id
    - query_id: node_types_reference
      if: to size the node_type this pool uses
    caveats: 'SCD snapshot: this returns the latest row per instance_pool_id, so a deleted pool (delete_time
      NOT NULL) is excluded. min_idle_instances/max_capacity are bigint. disk_spec/aws_attributes/azure_attributes/gcp_attributes
      are STRUCTs selected whole - only the cloud you actually run on has its struct populated, and their
      subfields are example-documented only, so pulling one specific subfield out is needs_confirmation.
      True idle-waste dollarization (min_idle_instances x node cost) is not possible from compute tables
      alone - node-type cost is not billed as its own line item, only rolled-up compute spend is. net_dbus
      is exact billed DBUs (usage_unit=''DBU''); est_usd_list is an ESTIMATE AT THE EFFECTIVE LIST PRICE
      (usage_quantity x list_prices.pricing.effective_list.default - DEC-66.1) - NOT your negotiated invoice
      rate (not available in any system table) and excludes cloud infra/egress cost; treat est_usd_list
      as directional. Cost is attributed by billing ID (usage_metadata.instance_pool_id) over the :period_days
      window (per-pool), not per event - the cost rollup is pre-aggregated before the join, so rows are
      never multiplied. This query is a config SNAPSHOT with no time window of its own; the cost columns
      use the :period_days window as the pool''s total compute spend (all instances drawing from the pool),
      not a measure of idle-only waste. Pools are billed via the clusters that use them, tagged with instance_pool_id
      on billing.usage. instance_pool_id is a globally-unique GUID; the rollup is keyed on workspace_id
      + instance_pool_id (both present here) to keep the join strictly 1:1. Regional - run per metastore
      region. price_basis is ''unpriced'' when any non-free-usage SKU billed to this pool had no matching
      list_prices row (net_dbus/est_usd_list then understate cost), ''free'' when every matched SKU is
      a FREE_USAGE SKU (a real $0), and ''priced'' otherwise.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/compute/instance_pools_idle_capacity.sql
    order_by: p.min_idle_instances DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - instance_pool_id
- name: f_node_timeline_utilization
  description: 'One row = one cluster + node_type + driver/worker role, with average and peak CPU and
    memory over the window. avg_cpu_pct and avg_mem_pct are the columns that matter: both low over many
    slices means the node is oversized for its workload. This is a right-sizing profile; compute_idle_node_ratio
    is the dedicated idle finding. Rows are capped inside every window_days block by the body''s LIMIT
    :top_n (default 100000, threshold ''top_n'').'
  meta:
    query_id: node_timeline_utilization
    title: Per-cluster CPU / memory / network utilization profile
    domain: compute
    tier: lite
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - compute_scope_gap
    reads:
    - system.compute.node_timeline
    requires: SELECT on system.compute; GA
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days, capped at 90 in-SQL by node_timeline retention
    - name: min_slices
      default: 60
      meaning: minimum node-minutes before a cluster is judged (fewer -> NOT_ASSESSED)
    - name: oversized_cpu_pct
      default: 20
      meaning: avg CPU percent below which a cluster looks oversized
    - name: oversized_mem_pct
      default: 30
      meaning: avg memory percent below which a cluster looks oversized
    - name: top_n
      default: 100000
      meaning: row cap
    confidence: confirmed
    confidence_note: node_timeline utilization columns verified in a live workspace.
    healthy: avg_cpu_pct at/above :oversized_cpu_pct OR avg_mem_pct at/above :oversized_mem_pct - the
      box is being used (field heuristic).
    investigate_if: avg_cpu_pct below :oversized_cpu_pct AND avg_mem_pct below :oversized_mem_pct across
      enough slices (WARN = oversized candidate) - field heuristic; peak_* matters too, a low average
      with a high peak may just be bursty.
    actions:
    - confirm the low utilization is steady (not a bursty job) from peak_cpu_pct / peak_mem_pct before
      acting (free);
    - drop to a smaller node type or fewer workers, or enable autoscaling (config);
    - switch to a memory- or compute-optimized family that matches the real bottleneck (spend).
    next:
    - query_id: compute_idle_node_ratio
      if: to rank the same clusters by idle-slice ratio and wasted list-price $
    - query_id: cost_by_compute_resource
      if: to attach billed DBUs to a right-sizing candidate
    caveats: node_timeline retention is 90 DAYS ONLY, so :period_days is capped at LEAST(:period_days,
      90) in SQL - a longer trend silently truncates (read it as "assessed over the last 90 days at most").
      Nodes that ran under ~10 minutes MAY NOT APPEAR (short-job blind spot). Classic compute ONLY - no
      SQL-warehouse or serverless node utilization exists in this table. mem_used_percent includes background
      processes, so it is not pure workload memory. disk_free_bytes_per_mount_point is a map and is not
      selected. Utilization is per region. Ordered worst-status-first (WARN, then NOT_ASSESSED, then OK,
      each by avg_cpu_pct ASC) before :top_n is applied - the old plain "avg_cpu_pct ASC" order kept only
      the least-busy groups when the cap bound, so a real account's genuinely-busy (OK) clusters were
      cut first and the finding could misread as all-idle; :top_n defaults to 100000 (was 200) so a low
      build-time cap does not silently cut the flagged rows that matter, with no thresholds.yml override
      needed. not_assessed_reason says why a node was not judged, e.g. '10 of 15 minutes needed'.
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/compute/node_timeline_utilization.sql
    order_by: CASE status WHEN 'WARN' THEN 0 WHEN 'NOT_ASSESSED' THEN 1 ELSE 2 END, avg_cpu_pct ASC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - cluster_id
        - node_type
        - driver
