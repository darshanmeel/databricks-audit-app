    caveats: 'SCD snapshot: this returns the latest row per warehouse_id, so a deleted warehouse (delete_time
      NOT NULL) is excluded. warehouse_size enum includes 5X_LARGE (Beta, PRO/SERVERLESS channel only).
      tags is a map. Regional - run per metastore region. One source note: the original vendor documentation
      for this table says it "has 12 columns" but its own reference table for the same table lists 13
      - that is a documentation-internal miscount in the vendor docs, not an error in this query, which
      selects all 13.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/compute/sql_warehouse_config_current.sql
    order_by: warehouse_id
