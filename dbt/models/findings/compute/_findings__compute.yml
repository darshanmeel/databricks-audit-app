- name: f_sql_warehouse_events_activity
  description: One row = one CURRENT (non-deleted) warehouse + event_type combination and its event count/cluster-count
    stats over the window - a warehouse that is current but had ZERO events at all in the window still
    gets exactly one row, with event_type NULL (previously such a warehouse produced no row here at all,
    the opposite of the dormancy detection this query promises). The columns that matter are event_type
    (RUNNING/STARTING show the warehouse was actually used; SCALED_UP/SCALED_DOWN show autoscaling churn;
    STOPPED/STOPPING show suspend behavior; NULL means zero events) and last_event_time - for a RUNNING
    or STARTING row, an old last_event_time means this warehouse has gone quiet. net_dbus (the warehouse's
    own billed DBUs in the window) tells a genuinely dormant zero-event warehouse (billed nothing either)
    apart from a silent-but-still-billed one.
  meta:
    query_id: sql_warehouse_events_activity
    title: SQL warehouse event activity (raw event-type breakdown)
    domain: compute
    tier: lite
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - no_activity
    reads:
    - system.compute.warehouse_events
    - system.compute.warehouses
    - system.billing.usage
    requires: SELECT on system.compute, system.billing; GA
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_stale_days
      default: 7
      meaning: days since a warehouse's last RUNNING/STARTING event that flags WARN
    - name: crit_stale_days
      default: 14
      meaning: days that flags CRITICAL
    confidence: confirmed
    confidence_note: Event-type enum verified against system.compute.warehouse_events in a live workspace;
      SCALING_UP/SCALING_DOWN values are undocumented so this query does not rely on them. The zero-event
      dormancy check cross-references system.billing.usage, also GA.
    healthy: status = OK on the RUNNING/STARTING rows (last RUNNING or STARTING event within :warn_stale_days)
      - field heuristic; tune for your account's usage cadence.
    investigate_if: status = CRITICAL on a NULL-event_type row (zero events AND zero billed DBUs in the
      window - genuinely dormant, the case this query exists to catch) or on a RUNNING/STARTING row stale
      for :crit_stale_days+ (WARN at :warn_stale_days+) - the warehouse has likely gone dormant. status
      is NOT_ASSESSED on SCALED_UP/SCALED_DOWN/STOPPED/STOPPING rows (staleness there is not inherently
      good or bad from this table alone), on a NULL-event_type row for a warehouse first seen within the
      window (no activity is expected yet), and on a NULL-event_type row that DID bill DBUs in the window
      (likely always-on with no scaling, not confirmably dormant from events alone).
    actions:
    - if a warehouse shows no RUNNING/STARTING activity for a long stretch, or reads CRITICAL with zero
      events, confirm with its owner it is still needed before touching config (free);
    - if confirmed unused, lower auto_stop_minutes or pause/decommission it in sql_warehouse_config_current
      (config);
    - if it is a scheduled/rarely-used warehouse by design, move it to Serverless so idle time between
      runs costs nothing (spend).
    next:
    - query_id: sql_warehouse_config_current
      if: to check auto_stop_minutes/warehouse_size for a dormant warehouse
    - query_id: compute_warehouse_idle_gaps
      if: for the RUNNING idle-tail duration instead of just event counts
    - query_id: compute_warehouse_autoscale_churn
      if: for the scaling-specific churn signal
    caveats: 'Authoritative 6-value event_type enum for system.compute.warehouse_events is SCALED_UP,
      SCALED_DOWN, STOPPING, RUNNING, STARTING, STOPPED. SCALING_UP/SCALING_DOWN appear in one official
      sample but are UNDOCUMENTED - this query does not rely on them, and you should not either. cluster_count
      is the number of clusters running at event time. Regional - run per metastore region. The warehouse
      list is the union of current (non-deleted) system.compute.warehouses rows and warehouses with events
      in the window, so a deleted or never-captured warehouse still shows its events; only warehouse_name
      and first_seen_time come from the (possibly missing) current warehouses row. first_seen_time is
      the earliest change_time ever seen for that warehouse_id (system.compute.warehouses has no create_time
      column), used only to suppress a false CRITICAL on a warehouse created inside the window (no activity
      is expected from it yet); a warehouse with no current row can only reach that branch if it also
      has zero events, which the union already excludes, so the zero-event/CRITICAL branch stays scoped
      to warehouses with a current row. status is only meaningful on RUNNING/STARTING rows and on the
      NULL-event_type (zero-event) row; it is NOT_ASSESSED on SCALED_UP/SCALED_DOWN/STOPPED/STOPPING rows
      since staleness on those event types does not map to a clean good/bad verdict from this table alone.
      A zero-event warehouse is cross-checked against its own DBU billing in the window before it can
      read CRITICAL: zero events but nonzero net_dbus means it is up and being charged for (likely always-on
      with no scaling) rather than confirmably dormant from events alone, and reads NOT_ASSESSED instead.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/compute/sql_warehouse_events_activity.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 WHEN 'OK' THEN 2 ELSE 3 END, last_event_time
      ASC NULLS FIRST
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - warehouse_id
        - event_type
- name: f_task_cluster_utilization
  description: 'One row = one task run of one job run that lasted at least :warn_run_hours, with the per-minute
    hardware telemetry of the classic cluster it ran on, restricted to the task''s own window. The columns
    that matter are bottleneck_hint (WAITING_OR_IDLE, DRIVER_BOUND, IO_WAIT, SKEWED, COMPUTE_BOUND, MEMORY_PRESSURE
    or MIXED) and the four numbers behind it: worker_cpu_p50_pct, worker_cpu_spread_pct (hottest minus
    coldest worker), worker_mem_p90_pct and worker_cpu_wait_avg_pct. overlapping_task_runs says how many
    OTHER task runs shared the cluster during the window - above 0 the profile is the cluster''s, not
    this task''s. This query cannot see the SQL or the Spark stage; it tells you the SHAPE of the problem
    so you open the Spark UI (spark_ui_url) already knowing what to look for. Rows are capped inside every
    window_days block by the body''s LIMIT :top_n (default 200, threshold ''top_n'').'
  meta:
    query_id: task_cluster_utilization
    title: Inside a long job run, what each task's classic cluster was doing - waiting, skewed, compute-bound
      or undersized
    domain: compute
    tier: standard
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - compute_scope_gap
    - retention_window
    - no_activity
    - ingestion_lag
    reads:
    - system.lakeflow.job_run_timeline
    - system.lakeflow.job_task_run_timeline
    - system.compute.node_timeline
    - system.compute.clusters
    - system.lakeflow.jobs
    - system.access.workspaces_latest
    requires: 'SELECT on system.lakeflow, system.compute AND system.access (the latter only for workspace_name
      and the three URL columns - see caveats to drop it); GA. SCOPE LIMIT: node_timeline holds classic
      all-purpose and job clusters ONLY, so a serverless or SQL-warehouse task has no hardware profile
      and comes back NOT_ASSESSED (its SQL is in query_task_statement_breakdown instead)'
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days, capped at 90 in-SQL by node_timeline retention
    - name: warn_run_hours
      default: 2
      meaning: run wall-clock hours at/above which a run is examined (the same bound as lakeflow_long_running_runs,
        so the two compose)
    - name: min_slices
      default: 60
      meaning: minimum node-minutes overlapping the task before a cluster is judged (fewer -> NOT_ASSESSED)
    - name: waiting_cpu_pct
      default: 20
      meaning: average worker CPU percent below which the cluster was mostly waiting, not working
    - name: busy_cpu_pct
      default: 70
      meaning: median worker CPU percent at/above which the task is genuinely compute-bound
    - name: crit_mem_pct
      default: 85
      meaning: p90 worker memory percent at/above which the cluster looks undersized (CRITICAL)
    - name: crit_swap_pct
      default: 10
      meaning: p90 worker (or driver, on a single-node cluster) memory swap percent at/above which the
        cluster is judged memory-pressure (CRITICAL) - a sustained figure, because a small non-zero swap
        is normal on these nodes
    - name: skew_gap_pct
      default: 40
      meaning: gap in average CPU between the hottest and the coldest worker that flags skew
    - name: warn_io_wait_pct
      default: 20
      meaning: average worker CPU-wait percent at/above which the task is I/O-bound
    - name: top_n
      default: 200
      meaning: row cap
    confidence: needs_confirmation
    confidence_note: 'Every column used (node_timeline''s cpu_*/mem_*/network_* and driver, job_task_run_timeline.compute_ids,
      clusters'' node types and autoscale bounds, workspaces_latest.workspace_url) was checked against
      a live system-catalog schema dump of this account taken 2026-07-07, and the table scopes, retention,
      the zero-valued run durations and the run / cluster URL shapes against the Databricks doc pages
      on 2026-09-21 - but the query has NOT been executed on a workspace. Confirm on your account: 1)
      for a task you know ran on a job cluster, node_minutes is roughly (nodes x task minutes) - far below
      that means node_timeline''s cluster_id does not match compute_ids, or the task fell in its ~10-minute
      blind spot; 2) cluster_url opens the cluster and spark_ui_url opens its Spark UI - the /sparkUi
      suffix is the one unverified URL shape here, drop that column if it 404s; 3) a serverless task shows
      cluster_id NULL and status NOT_ASSESSED rather than an error.'
    healthy: bottleneck_hint = COMPUTE_BOUND or MIXED with overlapping_task_runs = 0 - the cluster was
      doing the work; the time is the job's design or input volume, not a misfit between task and compute
      - field heuristic; every threshold is a header param.
    investigate_if: 'WAITING_OR_IDLE, DRIVER_BOUND, IO_WAIT or SKEWED (WARN) - the cluster was billed
      while mostly idle, single-threaded on the driver, stalled on I/O, or hot on a few workers only;
      MEMORY_PRESSURE (CRITICAL) - p90 worker memory at/above :crit_mem_pct or p90 worker swap at/above
      :crit_swap_pct, so spill and OOM are the likely cause of the length (field heuristic). NOT_ASSESSED
      is not a pass: read not_assessed_reason.'
    actions:
    - 'open spark_ui_url (or run_url and the task''s Spark UI tab) with the hint in hand - SKEWED: find
      the stage whose task durations are lopsided and salt / repartition the key; WAITING_OR_IDLE: look
      at the driver log for the pause (an external call, a collect(), a serial loop); IO_WAIT: the input
      is small-file or remote-storage bound, compact or cache it; DRIVER_BOUND: the work is not distributed
      (pandas, toPandas(), driver-side loops) (free);'
    - 'MEMORY_PRESSURE: raise spark.sql.shuffle.partitions / cut the widest stage, or move to a memory-optimized
      worker_node_type; SKEWED with autoscale: the cluster is not the problem, the key is (config);'
    - if the profile is genuinely COMPUTE_BOUND for hours and x_vs_job_p50 in lakeflow_long_running_runs
      is near 1, buy time - more workers, a faster family, or Photon (spend).
    next:
    - query_id: query_task_statement_breakdown
      if: for the serverless / warehouse tasks of the same runs - the statements themselves
    - query_id: lakeflow_long_running_runs
      if: for the run-level picture this query zooms into
    - query_id: node_timeline_utilization
      if: for the same cluster's profile over the whole window instead of one task
    - query_id: compute_idle_node_ratio
      if: WAITING_OR_IDLE recurs - the cluster-level idle ranking with list-price waste
    - query_id: classic_clusters_config_current
      if: the node type or autoscale range looks wrong
    - query_id: lakeflow_jobs_on_all_purpose
      if: overlapping_task_runs is high - the cluster is shared
    - query_id: cost_workspace_names
      if: you dropped the workspaces_latest join and want to resolve workspace_id separately
    caveats: 'SCOPE - system.compute.node_timeline records classic all-purpose and job clusters only,
      so a serverless or SQL-warehouse task has no rows here: it is kept as a NOT_ASSESSED row with not_assessed_reason
      = no_cluster_recorded (compute_ids empty - serverless, or a row from before compute_ids was populated
      in early Dec 2025) or no_node_timeline_rows (an id was recorded but nothing overlaps the task window
      - a SQL warehouse id, which the doc says compute_ids also carries, a node that ran under ~10 minutes,
      which the doc says may not appear in node_timeline at all, or activity past its 90-DAY default retention,
      which is why :period_days is capped at LEAST(:period_days, 90)); too_few_slices means fewer than
      :min_slices overlapping node-minutes, tune it down for short tasks; task_not_executed means the
      task was SKIPPED or BLOCKED and never ran (the doc represents it as a row whose period_start_time
      equals period_end_time). node_timeline and clusters cover all-purpose, job AND Lakeflow pipeline
      clusters (cluster_source UI / API / JOB / PIPELINE / PIPELINE_MAINTENANCE), never serverless or
      SQL warehouses. The cluster is the FIRST entry of the task''s compute_ids (as lakeflow_long_running_runs
      does); compute_ids_count shows when a task recorded more than one. The profile is CPU / memory of
      the machines during the task''s window, NOT the task''s own consumption: on a shared all-purpose
      cluster every concurrent workload is in the numbers, and overlapping_task_runs counts the other
      task runs (any job, in the window) on the same cluster whose window overlaps - read the hint with
      care whenever it is above 0. There is no Spark stage, job or statement in any system table; the
      hint is a machine-level inference (field heuristics in the :params, in this precedence: MEMORY_PRESSURE,
      SKEWED, COMPUTE_BOUND, IO_WAIT, DRIVER_BOUND, WAITING_OR_IDLE, else MIXED) meant to tell you what
      to look for when you do open the Spark UI. DURATIONS - the doc states that run_duration_seconds
      and the other phase columns on job_run_timeline are populated only for legacy single-task jobs and
      log 0 for every multi-task job, so a 0 is treated as "not reported" and the run bound falls back
      to wall clock between the run''s first and last observed rows (exactly what lakeflow_long_running_runs
      must do too). Task seconds are execution_duration_seconds where populated (end row only, since early
      Dec 2025, 0 treated the same way), else wall clock between the task''s first and last observed rows,
      to current_timestamp() while in flight; the telemetry window is that same wall clock, so cluster
      start-up minutes before the task''s first row are excluded (that is the setup phase, see lakeflow_phase_cold_start).
      Single-node clusters have no worker rows: single_node = true and the hint is computed from the driver''s
      numbers instead. mem_used_percent includes OS and background processes, so a memory floor of 30-40
      percent on an idle node is normal. SWAP IS THRESHOLDED - the MEMORY_PRESSURE rule judges the p90
      of worker (or driver, on a single-node cluster) swap against :crit_swap_pct, not any swap above
      zero, because a small non-zero swap figure is normal on these nodes; lakeflow_job_compute_pressure
      judges its own job-level swap the same way, with the same default, so the two now agree on a task/job''s
      swap-driven verdict. Cluster config comes from system.compute.clusters, SCD2 - the latest row per
      cluster, so a job cluster that was resized between runs shows its last shape. Like lakeflow_long_running_runs
      this query keeps the current day so a run in flight is examined; very recent minutes may still be
      materializing. Names are resolved by LEFT JOIN so a missing name never drops a row: job_name comes
      from system.lakeflow.jobs (SCD2) which one-time SUBMIT_RUN / WORKFLOW_RUN executions never write
      to; workspace_name and the three URLs come from system.access.workspaces_latest, a DIFFERENT system
      schema - if you cannot read it this query ERRORS rather than degrading, so drop workspace_name,
      the three URL columns and the ws LEFT JOIN, and resolve ids with cost_workspace_names. run_url and
      cluster_url follow the shapes lakeflow_long_running_runs uses; spark_ui_url appends /sparkUi to
      the cluster page and is the one unverified URL shape (the documented alternative needs the run''s
      spark_context_id, which no system table carries). The doc says a terminated cluster is permanently
      deleted 30 days after termination unless pinned, and only a limited number of recently terminated
      job clusters keep their Spark UI, so open the link soon - or turn on cluster log delivery to a Unity
      Catalog volume (GA since Apr 2026) so the Spark event log outlives the cluster and can be replayed.
      The job run page itself is kept for 60 days. No identities are emitted, so nothing is masked. There
      are no dollars here; price the cluster with compute_idle_node_ratio or cost_by_job.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/compute/task_cluster_utilization.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 WHEN 'NOT_ASSESSED' THEN 2 ELSE 3
      END, task_hours DESC, workspace_id, job_id, job_run_id, task_key
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - job_run_id
        - task_run_id
