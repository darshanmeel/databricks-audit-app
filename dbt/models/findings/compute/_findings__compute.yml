- name: f_compute_idle_node_ratio
  description: One row = one classic cluster over the window. idle_ratio (idle minute-slices / judged
    minute-slices, WORKER slices only - a single-node cluster with no workers is judged on its driver
    instead) is the column that matters; est_wasted_usd_list scales the cluster's effective-list-price
    DBU cost by its idle worker minutes over all node minutes (driver included in the denominator, so
    the driver's share is never counted as waste) so you can rank the biggest likely savings. High idle_ratio
    + meaningful est_wasted_usd_list = an auto-stop / downsizing candidate. price_basis (free/priced/unpriced)
    discloses whether that cost is a real $0 (free-usage SKU) or a pricing-coverage gap. Rows are capped
    inside every window_days block by the body's LIMIT :top_n (default 200, threshold 'top_n').
  meta:
    query_id: compute_idle_node_ratio
    title: Idle classic clusters by idle-slice ratio
    domain: compute
    tier: standard
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - compute_scope_gap
    reads:
    - system.compute.node_timeline
    - system.billing.usage
    - system.billing.list_prices
    requires: SELECT on system.compute, system.billing; GA
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days, capped at 90 in-SQL by node_timeline retention
    - name: idle_cpu_pct
      default: 5
      meaning: CPU busy percent below which a minute-slice counts as idle
    - name: min_slices
      default: 60
      meaning: minimum node-minutes before a cluster is judged (fewer -> NOT_ASSESSED)
    - name: warn_idle_ratio
      default: 0.5
      meaning: idle-slice fraction that flags WARN
    - name: crit_idle_ratio
      default: 0.8
      meaning: idle-slice fraction that flags CRITICAL
    - name: top_n
      default: 200
      meaning: row cap
    confidence: confirmed
    confidence_note: node_timeline columns verified in a live workspace; the est_wasted_usd_list overlay
      is a directional estimate at the effective list price (DEC-66.1), not a verified invoice figure.
    healthy: idle_ratio below :warn_idle_ratio (field heuristic - tune :warn_idle_ratio for your account).
    investigate_if: 'idle_ratio at/above :warn_idle_ratio (WARN) or :crit_idle_ratio (CRITICAL) with real
      est_wasted_usd_list - field heuristic. BEFORE downsizing, check avg_mem_pct_all: high memory + low
      CPU means the cluster is memory-bound, NOT idle, so shrinking it will spill.'
    actions:
    - set/shorten auto-termination on the cluster so idle time stops billing (free);
    - enable autoscaling or lower the min workers if the idle is steady-state over-provisioning (config);
    - move the workload to a smaller or memory-optimized node type once you have confirmed it is CPU-idle,
      not memory-bound (spend).
    next:
    - query_id: compute_warehouse_idle_gaps
      if: the idle compute is a SQL warehouse, not a classic cluster
    - query_id: cost_by_compute_resource
      if: to see the same cluster's full billed DBUs by day
    caveats: 'node_timeline retention is 90 DAYS ONLY, so :period_days is capped at LEAST(:period_days,
      90) in SQL - a longer window silently truncates (read it as "assessed over the last 90 days at most").
      Nodes that ran under ~10 minutes MAY NOT APPEAR (short-job blind spot), so a very short cluster
      is invisible here, not "idle". Classic compute ONLY - there are NO node_timeline rows for SQL warehouses
      or serverless, so this measure does not cover them. Each row of node_timeline is ONE node-minute
      (driver AND every worker), so a raw count is NOT hours - idle is reported as a RATIO of slices,
      never converted to hours. WORKER SLICES ONLY: idle_ratio and est_wasted_usd_list are judged on worker
      minute-slices alone (the `driver` column excludes the driver), because the driver is doing coordination
      work even on a fully idle cluster and including it understates idle on a small cluster (a 1 driver
      + 1 worker cluster with a busy driver and an idle worker used to read a diluted, misleadingly low
      idle share). A cluster with no worker slices at all in the window (a genuine single-node cluster)
      falls back to its driver slices instead, so it is still judged, not silently dropped. total_slices
      stays every node-minute (driver and worker); judged_slices is the worker-or-driver-fallback count
      :min_slices is checked against. CPU/mem are percents 0-100; mem_used_percent includes background
      processes. A slice is "idle" by a low-CPU threshold (:idle_cpu_pct) evaluated over every slice in
      the judged set, never only over already-idle rows. node_timeline carries no DBU/$ column: net_dbus
      is the exact billed DBUs (usage_unit=''DBU'') for the cluster and est_usd_list is an ESTIMATE AT
      THE EFFECTIVE LIST PRICE (usage_quantity x list_prices.pricing.effective_list.default - DEC-66.1),
      NOT the negotiated invoice rate and excluding cloud infra/egress $. est_wasted_usd_list = est_usd_list
      x idle worker slices / all node slices is DIRECTIONAL - it assumes every node minute costs the same
      (a driver on a bigger node type makes it slightly off) and that waste is proportional to idle slices,
      which over-counts when idle time is cheap warm-standby. Cost is attributed by billing cluster_id
      over the same window (per-cluster, not per node/slice); cluster_id is a globally-unique GUID so
      cost keys on cluster_id alone. price_basis is ''unpriced'' when any non-free-usage SKU billed to
      this cluster had no matching list_prices row (net_dbus/est_usd_list then understate cost), ''free''
      when every matched SKU is a FREE_USAGE SKU (a real $0), and ''priced'' otherwise.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/compute/compute_idle_node_ratio.sql
    order_by: est_wasted_usd_list DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
