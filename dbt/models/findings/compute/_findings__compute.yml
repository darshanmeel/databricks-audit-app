- name: f_compute_warehouse_autoscale_churn
  description: 'One row = one SQL warehouse''s scale-up/scale-down activity over the window. churn_events
    is TRUE autoscale churn - a SCALED_UP or SCALED_DOWN transition between two already-nonzero cluster
    counts - and is what status now bands on, per observed hour (observed_hours: the span between this
    warehouse''s first and last event in the window). start_events/stop_events count the warehouse''s
    own 0->N starts and N->0 stops separately (not churn); start_stop_cycles is the number of full start-then-stop
    cycles observed. scaling_events/scaled_up_events/scaled_down_events/scaling_events_total are KEPT
    with their original meaning (every SCALED_UP/SCALED_DOWN event, starts and stops included) for compatibility
    with anything already reading them.'
  meta:
    query_id: compute_warehouse_autoscale_churn
    title: SQL warehouse autoscale churn (scale-up/scale-down thrash)
    domain: compute
    tier: standard
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if: []
    reads:
    - system.compute.warehouse_events
    - system.compute.warehouses
    - system.billing.usage
    - system.billing.list_prices
    requires: SELECT on system.compute, system.billing; GA
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: min_observed_hours
      default: 1
      meaning: minimum hours between a warehouse's first and last event in the window before a churn rate
        is reported (guards divide-by-zero and short-span spikes)
    - name: warn_churn_per_hour
      default: 4
      meaning: true churn events (nonzero-to-nonzero cluster-count transitions) per observed hour that
        flags WARN
    - name: crit_churn_per_hour
      default: 10
      meaning: the same that flags CRITICAL
    confidence: needs_confirmation
    confidence_note: Event-type enum and the cost-rollup join verified against system.compute.warehouse_events
      and system.billing.usage/list_prices in a live workspace. The churn-vs-start/stop split (LAG'd prev_cluster_count
      over ALL event types) is a straightforward reading of the documented enum, but has not itself been
      confirmed against a live account's actual event ordering.
    healthy: status = OK - field heuristic; tune :warn_churn_per_hour / :crit_churn_per_hour for your
      account.
    investigate_if: status = WARN or CRITICAL (churn_events / observed_hours at or above the threshold)
      - field heuristic. status = NOT_ASSESSED means observed_hours is below :min_observed_hours, i.e.
      too little history to rate, not a clean bill of health.
    actions:
    - widen the warehouse's min_clusters/max_clusters autoscale bounds, or switch it to a fixed cluster
      count, so it stops thrashing (free);
    - raise auto_stop_minutes or route bursty/spiky workloads to a dedicated warehouse so scaling settles
      (config);
    - move the worst-churning warehouse to Serverless SQL, which absorbs scaling internally (spend).
    next:
    - query_id: sql_warehouse_config_current
      if: to see this warehouse's min_clusters/max_clusters
    - query_id: compute_warehouse_idle_gaps
      if: the same warehouse also shows a long RUNNING idle tail
    caveats: Authoritative event_type enum for system.compute.warehouse_events is SCALED_UP, SCALED_DOWN,
      STOPPING, RUNNING, STARTING, STOPPED. Only SCALED_UP/SCALED_DOWN count toward any of the event columns
      here. churn_events reads each event's own previous cluster_count (LAG over ALL event types in the
      window, ordered by event_time) and counts a SCALED_UP/SCALED_DOWN transition as churn only when
      BOTH the prior and the new cluster_count are > 0 - a transition FROM 0 is a start_event, a transition
      TO 0 is a stop_event, neither is churn. The very first in-window event has no earlier row to look
      back to and is treated as prev_cluster_count = 0 (the conservative reading at the window's edge,
      so it can only ever read as a start, never churn). avg_cluster_count_time_weighted weights each
      observed cluster_count by how long the warehouse actually held it before the next event (LEAD(event_time));
      the last event in the window contributes no weighted duration, since it has no next event yet. The
      churn rate is churn_events / observed_hours; observed_hours is the span between this warehouse's
      first and last event IN THE WINDOW, not the wall-clock window, so a warehouse seen for only part
      of the window is not diluted. A warehouse with a single event has a zero/near-zero observed span,
      so status is NOT_ASSESSED below :min_observed_hours rather than a fabricated spike. cluster_count
      is clusters running at event time. system.compute.warehouse_events carries no DBU/$ by itself -
      it is a behavioral churn signal only; net_dbus/est_usd_list come from the separate cost rollup below.
      net_dbus is exact billed DBUs (usage_unit='DBU'); est_usd_list is an ESTIMATE AT THE EFFECTIVE LIST
      PRICE (usage_quantity x list_prices.pricing.effective_list.default - DEC-66.1) - NOT your negotiated
      invoice rate (not available in any system table) and excludes cloud infra/egress cost; treat est_usd_list
      as directional. Cost is attributed by billing warehouse_id over the :period_days window (per-resource),
      not per scaling event - the cost rollup is pre-aggregated before the join, so rows here are never
      multiplied by it. warehouse_id is a globally-unique GUID, so the cost rollup is keyed on warehouse_id
      alone (workspace_id is not part of the rollup grain). warehouse_name comes from the latest non-deleted
      system.compute.warehouses row for the id and may be null if the warehouse has since been deleted.
      price_basis is 'unpriced' when any non-free-usage SKU billed to this warehouse had no matching list_prices
      row (net_dbus/est_usd_list then understate cost), 'free' when every matched SKU is a FREE_USAGE
      SKU (a real $0), and 'priced' otherwise.
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/compute/compute_warehouse_autoscale_churn.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 WHEN 'OK' THEN 2 ELSE 3 END, churn_events
      DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - warehouse_id
- name: f_compute_warehouse_autostop_churn
  description: One row = one SQL warehouse over the window (days with no STOPPED/STARTING event are not
    counted as observed). days_observed is how many days had at least one such event; days_flagged is
    how many of those individually read WARN or CRITICAL by the same daily rule as before. worst_day is
    the single worst day (ranked by status, then autostop_count, then est_wasted_usd_list) with its own
    autostop_count and est_wasted_usd_list, so one bad day is never buried in a total. total_autostop_count/total_autostop_idle_minutes/
    total_est_wasted_usd_list sum every day in the window. cold_start_risk_days counts days a classic
    or pro warehouse (never serverless) started at least :warn_daily_restarts times - every restart pays
    a cold start regardless of how short the auto-stop was.
