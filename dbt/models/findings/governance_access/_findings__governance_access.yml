    - privilege_scoped
    reads:
    - system.information_schema.column_masks
    requires: SELECT on system.information_schema; Public Preview, DBR 12.2 LTS+, Unity Catalog required
    params: []
    confidence: confirmed
    confidence_note: 'Columns verified against a live workspace on 2026-05-30: table_catalog, table_schema,
      table_name, column_name, mask_name, using_columns.'
    healthy: n/a - inventory
    investigate_if: n/a - inventory
