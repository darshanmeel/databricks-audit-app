- name: f_access_dead_table_candidates
  description: One row = a MANAGED or EXTERNAL table that never appeared as a lineage source (was never
    read) in the window. The columns that matter are days_since_altered (staleness) and table_owner (who
    to ask before dropping anything).
  meta:
    query_id: access_dead_table_candidates
    title: Dead-table cleanup candidates
    domain: governance_access
    tier: standard
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - lineage_inference_only
    - retention_window
    - privilege_scoped
    reads:
    - system.access.table_lineage
    - system.information_schema.tables
    requires: SELECT on system.access and system.information_schema; system.access.table_lineage is GA;
      information_schema requires Unity Catalog
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_dead_days
      default: 90
      meaning: days since last altered for a table with no lineage-source hits that flags WARN
    - name: crit_dead_days
      default: 365
      meaning: that flags CRITICAL
    confidence: needs_confirmation
    confidence_note: Lineage undercounts reads that have no captured source (e.g. INSERT ... VALUES literals),
      so a table absent from lineage is a cleanup candidate to cross-check, not proof it is unused.
    healthy: status = OK; days_since_altered below :warn_dead_days for a table that never appeared as
      a lineage source - field heuristic; a candidate can still be OK for a while (e.g. quarterly jobs).
    investigate_if: status = WARN at/above :warn_dead_days, CRITICAL at/above :crit_dead_days, or NOT_ASSESSED
      when last_altered is NULL (age unknown - do not treat as a finding) - field heuristic; widen :period_days
      first if your account's retention allows it, since a short lineage window over-flags quarterly/long-tail
      tables.
    actions:
    - cross-check the table against system.access.audit, query.history, and system.storage.table_metrics_history
      before touching anything (free);
    - if genuinely unused, revoke write access or move it to a to-be-deleted schema for a cooling-off
      period (config);
    - once confirmed dead, formally retire and drop it to reclaim storage spend (spend).
    next:
    - query_id: access_table_lineage_blast_radius
      if: see the table's full lineage graph if it does show up elsewhere
    - query_id: po_vacuum_reclaimed_bytes
      if: reclaim storage once you drop it
    caveats: A table that never shows up as a lineage SOURCE in the window is a cleanup CANDIDATE, not
      proof it's unused - a SELECT whose result is never written to another table emits no lineage row
      at all, and write-only targets never appear as a source either. Treat this as a candidate list to
      cross-check against system.access.audit, query.history, and system.storage.table_metrics_history
      before you touch anything - never as a DROP recommendation on its own. Lineage is only captured
      when Unity Catalog observes the operation. direct_access=false (indirect/view-expansion) edges still
      count as "appeared as a source" here, so a view-mediated read does not falsely mark the underlying
      base table dead. Retention on system.access.* tables is workspace-configurable, and a short window
      over-flags quarterly or long-tail tables - widen :period_days if your account's retention allows
      it. System tables are excluded by exact catalog name ('system'), not a bare NOT LIKE 'system' (which
      has no wildcard and would behave as <> 'system', missing system schemas that don't match exactly).
      information_schema is privilege-aware, so tables you cannot see are absent from this list, not proven
      dead. last_altered/created can be NULL or late-populated on some object types - read that as "age
      unknown," never as a finding on its own (this drives the NOT_ASSESSED status).
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/governance_access/access_dead_table_candidates.sql
    order_by: days_since_altered DESC NULLS LAST
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - table_catalog
        - table_schema
        - table_name
- name: f_access_delta_sharing_exposure
  description: One row = one OUTBOUND Delta Share, with how many recipients it is granted to and how many
    schemas/tables it exposes. The columns that matter are recipient_count and shared_table_count - together
    they size external data exposure. A share with recipients IS live external exposure. Rows are capped
    inside every window_days block by the body's LIMIT :top_n (default 200, threshold 'top_n').
  meta:
    query_id: access_delta_sharing_exposure
    title: Delta Sharing external exposure - recipients and shared objects per share
    domain: governance_access
    tier: standard
    stars: false
    origin: vendored
    windowed: false
    is_finding: true
    empty_if:
    - privilege_scoped
    - no_activity
    reads:
    - system.information_schema.shares
    - system.information_schema.share_recipient_privileges
    - system.information_schema.table_share_usage
    - system.information_schema.schema_share_usage
    requires: SELECT on system.information_schema; Unity Catalog required; Delta Sharing (provider side)
      in use
    params:
    - name: warn_share_recipients
      default: 1
      meaning: recipients on a share at/above which it flags WARN (any external recipient is worth a review)
    - name: crit_share_recipients
      default: 10
      meaning: recipients at/above which it flags CRITICAL
    - name: crit_shared_tables
      default: 100
      meaning: shared tables at/above which a share flags CRITICAL regardless of recipient count
    - name: top_n
      default: 200
      meaning: row cap
    confidence: confirmed
    confidence_note: shares, share_recipient_privileges, schema_share_usage, and table_share_usage columns
      are transcribed verbatim from the information_schema reference.
    healthy: recipient_count = 0 - a share defined but not yet granted to any recipient (field heuristic).
    investigate_if: recipient_count at/above :warn_share_recipients (WARN - external exposure exists,
      confirm it is intended); recipient_count at/above :crit_share_recipients or shared_table_count at/above
      :crit_shared_tables (CRITICAL - broad external exposure) - field heuristic.
    actions:
    - confirm each recipient is an intended partner and revoke any that are not (free);
    - scope shares to the minimum tables/schemas needed and prefer schema shares with row/column controls
      (config);
    - rotate recipient tokens and set recipient IP allowlists / expirations (config).
    next:
    - query_id: access_grants_inventory_extended
      if: the internal grant side of the same objects
    - query_id: access_tags_inventory
      if: whether the shared tables carry sensitivity tags
    caveats: PROVIDER side only - this is what YOU share OUT (outbound), not data shared TO you. system.information_schema
      is privilege-aware, so a principal that cannot see a share or its recipients undercounts exposure
      - label "partial - privilege-aware", never a complete share graph. recipient_count is DISTINCT recipients
      across the share's privilege rows; recipients are partial-masked. shared_table_count / shared_schema_count
      come from table_share_usage / schema_share_usage (what is actually exposed) and can lag share edits.
      recipient_count = 0 means defined-but-not-yet-granted-out - not necessarily safe, just not yet live.
      Token / expiration / IP-allowlist details are not in these views (Delta Sharing API only).
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/governance_access/access_delta_sharing_exposure.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 ELSE 2 END, recipient_count DESC,
      shared_table_count DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - share_name
- name: f_access_grants_inventory
  description: One row = an object scope (TABLE or CATALOG) x privilege type x grantee, rolled up. The
    columns that matter are grant_count (how many individual grants) and distinct_objects (how many different
    tables/catalogs that grantee touches).
  meta:
    query_id: access_grants_inventory
    title: Table and catalog grants inventory
    domain: governance_access
    tier: standard
    stars: false
    origin: vendored
    windowed: false
    is_finding: false
    empty_if:
    - privilege_scoped
    reads:
    - system.information_schema.table_privileges
    - system.information_schema.catalog_privileges
    requires: SELECT on system.information_schema; Unity Catalog required
    params: []
    confidence: confirmed
    confidence_note: table_privileges and catalog_privileges are transcribed verbatim - the only two privilege
      views confirmed column-by-column for this query.
    healthy: n/a - inventory
    investigate_if: n/a - inventory
    actions: []
    next:
    - query_id: access_grants_inventory_extended
      if: schema/connection/credential/external-location grants
    - query_id: access_runas_escalation
      if: cross-check a broadly-granted identity against run-as activity
    caveats: system.information_schema is privilege-aware - a principal with MANAGE sees only its own
      grants and only the objects it can see, so a single service principal generally cannot enumerate
      every grant in the metastore. Even run as a high-privilege audit principal, label this "partial
      - privilege-aware; incomplete vs SHOW GRANTS", never a complete grant graph. IS_GRANTABLE is always
      'NO' (reserved by Databricks) and is not collected here. table_privileges carries an inherited_from
      column (set when the grant traces to a higher-scope grant, e.g. a catalog-level grant that also
      covers this table) which this query does NOT filter or split out - grant_count and distinct_objects
      on the TABLE scope pool EXPLICIT and INHERITED-from-a-higher-scope grants together, undifferentiated
      (contrary to an earlier version of this caveat, which wrongly claimed inherited grants "never appear
      as rows" here - they do, just not labelled as such). catalog_privileges carries no inherited_from
      column in this source at all, so a catalog-level grant inherited from, say, a metastore default
      is invisible on the CATALOG scope, not zero. Privileges derived from object OWNERSHIP (never an
      explicit or inherited GRANT row on either scope) still never appear as rows in either branch, so
      a grantee's effective access can still exceed grant_count even after accounting for the above.
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/governance_access/access_grants_inventory.sql
    order_by: object_scope, PRIVILEGE_TYPE, GRANTEE
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - object_scope
        - privilege_type
        - GRANTEE
- name: f_access_grants_inventory_extended
  description: One row = an object scope (SCHEMA, CONNECTION, CREDENTIAL, or EXTERNAL_LOCATION) x privilege
    type x grantee, with a grant count. Use it to see who holds broad integration-level access beyond
    plain table/catalog grants.
  meta:
    query_id: access_grants_inventory_extended
    title: Schema, connection, credential, and external-location grants inventory
    domain: governance_access
    tier: standard
    stars: false
    origin: vendored
    windowed: false
    is_finding: false
    empty_if:
    - privilege_scoped
    reads:
    - system.information_schema.schema_privileges
    - system.information_schema.connection_privileges
    - system.information_schema.credential_privileges
    - system.information_schema.external_location_privileges
    requires: SELECT on system.information_schema; Unity Catalog required
    params: []
    confidence: needs_confirmation
    confidence_note: Only table_privileges and catalog_privileges (used in access_grants_inventory) are
      transcribed column-by-column; the object-name columns on these four sibling views (e.g. schema_privileges.catalog_name+schema_name,
      and the connection/credential/external-location name columns) are inferred, not verified. This query
      only reads GRANTEE and PRIVILEGE_TYPE, which are shared across every privilege view, so it is safe
      as written - do not add any object-name column from these views until you DESCRIBE it in your workspace.
    healthy: n/a - inventory
    investigate_if: n/a - inventory
    actions: []
    next:
    - query_id: access_grants_inventory
      if: table/catalog grants
    - query_id: access_runas_escalation
      if: ''
    caveats: 'These four views exist in information_schema per Databricks documentation, but their exact
      column names beyond the shared GRANTOR/GRANTEE/PRIVILEGE_TYPE/IS_GRANTABLE/INHERITED_FROM shape
      are not verified column-by-column here - only GRANTEE and PRIVILEGE_TYPE are used, which are safe.
      STORAGE_CREDENTIAL_PRIVILEGES is deprecated and excluded on purpose. The same privilege-aware incompleteness
      caveat as access_grants_inventory applies: this is partial, not a complete grant graph. SAFE as
      written (uses only GRANTEE/PRIVILEGE_TYPE, shared across all privilege views). NEEDS CONFIRMATION
      before reading any per-view object-name column: DESCRIBE each sibling view in your own workspace
      first.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/governance_access/access_grants_inventory_extended.sql
    order_by: object_scope, PRIVILEGE_TYPE, GRANTEE
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - object_scope
        - privilege_type
        - GRANTEE
- name: f_access_login_concentration
  description: One row = a workspace x masked principal x source IP x service x login action combo in
    the window. The columns that matter are non_success_count (a real, non-2xx status - never a missing
    one), unknown_status_count (rows whose status_code is simply missing, never counted as a failure)
    and distinct_source_ips (how many DIFFERENT locations that principal authenticated from within THIS
    ROW's OWN workspace in the window).
  meta:
    query_id: access_login_concentration
    title: Login concentration and failed-authentication rollup
    domain: governance_access
    tier: standard
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - preview_unavailable
    - privilege_scoped
    reads:
    - system.access.audit
    requires: SELECT on system.access; Public Preview
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_failed_logins
      default: 5
      meaning: non-success auth events for one principal+source_ip+service+action combo that flags WARN
    - name: crit_failed_logins
      default: 20
      meaning: that flags CRITICAL
    confidence: confirmed
    confidence_note: service_name='accounts' is confirmed; specific action_name values (mfaLogin, tokenLogin,
      and others) are representative, not a complete enumeration - matched via a login/authenticate name
      pattern rather than hardcoding a filter list. user_identity.subject_name (not subjectName) was confirmed
      live 2026-05-30 and is frequently NULL. Whether response.status_code is int or long is unverified,
      so the IS NOT NULL AND <>200 comparison is written defensively either way.
    healthy: status = OK; non_success_count below :warn_failed_logins for one principal+IP+action - field
      heuristic; some non-success events are normal (typos, expired tokens); a high unknown_status_count
      is a coverage gap, not itself a failure.
    investigate_if: status = WARN at/above :warn_failed_logins, CRITICAL at/above :crit_failed_logins
      - field heuristic; also worth a look whenever distinct_source_ips is high for a single principal
      in one workspace, which this query surfaces but does not score.
    actions:
    - confirm whether the failed attempts are a known automation/CI credential that rotated or expired
      (free);
    - if unexplained, force a credential/token reset for that principal and require MFA (config);
    - if this recurs across many principals, invest in a dedicated identity-threat-detection tool or SIEM
      integration ahead of Databricks-native monitoring (spend).
    next:
    - query_id: access_runas_escalation
      if: check if the same principal shows run-as activity
    - query_id: access_admin_role_change_events
      if: check if they also touched admin roles
    caveats: service_name='accounts' also carries non-login account-management actions (e.g. token/permission
      changes); action_name is filtered to a login/authenticate name pattern (case-insensitive) first,
      since the specific action_name values (mfaLogin, tokenLogin, and others) are representative, not
      a complete list - a login action this account uses under a name the pattern misses would be invisible
      here, a coverage gap, not a false negative. user_identity.subject_name (not subjectName) was confirmed
      live on 2026-05-30 and is frequently NULL. response.status_code missing (NULL) is its own unknown_status_count,
      never folded into non_success_count - a genuinely missing status is not evidence of a failed attempt.
      This reads system.access.audit, which is Public Preview and deduped by event_id (QUALIFY, latest
      event_time wins) before anything else, since a replayed/retried audit event must count once. Account-level
      events are global (workspace_id=0); workspace events are regional, so a single-region query undercounts.
      Ingest lag is roughly 15 minutes - treat the most recent hour as provisional and re-run later for
      a complete count. distinct_source_ips is computed in a separate CTE keyed on (workspace_id, RAW
      pre-mask principal), over every one of that principal's rows IN THAT WORKSPACE in the window, then
      joined back onto each of this query's own principal+IP+service+action rows - it is NOT `COUNT(DISTINCT
      source_ip_address)` scoped to the final GROUP BY (that GROUP BY already fixes source_ip_address
      to one value per row, so a same-position COUNT(DISTINCT source_ip_address) could only ever read
      0 or 1, never the principal's true IP spread - the exact bug this CTE fixes), and it is scoped per
      workspace so the app's workspace filter actually narrows it - a principal seen in two workspaces
      gets two independent counts, never one account-wide total merged across both. workspace_id is frequently
      NULL here because service_name='accounts' events are commonly account-scoped, not because the column
      itself is missing.
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/governance_access/access_login_concentration.sql
    order_by: non_success_count DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - principal
        - source_ip_address
        - service_name
        - action_name
- name: f_access_network_inbound_denials
  description: One row = a workspace x policy outcome x rule x request path x principal x source IP combo
    in the window. The column that matters is denial_count - how many times that combination was denied
    at the network edge.
  meta:
    query_id: access_network_inbound_denials
    title: Inbound network policy denials
    domain: governance_access
    tier: deep
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - preview_unavailable
    reads:
    - system.access.inbound_network
    requires: SELECT on system.access; Public Preview
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days (inbound retention caps at 30d regardless)
    - name: warn_denial_count
      default: 10
      meaning: denials for one rule+path+principal+IP that flags WARN
    - name: crit_denial_count
      default: 50
      meaning: that flags CRITICAL
    confidence: needs_confirmation
    confidence_note: The nested subfield source.ip is unverified - Databricks' docs describe the source
      struct as having subfields "including ip, private-link" but "including" is non-exhaustive, so the
      exact identifier (ip vs ip_address; private-link may need backtick-quoting) has not been confirmed
      column-by-column. All other columns (policy_outcome, rule_label, request_path, authenticated_as,
      event_time) are confirmed. A wrong subfield name errors the entire statement, so verify source.ip
      in your workspace (or drop it) before relying on this query.
    healthy: status = OK; denial_count below :warn_denial_count for one rule+path+principal+IP - field
      heuristic.
    investigate_if: status = WARN at/above :warn_denial_count, CRITICAL at/above :crit_denial_count -
      field heuristic; a sudden spike of denials from one source IP against multiple paths is worth prioritizing
      even below the threshold.
    actions:
    - confirm whether the denied traffic is a misconfigured internal client (bad DNS, wrong endpoint)
      rather than an external actor (free);
    - if the source is unexpected, tighten or add an explicit ingress rule and confirm the policy is not
      left in DENY_DRY_RUN (config);
    - if denials persist from external ranges, engage network/security to add IP-range blocking upstream
      of Databricks (spend).
    next:
    - query_id: access_network_outbound_denials
      if: check the egress side
    - query_id: access_admin_role_change_events
      if: see if the same principal also touched admin roles
    caveats: 'This surfaces DENIALS ONLY - policy_outcome is DENY or DENY_DRY_RUN, so there is no allow-side
      baseline here. Inbound retention is capped at 30 days regardless of :period_days - widening the
      parameter past 30 will not surface older data. This table has no event_date column, only event_time.
      An empty result means no ingress policy is configured, not that nothing was denied - degrade to
      "not assessed", never "clean". This reads system.access.inbound_network, which is Public Preview
      and regional. WORKSPACE_ID: added to the SELECT/GROUP BY (confirmed present on this table) - this
      table is already per-workspace, so the app''s workspace filter now actually narrows this finding.
      NEEDS CONFIRMATION: the source.ip nested subfield name is unverified in this account. A wrong name
      errors the whole statement - drop or replace it with the verified subfield before running this in
      your workspace.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/governance_access/access_network_inbound_denials.sql
    order_by: denial_count DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - policy_outcome
        - rule_label
        - request_path
        - authenticated_as
        - source_ip
- name: f_access_network_outbound_denials
  description: One row = a workspace x source type x destination type x access type x destination combo
    in the window. The column that matters is denial_count - how many times egress to that destination
    was blocked from that workspace.
  meta:
    query_id: access_network_outbound_denials
    title: Outbound network policy denials
    domain: governance_access
    tier: deep
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - preview_unavailable
    - compute_scope_gap
    reads:
    - system.access.outbound_network
    requires: SELECT on system.access; Public Preview
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days (outbound retention allows up to 365d)
    - name: warn_denial_count
      default: 10
      meaning: denials to one destination that flags WARN
    - name: crit_denial_count
      default: 50
      meaning: that flags CRITICAL
    confidence: confirmed
    confidence_note: All columns (network_source_type, destination_type, access_type, destination, dns_event.rcode,
      storage_event.rejection_reason, event_time) are confirmed.
    healthy: status = OK; denial_count below :warn_denial_count for one destination - field heuristic.
    investigate_if: status = WARN at/above :warn_denial_count, CRITICAL at/above :crit_denial_count -
      field heuristic; a new destination_type=STORAGE denial with a non-null storage_rejection_reason
      is worth a look regardless of volume.
    actions:
    - confirm the destination is genuinely unexpected rather than a known SaaS/API dependency that needs
      an egress rule (free);
    - add an explicit egress allow rule for legitimate destinations, or investigate the workload if it
      is not (config);
    - if repeated denials point at exfiltration attempts, engage security to review the workload's code
      and rotate any credentials it held (spend).
    next:
    - query_id: access_network_inbound_denials
      if: check the ingress side
    - query_id: access_vector_search_traffic
      if: the blocked destination is a Vector Search endpoint
    caveats: 'This surfaces DENIALS ONLY, so there is no allow-side traffic baseline and you cannot compute
      an allow/deny ratio from this alone. dns_event is NULL unless destination_type=DNS; storage_event
      is NULL unless destination_type=STORAGE. An empty table means no egress policy is configured or
      the Preview feature has not populated data yet - read that as "not assessed", never as zero exfiltration
      attempts. This table has no event_date column, only event_time. Outbound retention is 365 days,
      much longer than the inbound table, so widening :period_days here is meaningful. Regional. WORKSPACE_ID:
      added to the SELECT/GROUP BY (confirmed present on this table) - this table is already per-workspace,
      so the app''s workspace filter now actually narrows this finding; a destination denied from several
      workspaces now surfaces as one row per workspace instead of one pooled row, and denial_count/status
      band on that workspace''s own volume, not the account-wide total. This table only records serverless
      egress denials; egress from classic (non-serverless) compute is not covered here at all, so a clean
      result does not clear classic-compute workloads.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/governance_access/access_network_outbound_denials.sql
    order_by: denial_count DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - network_source_type
        - destination_type
        - access_type
        - destination
        - dns_rcode
        - storage_rejection_reason
- name: f_access_pii_outside_tables
  description: One row = a VOLUME or SCHEMA that either carries a sensitivity/PII tag (known sensitive
    data living OUTSIDE the table surface, where column masks / row filters / auto-classification do NOT
    apply) or is an UNTAGGED volume (an unclassified file store). The status band says which. This is
    the file/schema counterpart to access_classified_unmasked, which only sees table columns. Rows are
    capped inside every window_days block by the body's LIMIT :top_n (default 500, threshold 'top_n').
  meta:
    query_id: access_pii_outside_tables
    title: PII outside governed tables - sensitive-tagged and untagged volumes and schemas
    domain: governance_access
    tier: standard
    stars: false
    origin: vendored
    windowed: false
    is_finding: true
    empty_if:
    - privilege_scoped
    - no_activity
    reads:
    - system.information_schema.volumes
    - system.information_schema.volume_tags
    - system.information_schema.schema_tags
    requires: SELECT on system.information_schema; Unity Catalog required
    params:
    - name: top_n
      default: 500
      meaning: row cap - current-state, no window.
    confidence: needs_confirmation
    confidence_note: volumes, volume_tags, and schema_tags columns are transcribed verbatim; the sensitivity
      match is a HARD-CODED regex heuristic over tag names/values, not an authoritative classifier.
    healthy: a tagged, non-sensitivity-tagged volume (field heuristic) - the file store is inventoried
      and not flagged sensitive.
    investigate_if: a sensitivity-tagged or untagged EXTERNAL volume (CRITICAL - sensitive/unclassified
      files in external storage that masks cannot protect); a sensitivity-tagged managed volume or schema,
      or an untagged managed volume (WARN) - field heuristic; tune the sensitivity regex in the SQL to
      your tag vocabulary.
    actions:
    - for sensitive volumes, lock down access via grants + storage credentials (files cannot be masked)
      and confirm the data belongs in files not governed tables (free/config);
    - tag or classify untagged volumes so they stop being blind spots (config);
    - migrate PII that should be maskable into governed UC tables (spend/process).
    next:
    - query_id: access_volumes_inventory
      if: the full volume inventory this is derived from
    - query_id: access_classified_unmasked
      if: the table-column PII this does NOT cover
    - query_id: access_tags_inventory
      if: the account's tag vocabulary
    caveats: Volumes hold FILES and schemas are NAMESPACES - neither is covered by column masks, row filters,
      or the table-level auto-classifier, so sensitive data here is a genuine governance blind spot, not
      a false positive. The sensitivity match is a HARD-CODED regex over tag name/value ('(?i)(pii|sensitiv|confidential|gdpr|personal|secret|restricted)')
      - tune it in the SQL to your tag vocabulary; it will miss org-specific tag names and can false-positive
      on unrelated ones. system.information_schema is privilege-aware, so volumes/schemas the principal
      cannot see are absent. storage_location is deliberately not emitted here (see access_volumes_inventory)
      - this is the finding view. Current-state (no window).
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/governance_access/access_pii_outside_tables.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 ELSE 2 END, object_type, catalog_name,
      schema_name, object_name
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - object_type
        - catalog_name
        - schema_name
        - object_name
- name: f_access_pii_propagation_untagged
  description: One row = a source column (tagged sensitive) to target column (carrying no sensitivity
    tag of its own) propagation edge, one workspace at a time. The columns that matter are event_count
    (how often that flow ran) and distinct_creators (how many different identities ran it).
  meta:
    query_id: access_pii_propagation_untagged
    title: PII propagation into untagged columns
    domain: governance_access
    tier: standard
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - lineage_inference_only
    - schema_not_enabled
    - privilege_scoped
    - retention_window
    reads:
    - system.access.column_lineage
    - system.information_schema.column_tags
    requires: SELECT on system.access and system.information_schema; system.access.column_lineage is GA;
      information_schema requires Unity Catalog
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_pii_gap_events
      default: 5
      meaning: times a source-to-target untagged-propagation edge fired that flags WARN
    - name: crit_pii_gap_events
      default: 50
      meaning: that flags CRITICAL
    confidence: needs_confirmation
    confidence_note: This account's actual sensitivity tag_name/tag_value convention is not confirmed
      - the query matches common names (pii, sensitivity, sensitive, data_classification, classification,
      confidentiality, phi, pci) case-insensitively as a heuristic, written to under-detect rather than
      invent a match, which is the safe direction.
    healthy: status = OK; event_count below :warn_pii_gap_events for one source-to-target propagation
      edge - field heuristic; any row here is already a gap, so "healthy" just means it is not yet a well-established
      pipeline.
    investigate_if: status = WARN at/above :warn_pii_gap_events, CRITICAL at/above :crit_pii_gap_events
      - field heuristic; prioritize edges with a high event_count, since those are recurring, established
      pipelines, not one-off ad hoc queries.
    actions:
    - confirm the source column really is sensitive and the target genuinely lacks a tag (free);
    - tag the target column to match the source's classification, or add a column mask if it should stay
      untagged but restricted (config);
    - if this is a recurring ETL/pipeline pattern, fix the pipeline to propagate tags automatically instead
      of tagging targets one at a time (spend/eng time).
    next:
    - query_id: access_tags_inventory
      if: see the full tag inventory
    - query_id: access_classified_unmasked
      if: check whether the untagged target is also unmasked
    caveats: 'This detects sensitivity-tagged SOURCE columns that flow, via direct_access=true lineage,
      into target columns carrying no SENSITIVITY tag of their own (fixes access_pii_propagation_untagged-any-tag-counts-as-governed:
      the target used to be judged "untagged" by anti-joining against any column carrying ANY governance
      tag at all - ownership, lifecycle, anything - so a target tagged e.g. "owner=data-eng" read as governed
      and dropped out of this finding even though it carried no sensitivity classification; the target
      side now anti-joins against the SAME sensitive_tags set the source side already used, so a target
      only counts as governed when it carries a sensitivity tag itself). source_tags collapses every matching
      tag on the source column into one "name=value, name=value" string before the join, and the target-side
      anti-join does the same, so a column carrying more than one matching tag - on either side - produces
      exactly one row per edge, not one per tag; distinct_creators (COUNT DISTINCT, not a single masked
      identity) keeps that same one-row-per-edge shape when more than one identity ran the flow. The target-tag
      join uses exact (''='') matching on the four discrete catalog/schema/table/column columns rather
      than a LIKE/CONCAT comparison - ''_'' is a LIKE wildcard, so an underscore in an identifier would
      otherwise over-match and falsely mark a target "tagged", hiding a real gap. direct_access=true is
      a deliberate restriction: indirect/view-expansion edges are excluded, because a view does not re-expose
      the base sensitive column as a new physical target column, so view-mediated flows are intentionally
      invisible here. Tag values are free-text and case-sensitive, so coverage depends entirely on your
      account''s tagging discipline - an empty result can mean "no PII tagged anywhere", not "no gaps",
      so verify you actually have sensitivity tags in use before reading zero rows as clean. The PII tag-name
      set (pii, sensitivity, sensitive, data_classification, classification, confidentiality, phi, pci)
      is a heuristic on tag_name and tag_value matched case-insensitively - confirm your account''s actual
      sensitivity-tag convention, since this is written to under-detect rather than invent a match. A
      target column carrying some OTHER (non-sensitivity) governance tag now correctly still counts as
      a gap here; check access_tags_inventory if you need the full governance-tag picture rather than
      the sensitivity-only one this query judges "tagged" by. information_schema.column_tags is privilege-aware.
      Retention on system.access.* tables is workspace-configurable - widen :period_days where your retention
      allows it. The system catalog is excluded by exact name, not a bare NOT LIKE (which has no wildcard
      and would behave as <> ''system''). Column lineage is inference-only: PII propagation via unsupported
      paths (spark-submit/runs-submit jobs, RDDs, JDBC, UDFs, global temp views, path-only refs) or literal-only
      writes produces no lineage row and is invisible here, and Lakeflow pipeline column lineage additionally
      needs DBR 13.3 LTS+.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/governance_access/access_pii_propagation_untagged.sql
    order_by: event_count DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - source_table_catalog
        - source_table_schema
        - source_table_name
        - source_column_name
        - target_table_catalog
        - target_table_schema
        - target_table_name
        - target_column_name
- name: f_access_row_filters_inventory
  description: One row = a table in the metastore that has a row-level access filter attached. The columns
    that matter are filter_name (which filter function) and target_columns (what it evaluates to decide
    row visibility).
  meta:
    query_id: access_row_filters_inventory
    title: Row filters inventory
    domain: governance_access
    tier: standard
    stars: false
    origin: vendored
    windowed: false
    is_finding: false
    empty_if:
    - abac_only
    - privilege_scoped
    reads:
    - system.information_schema.row_filters
    requires: SELECT on system.information_schema; Public Preview, DBR 12.2 LTS+, Unity Catalog required
    params: []
    confidence: confirmed
    confidence_note: 'Columns verified against a live workspace on 2026-05-30: table_catalog, table_schema,
      table_name, filter_name, target_columns.'
    healthy: n/a - inventory
    investigate_if: n/a - inventory
    actions: []
    next:
    - query_id: access_column_masks_inventory
      if: the column-level equivalent
    - query_id: access_grants_inventory
      if: see who has access to these filtered tables
    caveats: This is already a compact current-state inventory - one row per filtered table. It is privilege-aware
      / object-visibility-scoped, so it only shows tables you can see. It reads system.information_schema.row_filters,
      which is Public Preview and requires DBR 12.2 LTS+. system.information_schema is metastore-wide.
      It lists only manually-applied (table-level) row filters set via ALTER TABLE; ABAC tag-based policy
      filters do not appear here, so an ABAC-governed account can look falsely unfiltered - enumerate
      those via the UC REST API.
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/governance_access/access_row_filters_inventory.sql
    order_by: table_catalog, table_schema, table_name
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - table_catalog
        - table_schema
        - table_name
- name: f_access_runas_escalation
  description: One row = a workspace x masked run_by/run_as identity pair x service x action, where the
    principal that initiated an action (run_by) differs from the identity it executed as (run_as). The
    columns that matter are delegation_kind (whether run_by/run_as look like a service principal or a
    human) and newly_seen_pair (whether this exact pair has ever run before, across this table's full
    retention); event_count is supporting context only, never the driver of status.
  meta:
    query_id: access_runas_escalation
    title: 'Run-as escalation: initiator vs executed-as identity'
    domain: governance_access
    tier: deep
    stars: true
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - preview_unavailable
    - verbose_audit_required
    - privilege_scoped
    reads:
    - system.access.audit
    requires: SELECT on system.access; Public Preview
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days.
    confidence: needs_confirmation
    confidence_note: identity_metadata.run_by and run_as are read directly off system.access.audit; no
      inferred column names there. The service-principal-vs-human classification below is a heuristic
      (the same UUID-shape test this query's own identity mask already used) that has not been cross-checked
      against a live account's actual service-principal id format.
    healthy: 'status = OK; a known pair, of any delegation_kind - field heuristic: this table has seen
      the pair run before, so it is that workspace''s established pattern. A low, steady event_count is
      often a legitimate job running as a service principal.'
    investigate_if: status = WARN - a newly seen pair that is still machine-involved (user_to_service_principal
      or service_principal_to_service_principal); status = CRITICAL - a newly seen pair where a human
      assumes another identity, either direction (service_principal_to_user or user_to_user) - field heuristic;
      also treat a ZERO-ROW result with suspicion rather than relief - see caveats.
    actions:
    - confirm whether the run_as identity is a known service principal configured for that job/pipeline,
      and whether this pair is genuinely new automation (free);
    - if unexpected, revoke the run_by principal's ability to act as that identity and review its grants
      via access_grants_inventory (config);
    - if run-as patterns are hard to reason about at scale, invest in a naming/tagging convention for
      service principals so legitimate run-as pairs are self-documenting (spend/eng time).
    next:
    - query_id: access_admin_role_change_events
      if: check if the same run_by identity also touched admin roles
    - query_id: access_grants_inventory
      if: see what the run_as identity can do
    caveats: 'identity_metadata is commonly NULL for ordinary single-user actions, so expect it to be
      sparse or entirely empty on many accounts - an empty result here means "not assessed", not "no escalation
      happened". Before trusting a clean (zero-row) result, verify system.access.audit is actually populated
      for your account and window. This reads system.access.audit, which is Public Preview. WORKSPACE_ID:
      added to the SELECT/GROUP BY (confirmed present on system.access.audit); it is frequently NULL here
      because run-as delegation is commonly logged as an account-scoped event, not because the column
      itself is missing - the app''s workspace filter may not narrow this finding even with the column
      present. STATUS (fixes access_runas_escalation-volume-not-escalation and access_runas_escalation-every-delegation-kind-warns):
      the query used to band CRITICAL/WARN purely on event COUNT per pair, so frequent-but-harmless automation
      and a rare real escalation got the same verdict; a first rewrite then banded WARN on every user_to_service_principal/user_to_user
      pair regardless of history, which made "Run now" on a job running as a service principal - the normal,
      recommended pattern - as noisy as a real escalation. It now bands on the pair''s own SHAPE and NOVELTY
      instead: delegation_kind classifies run_by/run_as as service-principal-shaped (UUID-shaped, the
      same regex the identity mask above uses) or human; newly_seen_pair is true when pair_history - scanned
      over this table''s FULL retention, not just :period_days - has never seen this exact (run_by, run_as)
      pair before this window. A pair this table has seen before, of ANY delegation_kind, is OK (that
      workspace''s established pattern); only a NEWLY seen pair flags at all, and only a newly seen service_principal_to_user
      or user_to_user pair (a human assuming another identity) is CRITICAL - a newly seen user_to_service_principal
      or service_principal_to_service_principal pair (new automation, still machine-to-machine or a person
      delegating outward) is WARN. A service principal whose display id is not UUID-shaped on your account
      misclassifies as human, and a human whose identity happens to be UUID-shaped misclassifies as a
      service principal - see confidence_note. pair_history''s full-retention scan is heavier than the
      rest of this query; narrow it to a fixed lookback if that cost matters more than the novelty signal
      on a long-retention account.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/governance_access/access_runas_escalation.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 ELSE 2 END, event_count DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - service_name
        - action_name
        - run_by
        - run_as
- name: f_access_sensitive_table_reads
  description: 'One row = a workspace x sensitive table x reader pair with at least one read from that
    workspace in the window (read as: this masked person or service principal read this table this many
    times FROM THAT WORKSPACE). The columns that matter are read_count (how often), reader vs table_owner
    (is this even the table''s own owner), and status. A row with every identifying column blank and status
    NOT_ASSESSED means the account has no sensitivity signal at all yet -- see not_assessed_reason; that
    row carries no workspace_id, so it drops out whenever a workspace filter is applied (it is not tied
    to any one workspace).'
  meta:
    query_id: access_sensitive_table_reads
    title: Who reads sensitive (PII-tagged or classified) tables, and how often
    domain: governance_access
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - preview_unavailable
    - privilege_scoped
    - lineage_inference_only
    - retention_window
    - no_activity
    reads:
    - system.access.table_lineage
    - system.information_schema.table_tags
    - system.information_schema.column_tags
    - system.information_schema.tables
    - system.data_classification.results
    requires: 'SELECT on system.access, system.information_schema and system.data_classification; system.access.table_lineage
      is GA; system.information_schema requires Unity Catalog; system.data_classification.results is Public
      Preview and needs BOTH the data-classification feature AND the system.data_classification schema
      enabled -- OPTIONAL for this query: it only widens which tables count as sensitive (see caveats:
      SENSITIVE); a table_tags or column_tags row alone is enough, so this finding still judges reads
      on every table those two catch even when system.data_classification.results is absent from the snapshot'
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_reads
      default: 20
      meaning: reads by one non-owner reader on one sensitive table in the window, above which that reader
        flags WARN
    confidence: needs_confirmation
    confidence_note: 'New app-owned query, not yet run live. Reuses the exact sensitivity-tag regex access_pii_outside_tables
      already applies to volume/schema tags (''(?i)(pii|sensitiv| confidential|gdpr|personal|secret|restricted)''),
      applied here to table_tags and column_tags, plus any table with a system.data_classification.results
      row (class_tag IS NOT NULL). Confirm on your account: a table you know is tagged sensitive appears
      with the right sensitivity_basis, and a reader you know is not that table''s owner and reads it
      often shows WARN.'
    healthy: status = OK - the reader IS the table's owner, or read_count is at/below :warn_reads - field
      heuristic; a table's own owner reading their own table is never flagged, regardless of volume.
    investigate_if: 'status = WARN - a reader who is NOT the table''s owner read a sensitive table more
      than :warn_reads times in the window (field heuristic; tune :warn_reads for your account). status
      = NOT_ASSESSED - read not_assessed_reason: the account has no sensitivity tag or classification
      result at all, so nothing here could be judged sensitive in the first place.'
    actions:
    - confirm the reader's access is expected (a support ticket, an approved analysis) by asking them
      or checking access_grants_inventory for how they can see the table (free);
    - if the access is broader than needed, narrow the grant or route it through a masked/aggregated view
      instead of the raw table (config);
    - if many people need the same sensitive table regularly, formalize it as a governed, access-reviewed
      data product with a named owner instead of ad hoc reads (spend/eng time).
    next:
    - query_id: access_data_classification_inventory
      if: the classified-column inventory this reads from
    - query_id: access_classified_unmasked
      if: whether those same columns are even masked
    - query_id: access_pii_outside_tables
      if: the file/schema equivalent of this table-level view
    - query_id: access_grants_inventory
      if: what a flagged reader can see and why
    caveats: 'SOURCE - this reads system.access.table_lineage (GA), not system.access.audit: a lineage
      row whose source_table_name is populated proves that table was read FROM, regardless of whether
      the same statement also wrote somewhere (a READ_WRITE edge still counts as a read of its source);
      table_lineage carries entity_type/entity_id and created_by, so it actually names the reader. system.access.audit
      is not used: its Unity Catalog getTable/getTableInfoV2 events are metadata lookups (they also fire
      on browse/describe, not only on data reads) and carry the table name only inside request_params,
      so they cannot count data reads per table. Only DIRECT reads count here (direct_access IS NULL OR
      direct_access = true; NULL keeps rows written before the column existed) -- a read through a view
      is recorded against the view, not against the raw table(s) it selects from, so tag or classify a
      view that exposes sensitive columns unmasked and its readers will show up here under the view''s
      own name, never folded into the base table''s count. Column lineage is inference-only and misses
      unsupported paths (spark-submit/runs-submit jobs, RDDs, JDBC, UDFs, path-based access, literal-only
      writes), so a real reader can be invisible here -- absence is a coverage gap, never proof nobody
      read the table. SENSITIVE - a table counts as sensitive when ANY of: its own table_tags row matches
      the sensitivity regex, ANY of its columns'' column_tags rows match the same regex, or it has ANY
      row (for any column) in system.data_classification.results with class_tag NOT NULL; sensitivity_basis
      lists which of the three applied, comma-joined. system.data_classification.results only ever WIDENS
      this set -- table_tags and column_tags alone are enough to judge every row this query can ever emit,
      so an account (or a snapshot) without that Public Preview table still gets a real, non-degraded
      result from tags alone; it never blocks or narrows what table_tags/column_tags already caught. The
      regex is a heuristic tuned to under-detect (''(?i)(pii|sensitiv|confidential|gdpr|personal|secret|restricted)'')
      -- tune it in the SQL to your tag vocabulary. OWNER - is-owner is judged by a case-insensitive,
      trimmed match of the RAW read event''s created_by against system.information_schema.tables.table_owner,
      done BEFORE either identity is masked for display; a table absent from information_schema.tables
      (dropped, or outside the inventory) has table_owner NULL, and a NULL owner never matches, so such
      a table''s reads are judged as non-owner reads (the safer direction). table_owner is often a group
      (Unity Catalog tables are commonly group-owned); a reader is matched only against the owner name
      itself, never against group membership, so on a group-owned table every reader -- including members
      of that owning group -- is judged a non-owner and can show WARN; check the owning group in access_grants_inventory
      before acting on a WARN row here. PRIVACY - reader and table_owner are masked to DEC-66.3''s identity
      format only when privacy.mask_user_identities is on (off by default, so both are raw): a service-principal
      GUID passes through unchanged; NULL/''__REDACTED__'' pass through unchanged; otherwise the first
      8 hex chars of sha2(lower(trim(x)), 256) + '' '' + the first 2 chars of the raw value + ''***''
      -- table_lineage carries no per-row real user id, so every masked identity here is the hash- derived
      form, never a real user id passthrough. NOT_ASSESSED - the single all-blank, NOT_ASSESSED, not_assessed_reason=''no_sensitivity_signal''
      row is emitted only when the account has ZERO rows across all three sensitivity sources above; once
      even one table is tagged or classified, that sentinel disappears and ordinary rows (or, with no
      reads yet, no rows at all -- DEC-57 / empty_if) take over. A sensitive table with zero reads in
      the window has no row here by design, same as every other verdict-only query in this library --
      pair with access_data_classification_inventory / access_tags_inventory for full sensitive-table
      coverage regardless of read activity. information_schema is privilege-aware, so a tag or table this
      principal cannot see is invisible, not proven absent. Retention on system.access.* is workspace-configurable;
      widen :period_days where your retention allows it. WORKSPACE_ID: added to table_reads/reads_agg''s
      own SELECT and GROUP BY, straight from table_lineage''s own workspace_id (confirmed present) --
      the app''s workspace filter now actually narrows this finding. read_count/status now band on reads
      FROM ONE WORKSPACE, not the account-wide total for that table+reader; a table read by the same person
      from several workspaces now surfaces as one row per workspace instead of one pooled row, so a reader
      who is quiet in each workspace individually but busy overall no longer necessarily flags WARN. is_owner/
      table_owner/sensitivity_basis are unaffected -- those come from information_schema and data_classification,
      which are metastore-wide, not per-workspace. The single account-wide NOT_ASSESSED sentinel row has
      no natural workspace, so its workspace_id is NULL.'
    sql_url: app/queries/app/governance_access/access_sensitive_table_reads.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 WHEN 'NOT_ASSESSED' THEN 2 ELSE 3
      END, read_count DESC, table_catalog, table_schema, table_name, reader
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - table_catalog
        - table_schema
        - table_name
        - reader
- name: f_access_source_table_coverage
  description: 'One row = one system table this app reads (45 tables; see requires for the two left out).
    For a table with a time column: rows_in_window/days_with_data_in_window/first_date_in_ window/last_date_in_window
    are clipped to the last :period_days days; min_time/max_time/lag_days are the table''s FULL history,
    never clipped, so a table can show real rows in the window while lag_days still proves it has gone
    stale since. For a table with no time column (a privilege, tag or config inventory, list_prices, node_types)
    only total_row_count is measured - there is no window to be stale or gappy in.'
  meta:
    query_id: access_source_table_coverage
    title: System table coverage - does every system table this app reads have fresh, gap-free data
    domain: governance_access
    tier: lite
    stars: false
    origin: app
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    reads:
    - system.access.audit
    - system.access.column_lineage
    - system.access.inbound_network
    - system.access.outbound_network
    - system.access.table_lineage
    - system.access.workspaces_latest
    - system.ai_gateway.usage
    - system.billing.attributed_usage
    - system.billing.list_prices
    - system.billing.usage
    - system.compute.clusters
    - system.compute.instance_events
    - system.compute.instance_pools
    - system.compute.node_timeline
    - system.compute.node_types
    - system.compute.warehouse_events
    - system.compute.warehouses
    - system.information_schema.catalog_privileges
    - system.information_schema.column_masks
    - system.information_schema.column_tags
    - system.information_schema.connection_privileges
    - system.information_schema.credential_privileges
    - system.information_schema.external_location_privileges
    - system.information_schema.row_filters
    - system.information_schema.schema_privileges
    - system.information_schema.schema_share_usage
    - system.information_schema.schema_tags
    - system.information_schema.share_recipient_privileges
    - system.information_schema.shares
    - system.information_schema.table_privileges
    - system.information_schema.table_share_usage
    - system.information_schema.table_tags
    - system.information_schema.tables
    - system.information_schema.views
    - system.information_schema.volume_tags
    - system.information_schema.volumes
    - system.lakeflow.job_run_timeline
    - system.lakeflow.job_task_run_timeline
    - system.lakeflow.job_tasks
    - system.lakeflow.jobs
    - system.lakeflow.pipeline_update_timeline
    - system.lakeflow.pipelines
    - system.query.history
    - system.serving.endpoint_usage
    - system.serving.served_entities
    requires: 'SELECT on system.access, system.ai_gateway, system.billing, system.compute, system.information_schema,
      system.lakeflow, system.query and system.serving; most are GA but several (system.ai_gateway.usage,
      system.access.inbound_network/outbound_network, system.serving.*) are Public Preview - a missing
      preview table fails this whole statement (see caveats). Two system tables are deliberately left
      out of this inventory rather than risk failing it entirely - see caveats: system.data_classification.results
      (Public Preview, a separate opt-in schema most accounts do not have) and system.storage.predictive_optimization_operations_history
      (Public Preview, needs Predictive Optimization enabled).'
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days used for the window-scoped columns only (rows_in_window, days_with_data_in_window,
        first/last_date_in_window)
    confidence: needs_confirmation
    confidence_note: 'Every column read here (COUNT, MIN, MAX on each table''s own documented time column)
      is a plain aggregate, not new logic, but this exact 45-table shape has not run on a live account
      yet. Confirm on your own account: 1) this statement completes at all (see caveats on what a missing
      table does to it); 2) a table you know stopped updating some days ago shows a matching lag_days
      and a WARN/CRITICAL status, not OK.'
    healthy: status = OK - either the table fills every day (see investigate_if) and has no gap or lag,
      or it is one of the other 40 tables, which always read OK (see caveats) - counts are shown for reference,
      a table that only changes sometimes or logs sparse activity has no "should have a row today" expectation.
    investigate_if: 'gap/lag status is judged only for the 5 tables that fill every day - billing. usage,
      access.audit, query.history, compute.node_timeline, lakeflow.job_run_timeline. For those: status
      = CRITICAL - the table has zero rows at all: a full gap, not just a stale window. status = WARN
      - zero rows in the window, OR missing one or more days inside the window (days_with_data_in_window
      < :period_days - 1), OR whose newest row anywhere is more than 2 days old (lag_days > 2). The other
      40 tables (change-time tables that only update sometimes, and tables that are sparse or legitimately
      empty on many accounts) always read OK - read their counts and lag_days for reference, never as
      a finding.'
    actions:
    - for a fills-every-day table read CRITICAL, enable the missing system schema for this table - Unity
      Catalog system schemas, per catalog (free);
    - for WARN with a real gap or a stale newest row, check whether the underlying feature that populates
      the table (verbose audit logging, a job/pipeline that ran, a warehouse that queried) is actually
      active in the window - the table itself is fine, the source activity is not (free);
    - for WARN on a lag alone, re-run this check tomorrow before assuming the table stopped for good (free).
    next: []
    caveats: This intentionally excludes system.data_classification.results and system.storage. predictive_optimization_operations_history
      - both Public Preview, opt-in features many accounts do not have enabled. A missing table errors
      the WHOLE statement on Databricks SQL (there is no per-branch try/catch across a UNION ALL - the
      engine resolves every referenced table before running any of it), so a single-statement inventory
      cannot degrade row-by-row for a table that might not exist; excluding a preview table here is the
      only way this check can still run on an account that lacks it. If this statement itself fails, the
      account is missing one of the 45 core tables below entirely (not just short on rows) - each SELECT
      block is preceded by a `-- schema. table` comment naming it; delete that block plus the UNION ALL
      joining it to the next block (or the previous one, if it is the last block) to isolate and skip
      the missing table, then re-run to find the next one if more than one is absent. Every date/timestamp
      output is CAST to STRING so DATE and TIMESTAMP columns can share one UNION ALL result shape. rows_in_window/total_row_count
      and days_with_data_in_window/lag_days are NULL for a table with no time column - there is no window
      to measure. STATUS SCOPE - only the 5 tables that fill every day (billing.usage, access. audit,
      query.history, compute.node_timeline, lakeflow.job_run_timeline) run the gap/lag state machine;
      the other 40 - change-time tables (clusters, warehouses, jobs, job_tasks, pipelines, instance_pools,
      served_entities) that only update sometimes, and tables that are sparse (inbound/outbound_network,
      ai_gateway.usage, endpoint_usage) or legitimately empty on many accounts (column_masks, row_filters,
      shares*, connection_privileges) - always read OK regardless of row count, gap or lag; a real WARN/CRITICAL
      on one of them would be a false alarm, not a finding. This does not attempt to detect a table outside
      this list entirely (a future system table this app has not started reading yet).
    sql_url: app/queries/app/governance_access/access_source_table_coverage.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 ELSE 2 END, schema_name, table_name
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - schema_name
        - table_name
- name: f_access_table_lineage_blast_radius
  description: One row = a workspace x source table x target table data-flow edge (plus type, entity_type,
    and direct_access) in the window, kept as detail; event_count is the edge's own event volume, distinct_principals
    this edge's own distinct identity count within that workspace. source_distinct_principals is the SOURCE
    TABLE's total reach - every distinct identity that touched it via ANY target from ANY workspace in
    the window, not just this one edge - so a table fanned out across many small targets still reads its
    true blast radius instead of a count fragmented per edge; NULL on a target-less WRITE row, which has
    no source table to roll up to.
  meta:
    query_id: access_table_lineage_blast_radius
    title: Table-level lineage blast radius
    domain: governance_access
    tier: standard
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - lineage_inference_only
    - privilege_scoped
    reads:
    - system.access.table_lineage
    requires: SELECT on system.access; GA
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_blast_principals
      default: 10
      meaning: distinct principals driving one source-target edge that flags WARN
    - name: crit_blast_principals
      default: 50
      meaning: that flags CRITICAL
    confidence: confirmed
    confidence_note: source_table_full_name is NULL for write-only events and target_table_full_name is
      NULL for read-only events; the access_class CASE reproduces Databricks' documented read/write rule
      from those two columns.
    healthy: status = OK; source_distinct_principals (the source table's own total reach, or this edge's
      own distinct_principals when there is no source to roll up to) below :warn_blast_principals - field
      heuristic.
    investigate_if: status = WARN at/above :warn_blast_principals, CRITICAL at/above :crit_blast_principals
      - field heuristic; an edge with direct_access=true, a sensitive-looking source, and high distinct_principals
      is the highest-priority combination to review.
    actions:
    - confirm the source table's sensitivity via access_data_classification_inventory before treating
      a wide edge as risky (free);
    - tighten grants on the source table if the fan-out is broader than intended (config);
    - if this is a genuinely critical shared table, formalize it as a governed data product with an owner
      and change-review process (spend/eng time).
    next:
    - query_id: access_column_lineage_sensitive_reach
      if: the column-level equivalent
    - query_id: access_pii_propagation_untagged
      if: check if this edge is also an untagged PII gap
    caveats: 'source_table_full_name is NULL for write-only events and target_table_full_name is NULL
      for read-only events - the access_class column reproduces Databricks'' documented read/write rule
      from those two columns. direct_access=false means an indirect or view-expansion access. This reads
      system.access.table_lineage, which is GA with a rolling 365-day retention. An empty result for a
      table you know is used means the lineage event was simply not captured (MERGE, JDBC, path-based,
      or temp-view access all have gaps), not that the table is unused - degrade to a coverage gap, never
      a false negative. Regional. This query historically used a 90-day window; set :period_days=90 to
      reproduce it. Rows where BOTH source_table_full_name and target_table_full_name are NULL (path-based,
      JDBC, or otherwise-unresolved access that this table cannot tie to a catalog table on EITHER side)
      are excluded, as access_column_lineage_sensitive_reach''s own WHERE already does for its source
      side - without this filter every such access pooled into ONE fake ''UNKNOWN'' edge with a shared
      distinct_principals count, so unrelated path-based accesses by many different principals could combine
      to a CRITICAL blast radius that no single real edge earned. A path-based or otherwise-unresolved
      access is invisible here by design, not folded into any other edge''s principal count - it is a
      coverage gap, same as an uncaptured event. source_distinct_principals is computed per SOURCE TABLE
      (source_reach below), not per edge: a source read through five different targets by five different
      principals each used to read a per-edge count of 1 on every one of those five rows (each below :warn_blast_principals)
      even though the table''s own real reach was 5 - source_distinct_principals now reads 5 on every
      one of that source''s rows, while distinct_principals keeps the per-edge count (never overwritten)
      so the detail is not lost. A row with no source table (a WRITE access_class) has nothing to roll
      up to, so source_distinct_principals is NULL there and status falls back to distinct_principals,
      that row''s own edge-level count.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/governance_access/access_table_lineage_blast_radius.sql
    order_by: distinct_principals DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - source_table_full_name
        - target_table_full_name
        - source_type
        - target_type
        - entity_type
        - direct_access
        - access_class
- name: f_access_tags_inventory
  description: One row = a tag name/value pair at column, table, schema, or volume scope, with how many
    objects carry it. Use it to see your account's actual tagging vocabulary in practice.
  meta:
    query_id: access_tags_inventory
    title: Manual governance tags inventory
    domain: governance_access
    tier: standard
    stars: false
    origin: vendored
    windowed: false
    is_finding: false
    empty_if:
    - privilege_scoped
    reads:
    - system.information_schema.column_tags
    - system.information_schema.table_tags
    - system.information_schema.schema_tags
    - system.information_schema.volume_tags
    requires: SELECT on system.information_schema; Unity Catalog required
    params: []
    confidence: confirmed
    confidence_note: column_tags, table_tags, schema_tags, and volume_tags are transcribed verbatim; catalog_tags
      is excluded (its column list is not in the confirmed schema dump).
    healthy: n/a - inventory
    investigate_if: n/a - inventory
    actions: []
    next:
    - query_id: access_pii_propagation_untagged
      if: see where tagged sensitive data flows into untagged targets
    - query_id: access_data_classification_inventory
      if: the auto-detected counterpart to these manual tags
    caveats: This uses COLUMN_TAGS, TABLE_TAGS, SCHEMA_TAGS, and VOLUME_TAGS - all four transcribed verbatim.
      CATALOG_TAGS is deliberately excluded because its column list is not in the confirmed schema dump
      - add it only after confirming its columns in your workspace. This is privilege-aware, so the tag
      inventory is scoped to what the querying principal can see. Manual tags here are a distinct governance
      mechanism from the auto-detected classification in access_data_classification_inventory.
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/governance_access/access_tags_inventory.sql
    order_by: object_scope, TAG_NAME, TAG_VALUE
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - object_scope
        - tag_name
        - tag_value
- name: f_access_vector_search_traffic
  description: One row = a workspace + index (or endpoint, if that is the only key populated - see caveats)
    x action x day, with how many query/scan events it received. The columns that matter are vector_search_key
    (the grouping key) and event_count - join this against your own billing data to tell a provisioned-but-unqueried
    endpoint (bills spend, zero rows here) from a genuinely idle one.
  meta:
    query_id: access_vector_search_traffic
    title: Vector Search query and scan traffic by endpoint
    domain: governance_access
    tier: standard
    stars: false
    origin: vendored
    windowed: true
    is_finding: false
    empty_if:
    - schema_not_enabled
    - preview_unavailable
    - verbose_audit_required
    - privilege_scoped
    reads:
    - system.access.audit
    requires: SELECT on system.access; Public Preview
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days.
    confidence: needs_confirmation
    confidence_note: service_name='vectorSearch' and the query/scan action_name set (queryVectorIndex,
      queryVectorIndexNextPage, queryVectorIndexRouteOptimized, scanVectorIndex, scanVectorIndexRouteOptimized)
      are confirmed against Databricks' documentation on unused Vector Search endpoints. request_params['index_name']
      is NOT confirmed against a live account - it is inferred from the Query/Scan Index REST API's own
      path parameter, not read off a real event. Before trusting vector_search_key, run `SELECT DISTINCT
      map_keys(request_params) FROM system.access.audit WHERE service_name = 'vectorSearch'` on your own
      account and confirm which key is actually populated.
    healthy: n/a - inventory
    investigate_if: n/a - inventory
    actions: []
    next:
    - query_id: cost_vector_search_spend
      if: join this against spend to find endpoints that bill but never show up here
    - query_id: compute_serving_endpoint_cost_status
      if: the general serving-endpoint idle-detection sibling
    caveats: 'service_name=''vectorSearch'' and the query/scan action_name set (queryVectorIndex, queryVectorIndexNextPage,
      queryVectorIndexRouteOptimized, scanVectorIndex, scanVectorIndexRouteOptimized) are confirmed against
      Databricks'' documentation on unused Vector Search endpoints. GRAIN (fixes access_vector_search_traffic-endpoint-name-always-null):
      this query used to key rows on request_params[''endpoint_name''] alone, but the real vectorSearch
      query/scan audit events we have reviewed do not carry that key at all - it read NULL on every row,
      since queryVectorIndex/scanVectorIndex operate on a named INDEX, not directly on an endpoint (the
      endpoint is implicit in the index). vector_search_key now reads request_params[''index_name''] first,
      falling back to request_params[''endpoint_name''] if some event shape carries that instead - see
      confidence_note before trusting either key on your account; if NEITHER key is populated, this query
      still collapses to one NULL group per day/action, exactly as before the fix. endpoint_name is kept,
      meaning unchanged (a straight read of request_params[''endpoint_name''], MAX''d per group since
      it is no longer the group key itself), so nothing that already reads this column by name breaks;
      it will still read NULL on the events this fix was written against. distinct_index_names counts
      distinct request_params[''index_name''] values folded into each vector_search_key group (0 when
      index_name is never populated). An endpoint/index that bills spend but has no row here is provisioned-but-unqueried
      - a retire candidate - but you need to join this against your own billing data; this query alone
      only tells you what was queried, not what was billed. If this source has no rows at all, idle status
      cannot be assessed from it - treat that as visibility-only, never assume idle. workspace_id is added
      to the SELECT and GROUP BY so the app''s workspace filter can narrow this check; it does not change
      any other column''s meaning.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/governance_access/access_vector_search_traffic.sql
    order_by: event_date DESC, vector_search_key, action_name
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - event_date
        - action_name
        - vector_search_key
- name: f_access_views_inventory
  description: One row = one view (or materialized view) visible to your grants, with whether it is materialized,
    updatable/insertable, its sql_path, and the size of its definition. Use it to complete the lineage
    picture (views mediate table-to-table flows that table lineage may not attribute) and to inventory
    materialized views (which carry compute + storage cost). Rows are capped inside every window_days
    block by the body's LIMIT :top_n (default 100000, threshold 'top_n').
  meta:
    query_id: access_views_inventory
    title: View inventory (lineage completeness and materialized views)
    domain: governance_access
    tier: standard
    stars: false
    origin: vendored
    windowed: false
    is_finding: false
    empty_if:
    - privilege_scoped
    - no_activity
    reads:
    - system.information_schema.views
    requires: SELECT on system.information_schema; Unity Catalog required
    params:
    - name: top_n
      default: 100000
      meaning: row cap - current-state inventory, no window.
    confidence: confirmed
    confidence_note: views columns are transcribed verbatim from the information_schema reference; only
      view METADATA is emitted, never the view_definition SQL itself.
    healthy: n/a - inventory
    investigate_if: n/a - inventory
    actions: []
    next:
    - query_id: access_table_lineage_blast_radius
      if: the table lineage these views mediate
    - query_id: access_dead_table_candidates
      if: unused views/tables to retire
    caveats: The view_definition SQL is NOT emitted (it can contain sensitive logic) - only its character
      length (definition_chars) and a derived flag. references_mask_or_filter is a TEXT heuristic (the
      definition string mentions MASK/FILTER) and is NOT authoritative masked-view detection - a view
      can wrap a masked table without saying so, and a definition can mention the words for unrelated
      reasons. system.information_schema is privilege-aware, so views the principal cannot see are absent.
      is_materialized separates materialized views (compute/storage cost) from plain views. Current-state
      inventory (no window). This is a full inventory, not a findings list (no status column) - a row
      cap silently drops whole catalogs/schemas past the alphabetical cutoff, never surfacing which ones
      were dropped; :top_n defaults to 100000 (was 500) so a real account's view count does not silently
      truncate, with no thresholds.yml override needed.
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/governance_access/access_views_inventory.sql
    order_by: view_catalog, view_schema, view_name
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - view_catalog
        - view_schema
        - view_name
- name: f_access_volumes_inventory
  description: One row = one Unity Catalog volume (files that live OUTSIDE tables), with its type, storage
    location, and whether it carries any governance tag. The column that matters is tag_count = 0 - an
    unclassified file store, a common PII blind spot, since data classification and column masks apply
    to TABLES, not volume files. Rows are capped inside every window_days block by the body's LIMIT :top_n
    (default 500, threshold 'top_n').
  meta:
    query_id: access_volumes_inventory
    title: UC volumes inventory and tag coverage (files outside tables)
    domain: governance_access
    tier: standard
    stars: false
    origin: vendored
    windowed: false
    is_finding: true
    empty_if:
    - privilege_scoped
    - no_activity
    reads:
    - system.information_schema.volumes
    - system.information_schema.volume_tags
    requires: SELECT on system.information_schema; Unity Catalog required
    params:
    - name: top_n
      default: 500
      meaning: row cap - current-state inventory, no window.
    confidence: confirmed
    confidence_note: volumes and volume_tags columns are transcribed verbatim from the information_schema
      reference.
    healthy: tag_count above 0 - the volume carries at least one governance tag (field heuristic).
    investigate_if: tag_count = 0 on an EXTERNAL volume (CRITICAL - unclassified files in external storage)
      or on a managed volume (WARN - unclassified file store) - field heuristic; tune to your tagging
      policy.
    actions:
    - tag volumes that hold sensitive files with your classification tags so they appear in governance
      rollups (free/config);
    - for external volumes confirm the storage_location is an intended, access-controlled location (config);
    - move PII that belongs in governed tables out of raw volume files (spend/process).
    next:
    - query_id: access_tags_inventory
      if: the account's tag vocabulary these should use
    - query_id: access_data_classification_inventory
      if: table-level classification these volume files are invisible to
    caveats: Volumes hold FILES, which sit outside the table-level classification and masking the other
      governance queries cover - so an untagged volume is a genuine blind spot, not a false positive.
      system.information_schema is privilege-aware, so volumes the principal cannot see are absent. tag_count
      is DISTINCT tags from volume_tags joined on (catalog, schema, volume). storage_location is the raw
      external/managed path and is SENSITIVE - treat the result as confidential. volume_owner is partial-masked.
      Current-state inventory (no window).
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/governance_access/access_volumes_inventory.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 ELSE 2 END, v.VOLUME_CATALOG, v.VOLUME_SCHEMA,
      v.VOLUME_NAME
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - volume_catalog
        - volume_schema
        - volume_name
