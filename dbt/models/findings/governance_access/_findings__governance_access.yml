      judged broad); connection_privileges/ credential_privileges/external_location_privileges are still
      out of scope - access_grants_inventory_extended gives a rough per-privilege COUNT for those (no
      object name) if you need a signal today. A grant made at the schema level is judged on its own here;
      it is NOT expanded down to every table the schema holds, so this still misses a broad EFFECTIVE
