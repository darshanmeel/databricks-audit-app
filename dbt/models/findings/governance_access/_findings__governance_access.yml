      schema) gives the same grantee the same privilege is dropped: it adds no access, and keeping it
      turned one catalog grant into a row per table. Only the grant at the highest scope is listed; a
      table row whose parent grant this principal cannot see is kept. catalog_privileges carries NO inherited_from
      column in this source at all (access_grants_inventory''s own caveat, verbatim) - is_inherited and
      inherited_from are therefore always NULL on every CATALOG-scope row, meaning "not tracked", never
