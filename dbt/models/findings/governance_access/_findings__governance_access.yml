      identical, already- recorded gap for access_grants_inventory''s own GRANTEE column). No dollars,
      no window - current-state grant rollup, like access_grants_inventory.'
    sql_url: app/queries/app/governance_access/access_broad_grants.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 ELSE 2 END, securable_type, securable,
