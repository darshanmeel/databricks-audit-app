- name: f_access_data_classification_inventory
  description: One row = a column the auto-classifier tagged, deduplicated to one row per catalog/schema/table/column/class_tag/confidence/data_type.
    The columns that matter are class_tag (what kind of sensitive data) and max_frequency (how consistently
    it matched).
  meta:
    query_id: access_data_classification_inventory
    title: Auto-classified sensitive column inventory
    domain: governance_access
    tier: standard
    stars: false
    origin: vendored
    windowed: false
    is_finding: false
    empty_if:
    - schema_not_enabled
    - preview_unavailable
    - no_serverless
    reads:
    - system.data_classification.results
    requires: SELECT on system.data_classification; Public Preview, Unity Catalog required, needs the
      data-classification feature AND the system.data_classification schema both enabled
    params: []
    confidence: confirmed
    confidence_note: Columns confirmed against Databricks documentation for system.data_classification.results.
    healthy: n/a - inventory
    investigate_if: n/a - inventory
    actions: []
    next:
    - query_id: access_classified_unmasked
      if: see which of these are masked
    - query_id: access_pii_propagation_untagged
      if: see where this sensitive data propagates from here
    caveats: This deliberately DROPS the underlying samples array (up to 5 raw sample values) - collecting
      raw sensitive values would defeat the point of an audit tool, so never add it back. confidence is
      HIGH or LOW; frequency is a float from 0 to 1. It covers ENABLED CATALOGS ONLY - a catalog that
      never had classification turned on has no rows here, and that is not the same as "nothing sensitive."
      It requires BOTH the data-classification feature AND the separate system.data_classification schema
      to be enabled - enabling one does not enable the other, so if this query errors or returns nothing,
      check both settings before concluding you have no classified data. Public Preview. 13-month retention.
      Regional. Scans run on serverless compute and complete asynchronously (new objects within ~24h),
      so a catalog with everything enabled but no serverless available, or only just enabled, can still
      show no rows yet.
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/governance_access/access_data_classification_inventory.sql
