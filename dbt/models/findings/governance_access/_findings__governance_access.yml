      if: check whether this same sensitive data propagates further, still unmasked
    caveats: 'column_masks is metastore-scoped, privilege-aware, and excludes BROWSE-only tables - a missing
      mask row can mean the principal running this query simply cannot see it, not that no mask exists.
      Treat a low unmasked count as a floor, not a guarantee of a clean masking posture, unless the querying
      principal has broad visibility. Confirm whether system.information_schema in your account covers
      the whole metastore or only the system catalog - a per-catalog union may be needed for full coverage.
      column_masks is Public Preview and requires DBR 12.2 LTS+. column_masks lists only manually-applied
      (ALTER TABLE SET MASK) masks; ABAC tag-based policy masks never appear there, so ABAC policies are
      read from abac_policy_definitions (Public Preview; the export identity sees only policies on securables
      where it has READ METADATA or MANAGE, so an empty result can mean "not visible", not "none"). The
      join used to be written on cm.CATALOG_NAME / cm.SCHEMA_NAME, which follows some published Databricks
      docs but does not exist on the live table (DEC-53): the real column_masks columns are table_catalog
      / table_schema / table_name / column_name / mask_name, the same names access_column_masks_inventory.sql
      already confirmed live - this query now joins on those, matching that sibling. mask_name is selected
      with an explicit lowercase alias so the output column name is deterministic on every engine: an
      unaliased column reference can otherwise surface in whatever case it was WRITTEN in the query text
      on some engines (not the case of the underlying catalog column), which would have silently produced
      an uppercase MASK_NAME key in production while this repo''s own DuckDB-backed tests kept returning
      lowercase mask_name - the same class of engine-vs-fixture drift DEC-53 already flagged once for
      this query.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/governance_access/access_classified_unmasked.sql
    order_by: is_unmasked DESC, catalog_name, schema_name, table_name, column_name
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - catalog_name
        - schema_name
        - table_name
        - column_name
- name: f_access_column_lineage_sensitive_reach
  description: One row = a workspace x source column x target column data-flow edge (plus entity_type
    and direct_access), restricted to edges whose SOURCE column carries a sensitivity tag. The columns
    that matter are source_sensitivity_tags (which tag(s) made the source count as sensitive), event_count
    (how often that flow ran) and distinct_principals - how many different identities drove it FROM THAT
    WORKSPACE. This is per-edge-per-workspace, not a table-level rollup; pair it with access_table_lineage_blast_radius
    for the coarser view.
  meta:
    query_id: access_column_lineage_sensitive_reach
    title: Column-level lineage reach
    domain: governance_access
    tier: deep
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - lineage_inference_only
    - schema_not_enabled
    reads:
    - system.access.column_lineage
    - system.information_schema.column_tags
    requires: SELECT on system.access and system.information_schema; system.access.column_lineage is GA;
      information_schema requires Unity Catalog
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_reach_principals
      default: 10
      meaning: distinct principals driving one source-target column edge that flags WARN
    - name: crit_reach_principals
      default: 50
      meaning: that flags CRITICAL
    confidence: needs_confirmation
    confidence_note: The source/target table and column names, entity_type, direct_access, created_by
      and event_time columns are confirmed against system.access.column_lineage. This account's actual
      sensitivity tag_name/tag_value convention is not confirmed - the query matches common names (pii,
      sensitivity, sensitive, data_classification, classification, confidentiality, phi, pci) case-insensitively
      as a heuristic (the same one access_pii_propagation_untagged uses), written to under-detect rather
      than invent a match, which is the safe direction.
    healthy: status = OK; distinct_principals below :warn_reach_principals for one sensitive-source edge
      - field heuristic.
    investigate_if: status = WARN at/above :warn_reach_principals, CRITICAL at/above :crit_reach_principals
      - field heuristic; a column with no sensitivity tag at all never appears here at all (see caveats),
      so also check access_data_classification_inventory or access_tags_inventory for anything this query's
      own tag-name heuristic missed.
    actions:
    - confirm the listed source_sensitivity_tags value is genuinely a sensitivity tag on your account,
      not a false match from the heuristic (free);
    - tighten grants on the source or add a mask, and check access_pii_propagation_untagged for the specific
      untagged-target case (config);
    - if a column is a genuinely critical, widely-reached asset, formalize it as a governed data product
      with an owner (spend/eng time).
    next:
    - query_id: access_pii_propagation_untagged
      if: the specific untagged-target finding this feeds
    - query_id: access_table_lineage_blast_radius
      if: the table-level rollup
    caveats: '"sensitive" means the SOURCE column carries a UC column tag (system.information_schema.column_tags)
      whose name or value matches pii/sensitivity/sensitive/data_classification/classification/confidentiality/phi/pci,
      case-insensitively - a governance TAG, never an automated data_classification scan result (not available
      on this account). This is a heuristic on tag_name/tag_value, written to under-detect rather than
      invent a match; confirm your account''s actual sensitivity-tag convention. A sensitive column with
      no such tag is invisible here entirely - the same blind spot access_pii_propagation_untagged already
      documents on its target side - so a clean or empty result is not proof nothing sensitive is reached,
      only that nothing TAGGED sensitive is. source_sensitivity_tags collapses every matching tag on the
      source column into one "name=value, name=value" string before the join to lineage, so a column carrying
      more than one matching tag (e.g. pii=true AND classification=confidential) still produces exactly
      one row per edge, not one per tag. direct_access = true/false is passed through unfiltered (unlike
      access_pii_propagation_untagged, which restricts to true), so both direct and view-expanded reach
      are visible; filter to direct_access = true yourself for the narrower, more certain reading. column_lineage
      is a SUBSET of all data movement - events with no captured source (e.g. INSERT ... VALUES literals)
      are NOT captured, so this undercounts; report it as coverage-bounded, never as a complete picture.
      External/path references show cloud path strings, not table names. statement_id is SQL-warehouse-only.
      entity_metadata subfields (job_info.job_id, notebook_id, sql_query_id, dlt_pipeline_info.*, genie_space_id,
      alert_id) are available in the source table for finer attribution but are kept out of this rollup.
      GA. Regional. This query historically used a 90-day window; set :period_days=90 to reproduce it.
      WORKSPACE_ID: added to the SELECT/GROUP BY (confirmed present on column_lineage) - the app''s workspace
      filter now actually narrows this finding. distinct_principals (and event_count, status) is therefore
      reach WITHIN ONE WORKSPACE, not the account-wide total for that column edge; the same sensitive
      column reached from several workspaces now surfaces as one row per workspace instead of one pooled
      row. Aggregate across workspace_id yourself for the account-wide figure. Lineage is also not inferred
      for work run via unsupported paths (RDD, JDBC, spark-submit jobs, UDFs, global temp views) or for
      pipeline column lineage below DBR 13.3 LTS, so an edge can be wholly absent - low or missing reach
      is not proof of safety.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/governance_access/access_column_lineage_sensitive_reach.sql
    order_by: distinct_principals DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - source_table_full_name
        - source_column_name
        - target_table_full_name
        - target_column_name
        - entity_type
        - direct_access
- name: f_access_column_masks_inventory
