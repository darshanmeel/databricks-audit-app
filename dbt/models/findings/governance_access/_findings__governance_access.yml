    tier: standard
    stars: false
    origin: vendored
    windowed: false
    is_finding: true
    empty_if:
    - schema_not_enabled
    - preview_unavailable
    - no_serverless
    - abac_only
    - privilege_scoped
    reads:
    - system.data_classification.results
    - system.information_schema.column_masks
    - system.information_schema.abac_policy_definitions
    requires: SELECT on system.data_classification and system.information_schema; system.data_classification
      is Public Preview and requires Unity Catalog; column_masks is Public Preview (DBR 12.2 LTS+); abac_policy_definitions
      is Public Preview
    params: []
    confidence: confirmed
    confidence_note: Columns are doc-confirmed. The residual uncertainty is join completeness (column_masks
      is privilege-aware), not whether the columns exist.
    healthy: status = OK; is_unmasked = false (a mask is applied) - field heuristic; confirm by reviewing
      MASK_NAME per column.
    investigate_if: status = CRITICAL when is_unmasked = true - field heuristic; prioritize columns with
      the widest access (cross-check against access_grants_inventory).
    actions:
    - confirm the column is genuinely sensitive by reviewing the class_tag/confidence pair, not the raw
