      which is Public Preview and requires DBR 12.2 LTS+ - if unsupported on your account, expect an empty
      or erroring result, not a true zero. system.information_schema is metastore-wide. column_masks lists
      only manually-applied (ALTER ... SET MASK) masks; ABAC tag-based policy masks never appear here,
      so an ABAC-governed account can look falsely unmasked - enumerate those via the UC REST API.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/governance_access/access_column_masks_inventory.sql
    order_by: table_catalog, table_schema, table_name, column_name
