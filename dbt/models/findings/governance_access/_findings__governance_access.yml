      derived from object OWNERSHIP... still never appear as rows in either branch"), so this query can
      flag a MANAGE grant but can never see who actually owns an object. GRANTEE_TYPE HEURISTIC - no dedicated
      principal-type column exists in either source table, so grantee_type is inferred: the three literal
      built-in all-users spellings above -> ALL_USERS; a 36-char hex GUID -> SERVICE_ PRINCIPAL (already
