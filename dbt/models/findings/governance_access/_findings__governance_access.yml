    are mask_name (which masking function) and using_columns (what it reads to decide the mask).
  meta:
    query_id: access_column_masks_inventory
    title: Column masks inventory
    domain: governance_access
    tier: standard
    stars: false
    origin: vendored
    windowed: false
    is_finding: false
    empty_if:
