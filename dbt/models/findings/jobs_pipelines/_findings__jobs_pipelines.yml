- name: f_lakeflow_retries_repairs
  description: One row = a job in the window. The column that matters is total_retries - extra attempt
    rows beyond the first, summed across all the job's runs; runs_with_retry tells you how many distinct
    runs needed at least one retry, and net_dbus/est_usd_list is the job's overall DBU cost for context.
  meta:
    query_id: lakeflow_retries_repairs
    title: Job run retries and repair attempts, with DBU cost
    domain: jobs_pipelines
    tier: standard
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    reads:
    - system.lakeflow.job_run_timeline
