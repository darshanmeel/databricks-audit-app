      meaning: rolling window in days
    - name: warn_total_retries
      default: 5
      meaning: total retries for a job in the window that flags WARN
    - name: crit_total_retries
      default: 20
      meaning: that flags CRITICAL
    confidence: confirmed
    confidence_note: The retry count formula (non-NULL-result_state rows per run_id, minus 1) was verified
      against the documented visibility caveat for system.lakeflow.job_run_timeline.
    healthy: total_retries low relative to distinct_runs - field heuristic; tune :warn_total_retries for
      your account.
    investigate_if: total_retries at/above :warn_total_retries (WARN) or :crit_total_retries (CRITICAL)
      - field heuristic; a job where runs_with_retry is close to distinct_runs is retrying on (almost)
