    duration, avg_run_s their average and max_run_s the longest; median_run_s is the resource's own median
    run over the whole window. day_state reads failed when any run failed, slow when avg_run_s is at least
    :slow_ratio times median_run_s and :slow_min_s longer, skipped when every run was skipped, else ok.
