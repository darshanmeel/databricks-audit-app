- name: f_lakeflow_jobs_on_all_purpose
  description: One row = one (job, all-purpose cluster) placement over the window. cluster_source is the
    column that matters - UI or API means the job ran on an interactive/all-purpose cluster (the anti-pattern)
    instead of a cheaper jobs cluster; WAREHOUSE means the id was a SQL warehouse, not a cluster, so this
    check does not apply. est_usd_list_share is this job's OWN metered $ on this cluster, from the billing
    rows that carry both this cluster and this job - never the shared cluster's whole bill, never an even
    split of it. Rows are capped inside every window_days block by the body's LIMIT :top_n (default 100000,
    threshold 'top_n').
  meta:
    query_id: lakeflow_jobs_on_all_purpose
    title: Jobs running on all-purpose (interactive) clusters
    domain: jobs_pipelines
    tier: standard
    stars: true
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    reads:
    - system.lakeflow.job_task_run_timeline
    - system.compute.clusters
    - system.billing.usage
    - system.billing.list_prices
    requires: SELECT on system.lakeflow, system.compute, system.billing; GA
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: crit_share_usd
      default: 100
      meaning: this job's own metered $ on an all-purpose cluster that flags CRITICAL
    - name: top_n
      default: 100000
      meaning: row cap
    confidence: needs_confirmation
    confidence_note: The cross-domain join to system.compute.clusters, whether compute_ids is populated
      on older rows, and whether compute (the struct array this query now reads to tell a SQL-warehouse
      id apart from a cluster id, and to attribute cost to a job's own billing rows) populates on the
      same rows as compute_ids are the things to confirm on your own workspace.
    healthy: cluster_source = JOB, i.e. the task ran on dedicated jobs compute - est_usd_list_share is
      then informational only (field heuristic).
    investigate_if: cluster_source IN ('UI','API') (WARN), especially with est_usd_list_share at/above
      :crit_share_usd (CRITICAL) - a job pinned to an always-on interactive cluster (field heuristic).
      cluster_source = WAREHOUSE is not this anti-pattern (a SQL-warehouse task, not a cluster) and always
      reads OK. The trailing NOT_ASSESSED summary row counts runs dropped for null/empty compute_ids;
      do not read those as "clean".
    actions:
    - point the job at a job cluster / new-cluster-per-run instead of an existing all-purpose cluster
      (free, in the job definition);
    - if the interactive cluster exists only to serve jobs, add auto-termination or delete it (config);
    - if shared interactive compute is genuinely required, move the heavy jobs to a right-sized jobs cluster
      (spend / reshape).
    next:
    - query_id: cost_by_job
      if: to dollarize the same jobs' DBUs
    - query_id: lakeflow_failed_jobs_wasted_dbus
      if: these jobs also fail
    - query_id: compute_warehouse_idle_gaps
      if: the shared cluster sits idle between runs
    caveats: 'Anti-pattern = a job task running on cluster_source IN (''UI'',''API'') (all-purpose). EXPLODE(compute_ids)
      drops rows where compute_ids is NULL OR empty (e.g. early-Dec-2025 rows) - both shapes are surfaced
      as a separate NOT_ASSESSED summary row (task_runs = dropped runs), NEVER implicitly counted as zero
      or as clean (an empty, non-NULL array silently vanished from both branches before this fix - EXPLODE()
      of an empty array yields zero rows, so it was invisible even in the "dropped" count). compute_ids
      can ALSO carry SQL-warehouse ids, not just cluster ids (Databricks'' own docs, already noted in
      this folder''s lakeflow_long_running_runs.sql for its own first-compute-id link) - a warehouse id
      never has a row in system.compute.clusters, so it used to fall through the cluster_source LEFT JOIN
      as a false NOT_ASSESSED. This query now also explodes compute (a parallel struct-array column on
      the same table, one entry per compute_ids entry, with separate cluster_id/warehouse_id fields) and
      labels an id WAREHOUSE, status OK, whenever it names a warehouse instead of a cluster - a real NOT_ASSESSED
      now means an id that is neither a known cluster nor a known warehouse (e.g. a cluster deleted before
      system tables started recording, or a genuine dimension gap), not "ran on a warehouse". Confirm
      the exact cluster_source column name and value enum, and that system.compute.clusters is SCD2 on
      your workspace (the latest row is taken by change_time). net_dbus is exact billed DBUs (usage_unit=''DBU'');
      est_usd_list is an ESTIMATE AT THE EFFECTIVE LIST PRICE (usage_quantity x list_prices.pricing.effective_list.default
      - DEC-66.1), NOT the negotiated invoice rate, and excludes cloud infra/egress $. Cost is attributed
      to THIS JOB from the cluster''s own billing rows that carry usage_metadata.job_id = this job (pre-aggregated
      per (workspace_id, cluster_id, job_id) then LEFT JOINed so rows are never multiplied): a shared
      all-purpose cluster''s notebook or other-job usage carries no job_id match and is correctly excluded,
      and summing net_dbus/est_usd_list across every job on a shared cluster no longer double-counts the
      cluster''s bill. est_usd_list_share is kept as its own column (read by the app''s discount/column
      logic) but is now identical to est_usd_list, not a further even split by jobs_sharing_cluster -
      jobs_sharing_cluster stays as informational context (how many distinct jobs use this cluster), no
      longer a divisor. price_basis is ''unpriced'' when any non-free-usage SKU billed to this job''s
      own usage on the shared cluster had no matching list_prices row (est_usd_list/est_usd_list_share
      then understate cost), ''free'' when every matched SKU is a FREE_USAGE SKU (a real $0), ''priced''
      otherwise, and NULL on the trailing NOT_ASSESSED dropped-runs summary row (no cost was attributed
      there). Ordered worst-status-first (CRITICAL, WARN, NOT_ASSESSED, then OK, each by est_usd_list_share
      DESC) before :top_n is applied, so a flagged placement is never cut before an OK one; :top_n defaults
      to 100000 (was 500) because this is a per-placement finding, not a small inventory, and a low build-time
      cap can silently drop the flagged rows that matter, with no thresholds.yml override needed.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/jobs_pipelines/lakeflow_jobs_on_all_purpose.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 WHEN 'NOT_ASSESSED' THEN 2 ELSE 3
      END, est_usd_list_share DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - job_id
        - compute_id
- name: f_lakeflow_long_running_runs
  description: One row = one job run that lasted at least :warn_run_hours (plus any run whose duration
    could not be established). The columns that matter are run_hours (wall clock), top_task_key with top_task_share_pct
    (which task ate the run), and x_vs_job_p50 (this run against the same job's median run in the window).
    job_name and top_3_tasks are there so a row reads without a second lookup, and run_url / top_task_cluster_url
    open the run and its compute straight from the result grid.
  meta:
    query_id: lakeflow_long_running_runs
    title: Job runs past a duration bound, and the task eating the time
    domain: jobs_pipelines
    tier: standard
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - no_activity
    - ingestion_lag
    reads:
    - system.lakeflow.job_run_timeline
    - system.lakeflow.job_task_run_timeline
    - system.lakeflow.jobs
    - system.access.workspaces_latest
    requires: SELECT on system.lakeflow AND on system.access (the latter only for the workspace_name column
      - see caveats to drop it); GA (the five *_duration_seconds columns were added early Dec 2025)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_run_hours
      default: 2
      meaning: run wall-clock hours at/above which a run is reported and flagged WARN
    - name: crit_run_hours
      default: 6
      meaning: run wall-clock hours that flag CRITICAL
    confidence: needs_confirmation
    confidence_note: 'Checked against the Databricks doc pages on 2026-09-21 (not against a live workspace):
      the doc states that run_duration_seconds and the four phase columns on job_run_timeline are populated
      only for legacy single-task jobs and log 0 for every multi-task job, so this query now treats 0
      as "not reported" and falls back to wall clock - without that, no multi-task run could ever reach
      :warn_run_hours; the doc also states that SKIPPED / BLOCKED tasks do write a zero-length timeline
      row. The run/task join key and the SCD2 name lookup follow the three verified queries in this folder
      (lakeflow_succeeded_with_failed_tasks, lakeflow_tasks_near_timeout, lakeflow_phase_cold_start).
      Still unverified on a workspace: 1) the in-flight path (result_state IS NULL measured against current_timestamp())
      - confirm an in-flight run shows in_flight = true with a run_hours close to the Jobs UI; 2) try_element_at(compute_ids,
      1) returns a cluster id that top_task_cluster_url opens (the doc says compute_ids also carries SQL
      warehouse ids, for which the cluster link is meaningless); 3) workspace_name / job_name resolve,
      with job_name NULL only for submit / workflow runs.'
    healthy: no rows - no run reached :warn_run_hours in the window - field heuristic; tune :warn_run_hours
      for your account, it is the whole point of this query.
    investigate_if: 'any row - run_hours at/above :warn_run_hours (WARN), at/above :crit_run_hours or
      still in flight past the bound (CRITICAL) - field heuristic. Read x_vs_job_p50 next: well above
      1 means this run is abnormal for this job (look at that run), near 1 means the job is always this
      slow (look at the job''s design). wait_share_pct above ~30 means the time went to setup/queue, not
      to work (NULL for every multi-task job - the phase columns are legacy-only, see caveats - lakeflow_phase_cold_start
      is the job-level p95 view of that same setup/queue breakdown, RUN-level like this query, not task-level;
      it now folds the same multi-task 0-sentinel to NULL that this query already falls back to wall clock
      for).'
    actions:
    - 'open the flagged run''s top_task_key and split the time: wait_share_pct high means cluster start
      or queueing, otherwise compare the task''s input volume against a normal run of the same job (free);'
    - give the job and its tasks a timeout so a runaway is killed instead of billing until someone notices,
      and cut the dominant task down - narrow the window it reprocesses, split it, or run independent
      tasks in parallel instead of in sequence (config);
    - if the dominant task is genuinely compute-bound, move it to a warm pool or serverless to kill the
      cold start, or give it a faster node type / more workers (spend).
    next:
    - query_id: lakeflow_phase_cold_start
      if: wait_share_pct is high - the per-job setup/queue breakdown
    - query_id: lakeflow_tasks_near_timeout
      if: the dominant task is closing on its configured timeout
    - query_id: lakeflow_jobs_no_timeout
      if: the long run had no timeout to stop it
    - query_id: lakeflow_retries_repairs
      if: the run is long because it kept retrying
    - query_id: cost_workspace_names
      if: you dropped the workspaces_latest join and want to resolve workspace_id separately
    caveats: 'This query deliberately does NOT drop the current day the way the other duration queries
      in this folder do, because a run that is over the bound right now is the case you most want to catch;
      the cost is that very recent rows may still be materializing, so a run that started minutes ago
      can be missing or measured short. run_duration_seconds and the four phase columns are not populated
      before early Dec 2025, are never populated while a run is in flight, and - per the doc - are populated
      only for legacy single-task jobs while every multi-task job logs 0 in them, so a 0 is treated as
      not reported and this falls back to wall clock between the run''s first and last observed rows;
      run_s_is_lower_bound marks every row where that fallback was used (for a multi-task job, every row),
      and wait_share_pct is NULL rather than a false 0 on those rows. A run that started BEFORE the window
      is only visible through its in-window rows, so its measured duration is a lower bound too - keep
      :period_days comfortably wider than :warn_run_hours. result_state is populated only in a run''s
      end row, so in_flight = true means "no end row seen yet", which is also what ingestion lag looks
      like. top_3_tasks lists the three slowest task_keys of the run with their observed hours, longest
      first, so the shape of a run reads without a second query; a run with fewer than three observed
      tasks simply lists fewer. top_task_key is the task with the most observed seconds (execution_duration_seconds
      where populated, else wall clock across that task''s rows); tasks run in parallel, so the task seconds
      of a run can add up to more than the run''s own seconds and top_task_share_pct can exceed 100 -
      read it as "the share of the run''s wall clock this task was busy", not as a decomposition of the
      run. A task that never ran (SKIPPED, BLOCKED) writes a single zero-length row per the doc and a
      task still waiting writes none, so neither can be a top task and a run whose time is spent waiting
      on a dependency shows a small top_task_share_pct - that gap is the finding. x_vs_job_p50 uses the
      same window, and the long runs themselves are in that median, so it is conservative: a job that
      is ALWAYS slow sits near 1.0, which is a chronic-slowness signal rather than a false negative. Names
      are resolved by LEFT JOIN so a missing name never drops a row: job_name comes from system.lakeflow.jobs,
      which is SCD2 (the latest row per job by change_time is taken, deleted jobs included, so a long
      run of a since-deleted job keeps its last known name) and which one-time SUBMIT_RUN / WORKFLOW_RUN
      executions never write to - those runs show job_name NULL and are identified by job_id alone. workspace_name
      comes from system.access.workspaces_latest, a DIFFERENT system schema: if system.access is not enabled
      or you cannot read it, this query ERRORS rather than degrading, so drop the workspace_name column
      and its LEFT JOIN (two lines) and resolve ids with cost_workspace_names separately - that is why
      the cost domain keeps the lookup separate. No user or principal identities are emitted, so nothing
      here needs masking; task names are task_keys, which are job configuration, not identities. The three
      URLs are built from workspaces_latest.workspace_url (its trailing slash is stripped), so they share
      the system.access dependency above and are NULL without it. Databricks documents a per-run page
      but NO per-task deep link, so run_url is the task entry point: it opens the run''s task graph, from
      which a task''s output and Spark UI are one click away. top_task_cluster_id is the FIRST entry of
      that task''s compute_ids array, so a task that moved across compute shows only the first; it is
      NULL for serverless tasks (no cluster exists) and on rows from before compute_ids was populated
      (early Dec 2025) - a NULL link there means "no cluster recorded", never "no cluster used". There
      are no dollars here - durations are not a billing unit; price a long run with lakeflow_failed_jobs_wasted_dbus
      or the cost domain.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/jobs_pipelines/lakeflow_long_running_runs.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 ELSE 2 END, run_hours DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - job_id
        - run_id
- name: f_lakeflow_never_started_runs
  description: One row = a (workspace, job, termination_code) combination. never_started_runs is the DISTINCT
    union of never_started_runs_zero_length (a zero-length run period) and never_started_runs_invalid_config_no_tasks
    (an INVALID_RUN_CONFIGURATION run that spawned no task row at all) - runs that were created but never
    began executing (queue rejection, quota hit, config error) before terminating.
  meta:
    query_id: lakeflow_never_started_runs
    title: Runs that never started execution
    domain: jobs_pipelines
    tier: lite
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    reads:
    - system.lakeflow.job_run_timeline
    - system.lakeflow.job_task_run_timeline
    - system.lakeflow.jobs
    - system.access.workspaces_latest
    requires: SELECT on system.lakeflow AND on system.access (the latter only for the workspace_name column
      - see caveats to drop it); GA
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_never_started
      default: 3
      meaning: never-started runs for a (job, termination_code) pair that flags WARN
    - name: crit_never_started
      default: 10
      meaning: that flags CRITICAL
    confidence: needs_confirmation
    confidence_note: 'The period_start_time = period_end_time signature for a never-executed run, and
      termination_code as the reason, were verified against system.lakeflow.job_run_timeline in a live
      workspace. never_started_runs_invalid_config_no_tasks (an INVALID_RUN_CONFIGURATION run with no
      row at all in system.lakeflow.job_task_run_timeline) is a new, UNCONFIRMED second signature, added
      because it was not known whether every never-started run is zero-length: it has not been checked
      against a live account''s actual INVALID_RUN_CONFIGURATION rows. Read never_started_runs_zero_length
      and never_started_runs_invalid_config_no_tasks separately before trusting the combined never_started_runs:
      if the invalid-config count is consistently 0, the zero-length match alone was already sufficient;
      if it consistently matches or exceeds the zero-length count for the same termination_code, the two
      may be catching the same runs under different names rather than a genuine second case.'
    healthy: never_started_runs at/near 0 for every job - field heuristic; tune :warn_never_started for
      your account.
    investigate_if: never_started_runs at/above :warn_never_started (WARN) or :crit_never_started (CRITICAL)
      for a job/termination_code pair - field heuristic; check termination_code first, it usually names
      the blocker (queue/quota/config).
    actions:
    - read the termination_code and, if it is a quota/limit code, check for a scheduling pile-up on that
      job (free);
    - fix the underlying config error or raise the relevant workspace limit (config);
    - if the block is capacity (queue/cluster limits), add capacity (spend).
    next:
    - query_id: lakeflow_termination_taxonomy
      if: for the account-wide termination_code picture
    - query_id: lakeflow_job_queue_time
      if: queueing and never-started runs often share a capacity root cause
    caveats: 'period_start_time == period_end_time marks a run that never executed; termination_code gives
      the reason. This is filtered to end rows only, to avoid false positives from clock-hour-aligned
      slicing of long runs. never_started_runs_invalid_config_no_tasks additionally counts a run whose
      termination_code is INVALID_RUN_CONFIGURATION and which has no matching row in system.lakeflow.job_task_run_timeline
      in the window - a run that never started should never have spawned a task; this can overlap never_started_runs_zero_length
      (a run can match both), so the combined never_started_runs column is a DISTINCT run_id union, never
      a sum of the two. job_name comes from system.lakeflow.jobs (SCD2, latest row by change_time, deleted
      jobs kept) and is NULL for one-time SUBMIT_RUN / WORKFLOW_RUN executions. workspace_name comes from
      system.access.workspaces_latest, a DIFFERENT system schema: if system.access is not enabled or you
      cannot read it, this query ERRORS rather than degrading, so drop the workspace_name column and its
      LEFT JOIN (two lines) and resolve ids with cost_workspace_names separately.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/jobs_pipelines/lakeflow_never_started_runs.sql
    order_by: never_started_runs DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - job_id
        - termination_code
- name: f_lakeflow_phase_cold_start
  description: One row = a job in the window. The column that matters is setup_s_p95 - the 95th-percentile
    cold-start (cluster setup) seconds before a run's code starts executing, now measured from every task
    run (single- or multi-task jobs alike); execution_s_total is how much of the run's time was actual
    work.
  meta:
    query_id: lakeflow_phase_cold_start
    title: Job run phase breakdown - setup, queue, execution, cleanup
    domain: jobs_pipelines
    tier: lite
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    reads:
    - system.lakeflow.job_run_timeline
    - system.lakeflow.job_task_run_timeline
    requires: SELECT on system.lakeflow; GA (the five *_duration_seconds columns were added early Dec
      2025)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_setup_p95_s
      default: 60
      meaning: 95th-percentile setup seconds that flags WARN
    - name: crit_setup_p95_s
      default: 300
      meaning: that flags CRITICAL
    confidence: needs_confirmation
    confidence_note: The five phase columns and the queue-vs-job_task_run_timeline scoping were verified
      against system.lakeflow.job_run_timeline in a live workspace. Per Databricks' own documentation,
      run_duration_seconds and the four phase columns on job_run_timeline are populated only for LEGACY
      SINGLE-TASK jobs; every multi-task job logs a literal 0 in ALL of them together (never NULL) - so
      on that table alone, a multi-task job could never be assessed for cold start. job_task_run_timeline
      carries its own task-level setup_duration_seconds (this folder's lakeflow_tasks_near_timeout already
      reads that table's execution_duration_seconds the same way, for every job, single- or multi-task
      - the only gap it or this query has is "not populated before late Nov/early Dec 2025", never a multi-task
      fold to 0), so this query now reads setup time from there instead, and a multi-task job gets a real
      cold-start read. job_task_run_timeline has no queue_duration_seconds column at all (task-level queue
      time is not published anywhere), so queue_s_p95 stays sourced from job_run_timeline and stays legacy-single-task-only
      - see caveats.
    healthy: setup_s_p95 below :warn_setup_p95_s seconds - field heuristic; tune :warn_setup_p95_s for
      your account.
    investigate_if: setup_s_p95 at/above :warn_setup_p95_s (WARN) or :crit_setup_p95_s (CRITICAL) seconds
      - field heuristic; also check rows_setup_null before trusting a low number on a short-history account.
      queue_s_p95 stays NULL for a multi-task job - see caveats, this is a real data gap, not a bug.
    actions:
    - switch the job to a job cluster/pool that is already warm, or share a cluster across tasks in the
      same job (free);
    - enable a cluster pool or serverless compute to cut cold-start time (config);
    - keep a small always-on pool of pre-warmed instances if setup latency is business-critical (spend).
    next:
    - query_id: lakeflow_job_queue_time
      if: queue time is one slice of this same breakdown, isolated, same legacy-single-task-only limit
    - query_id: lakeflow_workload_mix_hours
      if: to see whether the affected job runs often enough to be worth the fix
    caveats: 'setup_s_total / setup_s_p95 / rows_setup_null / status are now computed from system.lakeflow.job_task_run_timeline''s
      own setup_duration_seconds, one row per task run, summed/percentiled directly with no run_duration_seconds
      gate: that table has no "0 for every multi-task job" fold, only "NULL before this column existed"
      (late Nov/early Dec 2025), so a genuine 0-second setup reads as a real 0 and a multi-task job is
      judged on its own tasks'' cold starts instead of reading NOT_ASSESSED forever. rows_setup_null counts
      task rows whose setup_duration_seconds is NULL (column not yet populated); a job with no task row
      in the window at all has nothing to band on and reads NOT_ASSESSED, distinct from a job whose observed
      task rows all have a NULL setup (also NOT_ASSESSED, via the p95-is-NULL branch). queue_s_total /
      queue_s_p95 are UNCHANGED and still come from job_run_timeline''s run-level queue_duration_seconds,
      which Databricks documents as populated only for LEGACY SINGLE-TASK jobs (every multi-task job''s
      run-level row logs a literal 0, not NULL, in it and its four siblings together) - job_task_run_timeline
      has no queue_duration_seconds column at all, at any granularity, so a multi-task job''s queue wait
      cannot be measured from any system table today; this query reads queue_duration_seconds only where
      run_duration_seconds > 0 (`CASE WHEN run_duration_seconds > 0 THEN queue_duration_seconds END`),
      keeping a genuine 0-second queue on a legacy single-task job as a real 0 while a multi-task row''s
      sentinel 0 stays excluded as "not reported" - queue_s_p95 is simply NULL for a multi-task-only job,
      a permanent gap this query cannot close, not a NOT_ASSESSED status (this id has no status branch
      on queue at all - see lakeflow_job_queue_time for the dedicated, banded queue check, with the same
      limit). execution_s_total / cleanup_s_total / run_s_total are also UNCHANGED, still run-level from
      job_run_timeline and still 0-for-multi-task (read them as "legacy single-task jobs only" the same
      way queue is). All five *_duration_seconds columns on both tables are NULL before their own column
      existed, so on a short-history account rows_setup_null / a NULL queue_s_p95 may just mean "not populated
      yet", not "multi-task". This query uses the exact PERCENTILE function; on large volumes prefer PERCENTILE_APPROX
      instead, since exact PERCENTILE can be expensive.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/jobs_pipelines/lakeflow_phase_cold_start.sql
    order_by: setup_s_p95 DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - job_id
- name: f_lakeflow_pipeline_cost
  description: 'One row = a pipeline. The column that matters is net_pipeline_dbus - net DBUs billed to
    that pipeline in the window; net_maintenance_dbus is the housekeeping share of that total, broken
    out separately; updates/active_seconds_total are the over-refresh signal (many short updates can mean
    the pipeline is triggered more often than the data actually changes). price_basis (free/priced/unpriced)
    discloses whether net_list_cost is a real $0 (free-usage SKU) or understated by a pricing-coverage
    gap. est_wasted_usd_list is the possible waste: net_list_cost (minus its maintenance share) when the
    pipeline delivered NOTHING in the window (see caveats), 0 when it delivered at least one completed
    update, and NULL when there is no discrete completed-update signal to judge (a continuous pipeline,
    or one still mid-update at the end of the window).'
  meta:
    query_id: lakeflow_pipeline_cost
    title: Per-pipeline DBU cost and update/refresh volume
    domain: jobs_pipelines
    tier: deep
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - preview_unavailable
    - no_activity
    reads:
    - system.billing.usage
    - system.billing.list_prices
    - system.lakeflow.pipelines
    - system.lakeflow.pipeline_update_timeline
    requires: SELECT on system.billing, system.lakeflow; GA (system.billing.usage/list_prices); Public
      Preview (system.lakeflow.pipelines and pipeline_update_timeline - a missing/disabled table degrades
      names/updates to NULL, never the DBU attribution)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_pipeline_dbus
      default: 500
      meaning: net pipeline DBUs in the window that flags WARN
    - name: crit_pipeline_dbus
      default: 2000
      meaning: that flags CRITICAL
    confidence: needs_confirmation
    confidence_note: pricing.effective_list.default (the effective, post-promotion list price - DEC-66.1)
      is the one dollar basis used across this app; net_list_cost is a directional estimate at that price,
      never a billed dollar figure. is_continuous (settings.continuous on system.lakeflow.pipelines) and
      the in-flight / nothing-delivered split below are new, not yet confirmed against a live workspace.
    healthy: net_pipeline_dbus below :warn_pipeline_dbus for the window, with maintenance a small share
      of the total, and est_wasted_usd_list at 0 - field heuristic; tune :warn_pipeline_dbus for your
      account.
    investigate_if: 'est_wasted_usd_list > 0 (CRITICAL at/above :crit_pipeline_dbus, WARN at/above :warn_pipeline_dbus
      - the pipeline billed real DBUs and delivered nothing), or net_pipeline_dbus at/above :crit_pipeline_dbus
      with something delivered (WARN - large but not necessarily wasteful; this is a spend-magnitude signal,
      not a waste one) - field heuristic; also look at updates vs active_seconds_total for over-refresh.
      NOT_ASSESSED is not a pass: read not_assessed_reason.'
    actions:
    - check the pipeline's trigger interval against how often the source data actually changes and space
      it out if it is over-refreshing (free);
    - switch a continuously-triggered pipeline to a scheduled/triggered pipeline if continuous freshness
      is not required (config);
    - if the pipeline is correctly sized and still expensive, revisit serverless/Photon settings or move
      it to a cheaper SKU tier (spend).
    next:
    - query_id: lakeflow_pipeline_idle_tail_duration
      if: for cluster lingering after the pipeline's active window
    - query_id: lakeflow_pipeline_update_failures_retries
      if: for how much of that DBU spend is retries
    caveats: PER-PIPELINE DBUs = net DBUs billed on system.billing.usage rows carrying usage_metadata.dlt_pipeline_id,
      attributed on (workspace_id, dlt_pipeline_id). usage_metadata also carries dlt_update_id and dlt_maintenance_id;
      maintenance DBUs (dlt_maintenance_id IS NOT NULL) are summed into a SEPARATE net_maintenance_dbus
      column so housekeeping is not blamed on pipeline logic, and net_maintenance_list_cost is excluded
      from est_wasted_usd_list so maintenance-only spend is never counted as pipeline waste (net_list_cost,
      the pipeline's whole spend, is unchanged). usage_quantity is summed across ALL record_types (ORIGINAL/RETRACTION/RESTATEMENT
      already net) and filtered to upper(usage_unit)='DBU', so bytes/hours/tokens never blend into the
      DBU total. list_rate (pricing.effective_list.default) is the effective, post-promotion list price
      - DEC-66.1's one dollar basis; treat net_list_cost as an estimate at that price, never a negotiated
      or billed dollar (no negotiated-rate source exists, see cost_actual_vs_list_by_sku); the price window
      is open-interval (price_end_time NULL = currently effective). dlt_pipeline_id is unique only WITHIN
      a workspace, so every join/group here is on (workspace_id, pipeline_id), never pipeline_id alone.
      pipelines is SCD2, so this takes the latest row via QUALIFY ROW_NUMBER() OVER (PARTITION BY workspace_id,
      pipeline_id ORDER BY change_time DESC) = 1 for names/type/is_continuous, not ids. pipeline_update_timeline
      gives the update count and active-second proxy for the over-refresh signal; result_state IS NOT
      NULL marks an update's end row (update_end_rows / updates / updates_completed / updates_failed_or_canceled
      are all end-row-only); update_rows_any counts every update row seen in the window, ended or not,
      so a still-running update is not confused with no activity at all. NOTHING DELIVERED means either
      zero update activity all window, or every ended update read FAILED or CANCELED - a bare updates_completed
      = 0 is NOT enough on its own, since an update still in flight also shows 0 completed (checked first,
      via in_flight_only, and reads NOT_ASSESSED, never CRITICAL). A continuous pipeline (is_continuous)
      runs one update for the whole window that never produces an end row, so it has no discrete completed-update
      signal at all and reads NOT_ASSESSED, never CRITICAL, regardless of spend. system.lakeflow.pipelines
      and pipeline_update_timeline are Public Preview - a missing table degrades the names/update/is_continuous
      columns to NULL via LEFT JOIN (is_continuous defaults FALSE, i.e. judged as non-continuous), never
      dropping the DBU attribution itself. price_basis is 'unpriced' when any non-free-usage SKU billed
      to this pipeline had no matching list_prices row (net_list_cost then understates cost), 'free' when
      every matched SKU is a FREE_USAGE SKU (a real $0), and 'priced' otherwise. is_high_spend flags net_pipeline_dbus
      at/above :warn_pipeline_dbus as a plain size fact, independent of status - a pipeline between :warn_pipeline_dbus
      and :crit_pipeline_dbus that delivered something is_high_spend = true but status = OK (spend alone,
      below the CRITICAL floor, with nothing wasted, is not itself a finding); at/above :crit_pipeline_dbus
      it is WARN even when delivering, since that much spend is worth a second look regardless.
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/jobs_pipelines/lakeflow_pipeline_cost.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 WHEN 'NOT_ASSESSED' THEN 2 ELSE 3
      END, c.net_pipeline_dbus DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - pipeline_id
- name: f_lakeflow_pipeline_idle_tail_duration
  description: One row = a pipeline. The columns that matter are updates/active_seconds_total (how much
    the pipeline actually ran) next to net_dbus (what it was billed) - a large gap between billed DBUs
    and active update time on a non-continuous pipeline suggests the cluster is lingering after the run
    (idle tail) rather than shutting down promptly.
  meta:
    query_id: lakeflow_pipeline_idle_tail_duration
    title: Pipeline update activity and idle-tail DBU exposure
    domain: jobs_pipelines
    tier: standard
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - preview_unavailable
    reads:
    - system.lakeflow.pipeline_update_timeline
    - system.lakeflow.pipelines
    - system.billing.usage
    - system.billing.list_prices
    requires: SELECT on system.lakeflow, system.billing; Public Preview (system.lakeflow.pipelines and
      pipeline_update_timeline); GA (system.billing.usage/list_prices)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_idle_dbus
      default: 100
      meaning: net DBUs in the window on a non-continuous pipeline that flags WARN
    - name: crit_idle_dbus
      default: 500
      meaning: that flags CRITICAL
    confidence: needs_confirmation
    confidence_note: the settings.continuous / settings.development dot-access assumes settings is a STRUCT
      on system.lakeflow.pipelines; whether it is a STRUCT (dot-access) or a MAP (settings['key']) on
      your account is unverified.
    healthy: net_dbus roughly tracks active_seconds_total for non-continuous pipelines, and stays below
      :warn_idle_dbus for the window - field heuristic; tune :warn_idle_dbus for your account.
    investigate_if: net_dbus at/above :warn_idle_dbus (WARN) or :crit_idle_dbus (CRITICAL) on a pipeline
      where setting_continuous is false and active_seconds_total looks small relative to net_dbus - field
      heuristic.
    actions:
    - check the pipeline's cluster auto-termination / shutdown-delay setting (free);
    - shorten the idle shutdown delay or move the pipeline to serverless DLT compute (config);
    - if the workload genuinely needs a warm cluster between runs, that is a deliberate spend - just confirm
      it is intentional (spend).
    next:
    - query_id: lakeflow_pipeline_cost
      if: for the full per-pipeline DBU picture
    - query_id: lakeflow_pipelines_inventory_tier
      if: for the pipeline's serverless/continuous/development settings
    caveats: The active update window (period_start_time/period_end_time) is confirmed. The idle tail
      itself (post-run cluster lingering) is NOT a lakeflow column - this corroborates it via serverless/DLT
      DBU in system.billing.usage joined by usage_metadata.dlt_pipeline_id, so treat net_dbus vs active_seconds_total
      as a proxy, not a direct idle-time measurement. A cluster-shutdown-delay-style setting is not in
      the documented schema and is deliberately not emitted here. net_dbus is the exact billed DBUs (usage_unit='DBU');
      est_usd_list is an ESTIMATE AT THE EFFECTIVE LIST PRICE (usage_quantity x list_prices.pricing.effective_list.default
      - DEC-66.1), not your negotiated invoice rate, and it excludes cloud infra/egress cost - treat it
      as directional. Cost is attributed by (workspace_id, dlt_pipeline_id) over the window (per-pipeline),
      not per update/event; the rollup is pre-aggregated then LEFT JOINed, so result rows are never multiplied.
      price_basis is 'unpriced' when any non-free-usage SKU billed to this pipeline had no matching list_prices
      row (net_dbus/est_usd_list then understate cost), 'free' when every matched SKU is a FREE_USAGE
      SKU (a real $0), and 'priced' otherwise.
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/jobs_pipelines/lakeflow_pipeline_idle_tail_duration.sql
    order_by: net_dbus DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - pipeline_id
