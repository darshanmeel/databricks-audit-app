      are emitted, so nothing here needs masking. This is an inventory, not a finding - no WARN/CRITICAL
      band is invented for a dollar figure alone; :top_n orders worst (most expensive) first so a cut
      row is always the cheapest, never the run you most needed to see.'
    sql_url: app/queries/app/jobs_pipelines/lakeflow_job_run_cost.sql
    order_by: d.net_list_cost DESC NULLS LAST, d.net_run_dbus DESC
