- name: f_lakeflow_job_compute_pressure
  description: 'One row = one job with at least one task run starting in the window: every run and every
    task of the job pooled, with the per-minute telemetry of every classic cluster its task runs used,
    restricted to each task run''s own window, node-minutes shared by parallel tasks counted once. The
    columns that matter are pressure (MEMORY, SKEW, CPU, IO_WAIT, DRIVER, IDLE or NONE), scaling_hint
    (the lever: SCALE_UP_MEMORY, SCALE_OUT, FIX_SKEW, DISTRIBUTE_WORK, FIX_IO, SCALE_DOWN or NONE), pressure_reason
    (the numbers that decided it, in words), hottest_task_key (the task to open first) and on_all_purpose
    (TRUE = the profile is shared with other work on an all-purpose cluster). at_ceiling says whether
    any run''s CPU-bound cluster reached its configured maximum workers, which decides whether "more workers"
    is even a lever. The query cannot see the Spark stage; it names the shape of the problem so the Spark
    UI is opened knowing what to look for. Rows are capped inside every window_days block by the body''s
    LIMIT :top_n (default 100000, threshold ''top_n'').'
  meta:
    query_id: lakeflow_job_compute_pressure
    title: 'Per job, whether its classic compute was memory-bound, CPU-bound at its ceiling, skewed, driver-bound,
      I/O-bound or idle - and the lever that goes with it: scale up, scale out, scale down, or not a scaling
      problem'
    domain: jobs_pipelines
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - compute_scope_gap
    - retention_window
    - no_activity
    - ingestion_lag
    reads:
    - system.lakeflow.job_task_run_timeline
    - system.compute.node_timeline
    - system.compute.clusters
    - system.compute.node_types
    - system.lakeflow.jobs
    requires: 'SELECT on system.lakeflow and system.compute; GA. SCOPE LIMIT: node_timeline holds classic
      all-purpose, job, Lakeflow pipeline and pipeline-maintenance compute ONLY, so a job whose tasks
      ran on serverless or a SQL warehouse has no hardware profile and comes back NOT_ASSESSED with a
      named reason, never as "no pressure"'
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days, capped at 90 in-SQL by node_timeline retention
    - name: min_slices
      default: 60
      meaning: minimum judged node-minutes (the workers', or the driver's on a single-node cluster) pooled
        over the whole job before it is judged (fewer -> NOT_ASSESSED)
    - name: waiting_cpu_pct
      default: 20
      meaning: average worker CPU percent below which the workers were mostly waiting, not working
    - name: busy_cpu_pct
      default: 70
      meaning: median worker CPU percent at/above which the job is genuinely CPU-bound
    - name: crit_mem_pct
      default: 85
      meaning: p90 worker memory percent at/above which the job is memory-bound (CRITICAL)
    - name: crit_swap_pct
      default: 10
      meaning: p90 worker swap percent at/above which the job is memory-bound (CRITICAL) - a sustained
        figure, because a small non-zero swap is normal on these nodes
    - name: skew_gap_pct
      default: 40
      meaning: gap in average CPU between the hottest and the coldest worker of one run's cluster that
        flags skew
    - name: warn_io_wait_pct
      default: 20
      meaning: average worker CPU-wait percent at/above which the job is I/O-bound
    - name: top_n
      default: 100000
      meaning: row cap - far above any account's job count, because this is a verdict per job and a cut
        row would read as "not flagged"
    confidence: needs_confirmation
    confidence_note: 'Built on the columns, scopes and heuristic of task_cluster_utilization (checked
      against a live system-catalog schema dump and the Databricks doc pages) and calibrated once against
      a redacted diagnostics export of a real account, but this query has NOT been executed on a workspace.
      Confirm on your account: 1) for a job you know ran on a job cluster, node_timeline.cluster_id matches
      the first entry of its task runs'' compute_ids - node_minutes should be roughly nodes x run minutes,
      and far below that means the ids do not match or the run fell in node_timeline''s ~10-minute blind
      spot; 2) max_autoscale_workers on system.compute.clusters reads as the ceiling autoscale can reach
      - at_ceiling TRUE on a job you know scaled to its maximum, FALSE on one that did not; 3) a serverless-only
      job shows NOT_ASSESSED with no_cluster_recorded rather than an error.'
    healthy: 'pressure = NONE, or pressure = CPU with no scale-out lever: at_ceiling FALSE - the workers
      were doing the work and could still grow; NULL - the cluster config was not found, or the cluster
      is single-node and cannot grow by workers (its lever, a larger node, is not named here); field heuristic,
      every threshold is a header param.'
    investigate_if: 'MEMORY (CRITICAL) - p90 worker memory at/above :crit_mem_pct or p90 swap at/above
      :crit_swap_pct: the job''s input per run is larger than what its workers hold in memory, so spill
      and OOM are the likely cost; CPU at the ceiling (at_ceiling TRUE), SKEW, DRIVER, IO_WAIT or IDLE
      (WARN). NOT_ASSESSED is not a pass: read not_assessed_reason.'
    actions:
    - 'read scaling_hint with pressure_reason, hottest_task_key and on_all_purpose in hand: MEMORY (SCALE_UP_MEMORY)
      - the job''s input per run is larger than what its workers hold in memory, so first cut the input
      per run (narrow the reprocessed window, filter and prune earlier, process incrementally); SKEW (FIX_SKEW)
      - salt or repartition the hot key, adding nodes will not help; DRIVER (DISTRIBUTE_WORK) - move pandas
      / collect() / driver-side loops onto Spark; IO_WAIT (FIX_IO) - compact small files or cache the
      input; IDLE (SCALE_DOWN) - find the pause in the driver log, an external call or a serial loop (free);'
    - MEMORY - raise spark.sql.shuffle.partitions so each Spark task holds less, or split the widest stage;
      IDLE - fewer or smaller workers, or autoscale down to the minimum; CPU with headroom - nothing,
      autoscale can still grow (config);
    - 'MEMORY - scale up: a worker node type with more memory per worker (Databricks: increase the amount
      of memory available on your instances); CPU at the ceiling (SCALE_OUT) - scale out: raise max_autoscale_workers
      or the fixed worker count, or a faster family / Photon (spend).'
    next:
    - query_id: task_cluster_utilization
      if: per task run, for runs over two hours
    - query_id: lakeflow_long_running_runs
      if: ''
    - query_id: node_timeline_utilization
      if: ''
    - query_id: classic_clusters_config_current
      if: ''
    - query_id: lakeflow_jobs_on_all_purpose
      if: on_all_purpose
    caveats: 'SCOPE - system.compute.node_timeline records classic all-purpose, job, Lakeflow pipeline
      and pipeline-maintenance compute only (cluster_source UI / API / JOB / PIPELINE / PIPELINE_MAINTENANCE),
      never serverless or SQL warehouses, so a job with no classic telemetry is kept as a NOT_ASSESSED
      row with not_assessed_reason = no_cluster_recorded (no executed task run recorded a compute id -
      serverless, or rows from before compute_ids was populated in early Dec 2025), no_node_timeline_rows
      (an id was recorded but nothing overlaps the task windows - a SQL warehouse id, which the doc says
      compute_ids also carries, a node that ran under ~10 minutes, which the doc says may not appear in
      node_timeline at all, or activity past its 90-DAY default retention, which is why :period_days is
      capped at LEAST(:period_days, 90)), too_few_slices (fewer than :min_slices judged node-minutes pooled
      over the whole job - tune it down for a job made only of very short runs) or task_not_executed (every
      task run of every run was SKIPPED or BLOCKED; the doc writes such a task as a zero-length row).
      The cluster of a task run is the FIRST entry of its compute_ids, as in task_cluster_utilization.
      POOLING - every run and every task of the job in the window is pooled before the percentiles are
      taken, so a job that is fine on weekdays and spills on Monday reads as its pooled p90; the per-task-run
      view of runs over two hours is task_cluster_utilization. Parallel tasks of one run on one shared
      job cluster are deduplicated per node-minute (run, cluster, instance, minute), but two overlapping
      runs of the same job on one all-purpose cluster count that cluster twice. hottest_task_key is the
      task whose own windows saw the highest p90 worker memory (ties: more task hours, then task_key)
      - on a shared cluster that is where the memory was high, not proof that task used it - and NULL
      when no task''s windows had worker telemetry (a single-node job, whose memory is the driver''s,
      pooled across its tasks, so no task can be named from it). The profile is the CPU / memory of the
      machines during the task windows, NOT the job''s own consumption: on an all-purpose cluster every
      concurrent workload is in the numbers, which is why on_all_purpose is carried (NULL when none of
      the job''s clusters has a configuration row). There is no Spark stage, job or statement in any system
      table; the verdict is a machine-level inference (field heuristics in the :params, in this precedence:
      MEMORY, SKEW, CPU, IO_WAIT, DRIVER, IDLE, else NONE) meant to tell you what to look for when you
      open the Spark UI. worker_cpu_spread_pct is the largest hottest-minus-coldest gap in average worker
      CPU within any one run''s cluster. Single-node clusters have no worker rows: single_node = true
      and the verdict is judged on the driver''s numbers instead; on a single-node job SCALE_UP_MEMORY
      means a node type with more memory for the driver, which does all the work, and SCALE_DOWN a smaller
      node. single_node is TRUE only when the job had no worker minute at all, so in a job that mixes
      a single-node cluster with a multi-worker one the verdict reads the workers'' numbers, the single-node
      cluster''s own memory and CPU are not judged, and the DRIVER rule reads only the drivers of run
      clusters that had workers (a single-node cluster''s only node is doing its own work, not waiting
      on workers - task_cluster_utilization makes the same exclusion per task run); driver_cpu_avg_pct
      is still every driver minute of the job. mem_used_percent includes OS and background processes,
      so a memory floor of 30-40 percent on an idle node is normal. SWAP IS THRESHOLDED - this query and
      task_cluster_utilization both judge the p90 of worker (or driver, on a single-node cluster) swap
      against a :crit_swap_pct param (default 10 on both), because a small non-zero swap figure is normal
      on these nodes and flagging any swap above zero used to flag nearly every task/job assessed on a
      real account; the two queries pool over different grains (this one over the whole job, task_cluster_utilization
      over one task run of one run), so their p90s can still differ on a mixed job, but the rule itself
      is now the same. CEILING - per run and cluster, the most worker instances running in the same minute
      (worker_nodes_seen_max is that concurrent peak, not a count of distinct instance ids, so autoscale
      churn and spot replacements that issue new ids never read as growth) is compared against that cluster''s
      LATEST configuration (max_autoscale_workers, else worker_count; system.compute.clusters is SCD2,
      so a cluster resized between runs shows its last shape), and a run''s cluster counts toward at_ceiling
      only when that cluster was itself CPU-bound (its own worker CPU p50 at/above :busy_cpu_pct), so
      a light fixed-size side cluster never makes a job read as out of room: at_ceiling is TRUE when any
      such run reached its ceiling, FALSE when none did, and NULL when no cluster of the job has a known
      worker ceiling - no configuration row, or a single-node cluster (worker_count 0), which has no workers
      to scale out. A CPU-bound single-node job therefore reads CPU / NONE / OK: its lever would be a
      larger node, which this query does not name. workers_configured_max and worker_nodes_seen_max describe
      ONE reference run and cluster: the one that set at_ceiling, else a CPU-bound one, else any - the
      most workers running at once first (ties: latest run, then cluster_id) - and the ending of a CPU
      pressure_reason (at ceiling, headroom, cluster config not found, no worker ceiling configured) describes
      that same cluster, so a light cluster that sat at its fixed size never stands in for the CPU-bound
      one; only when the job''s pooled worker CPU p50 crossed :busy_cpu_pct although no single run''s
      cluster did is the reference simply the largest cluster. A node that lived under ~10 minutes may
      be missing from that count. On a single-node job pressure_reason names the driver''s numbers as
      the driver''s (driver memory p90, driver CPU avg), and a figure the row lacks reads n/a there. CPU-bound
      with headroom is OK, not WARN: a WARN must have a lever. clusters_seen and max_clusters_per_run
      count every compute id the job''s task runs recorded - a SQL warehouse id of a SQL task included
      - while latest_cluster_id prefers a classic cluster (one with a configuration row or node_timeline
      rows) and falls back to any recorded id only when the job has none. cluster_source, worker_node_type,
      driver_node_type, worker_memory_gb and worker_cores describe latest_cluster_id, the classic cluster
      of the latest-starting task run that recorded one; worker_memory_gb and worker_cores come from system.compute.node_types
      and are NULL when the node type is not listed there. network_received_gb is network traffic received
      by the job''s nodes, the only input-volume proxy a classic job has in the system tables - not bytes
      read. Task seconds are execution_duration_seconds where populated (end row only, 0 treated as not
      reported), else wall clock between the task''s first and last observed rows, to current_timestamp()
      while in flight; the telemetry window is that same wall clock, so cluster start-up minutes before
      a task''s first row are excluded (see lakeflow_phase_cold_start). Like task_cluster_utilization
      this query keeps the current day, so a run in flight is examined and very recent minutes may still
      be materializing. job_name comes from system.lakeflow.jobs (SCD2, latest row) and is NULL for one-time
      SUBMIT_RUN / WORKFLOW_RUN executions; workspace names are resolved outside this query, so it needs
      no system.access. No identities are emitted, and there are no dollars here - node-minutes are not
      a billing unit; price a job with cost_by_job. :top_n caps the rows across ALL workspaces, worst
      first; its default is set far above any account''s job count, and an override lowered in config/thresholds.yml
      cuts the OK rows, then the NOT_ASSESSED ones, first. Scale up here means a larger warehouse_size
      / more memory per worker and scale out means more clusters / more workers; Databricks'' own warehouse_events
      logs SCALED_UP when a warehouse ADDS A CLUSTER, so do not read that event name as this query''s
      scale-up. For a classic job cluster, scale up is a worker node type with more memory per worker
      and scale out is more workers (a higher max_autoscale_workers or fixed worker count).'
    sql_url: app/queries/app/jobs_pipelines/lakeflow_job_compute_pressure.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 WHEN 'NOT_ASSESSED' THEN 2 ELSE 3
      END, task_hours_total DESC, workspace_id, job_id
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - job_id
- name: f_lakeflow_job_cost_summary
  description: 'One row = one job''s cost roll-up over every run lakeflow_job_run_cost attributed to it
    in this same window: runs (how many distinct job runs had billed DBUs), net_job_dbus / net_list_cost
    (the total), and est_median_usd_list / est_max_usd_list (is the job expensive because every run costs
    about the same, or because a few runs spike?). price_basis discloses a pricing-coverage gap the same
    way lakeflow_job_run_cost does.'
  meta:
    query_id: lakeflow_job_cost_summary
    title: Per-job cost roll-up - runs, total, median and max cost per run
    domain: jobs_pipelines
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: false
    empty_if:
    - schema_not_enabled
    - no_activity
    - ingestion_lag
    reads:
    - system.billing.usage
    - system.billing.list_prices
    - system.lakeflow.jobs
    requires: SELECT on system.billing, system.lakeflow; GA (billing.usage/list_prices and lakeflow.jobs
      are generally available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    confidence: needs_confirmation
    confidence_note: Aggregates the exact per-run attribution and effective-list price join lakeflow_job_run_cost
      uses (usage_metadata.job_id/job_run_id, DEC-66.1) one level up, to (workspace_id, job_id); neither
      query has itself been run against a live workspace. Confirm a job you know the run count of for
      the window shows the matching `runs` here.
    healthy: n/a - inventory
    investigate_if: n/a - inventory
    actions: []
    next:
    - query_id: lakeflow_job_run_cost
      if: for the per-run detail behind this roll-up
    - query_id: cost_by_job
      if: for the job's whole-window DBU total across every job_id-attributed usage row, including any
        without a job_run_id - see caveats
    - query_id: lakeflow_failed_jobs_wasted_dbus
      if: failures are eating into the total
    caveats: This is lakeflow_job_run_cost's own per-run rows (same usage_metadata.job_id/job_run_id attribution,
      same effective-list price join, DEC-66.1) aggregated one level up to (workspace_id, job_id) - read
      that query's header for the attribution and shared-job-cluster rules this total inherits unchanged,
      INCLUDING that a job_id-attributed usage row with no job_run_id is excluded from both queries; net_job_dbus/net_list_cost
      here can therefore be LESS than the SAME job's whole-window total in cost_by_job or lakeflow_failed_jobs_wasted_dbus,
      which key on job_id alone and do not require job_run_id - never read this query as the job's authoritative
      whole-window spend, use cost_by_job for that; this pair is for the per-run breakdown and the run-to-run
      spread. runs counts only runs with at least one billed DBU row in the window (job_run_timeline is
      not read here, so a run with zero billed usage - e.g. it failed before any compute started - is
      not counted and not a gap in this total). net_list_cost is left NULL rather than forced to 0 when
      nothing priced it; price_basis is 'unpriced' when any run of the job is 'unpriced' (the job total
      then understates cost), 'free' when no run of the job ever priced (every matched SKU was FREE_USAGE),
      and 'priced' otherwise - the same three-state rule lakeflow_job_run_cost uses, applied across the
      job's own runs. median_run_dbus / est_median_usd_list / max_run_dbus / est_max_usd_list are computed
      over the job's own runs in the window (the exact percentile, interpolated between the two middle
      runs when the run count is even, and MAX; both skip any run whose own value is NULL because nothing
      priced it) - a job with one enormous run and many cheap ones shows est_max_usd_list far above est_median_usd_list;
      a job whose runs cost about the same shows the two close together. job_id is unique only within
      a workspace, so every grouping is on (workspace_id, job_id). job_name comes from system.lakeflow.jobs
      (SCD2, latest row by change_time, deleted jobs kept) and is NULL for one-time SUBMIT_RUN / WORKFLOW_RUN
      executions, which never write to that table. No identities are emitted, so nothing here needs masking.
      This is an inventory, not a finding - no WARN/CRITICAL band is invented for a dollar total alone.
    sql_url: app/queries/app/jobs_pipelines/lakeflow_job_cost_summary.sql
    order_by: t.net_list_cost DESC NULLS LAST, t.net_job_dbus DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - job_id
- name: f_lakeflow_job_duration_regression
  description: One row = one job with at least one completed run (an end row) in the window. Only SUCCEEDED
    runs feed a duration - a run that ultimately failed tells you nothing about how long the job normally
    takes. recent_median_minutes is the median wall-clock duration of the job's SUCCEEDED runs in the
    last :recent_days days; baseline_median_minutes is the SAME job's own median over the earlier, remaining
    days of the window; slowdown_ratio is recent over baseline. recent_runs/baseline_runs are the SUCCEEDED-run
    counts each median is built on - read these before trusting a ratio built on a handful of runs - and
    the _repaired columns say how many of those needed at least one retry. recent_queue_s/setup_s/execution_s
    and their baseline counterparts are the same two medians broken into the three legacy phase columns
    (NULL where Databricks does not report them - see caveats); grew_most says which side actually grew
    - 'queue_or_setup' points at capacity (a busier cluster pool, slower autoscale), 'run_time' at the
    job's own code or its input data.
  meta:
    query_id: lakeflow_job_duration_regression
    title: 'Per job: how its recent run duration compares to its own earlier baseline in the same window'
    domain: jobs_pipelines
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - no_activity
    reads:
    - system.lakeflow.job_run_timeline
    - system.lakeflow.jobs
    requires: SELECT on system.lakeflow; GA (system.lakeflow.job_run_timeline and system.lakeflow.jobs
      are generally available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: recent_days
      default: 7
      meaning: the most recent N days of the window is the job's "recent" slice, capped at HALF of :period_days
        (see caveats) so the earlier remainder always has a non-empty "baseline" to compare against
    - name: min_runs_each_side
      default: 3
      meaning: minimum SUCCESSFUL runs required on EACH side (recent and baseline) before a ratio is judged,
        below -> NOT_ASSESSED
    - name: warn_slowdown_ratio
      default: 1.5
      meaning: recent median duration over baseline median duration at/above which WARN
    - name: crit_slowdown_ratio
      default: 2.0
      meaning: ratio at/above which CRITICAL
    confidence: needs_confirmation
    confidence_note: Built on the same end-row, attempt-row and wall-clock-fallback conventions lakeflow_retries_repairs
      and lakeflow_long_running_runs already verified against a live workspace (period_end_time < date_trunc('DAY',
      now) drops the incomplete current day, result_state IS NOT NULL marks an end row, NULLIF(run_duration_seconds,
      0) treats the documented multi-task 0-sentinel as not-reported and falls back to timestampdiff wall
      clock). Pooling a multi-hour attempt's own earlier NULL-result_state slices (a run over ~1h is sliced
      hourly, per the doc lakeflow_long_running_runs already verified this against) into that same attempt's
      start, the recent-vs-baseline split, and measuring a repaired run on its final attempt's own wall
      clock rather than the calendar gap before a repair, are new logic on top of those verified primitives
      and have not themselves been run against a live workspace.
    healthy: 'status = OK - slowdown_ratio below :warn_slowdown_ratio (this includes a job that got FASTER:
      ratio < 1) with enough successful runs judged on both sides.'
    investigate_if: 'CRITICAL - slowdown_ratio at/above :crit_slowdown_ratio: the job''s recent runs are
      taking meaningfully longer than its own earlier runs in the same window. WARN - at/above :warn_slowdown_ratio.
      NOT_ASSESSED - fewer than :min_runs_each_side successful runs on the recent side, the baseline side,
      or both: read not_assessed_reason; comparing two measured periods is fine, but not on too few runs
      to mean anything.'
    actions:
    - open the job's recent runs and compare input volume against an older one - a bigger input is the
      single most common cause (free);
    - if the input did not change, check whether the job's cluster changed (a smaller node type, fewer
      workers, a different pool) - lakeflow_job_compute_pressure names memory/CPU/skew pressure on the
      same job (config);
    - if the job is genuinely processing more data than before, scale the job cluster up or out to match
      (spend).
    next:
    - query_id: lakeflow_job_reliability
      if: a job can be slow and still succeed every time, or be both slow and flaky
    - query_id: lakeflow_job_compute_pressure
      if: for why - memory, CPU, skew
    - query_id: lakeflow_long_running_runs
      if: for the individual runs behind a slow median
    - query_id: lakeflow_retries_repairs
      if: a repair adds attempts, not duration, to this query's own numbers - but still costs DBUs
    caveats: 'Only runs whose FINAL attempt is SUCCEEDED contribute a duration - a run that failed outright,
      or that a repair never rescued, is excluded entirely from both medians, the same "successful runs
      only" choice lakeflow_long_running_runs''s own job-median baseline makes. SLICING - system.lakeflow.job_run_timeline
      splits a run past roughly an hour into hourly rows, and only the LAST row of an attempt carries
      result_state (lakeflow_long_running_runs documents this too); this query therefore pools an attempt''s
      OWN rows first (every row from after the previous attempt''s end, or the run''s own start, up to
      and including this attempt''s end row) into one true wall-clock span before measuring it, rather
      than reading only the final row''s own short start-to-end - a run that grew from 2h to 5h now reads
      as 5h, not as its own last <=1h slice. A repaired/retried run (more than one attempt sharing run_id,
      the same visibility caveat lakeflow_retries_repairs documents) is measured on its LAST attempt''s
      OWN pooled wall clock (that attempt''s own true start to its own end row), never the calendar time
      from the run''s first attempt to its last - an earlier failed attempt''s duration, and the human
      time before someone clicked repair, would otherwise inflate "how long the job took" with time the
      job itself was not running; this is the opposite choice from lakeflow_long_running_runs, which pools
      EVERY attempt row of a run_id into one MIN/MAX wall clock and is measuring "how long did this run_id
      occupy", a different question. A run whose final attempt''s own first slice started before :period_days
      ago (so the window bound in all_rows drops it) is measured short - keep :period_days comfortably
      wider than the longest run you expect, the same advice lakeflow_long_running_runs gives. run_duration_seconds
      is read the same way lakeflow_long_running_runs reads it: NULLIF(run_duration_seconds, 0) (Databricks
      documents it, like its four duration siblings, as populated only for legacy single-task jobs and
      logged as a literal 0 - never NULL - for every multi-task job, and only on an attempt''s own end
      row), falling back to timestampdiff(SECOND, ...) of that same pooled attempt span when the column
      reads 0 or the job is multi-task; both medians are therefore a lower bound wherever that fallback
      was used. RECENT VS BASELINE - the recent slice is period_start_time >= (today - LEAST(:recent_days,
      FLOOR(:period_days / 2))); the baseline slice is the rest of the window. The FLOOR cap means the
      recent slice is never more than half the chosen window, so the baseline side is never empty by construction
      - at the app''s shortest offered window (7 days, where :recent_days''s own default of 7 would otherwise
      cover the whole thing), the effective split is 3 recent days against 4 baseline days; at 30 or 90
      it stays the full 7-day default recent slice, since 7 is already <= half of those windows. A job
      whose ACTUAL runs are all newer than the baseline cutoff (a job that simply has not been running
      long) still, correctly, reads NOT_ASSESSED (too_few_baseline_runs) - the cap fixes the split being
      empty by construction, not a genuinely short history. A run is bucketed by its OWN final attempt''s
      pooled start. DEC-62 is why the split works this way at all - both medians are measured inside the
      window the user picked, never one projected or scaled from the other. job_id is unique only within
      a workspace, so grouping is on (workspace_id, job_id). job_name comes from system.lakeflow.jobs
      (SCD2, latest row, deleted jobs kept) and is NULL for one-time SUBMIT_RUN / WORKFLOW_RUN executions.
      On a partial snapshot the baseline side (the older half of the window) is the one most likely to
      be thin - the generic window_coverage marker (DEC-64) is the account-wide signal to check first.
      There are no dollars here - durations are not a billing unit; a job that is also costing more is
      lakeflow_failed_jobs_wasted_dbus / lakeflow_retries_repairs''s question, not this one''s. PHASE
      COLUMNS (T12) - queue_duration_seconds/setup_duration_seconds/execution_duration_seconds are, per
      Databricks'' own documentation, populated only for legacy single-task jobs and log a literal 0 (never
      NULL) on every multi-task job''s run-level row, on the run''s own end row only - read the same way
      run_duration_seconds itself is (NULLIF(..., 0), "0 = not reported"), pooled across a repaired run''s
      own attempts the same way duration_s is. A multi-task job therefore reads every one of these six
      columns and grew_most as NULL, never a false 0. grew_most compares the RECENT-over-BASELINE ratio
      of (queue+setup) against that of execution alone (each phase COALESCEd to 0 before summing, so one
      missing phase does not null out the other''s own real reading) - it names a side only when that
      side''s own ratio is above 1 (it actually grew) AND is the larger of the two; NULL when neither
      side grew, or neither is measurable.'
    sql_url: app/queries/app/jobs_pipelines/lakeflow_job_duration_regression.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 WHEN 'NOT_ASSESSED' THEN 2 ELSE 3
      END, slowdown_ratio DESC, workspace_id, job_id
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - job_id
- name: f_lakeflow_job_oversized
  description: 'One row = one job with at least one task run starting in the window: pooled worker CPU
    p90, memory p90 and their peaks, plus the peak swap, across every job-cluster run''s deduplicated
    node-minutes (the same telemetry lakeflow_job_compute_pressure builds), the busiest run''s cluster
    node type and its workers configured vs seen, and the job''s own compute dollars at list price over
    the window (the same DEC-66.1 join lakeflow_job_cost_summary uses). oversized is TRUE when CPU p90
    and memory PEAK sit under their thresholds and no worker ever swapped (:oversized_swap_pct), on a
    job that is not single-node and has at least :min_runs runs with telemetry. est_saving_usd_list is
    a rough, MEASURED-utilisation estimate - a fraction of the job''s own list-priced dollars, never a
    forecast of what a resize would actually save (see caveats). suggested_action names the lever. Rows
    are capped inside every window_days block by the body''s LIMIT :top_n (default 100000, threshold ''top_n'').'
  meta:
    query_id: lakeflow_job_oversized
    title: Jobs on bigger machines than they need - the opposite of lakeflow_job_compute_pressure
    domain: jobs_pipelines
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - compute_scope_gap
    - retention_window
    - no_activity
    - ingestion_lag
    reads:
    - system.lakeflow.job_task_run_timeline
    - system.compute.node_timeline
    - system.compute.clusters
    - system.compute.node_types
    - system.lakeflow.jobs
    - system.billing.usage
    - system.billing.list_prices
    requires: 'SELECT on system.lakeflow, system.compute AND system.billing; GA. SCOPE LIMIT: node_timeline
      holds classic all-purpose, job, Lakeflow pipeline and pipeline-maintenance compute ONLY, so a job
      whose tasks ran on serverless or a SQL warehouse has no hardware profile and comes back NOT_ASSESSED
      with a named reason, never as "not oversized"'
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days - the telemetry side is capped in-SQL at LEAST(:period_days, 90)
        by node_timeline retention, the cost side is not (see caveats)
    - name: min_runs
      default: 3
      meaning: minimum job-cluster runs carrying node telemetry pooled over the whole job before it is
        judged (fewer -> NOT_ASSESSED)
    - name: oversized_cpu_pct
      default: 30
      meaning: worker CPU p90 percent below which the job's CPU is judged oversized
    - name: oversized_mem_pct
      default: 40
      meaning: worker memory PEAK percent below which the job's memory is judged oversized
    - name: oversized_swap_pct
      default: 1
      meaning: worker swap peak percent at/above which the job counts as swapping and is never oversized
        - set above 0 so background swap noise doesn't block it
    - name: warn_saving_usd
      default: 25
      meaning: estimated saving in the window at/above which a job flags WARN
    - name: crit_saving_usd
      default: 200
      meaning: the same at/above which a job flags CRITICAL
    - name: top_n
      default: 100000
      meaning: row cap - far above any account's job count, because this is a verdict per job and a cut
        row would read as "not flagged"
    confidence: needs_confirmation
    confidence_note: 'Reuses the exact node-timeline telemetry (worker CPU/memory percentiles, node type,
      workers configured vs seen, the dedup and single-node rules) lakeflow_job_compute_pressure and task_cluster_utilization
      already carry, and the exact per-run/per-job effective-list-price DBU join (DEC-66.1) lakeflow_job_run_cost
      / lakeflow_job_cost_summary already carry, but this query has not itself been run against a live
      workspace. Confirm on your account: 1) a job you know runs on a fixed-size or lightly-loaded job
      cluster shows a plausible worker_cpu_p90_pct / worker_mem_p90_pct here; 2) job_list_cost_usd is
      close to that same job''s own total in lakeflow_job_cost_summary for the same window (see caveats
      for why the two can legitimately differ); 3) a serverless-only job shows NOT_ASSESSED with no_cluster_recorded
      rather than an error.'
    healthy: oversized = FALSE (including every single-node job, which this check never sizes down), or
      oversized = TRUE with est_saving_usd_list under :warn_saving_usd - field heuristic, every threshold
      is a header param.
    investigate_if: 'oversized = TRUE with est_saving_usd_list at/above :warn_saving_usd (WARN) or :crit_saving_usd
      (CRITICAL) in the window. NOT_ASSESSED is not a pass: read not_assessed_reason.'
    actions:
    - suggested_action = 'one node size down' - move worker_node_type to the next smaller size in the
      same family; a node one size down roughly halves cores and memory, which is what the est_saving_usd_list
      x0.5 case assumes (config);
    - suggested_action = 'fewer workers / lower autoscale max' - the job already runs fewer workers than
      its configured ceiling, so lower max_autoscale_workers (or the fixed worker count) to match what
      it actually uses, before touching the node type (config);
    - confirm on a quiet run first - a job that is oversized most of the time can still spike on an unusual
      input; read runs_with_telemetry with worker_mem_peak_pct / worker_cpu_peak_pct before resizing,
      and watch the next few runs after a change (free).
    next:
    - query_id: lakeflow_job_compute_pressure
      if: the opposite check - is this job UNDER-sized
    - query_id: lakeflow_job_cost_summary
      if: the job's per-run cost detail behind job_list_cost_usd
    - query_id: task_cluster_utilization
      if: per-run telemetry for any one run over two hours
    - query_id: classic_clusters_config_current
      if: the cluster's current configuration
    caveats: 'SCOPE - identical to lakeflow_job_compute_pressure: system.compute.node_timeline records
      classic all-purpose, job, Lakeflow pipeline and pipeline-maintenance compute only (cluster_source
      UI / API / JOB / PIPELINE / PIPELINE_MAINTENANCE), never serverless or SQL warehouses, so a job
      with no classic telemetry is NOT_ASSESSED (no_cluster_recorded / no_node_timeline_rows), not "not
      oversized". POOLING - every run of the job in the window is pooled before the p90s are taken (dedup:
      parallel tasks of one run sharing one cluster count each node-minute once), exactly as lakeflow_job_compute_pressure
      pools; a job that is genuinely oversized most weeks but spikes once can still average under the
      thresholds - read runs_with_telemetry, this is a pooled verdict, not a per-run one. PEAK AND SWAP
      - memory is judged on its highest minute, not p90, because a smaller node that cannot hold the busiest
      minute spills or fails; one size down roughly halves memory, so a peak under 40% stays under about
      80% after the change. CPU stays on p90: a CPU peak only slows a run. node_timeline rows are one-minute
      averages, so a spike of a few seconds can still be missed. Spill is not in the system tables for
      job clusters; worker swap (mem_swap_percent at/above :oversized_swap_pct) is the early sign used
      instead, and a job that swapped is never oversized. SINGLE-NODE jobs (no worker minutes at all)
      are judged (single_node = TRUE, worker_cpu_p90_pct / worker_mem_p90_pct are then NULL, both driver-only
      numbers) but are NEVER oversized here: the lever this check names is a smaller WORKER node type
      or fewer workers, neither of which applies to a one-node cluster the same way. REFERENCE CLUSTER
      - worker_node_type, worker_cores, worker_memory_gb and cluster_source describe latest_cluster_id
      (the classic cluster - one this query actually has node telemetry for - of the latest-starting task
      run); workers_configured_max and worker_nodes_seen_max instead describe the job''s BUSIEST run and
      cluster (most workers running at once; ties: latest run, then cluster_id), which can be a different
      cluster on a job that used more than one - suggested_action is decided from that busiest pair. SAVING
      ESTIMATE - est_saving_usd_list is job_list_cost_usd (the job''s own list-priced compute dollars
      over the window) times 0.5 when CPU p90 and memory peak both sit under half their thresholds (a
      node one size down roughly halves both cores and memory, so the whole job cluster''s dollars roughly
      halve too), else times 0.25 for a lighter, still-real margin; it is a rough estimate from MEASURED
      utilisation, not a forecast of what resizing would actually save - actual savings depend on the
      node family''s real size steps, on whether other jobs share the same cluster, and on whether the
      input volume stays the same. A NULL job_list_cost_usd (no cost usage matched, see PRICE below) leaves
      est_saving_usd_list NULL too rather than a fabricated number, and such a row reads OK on the dollar
      bands (a NULL never meets a dollar band) although oversized may still be TRUE - read oversized itself,
      not only status, before deciding nothing is there. PRICE - job_list_cost_usd and price_basis reuse
      lakeflow_job_run_cost / lakeflow_job_cost_summary''s own run_usage CTE unchanged (usage_metadata.job_id/job_run_id,
      DEC-66.1 effective-list price, SUM(usage_quantity * list_rate)) rolled up to the job: an estimate
      at list price, never a negotiated or billed dollar, and, per that query''s own attribution caveat,
      EXCLUDING any job_id-attributed usage row with no job_run_id - so job_list_cost_usd can be LESS
      than this same job''s whole-window total in cost_by_job. price_basis is left NULL (not defaulted
      to ''priced'') when the job''s runs matched NO system.billing.usage row carrying both ids in the
      window - genuinely no cost data joined, never read as a real $0; ''free'' is a real $0 (every matched
      SKU was FREE_USAGE), ''unpriced'' means at least one matched SKU had no list_prices row (job_list_cost_usd
      then understates the job). WINDOW MISMATCH - the CPU/memory telemetry is judged over at most the
      last 90 days (node_timeline retention, the same LEAST(:period_days, 90) cap lakeflow_job_compute_pressure
      uses), while job_list_cost_usd is priced over the FULL :period_days (system.billing.usage has its
      own, much longer retention); with :period_days over 90 the judged runs are a recent subset of what
      job_list_cost_usd bills, so est_saving_usd_list can then overstate what a smaller node type would
      actually have saved across the whole priced window - keep :period_days at or under 90 to avoid this.
      No identities are emitted, and there is no forecast anywhere in this query: every number is measured
      over runs that already happened. :top_n orders worst (highest est_saving_usd_list) first, so a cut
      row is always the smallest saving, never the one you most needed to see.'
    sql_url: app/queries/app/jobs_pipelines/lakeflow_job_oversized.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 WHEN 'NOT_ASSESSED' THEN 2 ELSE 3
      END, est_saving_usd_list DESC NULLS LAST, workspace_id, job_id
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - job_id
- name: f_lakeflow_job_ownership_orphans
  description: One row = a job. creator_user_name/run_as_user_name are this job's owner and run-as identity
    (masked - see caveats); run_as_kind reads them as SERVICE_PRINCIPAL or HUMAN. is_scheduled is true
    when the job also runs on a schedule or other automatic trigger and is not paused - not only on demand.
    principal_missing is true when the job recorded one identity but the other is gone - not simply never-recorded
    (that is identity_not_recorded, shown for context and never scored). identity_redacted is true when
    a FedRAMP/redacted workspace masked an identity - not a missing principal.
  meta:
    query_id: lakeflow_job_ownership_orphans
    title: Jobs running as a human identity, and jobs whose owner or run-as principal is missing
    domain: jobs_pipelines
    tier: standard
    stars: false
    origin: vendored
    windowed: false
    is_finding: true
    empty_if:
    - schema_not_enabled
    - submit_run_skipped
    reads:
    - system.lakeflow.jobs
    - system.access.workspaces_latest
    requires: SELECT on system.lakeflow AND on system.access (the latter only for the workspace_name column
      - see caveats to drop it); GA (system.lakeflow.jobs is generally available; creator_user_name/run_as_user_name/trigger_type/paused
      are not populated for rows emitted before early December 2025)
    params: []
    confidence: needs_confirmation
    confidence_note: creator_user_name, run_as_user_name, trigger_type and paused are not populated for
      rows emitted before early December 2025, and jobs is SCD2 (one row per change) - an untouched job
      can still carry a fully-unpopulated latest row on an otherwise-current account. A job with NEITHER
      identity recorded reads NOT_ASSESSED (identity_not_recorded), never a scored missing principal;
      only a job that recorded one identity but is now missing the other reads principal_missing. FedRAMP/redacted
      workspaces emit '__REDACTED__' for masked identities; a redacted identity is normalized to NULL
      before judging and is excluded from principal_missing, so a masking policy never misreads as a missing/deleted
      principal. Whether a run-as identity is a service principal is inferred from its shape (an application-id
      UUID, the same heuristic access_runas_escalation.sql uses for run_by/run_as) - there is no principal-type
      column on this table to confirm it against.
    healthy: run_as_kind = SERVICE_PRINCIPAL and principal_missing is false - field heuristic.
    investigate_if: 'status = CRITICAL - the job runs as a human identity (run_as_kind = HUMAN) AND is_scheduled
      - the worse pattern, since it breaks the moment that person leaves or loses access and runs every
      scheduled action under one person''s privileges; status = WARN - the job runs as a human on demand
      only, or principal_missing is true - field heuristic; this is a governance posture signal, not a
      cost figure. NOT_ASSESSED is not a pass: identity_not_recorded is true - neither identity is populated
      for this job''s row yet.'
    actions:
    - move a flagged job - especially a scheduled one - onto a service principal run-as (free/config);
    - for principal_missing, confirm whether the missing owner or run-as was removed from the account
      - a deleted principal is visible here only when the table drops its name, not when its UUID/name
      simply stays on the job row - and re-set run_as explicitly (config);
    - require run_as to be set explicitly to a service principal in your job-creation template (config);
    - n/a - this finding does not itself justify new spend.
    next:
    - query_id: lakeflow_health_rule_coverage
      if: for the related governance-coverage picture
    - query_id: lakeflow_stale_zombie_jobs
      if: orphaned jobs are often also stale
    caveats: 'creator_user_name, run_as_user_name, trigger_type and paused are not populated for rows
      emitted before early December 2025, so on a short-history account - or simply an untouched job,
      since jobs is SCD2 and writes a new row only when a job changes - they are NULL on the latest row;
      such a job reads identity_not_recorded = true and status = NOT_ASSESSED rather than a false-clean
      OK. A job that recorded only one identity (the other NULL) reads principal_missing = true instead,
      since that is a recorded gap, not an unpopulated column. A deleted principal is visible only when
      the table drops its name (principal_missing); a deleted user or service principal whose name or
      UUID is still on the job row is not detected - there is no principals source until the SCIM collector
      (T-44, DEC-56). FedRAMP/redacted workspaces emit ''__REDACTED__'', which is likewise normalized
      to NULL before anything is judged, and identity_redacted is set instead of principal_missing, so
      a masking policy never misreads as a missing/deleted principal. A run-as identity is judged SERVICE_PRINCIPAL
      when it matches an application-id UUID shape and HUMAN otherwise - Databricks convention, not a
      column this table carries to confirm it against, so an unusually-named human account or a non-UUID-shaped
      service principal on your account would be misread; confirm a sample. jobs is SCD2 (one row per
      change); this takes the latest row per (workspace_id, job_id) by change_time, then excludes delete_time
      IS NOT NULL rows (must dedupe change-history before counting, or jobs inflate). job_id is unique
      only within a workspace, so the partition includes workspace_id. trigger_type IS NOT NULL AND NOT
      paused marks a job that runs on a schedule or another automatic trigger (PERIODIC, FILE_ARRIVAL,
      TABLE, CONTINUOUS, ...) and is not currently paused, rather than only on demand or paused; a job
      whose creator and run-as are the same human is no longer read as healthy by itself - a human running
      their own job, especially a scheduled production one, is exactly the pattern this check flags, and
      a human creator handing run-as to a service principal is exactly the pattern it treats as healthy.
      IDENTITY MASKING (DEC-66.3): creator_user_name/run_as_user_name are masked to "<id> <first 2 chars>***"
      the same way every other vendored finding masks a human identity - a GUID or NULL/''__REDACTED__''
      passes through unchanged; masking itself is optional (config/settings.yml''s privacy.mask_user_identities,
      off by default). This is a governance posture signal, not a cost figure. system.lakeflow.jobs is
      a definition table that one-time SUBMIT_RUN/WORKFLOW_RUN executions skip entirely, so jobs run only
      via submit/workflow runs never appear here and are invisible to this ownership assessment. workspace_name
      comes from system.access.workspaces_latest, a DIFFERENT system schema: if system.access is not enabled
      or you cannot read it, this query ERRORS rather than degrading, so drop the workspace_name column
      and its LEFT JOIN (two lines) and resolve ids with cost_workspace_names separately.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/jobs_pipelines/lakeflow_job_ownership_orphans.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 WHEN 'NOT_ASSESSED' THEN 2 ELSE 3
      END, j.workspace_id, j.job_id
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - job_id
- name: f_lakeflow_job_queue_time
  description: One row = a job in the window. The column that matters is queue_s_p95 - the 95th-percentile
    seconds a run waited before starting; queue_s_total is the sum across all its runs. Consistently high
    p95 on the same job means it is waiting on capacity, not a one-off traffic spike.
  meta:
    query_id: lakeflow_job_queue_time
    title: Job queue time by workspace and job
    domain: jobs_pipelines
    tier: standard
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    reads:
    - system.lakeflow.job_run_timeline
    requires: SELECT on system.lakeflow; GA (queue_duration_seconds was added late Nov 2025)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_queue_p95_s
      default: 60
      meaning: 95th-percentile queue seconds that flags WARN
    - name: crit_queue_p95_s
      default: 300
      meaning: that flags CRITICAL
    confidence: needs_confirmation
    confidence_note: queue_duration_seconds is not populated before late Nov 2025, so on a short-history
      account it is NULL for every run; runs_queue_null exposes that so this query degrades instead of
      reading NULL as zero queue time. Per Databricks' own documentation, queue_duration_seconds (like
      the other four *_duration_seconds columns on this table) is populated only for LEGACY SINGLE-TASK
      jobs; every multi-task job logs a literal 0 in it (never NULL). run_duration_seconds is documented
      with the same legacy-single-task-only scope, so it is 0 on the exact same multi-task rows - this
      query reads queue_duration_seconds only where run_duration_seconds > 0, so a genuine 0-second queue
      on a legacy single-task job is kept as a real 0, and a multi-task row's 0 is folded to "not reported"
      instead - see caveats.
    healthy: queue_s_p95 below :warn_queue_p95_s seconds - field heuristic; tune :warn_queue_p95_s for
      your account.
    investigate_if: queue_s_p95 at/above :warn_queue_p95_s (WARN) or :crit_queue_p95_s (CRITICAL) seconds
      - field heuristic; also check runs_queue_null before trusting a "0" queue time on a short-history
      account.
    actions:
    - stagger the job's schedule off the top of the hour and away from other jobs sharing the same warehouse
      (free);
    - move the job onto its own job cluster or a warehouse with autoscaling headroom (config);
    - add cluster capacity or move to serverless so runs stop queuing behind each other (spend).
    next:
    - query_id: lakeflow_phase_cold_start
      if: for the full setup/queue/execution/cleanup breakdown
    - query_id: lakeflow_stale_zombie_jobs
      if: the job turns out to rarely run, queuing may not be worth fixing
    caveats: 'queue_duration_seconds is not populated before late Nov 2025, so on a short-history account
      it is NULL for every run. Databricks documents that this column (and its four siblings on job_run_timeline,
      including run_duration_seconds itself) is populated only for legacy SINGLE-TASK jobs; every MULTI-TASK
      job''s run-level row logs a literal 0, not NULL, in ALL of them together - so run_duration_seconds
      > 0 tells a legacy single-task run apart from a multi-task run ROW BY ROW. This query reads queue_duration_seconds
      only on rows where run_duration_seconds > 0 (`CASE WHEN run_duration_seconds > 0 THEN queue_duration_seconds
      END`, not a blind NULLIF(queue_duration_seconds, 0)): a genuine 0-second queue on a legacy single-task
      job is kept as a real 0 and banded as OK, while a multi-task row''s 0 is excluded as "not reported",
      the same convention lakeflow_long_running_runs already uses for its own wall-clock fallback and
      lakeflow_phase_cold_start now uses for its four phase columns. runs_queue_null counts a row as null
      when EITHER run_duration_seconds is not > 0 (multi-task, or no real wall-clock time) OR queue_duration_seconds
      itself is NULL (column not yet populated on a legacy job), so a fully-degraded column still reads
      "not assessed - column not yet populated / not reported for multi-task jobs" rather than zero queue
      time. A job with no run in the window reporting run_duration_seconds > 0 has nothing to band on
      at all and reads NOT_ASSESSED. queue_duration_seconds lives ONLY on job_run_timeline, not on job_task_run_timeline.
      It is populated only in the run''s end row (runs over 1h are sliced hourly), so this filters to
      result_state IS NOT NULL. job_id is unique only within a workspace, so all per-job grouping is on
      (workspace_id, job_id). PERCENTILE takes a fraction in [0,1]; 0.95 is correct here. There are no
      dollars: queue seconds are not a billing unit, and Databricks publishes no DBU-to-dollar rate.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/jobs_pipelines/lakeflow_job_queue_time.sql
    order_by: queue_s_p95 DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - job_id
- name: f_lakeflow_job_recent_runs
  description: One row = one job run, capped to each job's :runs_per_job most recent runs by run_start.
    This is a drill-down, not a finding - no status/WARN/CRITICAL band. The columns that matter are run_minutes,
    result_state/termination_code (the run's final outcome), attempts (how many times it was tried, repairs
    included), failing_task_keys (which task inside the run actually failed, when known), net_dbus/net_list_cost
    (the run's own discounted-at-list cost) and sql_error_sample (the de-identified error text of a failed
    SQL task, when the run had one).
  meta:
    query_id: lakeflow_job_recent_runs
    title: Last N runs per job - start, duration, result, failing task and cost
    domain: jobs_pipelines
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: false
    empty_if:
    - schema_not_enabled
    - no_activity
    reads:
    - system.lakeflow.job_run_timeline
    - system.lakeflow.job_task_run_timeline
    - system.lakeflow.jobs
    - system.access.workspaces_latest
    - system.billing.usage
    - system.billing.list_prices
    - system.query.history
    requires: SELECT on system.lakeflow, system.billing, system.query AND on system.access (the latter
      only for the workspace_name column - see caveats to drop it); GA (system.lakeflow.job_run_timeline/job_task_run_timeline/jobs
      and system.billing are generally available; system.query.history is Public Preview)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days, by run_start
    - name: runs_per_job
      default: 10
      meaning: how many of each job's most recent runs to keep
    confidence: needs_confirmation
    confidence_note: The job_run_timeline shape (period_start_time/period_end_time slicing, result_state
      populated only on an end row) is the same one lakeflow_job_run_cost and lakeflow_job_reliability
      already confirm against a live workspace, and this query's own result_state/termination_code/run_start
      reads follow lakeflow_job_run_cost's own verified end-row convention (see caveats). The per-run
      cost join (usage_metadata.job_id/job_run_id, DEC-66.1) is lakeflow_job_run_cost's own, unchanged.
      sql_error_sample (query_source.job_info.job_run_id, the de-value pattern) is new and has not itself
      been run against a live account - confirm it returns a plausible error shape for a run you know
      failed on a SQL task.
    healthy: n/a - inventory (a run-history drill-down for the Jobs run panel, not a scored check)
    investigate_if: n/a - inventory; result_state IN ('FAILED','ERROR','TIMED_OUT') is a failed run -
      read failing_task_keys, sql_error_sample and termination_code for the cause
    actions: []
    next:
    - query_id: lakeflow_failed_runs
      if: the account-wide failed-run rollup this feeds
    - query_id: lakeflow_job_run_cost
      if: the account-wide per-run cost rollup this reuses
    - query_id: lakeflow_retries_repairs
      if: a run kept retrying
    caveats: 'Grain is one row per (workspace_id, job_id, run_id); job_id is unique only within a workspace,
      so every join here is on (workspace_id, job_id). ranked, capped to :runs_per_job most recent runs
      BY run_start per job - a job with more runs in the window than :runs_per_job shows only its newest
      ones; raise :runs_per_job if you need deeper history. run_start is the run''s TRUE first observed
      slice - MIN(period_start_time) across every row of the run_id, whichever attempt it belongs to (a
      run over ~1h is sliced hourly, only the end row carries result_state). RESULT/TERMINATION/ATTEMPTS
      - unlike lakeflow_job_reliability''s own daily aggregate, there is no incomplete-current-day cutoff
      here: a run whose only end row landed today is still a real, finished run, not "still running" (result_state
      IS NOT NULL keeps end rows only). result_state/termination_code come from the run''s LAST end row
      only (highest period_end_time), never MAX(result_state)/MAX(termination_code) - comparing attempts''
      text alphabetically would pair an earlier attempt''s TIMED_OUT ahead of a later SUCCEEDED; a repaired
      run shows only its final outcome, not "TIMED_OUT -- SUCCEEDED". attempts is the count of end rows
      for the run_id (a repaired run took more than one). in_flight is true (and run_end/result_state/termination_code/attempts
      are NULL) when the run has no end row of its own yet in this snapshot at all - genuinely still running;
      run_minutes then covers only the time observed so far, through the current moment, not the run''s
      eventual total - run_duration_is_lower_bound is true whenever run_duration_seconds itself was never
      populated on the run''s own end row (read before that column existed, or the run is still in_flight),
      so run_minutes was computed from wall-clock period timestamps instead and may run short if a slice''s
      own period_end_time understates true end time. failing_task_keys/failing_task_termination_code come
      from system.lakeflow.job_task_run_timeline end rows in FAILED/ERROR/TIMED_OUT for the SAME run_id
      in the window; both are NULL when the run did not fail, or when it failed but no task-level breakdown
      exists for it yet (a submit/workflow run, or a gap before task-level timeline was populated) - NULL
      here is never proof the run succeeded, only that no failing task was found. COST - net_dbus/net_list_cost
      are this run''s own share, from the exact per-run attribution and effective-list price join lakeflow_job_run_cost
      uses (usage_metadata.job_id/job_run_id, DEC-66.1, usage_unit matched), priced over the SAME :period_days
      window; NULL (never 0) when no billed usage row carries this run''s ids - an hourly or otherwise
      very short job can genuinely show NULL here if its billing has not landed or its DBUs rounded to
      nothing. sql_error_sample is the de-valued (emails and string literals stripped, same pattern query_failed_queries_daily
      uses) error text of this run''s FAILED system.query.history statements (query_source.job_info.job_run_id
      = this run_id); NULL for a run with no SQL task, a run that did not fail on SQL, or one whose statements
      have not landed yet. job_name comes from system.lakeflow.jobs (SCD2, latest row by change_time,
      deleted jobs kept) and is NULL for one-time SUBMIT_RUN / WORKFLOW_RUN executions, which never write
      to that table. workspace_name comes from system.access.workspaces_latest, a DIFFERENT system schema:
      if system.access is not enabled or you cannot read it, this query ERRORS rather than degrading,
      so drop the workspace_name column and its LEFT JOIN (one line) and resolve ids with cost_workspace_names
      separately. No identities are emitted (sql_error_sample is de-valued at source), so nothing here
      needs masking.'
    sql_url: app/queries/app/jobs_pipelines/lakeflow_job_recent_runs.sql
    order_by: r.workspace_id, r.job_id, r.run_start DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - job_id
        - run_id
- name: f_lakeflow_job_reliability
  description: One row = one job with at least one completed run (an end row) in the window. runs is the
    job's distinct run count - a retried run counts once, on its FINAL attempt's outcome. The columns
    that matter are consecutive_failures (is the job broken right now), failure_rate_pct (is the job flaky
    over the whole window), and last_n_summary (a plain-words readout of the same last :last_n_runs runs
    last_n_runs_considered/last_n_failed give as numbers). status folds all three into one band; read
    investigate_if for the precedence. suggested_timeout_minutes is a concrete timeout to set (2x the
    job's own p95 successful-run duration, never below its longest successful run), NULL until the job
    has 5+ successful runs to measure it from.
  meta:
    query_id: lakeflow_job_reliability
    title: 'Per job: failure rate over the window and whether it is failing right now'
    domain: jobs_pipelines
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - no_activity
    reads:
    - system.lakeflow.job_run_timeline
    - system.lakeflow.jobs
    requires: SELECT on system.lakeflow; GA (system.lakeflow.job_run_timeline and system.lakeflow.jobs
      are generally available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: last_n_runs
      default: 10
      meaning: how many of the job's most recent runs make up the "last N runs" summary
    - name: min_runs
      default: 5
      meaning: minimum distinct runs in the window before a failure rate is judged (below -> NOT_ASSESSED,
        unless the CRITICAL streak rule already fired)
    - name: warn_failure_rate_pct
      default: 20
      meaning: failure rate percent (0-100) at/above which WARN, when there are at least :min_runs runs
    - name: crit_consecutive_failures
      default: 3
      meaning: consecutive failed runs, counting back from the very latest run, at/above which CRITICAL
        regardless of :min_runs
    confidence: needs_confirmation
    confidence_note: Built on the exact end-row and attempt-row conventions lakeflow_failed_runs and lakeflow_retries_repairs
      already verified against a live workspace (period_end_time < date_trunc('DAY', now) drops the incomplete
      current day, result_state IS NOT NULL keeps end rows only, multiple non-NULL-result_state rows sharing
      one run_id are repair/retry attempts); the failed-result_state set (FAILED, ERROR, TIMED_OUT) is
      lakeflow_failed_runs's own verified filter. The consecutive-failure streak and the last-N-runs summary
      are new derived logic on top of those verified primitives and have not themselves been run against
      a live workspace.
    healthy: status = OK - at least :min_runs runs in the window, failure_rate_pct below :warn_failure_rate_pct,
      and the job is not on a failure streak at/above :crit_consecutive_failures; fewer runs than that
      reads NOT_ASSESSED (too_few_runs), never OK.
    investigate_if: 'CRITICAL - consecutive_failures at/above :crit_consecutive_failures: the job''s most
      recent runs failed back-to-back and it is very likely broken right now - read latest_termination_code
      first. WARN - failure_rate_pct at/above :warn_failure_rate_pct with at least :min_runs runs: the
      job is flaky rather than currently broken. NOT_ASSESSED - fewer than :min_runs runs in the window
      and no live failure streak: read not_assessed_reason.'
    actions:
    - open the latest failed run and read its own error, not an older one - latest_termination_code names
      the code (free);
    - fix the root cause, or tune the job's retry/backoff policy so a transient failure stops repeating
      - runs_with_retry shows how often a repair was already needed (config);
    - if the failures trace back to under-provisioned or misconfigured compute, resize or reconfigure
      the job cluster (spend).
    next:
    - query_id: lakeflow_failed_runs
      if: for the account-wide termination_code breakdown
    - query_id: lakeflow_retries_repairs
      if: for the DBU cost of the repairs this query only counts
    - query_id: lakeflow_termination_taxonomy
      if: for the full termination_code picture
    - query_id: lakeflow_job_duration_regression
      if: a job can be reliable and still be getting slower
    caveats: 'End-row and window handling is identical to lakeflow_failed_runs / lakeflow_retries_repairs:
      period_end_time < date_trunc(''DAY'', current_timestamp()) drops the incomplete current day, and
      result_state IS NOT NULL keeps end rows only. A run retried or repaired writes one end row PER ATTEMPT
      sharing run_id (the same visibility caveat lakeflow_retries_repairs documents); this query dedupes
      every run_id to its LAST attempt (latest period_end_time), so a repaired run counts once, on its
      FINAL outcome - a run that failed then was repaired and succeeded reads as one SUCCEEDED run, never
      as one FAILED and one SUCCEEDED, and attempt_rows > 1 on that run is what makes it count toward
      runs_with_retry. Failed is the same three-value set lakeflow_failed_runs uses (FAILED, ERROR, TIMED_OUT);
      SKIPPED / CANCELLED / BLOCKED are not counted as failed for failure_rate_pct - a deliberately skipped
      or cancelled run is not, on its own, a reliability signal - but see consecutive_failures below for
      how the streak treats one sitting between two real failures. run_start (used for both the last-N-runs
      summary and the consecutive-failure streak) is the run''s own TRUE first observed slice - MIN(period_start_time)
      across every row of the run_id, not the end row''s own period_start_time alone (job_run_timeline
      slices a run over ~1h hourly and only the end row carries result_state, so reading the end row alone
      reported the start of its LAST slice, not the run''s true beginning - a run over ~4h showed the
      wrong-by-hours latest_run_start). consecutive_failures counts back from the LATEST run (recency
      rank 1) and stops ONLY at the job''s most recent SUCCEEDED run (or, if it has none in the window,
      counts every failed run there is) - a SKIPPED, CANCELLED or BLOCKED run in between is stepped over,
      never treated as if it broke the streak: FAILED, FAILED, FAILED, CANCELLED (oldest to newest) still
      reads consecutive_failures = 3, because someone killing (or a policy skipping) a hung, already-
      failing job is not the same thing as it recovering. It is computed over every run in the window,
      independent of :last_n_runs and independent of :min_runs - a job with only 3 runs, all 3 failed,
      and the default :crit_consecutive_failures = 3 reads CRITICAL even though 3 is below the default
      :min_runs = 5, because "the job is broken right now" is the more urgent fact (status precedence:
      CRITICAL is checked first, regardless of :min_runs; then NOT_ASSESSED if runs < :min_runs; then
      WARN; else OK - NOT_ASSESSED never means the job is fine). last_n_runs_considered / last_n_failed
      / last_n_summary summarise the job''s most recent :last_n_runs runs (fewer when the job has fewer
      runs than that in the window) - distinct from failure_rate_pct, which is over EVERY run in the window,
      so a job whose failures are all old and whose most recent runs are clean can show a non-trivial
      failure_rate_pct alongside "0 of last N runs failed". job_id is unique only within a workspace,
      so every grouping is on (workspace_id, job_id). job_name comes from system.lakeflow.jobs (SCD2,
      latest row by change_time, deleted jobs kept) and is NULL for one-time SUBMIT_RUN / WORKFLOW_RUN
      executions, which never write to that table. latest_result_state / latest_termination_code describe
      the single latest run''s own final attempt, for context next to consecutive_failures. successful_runs
      counts every SUCCEEDED run, repaired or not; p95_success_minutes / max_success_minutes are narrower
      - SUCCEEDED runs with exactly one attempt only, since a repaired run''s duration_s spans from its
      FIRST (failed) attempt''s start to its final attempt''s end, and folding that in would inflate the
      timeout suggestion by however long the earlier failed attempt(s) ran. suggested_timeout_minutes
      = CEIL(GREATEST(2 x p95_success_minutes, max_success_minutes)) once successful_runs >= 5, else NULL
      - never a number invented from too few runs; it never reads below the longest successful run actually
      observed. There are no dollars here - a failure is not priced; price a failing job with lakeflow_failed_jobs_wasted_dbus.'
    sql_url: app/queries/app/jobs_pipelines/lakeflow_job_reliability.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 WHEN 'NOT_ASSESSED' THEN 2 ELSE 3
      END, s.consecutive_failures DESC, failure_rate_pct DESC, workspace_id, job_id
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - job_id
- name: f_lakeflow_job_run_changes
  description: One row = one (job, attribute) pair, for every job whose LATEST run in the window either
    failed or ran above the job's own 90th-percentile duration. attribute is one of job_definition, runtime_version,
    worker_node_type, worker_count, upstream_tables, input_bytes, queue_s, setup_s, run_s; baseline_value/latest_value
    hold that attribute as of the baseline run and the latest run, and changed says whether they differ.
    baseline_run_id is the job's last SUCCEEDED run before the latest one (the run right before things
    went wrong); baseline_kind is 'prior_success' for those rows. A job with no successful run anywhere
    in the window instead gets ONE row with baseline_kind = 'no_success_in_window' and every other column
    NULL but latest_run_id - the app reads that as "no successful run in this window", never as "nothing
    changed". A job that is not a candidate at all (latest run neither failed nor slow) has no rows here.
    This is a drill-down, not a finding - no status column.
  meta:
    query_id: lakeflow_job_run_changes
    title: What changed since the last good run - compute shape, job edits, upstream tables, input size,
      timing
    domain: jobs_pipelines
    tier: deep
    stars: false
    origin: app
    windowed: true
    is_finding: false
    empty_if:
    - schema_not_enabled
    - no_activity
    reads:
    - system.lakeflow.job_run_timeline
    - system.lakeflow.job_task_run_timeline
    - system.lakeflow.jobs
    - system.compute.clusters
    - system.access.table_lineage
    - system.storage.table_metrics_history
    requires: SELECT on system.lakeflow, system.compute, system.access AND system.storage; GA (system.lakeflow.*,
      system.compute.clusters and system.access.table_lineage are all GA); system.storage.table_metrics_history
      must be enabled for this metastore - if it is not, this query errors rather than degrading (same
      limitation lakeflow_job_recent_runs documents for system.access)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days, by run_start
    confidence: needs_confirmation
    confidence_note: 'The run-start/end-row conventions reuse lakeflow_job_reliability''s own verified
      shape. Everything else here is new and unverified against a live workspace: the SCD2 "row valid
      at the run''s start" as-of join against system.compute.clusters and system.lakeflow.jobs (change_time
      <= run_start, latest wins), system.access.table_lineage keyed on entity_run_id = the job run id
      (rather than entity_metadata.job_info.job_run_id, which the schema also carries), and joining table_lineage''s
      source_table_catalog/schema/name to system.storage.table_metrics_history''s catalog_name/schema_name/table_name
      for a source table''s bytes as of a run''s date. Confirm on your account: 1) entity_run_id on a
      table_lineage row you know came from a job run matches that run''s own run_id, not some other id;
      2) the clusters row picked for a run you know the shape of is the one that was actually in effect
      then, not a later edit; 3) a job with no lineage rows at all (no table read) reads with upstream_tables/input_bytes
      both NULL, not zero.'
    healthy: n/a - drill-down
    investigate_if: n/a - drill-down; a row with changed = true names one concrete thing that is different
      between the last good run and the one that broke or slowed down
    actions: []
    next:
    - query_id: lakeflow_job_reliability
      if: is the job broken right now
    - query_id: lakeflow_job_duration_regression
      if: is the job slower than its own baseline
    - query_id: lakeflow_job_recent_runs
      if: the full run list this drills from
    caveats: CANDIDATES - a job's LATEST run in the window (recency by run_start, dedup to each run's
      final attempt the same way lakeflow_job_reliability does) qualifies when its final result is FAILED/ERROR/TIMED_OUT,
      or its own duration is above the 90th percentile of every one of the job's own completed runs in
      the window - a job with only OK, on-time runs never appears here. BASELINE - the nearest SUCCEEDED
      run strictly older than the latest one; a candidate job with none in the window gets its single
      'no_success_in_window' marker row instead (no comparison is possible - the caller should read that
      as "no successful run in this window", not as "no changes"). DURATIONS - queue_s/setup_s/run_s latest_value
      is the latest run's own reading; baseline_value is instead the MEDIAN of the job's last 5 SUCCEEDED
      runs before the latest one (a more robust reference than any single run) - queue_duration_seconds/setup_duration_seconds/run_duration_seconds
      are populated only for legacy single-task jobs (Databricks' own documentation; a multi-task job
      logs a literal 0, folded here to NULL like every duration query in this file does), so both values,
      and changed, read NULL on a multi-task job. COMPUTE SHAPE - dbr_version/worker_node_type/worker_count
      describe the FIRST recorded compute id of the run's latest-starting task, resolved to the system.compute.clusters
      row that was actually in effect AT the run's own start (the latest SCD2 row with change_time <=
      run_start, not simply the cluster's current shape) - a serverless run, or one whose compute id was
      never recorded, reads every compute-shape attribute NULL. worker_count reads the fixed worker_count
      when the cluster is not autoscaling, or "min-max" when it is; a single-node cluster (worker_count
      = 0, no autoscale) reads "0". JOB_DEFINITION compares the job's own change_time in effect AT each
      run (the latest system.lakeflow.jobs row with change_time <= that run's start) - changed = true
      means a DIFFERENT job version was active for the two runs, not what changed inside it; open the
      job's edit history in Databricks for the detail. UPSTREAM_TABLES/INPUT_BYTES - upstream tables are
      every DISTINCT source_table_full_name system.access.table_lineage records for that run's entity_run_id
      (this run's own read set, not the job's usual one), bounded to event_time within the check's own
      :period_days window like every other source here (never a full-history scan); a run that read nothing
      recorded IN THAT WINDOW reads NULL, never an empty list read as "no upstream". input_bytes sums
      system.storage.table_metrics_history's active_bytes for those same source tables, using each table's
      latest snapshot at/before the run's own date AND within :period_days (a daily snapshot, not a byte
      count at the exact run time) - a source table with no metrics snapshot in that window yet contributes
      nothing to the sum, so input_bytes can understate the true input on a very new table. Every baseline_value/latest_value
      is returned as text so one column can hold every attribute's own type; changed is NULL wherever
      a value on either side could not be measured, never a false "unchanged". job_id is unique only within
      a workspace, so every join here is on (workspace_id, job_id). No identities are emitted, so nothing
      here needs masking. There are no dollars here - price the job's compute with lakeflow_job_cost_summary.
    sql_url: app/queries/app/jobs_pipelines/lakeflow_job_run_changes.sql
    order_by: changed DESC, workspace_id, job_id, CASE attribute WHEN 'job_definition' THEN 0 WHEN 'runtime_version'
      THEN 1 WHEN 'worker_node_type' THEN 2 WHEN 'worker_count' THEN 3 WHEN 'upstream_tables' THEN 4 WHEN
      'input_bytes' THEN 5 WHEN 'queue_s' THEN 6 WHEN 'setup_s' THEN 7 ELSE 8 END
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - job_id
        - attribute
- name: f_lakeflow_job_run_cost
  description: One row = one job run with at least one billed DBU row attributed to it (usage_metadata.job_id
    + job_run_id) in the window. The columns that matter are net_run_dbus and net_list_cost (the run's
    DBUs and its effective-list-price dollar estimate), compute_type (serverless / classic / mixed) and
    run_start / result_state / termination_code from the run's own timeline row. price_basis tells you
    whether a low or $0 net_list_cost is a real free-usage SKU or a pricing-coverage gap. This is the
    per-run detail behind lakeflow_job_cost_summary's per-job roll-up. Rows are capped inside every window_days
    block by the body's LIMIT :top_n (default 100000, threshold 'top_n').
  meta:
    query_id: lakeflow_job_run_cost
    title: DBUs and dollar cost per job run, with start time, result and serverless vs classic
    domain: jobs_pipelines
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: false
    empty_if:
    - schema_not_enabled
    - no_activity
    - ingestion_lag
    reads:
    - system.billing.usage
    - system.billing.list_prices
    - system.lakeflow.job_run_timeline
    - system.lakeflow.jobs
    requires: SELECT on system.billing, system.lakeflow; GA (billing.usage/list_prices and lakeflow.job_run_timeline/jobs
      are generally available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: top_n
      default: 100000
      meaning: row cap - far above any account's run count in a normal window, because a cut row here
        would read as a run that cost nothing rather than one simply not shown
    confidence: needs_confirmation
    confidence_note: 'usage_metadata.job_id, usage_metadata.job_run_id and product_features.is_serverless
      are documented system.billing.usage columns (checked against a live system-catalog schema dump);
      the price join is the exact effective-list join T-69A verified elsewhere in this library (DEC-66.1),
      and the run_start / result_state / termination_code lookup follows lakeflow_long_running_runs''s
      own verified job_run_timeline shape. This exact query has not itself been run against a live workspace.
      Confirm on your account: 1) a job run you know the classic-cluster cost of shows a plausible net_run_dbus/net_list_cost
      here; 2) a run you know executed on serverless job compute reads compute_type = ''serverless'',
      and one you know ran on a dedicated job cluster reads ''classic''; 3) job_run_timeline.run_id for
      that same run lines up with the run_start you see in the Jobs UI.'
    healthy: n/a - inventory
    investigate_if: n/a - inventory
    actions: []
    next:
    - query_id: lakeflow_job_cost_summary
      if: 'for the per-job roll-up this feeds: runs, total, median and max cost per run'
    - query_id: lakeflow_pipeline_cost
      if: the pipeline-side equivalent
    - query_id: lakeflow_failed_jobs_wasted_dbus
      if: result_state is a failure - the job-level wasted-DBU view
    - query_id: lakeflow_jobs_on_all_purpose
      if: compute_type is classic and the job shares an all-purpose cluster
    caveats: 'ATTRIBUTION - usage_metadata.job_id/job_run_id attribute a billed system.billing.usage row
      to the run that was executing when it was recorded; both ids are unique only WITHIN a workspace,
      so every join/group here is on (workspace_id, job_id, job_run_id), never job_run_id alone. Only
      usage rows carrying BOTH job_id AND job_run_id feed this query - a job_id-attributed row with no
      job_run_id (an early-data gap; job_run_id is a newer column than job_id) is excluded here, so net_run_dbus
      summed across every run of a job (see lakeflow_job_cost_summary) can be LESS than that same job''s
      whole-window total in cost_by_job or lakeflow_failed_jobs_wasted_dbus, which key on job_id alone;
      use one of those two for the job''s true whole-window total, this pair for the per-run breakdown.
      usage_metadata.job_id/job_run_id populate for jobs-compute (classic and serverless); they are NULL
      for interactive / SQL-editor usage. SHARED JOB CLUSTERS - a classic job cluster bills DBUs for as
      long as it runs, and system.billing.usage slices that cluster-time into rows Databricks itself tags
      with job_id/job_run_id; when several tasks of the SAME run share one job cluster (the common case),
      every one of them bills under that SAME job_run_id, so their shared DBUs land correctly, undivided,
      on this one row - nothing here is a manual per-task split. NOT ATTRIBUTABLE: (a) a job whose code
      runs on a shared ALL-PURPOSE / interactive cluster instead of a dedicated job cluster - its own
      share is still tagged with job_id/job_run_id and priced here, but the cluster''s other concurrent
      work (interactive users, other jobs) and its idle time between jobs never carries any job_run_id
      and is invisible to this query - see lakeflow_jobs_on_all_purpose for that placement-premium risk
      at the cluster level; (b) a job cluster''s own startup/init span before the first task begins running,
      which Databricks bills to the cluster but is not documented as job_run_id-tagged during that init
      window - a run whose net_run_dbus looks light against its wall-clock duration may be missing that
      startup slice, not genuinely cheap. PRICE - net_list_cost is SUM(usage_quantity * list_prices.pricing.effective_list.default)
      per run (DEC-66.1, the one dollar basis this app uses) - an estimate at that basis, never a negotiated
      or billed dollar (no negotiated-rate source exists anywhere in system.billing), and it is left NULL
      rather than forced to 0 when nothing priced it; price_basis is ''unpriced'' when any non-free-usage
      SKU billed to this run had no matching list_prices row (net_list_cost then understates cost), ''free''
      when every matched SKU is a FREE_USAGE SKU (a real $0), and ''priced'' otherwise. The price window
      is open-interval (price_end_time NULL = currently effective). COMPUTE_TYPE - ''serverless'' when
      every DBU on the run has product_features.is_serverless = TRUE, ''classic'' when none does, ''mixed''
      when both classic and serverless DBUs billed to the same job_run_id (a job whose tasks use different
      compute); product_features is sparse, so a row where is_serverless is NULL counts as classic, same
      as overview_serverless_classic_split. compute_type is NULL in the rare case both the classic and
      serverless DBU totals net to zero or below (e.g. a full retraction), since neither branch of the
      CASE above is then true. TIMELINE - run_start/result_state/termination_code come from system.lakeflow.job_run_timeline,
      read for every run that has usage in run_usage above, with NO window lower bound on the timeline
      side (only runs already inside :period_days on the usage side reach this join, so this never pulls
      in an unrelated run) - a run started well before :period_days still shows its TRUE run_start, even
      when job_run_timeline slices a run over about an hour into multiple hourly rows (the same slicing
      lakeflow_long_running_runs and lakeflow_job_duration_regression document): run_start is MIN(period_start_time)
      across every observed slice of the run, never just the first in-window one. result_state/termination_code
      are read from the run''s LAST end row only (the highest period_end_time among rows where result_state
      IS NOT NULL - the same convention lakeflow_job_reliability uses), never MAX(result_state)/MAX(termination_code):
      a repaired or retried run writes one end row per attempt sharing run_id, and comparing text alphabetically
      (MAX) can read an earlier attempt''s state (TIMED_OUT beats a later SUCCEEDED) or pair one attempt''s
      code with a different attempt''s state; this query instead shows the run''s FINAL attempt''s own
      outcome, matching what the Jobs UI shows for that run. in_flight is NULL when the run has NO job_run_timeline
      row at all (its state is genuinely unknown - ingestion lag or a gap, never read as "running"), TRUE
      when the run has at least one observed slice but its latest slice has not yet produced an end row
      (still executing, including a repair attempt still running after an earlier attempt already failed),
      and FALSE once a final end row has landed; result_state and termination_code are NULL whenever in_flight
      is TRUE or NULL. Its cost is still governed by the usage side''s own usage_date < current_date()
      rule, so an in-flight run''s net_run_dbus/net_list_cost reflect only its billed usage through yesterday.
      job_name comes from system.lakeflow.jobs (SCD2, latest row by change_time, deleted jobs kept) and
