      no_timeout = true. Any other metric/operator (or an empty/NULL health_rules) does not count, since
      it does not bound the run''s own duration. timeout_seconds is not populated before early Dec 2025,
      so a NULL is ambiguous (no timeout vs not-yet-populated) for a job with no qualifying health rule.
      timeout_null_reason splits that ambiguity by population_floor_time: the earliest change_time, over
      this workspace''s FULL system.lakeflow.jobs history, at which any job row already shows a non-NULL
      timeout_seconds. A NULL-timeout job whose latest row''s change_time is BEFORE that floor reads ''not_populated'';
      at or after the floor reads ''after_population'' and counts fully toward no_timeout. If a workspace
      has never shown a non-NULL timeout_seconds at all, population_floor_time is NULL and every NULL
