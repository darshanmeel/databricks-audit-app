    had not yet started populating timeout_seconds when the job''s row was last changed (not a real gap,
    drives NOT_ASSESSED); ''after_population'' means the row was changed after this workspace started
    populating the column, so the NULL is read as a genuine no-timeout job and no_timeout counts it fully.'
  meta:
    query_id: lakeflow_jobs_no_timeout
    title: Jobs with no configured timeout, at-risk DBU exposure
