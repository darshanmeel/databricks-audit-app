- name: f_lakeflow_tasks_near_timeout
  description: One row = a task within a job. The columns that matter are runs_near_timeout (execution
    reached at least :near_timeout_ratio of the configured timeout but stayed under it) and runs_over_timeout
    (execution reached or passed the timeout and should have been killed) - the two never overlap, so
    status bands on their plain sum. runs_no_timeout_bound is runs with an explicit 0-second timeout (no
    bound configured, not a gap); runs_no_task_timeout is runs whose timeout_seconds is NULL (not yet
    populated on that row).
  meta:
    query_id: lakeflow_tasks_near_timeout
    title: Tasks running near or past their configured timeout
    domain: jobs_pipelines
    tier: standard
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - submit_run_skipped
    reads:
    - system.lakeflow.job_task_run_timeline
    - system.lakeflow.job_tasks
    - system.lakeflow.jobs
    - system.access.workspaces_latest
    requires: SELECT on system.lakeflow AND on system.access (the latter only for the workspace_name column
      - see caveats to drop it); GA (execution_duration_seconds and timeout_seconds were both added late
      Nov 2025)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: near_timeout_ratio
      default: 0.8
      meaning: fraction of the configured timeout that counts as "near timeout"
    - name: warn_near_timeout_runs
      default: 3
      meaning: near/over-timeout runs for a task that flags WARN
    - name: crit_near_timeout_runs
      default: 10
      meaning: that flags CRITICAL
    - name: null_bucket_material_share
      default: 0.5
      meaning: share of a task's runs that must be runs_no_task_timeout or runs_exec_null before it reads
        NOT_ASSESSED instead of being banded
    confidence: needs_confirmation
    confidence_note: both execution_duration_seconds (job_task_run_timeline) and timeout_seconds (job_tasks)
      are not populated before late Nov 2025; runs_no_task_timeout / runs_exec_null expose that so a short-history
      account degrades to "not assessed" instead of reading a missing value as zero.
    healthy: runs_near_timeout and runs_over_timeout both at/near 0 - field heuristic; tune :near_timeout_ratio
      and :warn_near_timeout_runs for your account.
    investigate_if: '(runs_near_timeout + runs_over_timeout) at/above :warn_near_timeout_runs (WARN) or
      :crit_near_timeout_runs (CRITICAL) - field heuristic; runs_over_timeout > 0 is the more urgent signal
      since the task should already have been killed. NOT_ASSESSED is not a pass: it means runs_no_task_timeout
      or runs_exec_null makes up at least :null_bucket_material_share of task_runs - read not_assessed_reason.'
    actions:
    - look at whether the task's input volume grew and the timeout was never revisited (free);
    - raise the task's configured timeout to a realistic value, or split the task into smaller steps (config);
    - if the task is legitimately compute-bound, give it a faster node type or more parallelism (spend).
    next:
    - query_id: lakeflow_job_tasks_no_timeout
      if: the tasks with no timeout at all, a related gap
    - query_id: lakeflow_phase_cold_start
      if: for the run-level setup/queue/execution breakdown
    caveats: '"Near timeout" means observed execution_duration_seconds reaches :near_timeout_ratio of
      the task''s configured timeout_seconds but stays under it; "over timeout" means it ran at/past the
      timeout - the two conditions are mutually exclusive (near is now bounded above by the timeout itself),
      so runs_near_timeout + runs_over_timeout never double-counts a run in both buckets. Both source
      columns are not populated before late Nov 2025. A timeout_seconds of exactly 0 is an explicit "no
      bound configured" (runs_no_timeout_bound) - a deliberate setting, not missing data, and is excluded
      from near/over-timeout the same as a NULL timeout since there is nothing to compare against; a NULL
      timeout_seconds (runs_no_task_timeout) or a NULL execution_duration_seconds (runs_exec_null) is
      column-not-yet-populated and, when either accounts for at least :null_bucket_material_share of a
      task''s runs, degrades the whole row to NOT_ASSESSED rather than silently excluding those runs with
      no signal. job_id and task_key are unique only within a workspace+job, so the join is on (workspace_id,
      job_id, task_key); job_tasks is SCD2, so this takes the latest row per (workspace_id, job_id, task_key)
      by change_time before joining, to avoid fan-out. job_task_run_timeline''s result_state is populated
      only in the task''s end row, so this filters to result_state IS NOT NULL. job_name comes from system.lakeflow.jobs
      (SCD2, latest row by change_time, deleted jobs kept) and is NULL for one-time SUBMIT_RUN / WORKFLOW_RUN
      executions. workspace_name comes from system.access.workspaces_latest, a DIFFERENT system schema:
      if system.access is not enabled or you cannot read it, this query ERRORS rather than degrading,
      so drop the workspace_name column and its LEFT JOIN (two lines) and resolve ids with cost_workspace_names
      separately. There are no dollars here - durations are not a billing unit.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/jobs_pipelines/lakeflow_tasks_near_timeout.sql
    order_by: (a.runs_near_timeout + a.runs_over_timeout) DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - job_id
        - task_key
