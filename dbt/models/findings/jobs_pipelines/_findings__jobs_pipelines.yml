- name: f_lakeflow_stale_zombie_jobs
  description: One row = an active job. The column that matters is last_run_start - the most recent time
    the job ran, across all history; is_stale flags jobs that have not run in over :stale_days days (or
    never at all).
  meta:
    query_id: lakeflow_stale_zombie_jobs
    title: Stale / zombie jobs with no recent runs
    domain: jobs_pipelines
    tier: standard
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - submit_run_skipped
    - retention_window
    reads:
    - system.lakeflow.jobs
    - system.lakeflow.job_run_timeline
    - system.billing.usage
    - system.billing.list_prices
    requires: SELECT on system.lakeflow, system.billing; GA
    params:
    - name: stale_days
      default: 30
      meaning: days since last run that flags WARN
    - name: crit_stale_days
      default: 90
      meaning: days since last run that flags CRITICAL
    - name: period_days
      default: 30
      meaning: cost-lookback window for net_dbus/est_usd_list (a separate window from the staleness thresholds)
    confidence: confirmed
    confidence_note: the SCD2-latest-row + delete_time filter and the last-run lookback (independent of
      the cost window) were verified against system.lakeflow.jobs and job_run_timeline in a live workspace.
    healthy: last_run_start recent (within :stale_days days) for every active job - field heuristic; tune
      :stale_days for your account.
    investigate_if: 'is_stale = 1, especially where last_run_start is NULL (no run ever recorded) or older
      than :crit_stale_days days - field heuristic. NOT_ASSESSED is not a pass: read not_assessed_reason.'
    actions:
    - confirm the job is genuinely unused and pause or delete it (free);
    - if it is meant to run on a longer cadence, document that in the job name/description so it stops
      looking abandoned (config);
    - n/a - a stale job is not itself a spend decision (it correctly shows ~0 net_dbus, see caveats).
    next:
    - query_id: lakeflow_job_ownership_orphans
      if: stale jobs are often also ownership orphans
    - query_id: lakeflow_health_rule_coverage
      if: a stale job is a low priority for health-rule coverage effort
    caveats: jobs is SCD2 - this takes the latest row per (workspace_id, job_id) by change_time; delete_time
      IS NULL excludes jobs you already deleted. last_run_start looks across ALL history (no lookback
      window), so no incomplete-current-day filter is needed here. net_dbus is the exact billed DBUs (usage_unit='DBU');
      est_usd_list is an ESTIMATE AT THE EFFECTIVE LIST PRICE (usage_quantity x list_prices.pricing.effective_list.default
      - DEC-66.1), not your negotiated invoice rate, and it excludes cloud infra/egress cost - treat it
      as directional. net_dbus/est_usd_list are attributed by (workspace_id, job_id) over the separate
      :period_days cost-lookback window, pre-aggregated before the LEFT JOIN so rows are never multiplied.
      A genuinely stale job correctly shows ~0 net_dbus, since it has had no recent runs in that window
      - net_dbus is not the signal here, staleness is. price_basis is 'unpriced' when any non-free-usage
      SKU billed to this job had no matching list_prices row (net_dbus/est_usd_list then understate cost),
      'free' when every matched SKU is a FREE_USAGE SKU (a real $0), and 'priced' otherwise. system.lakeflow.job_run_timeline
      retains only ~365 days, so last_run_start IS NULL can mean the job last ran beyond that retention
      window, never ran, or (see NOT_ASSESSED below) simply has not had time to run yet. capture_floor_days
      is how far back THIS WORKSPACE's own job_run_timeline history actually reaches (the earliest period_start_time
      seen in that workspace, across all jobs) - a NULL last_run_start reads NOT_ASSESSED (too_young_to_call_stale),
      never WARN or CRITICAL, whenever capture_floor_days is shorter than :stale_days (the workspace itself
      has not captured enough history to call anything stale) OR create_time is more recent than :stale_days
      days ago (the job itself is too young to have missed a run yet); otherwise a NULL last_run_start
      reads WARN, same as before this capture/job-age check existed - it is never escalated to CRITICAL
      on your behalf, since "confirmed never run" vs "just hasn't run yet" is a judgment call this query
      leaves to you. A non-NULL last_run_start is a direct measurement and is banded exactly as before,
      unaffected by capture_floor_days or create_time.
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/jobs_pipelines/lakeflow_stale_zombie_jobs.sql
    order_by: last_run_start ASC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - job_id
