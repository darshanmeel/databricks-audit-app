- name: f_lakeflow_workload_mix_hours
  description: One row = a (workspace, job, run_type, trigger_type, day) combination. Use distinct_runs
    and execution_s_total to see your run-type/trigger mix and daily volume before drilling into a specific
    failure or cost finding.
  meta:
    query_id: lakeflow_workload_mix_hours
    title: Job run workload mix by run type, trigger, and day
    domain: jobs_pipelines
    tier: lite
    stars: false
    origin: vendored
    windowed: true
    is_finding: false
    empty_if:
    - schema_not_enabled
    reads:
    - system.lakeflow.job_run_timeline
    requires: SELECT on system.lakeflow; GA (execution_duration_seconds was added early Dec 2025)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    confidence: confirmed
    confidence_note: the run_type values (JOB_RUN/SUBMIT_RUN/WORKFLOW_RUN) and the WORKFLOW_RUN compute-attribution
      note were verified against system.lakeflow.job_run_timeline in a live workspace.
    healthy: n/a - inventory
    investigate_if: n/a - inventory
    actions: []
    next:
    - query_id: lakeflow_failed_runs
      if: drill into failures within a given run_type/trigger_type
    - query_id: lakeflow_pipeline_cost
      if: drill into DBU cost for the pipeline-driven share of this mix
    caveats: run_type is one of JOB_RUN/SUBMIT_RUN/WORKFLOW_RUN. WORKFLOW_RUN compute is attributed to
      the parent notebook, not the job - do not double-count its DBUs against the job from this table;
      this query is for run-mix counting only, dollar attribution lives in the billing-domain queries.
      execution_duration_seconds is not populated before early Dec 2025, so treat a low/zero execution_s_total
      on an older account as degraded, not as truly idle. Databricks additionally documents this column
      (like its siblings on job_run_timeline) as populated only for legacy SINGLE-TASK jobs - a MULTI-TASK
      job's run logs a literal 0, not NULL, so execution_s_total on a multi-task-heavy day is a real undercount
      of actual execution time, not just a "not yet populated" gap; unlike lakeflow_phase_cold_start and
      lakeflow_job_queue_time, this inventory query does NOT fold that 0 to NULL, because it is a pure
      SUM with no status band to protect and folding it would silently drop real (if incomplete) volume
      from an inventory total. This counts DISTINCT run_id to net out the hourly slicing of runs over
      1 hour. completed_run_rows should be read as an end-row count, not a run count (that is distinct_runs).
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/jobs_pipelines/lakeflow_workload_mix_hours.sql
    order_by: workspace_id, run_day DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - job_id
        - run_type
        - trigger_type
        - run_day
