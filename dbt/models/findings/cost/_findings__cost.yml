- name: f_cost_chargeback_by_allocation_tag
  description: One row = a workspace + usage_unit's spend under one allocation-tag value, at the effective
    list price (DEC-66.1), over the window. is_missing_allocation_key = true is the one row per workspace
    + usage_unit that could NOT be attributed to cost_center or team even though the resource may carry
    other, unrelated tags -- read share_of_unit_pct and status on that row for "how much of this spend
    has nowhere to be charged back". price_basis (priced/free/unpriced) discloses whether net_list_cost_usd
    for that allocation value is a real dollar estimate, a real $0 (free-usage SKUs), or understated by
    a pricing-coverage gap.
  meta:
    query_id: cost_chargeback_by_allocation_tag
    title: Chargeback in dollars by the allocation tag, with the share of spend missing it
    domain: cost
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: true
    empty_if:
    - no_activity
    reads:
    - system.billing.usage
    - system.billing.list_prices
    requires: SELECT on system.billing; GA (system.billing.usage and system.billing.list_prices are generally
      available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_missing_pct
      default: 20
      meaning: percent of a workspace + usage_unit's own priced spend that carries no allocation-key tag,
        at/above which WARN
    - name: crit_missing_pct
      default: 50
      meaning: percent at/above which CRITICAL
    - name: allocation_keys
      default: costcenter,team
      meaning: the tag keys that charge spend back, first one wins, written lower case without spaces,
        hyphens or underscores (department,project for a company that tags those)
    confidence: needs_confirmation
    confidence_note: New app-owned query, not yet run live. Builds on the effective-list-price join every
      priced cost query in this app already uses (DEC-66.1) and on the custom_tags explode cost_chargeback_by_tag
      already proves works against a live workspace; confirm on your account that a usage row you know
      carries a cost_center (or team) tag lands under that exact value, and that a row you know carries
      only unrelated tags (or none at all) lands in the is_missing_allocation_key = true row for its workspace
      + usage_unit.
    healthy: a real allocation-tag row, or the is_missing_allocation_key row when its share_of_unit_pct
      sits below :warn_missing_pct
    investigate_if: 'CRITICAL - the is_missing_allocation_key row''s share_of_unit_pct is at/above :crit_missing_pct;
      WARN - at/above :warn_missing_pct. NOT_ASSESSED - read not_assessed_reason: either this workspace
      + usage_unit''s own priced spend nets to nothing measurable (every SKU in it is unpriced or free-usage),
      or the missing-key spend itself is entirely unpriced (a real pricing-coverage gap) -- neither case
      has an honest percentage to band, so this reads NOT_ASSESSED rather than a silent OK (DEC-57/58:
      NOT_ASSESSED is never OK). A missing-key row whose spend is entirely free-usage is NOT one of these
      cases: that is a real $0, so it reads status OK with share_of_unit_pct = 0, never NOT_ASSESSED.'
    actions:
    - open cost_chargeback_by_tag for this workspace to see whether the missing spend carries OTHER tags
      (a tagging-convention gap) or none at all (a resource nobody tagged) (free);
    - attach the account's allocation tag (cost_center, or team where that is the convention -- see caveats)
      to the untagged resource's cluster/job/warehouse config, or a serverless usage policy for serverless
      spend (config);
    - if a product line structurally cannot carry the tag (shared infrastructure), accept and document
      the residual the same way cost_dbsql_allocation_gap documents its own unattributable share (spend,
      in the sense of accepted shared-infrastructure overhead).
    next:
    - query_id: cost_chargeback_by_tag
      if: the row-tag detail and every raw tag key/value behind this query's own cost_center/team pick
    - query_id: cost_chargeback_by_identity
      if: who ran the untagged spend
    - query_id: cost_dollarized_by_sku_day
      if: the SKU-level detail behind one allocation value's dollars
    caveats: 'ALLOCATION KEY - config/tag_aliases.yml (DEC-60) canonicalises tag keys into WORKSPACE ATTRIBUTES
      (one dominant value per workspace, read via dims.dim_workspace) -- a different mechanism from this
      query, which reads the ROW-level custom_tags map directly, one usage row at a time, so a workspace
      with mixed tagging still charges back correctly at the row level rather than collapsing to one workspace-wide
      label. The keys are :allocation_keys (default cost_center, then team; set your own in config/thresholds.yml
      under this check, e.g. allocation_keys: department,project). Matching ignores case, spaces, hyphens
      and underscores, so "cost_center", "costcenter" and "Cost-Center" are one key; the first key in
      the list wins when one usage row carries two. A spelling that is not in the list (for example cc
      or cost_centre) lands in the missing row. MISSING vs UNTAGGED - a row lands in is_missing_allocation_key
      = true whenever it carries none of the keys, even when it carries other tags entirely (env, owner,
      ...) -- this is the fix for cost_chargeback_by_tag''s "untagged" reading, which only ever meant
      "no tags at all". UNIT - grouped by usage_unit and never summed across it (DEC-24): a DBU and a
      GB-month are not comparable quantities, so net_usage_quantity is only ever summed within one usage_unit;
      the dollar columns ARE comparable across usage_unit (DEC-66.1''s one effective-list basis), but
      share_of_unit_pct is still computed within one workspace + usage_unit at a time so a heavily-tagged
      storage bill cannot hide a poorly-tagged compute bill on the same workspace. PRICE - net_list_cost_usd
      is SUM(usage_quantity * list_prices.pricing.effective_list.default) for that allocation value (DEC-66.1,
      the one dollar basis this app uses), an estimate, never a negotiated or billed dollar. price_basis
      is ''unpriced'' when any non-free-usage SKU in that allocation value had no matching list_prices
      row (net_list_cost_usd then understates or is NULL, never forced to 0), ''free'' when every matched
      SKU is a FREE_USAGE SKU (a real $0, also read as NULL when nothing else in the group priced), ''priced''
      otherwise. A free-usage-only row (price_basis = ''free'') is a real $0, not a coverage gap: it reads
      status OK with share_of_unit_pct = 0 -- this applies to the is_missing_allocation_key row exactly
      like any other, so a missing-key bucket whose only spend is free-usage never falsely reads NOT_ASSESSED
      or gets skipped from the percentage. NOT_ASSESSED on the missing-key row is reserved for a genuine
      pricing-coverage gap (price_basis = ''unpriced'') or for a workspace + usage_unit whose own priced
      spend nets to nothing measurable. Corrections are netted (SUM across all record_types -- never filter
      to ORIGINAL only). The current day is excluded, same as every other windowed cost query, since billing.usage
      lands with ingestion lag and the trailing day is provisional.'
    sql_url: app/queries/app/cost/cost_chargeback_by_allocation_tag.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 WHEN 'NOT_ASSESSED' THEN 2 ELSE 3
      END, a.workspace_id, a.usage_unit, is_missing_allocation_key DESC, a.net_list_cost_usd DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - usage_unit
        - allocation_key
        - allocation_value
- name: f_cost_chargeback_by_cluster
  description: One row = one all-purpose cluster (workspace_id, cluster_id, cluster_kind = 'all_purpose'),
    by name and owner; one row per job whose runs used job clusters in the window (workspace_id, job_id,
    cluster_kind = 'job_cluster') - a job's short-lived job clusters are rolled up to the job rather than
    listed one ephemeral cluster_id at a time; PLUS one row per classic (non-serverless) Lakeflow Declarative
    Pipeline whose compute billed with a cluster_id in the window (workspace_id, pipeline_id, cluster_kind
    = 'pipeline'), by pipeline name. The three kinds are mutually exclusive by construction (split on
    dlt_pipeline_id first, then job_id), so nothing is double-counted across them. est_current_usd_list
    / est_previous_usd_list are the two totals; est_change_usd_list and change_pct compare them. price_basis
    discloses pricing coverage across both windows combined; not_assessed_reason explains a NOT_ASSESSED
    row. is_other=true is the one pooled row for every status=OK row ranked below :top_n by current spend
    (every other column NULL on that row, pooled_count says how many); it always reads status OK (see
    caveats).
  meta:
    query_id: cost_chargeback_by_cluster
    title: Chargeback by cluster, job cluster or pipeline, current period versus the one before it
    domain: cost
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: true
    empty_if:
    - no_activity
    reads:
    - system.billing.usage
    - system.billing.list_prices
    - system.compute.clusters
    - system.lakeflow.jobs
    - system.lakeflow.pipelines
    - system.access.workspaces_latest
    requires: SELECT on system.billing, system.compute, system.lakeflow and system.access; GA (all six
      tables are generally available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days - the current period is the most recent N days, the previous period
        is the equal-length N days immediately before it
    - name: warn_increase_pct
      default: 25
      meaning: percent increase in a row's list-priced spend, current period over previous, at/above which
        WARN
    - name: crit_increase_pct
      default: 50
      meaning: percent increase at/above which CRITICAL
    - name: min_spend_usd
      default: 20
      meaning: the current period's own list-priced spend must be at least this before a percent change
        is judged - below it the row reads OK regardless of the swing, since a percent figure on a tiny
        base is noise
    - name: top_n
      default: 20
      meaning: how many status=OK rows, ranked by current-period spend descending, are kept as their own
        row before the rest are pooled into one is_other=true row - every WARN/CRITICAL/NOT_ASSESSED row
        is always kept as its own row, never pooled, so a real finding on a small cluster can never be
        hidden behind the cap
    confidence: needs_confirmation
    confidence_note: New app-owned query, not yet run live. Reuses the effective-list-price join every
      priced cost query in this app already uses (DEC-66.1) and the exact current-vs-previous- window
      contract cost_period_over_period already established (same NOT_ASSESSED / price_basis rules, applied
      per cluster/job-cluster/pipeline instead of per workspace+product); confirm on your account that
      a cluster, job or pipeline you know grew or shrank between two recent equal periods matches this
      query's change_pct, and that "all-purpose" here (a billed cluster_id with no dlt_pipeline_id or
      job_id at all) matches how you expect interactive clusters to be billed.
    healthy: status OK - no increase at/above :warn_increase_pct, or the row's own current-period spend
      (a real $0 counts) sits below :min_spend_usd
    investigate_if: 'CRITICAL - the increase is at/above :crit_increase_pct on at least :min_spend_usd
      of current spend, or the row is brand-new spend above the floor with nothing in the previous period
      to compare against; WARN - at/above :warn_increase_pct. NOT_ASSESSED - read not_assessed_reason:
      ''previous_window_not_covered'' when the account''s own earliest recorded usage does not reach back
      far enough to cover the previous window at this window length; ''current_period_unpriced'' when
      this row''s current-period spend could not be priced at all; ''previous_period_unpriced'' is the
      same gap on the previous period''s own side.'
    actions:
    - open cost_chargeback_by_job for a job_cluster row, or cost_chargeback_by_tag_value for the tag behind
      the growth (free);
    - if the growth is deliberate, right-size the cluster or set a budget policy before it compounds another
      period (config);
    - for a growing all_purpose cluster, check compute_warehouse_idle_gaps' compute-domain sibling (cluster
      utilization) before assuming more spend means more real work (free).
    next:
    - query_id: cost_chargeback_by_job
      if: the job behind a job_cluster row
    - query_id: cost_chargeback_reconcile
      if: this view's own total against the account's billing total
    - query_id: cost_chargeback_by_tag_value
      if: the tag cut of the same spend
    caveats: DEC-66.1 - the effective list price only, never a negotiated rate; the same basis on both
      windows. "all-purpose" means a cluster-attributed billed row with no dlt_pipeline_id or job_id at
      all (interactive use); it is not read from cluster_source, so a cluster created via the UI but driven
      only by job runs in this window shows up entirely under job_cluster, never under its own cluster_id
      - the intended "rolled up to their job" behavior. owner for a job_cluster row is the job's run_as,
      and for a pipeline row is the pipeline's run_as - neither is a person who clicked anything. This
      is a chargeback reference, not a fix for a listed problem. Corrections are netted (SUM across all
      record_types - never filter to ORIGINAL only). The current day is excluded from both windows, same
      as every other windowed cost query, since billing.usage lands with ingestion lag and the trailing
      day is provisional. POOLING - the is_other row only ever pools rows that were ALREADY status=OK
      on their own, and it always reads status OK itself, however large the combined dollars - a rollup
      of small, healthy rows is never itself a finding; it can never hide a WARN/CRITICAL/NOT_ASSESSED
      row, which always keeps its own row regardless of :top_n.
    sql_url: app/queries/app/cost/cost_chargeback_by_cluster.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 WHEN 'NOT_ASSESSED' THEN 2 ELSE 3
      END, is_other, est_change_usd_list DESC NULLS LAST, workspace_id, cluster_kind, entity_id
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - cluster_kind
        - entity_id
- name: f_cost_chargeback_by_identity
  description: One row = a day + workspace + product + masked identity's DBU usage. The columns that matter
    are identity_type (user vs service_principal vs unknown) and identity_run_as (the masked principal)
    - use this to see who is spending, and how much of the spend has no attributable identity at all.
  meta:
    query_id: cost_chargeback_by_identity
    title: DBU usage by identity (chargeback)
    domain: cost
    tier: standard
