- name: f_cost_by_job
  description: 'One row = a day + workspace + job''s DBU cost. The columns that matter are job_id/job_name
    (which job) and net_usage_quantity (its DBU burn that day, priced at usd_list) - distinct_runs lets
    you tell a job that is expensive because it runs constantly apart from one that is expensive because
    a single run is heavy. status is a SPEND-MAGNITUDE rank, not a waste signal: cross-check lakeflow_job_compute_pressure
    or compute_idle_node_ratio for this job''s own clusters before treating a flagged row as wasteful
    rather than simply large.'
  meta:
    query_id: cost_by_job
    title: DBU cost by job
    domain: cost
    tier: standard
    stars: true
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - ingestion_lag
    reads:
    - system.billing.usage
    - system.billing.list_prices
    - system.lakeflow.jobs
    - system.access.workspaces_latest
    requires: SELECT on system.billing, system.lakeflow, system.access; billing usage/list_prices and
      system.lakeflow.jobs are GA, workspaces_latest is Public Preview
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_job_dbus_per_day
      default: 50
      meaning: DBUs/day on a single job that flags WARN
    - name: crit_job_dbus_per_day
      default: 200
      meaning: DBUs/day that flags CRITICAL
    confidence: confirmed
    confidence_note: usage_metadata.job_id and product_features.is_serverless are documented system.billing.usage
      columns.
    healthy: net_usage_quantity below :warn_job_dbus_per_day DBUs/day per job (field heuristic - tune
      :warn_job_dbus_per_day for your account).
    investigate_if: net_usage_quantity at/above :warn_job_dbus_per_day (WARN) or :crit_job_dbus_per_day
      (CRITICAL) DBUs/day - field heuristic; a job that is consistently in-band and just large may be
      fine, a job whose per-run cost keeps climbing is the one to open first.
    actions:
    - resolve job_id to name/owner/run_as via system.lakeflow.jobs and confirm the job is still needed
      at this frequency (free);
    - move the job off an always-on all-purpose cluster onto job-scoped compute, or tune its cluster size/autoscaling
      (config);
    - if the job is genuinely compute-heavy and correctly sized, consider a committed-use discount for
      that capacity (spend).
    next:
    - query_id: lakeflow_jobs_on_all_purpose
      if: this job is paying the all-purpose placement premium
    - query_id: lakeflow_failed_runs
      if: distinct_runs is high relative to net_usage_quantity - retries may be inflating the cost
    caveats: usage_metadata.job_id populates for jobs-compute (classic and serverless); it is NULL for
      interactive / SQL-editor lines and those are excluded here by construction. job_name resolves from
      the latest (by change_time) system.lakeflow.jobs row (SCD2) and may be null if the job has since
      been deleted; join job_id -> system.lakeflow.jobs yourself for run_as and other job detail. is_serverless
      separates jobs-serverless from classic jobs compute, which is the placement-premium signal. usage_quantity
      is DBU; usd_list is an ESTIMATE AT THE EFFECTIVE LIST PRICE (usage_quantity x list_prices.pricing.effective_list.default
      - DEC-66.1), not your negotiated invoice rate, priced the same way every other cost_* query in this
      set prices. price_basis is 'unpriced' when any non-free-usage SKU billed to this job/day had no
      matching list_prices row (usd_list then understates cost), 'free' when every matched SKU is a FREE_USAGE
      SKU (a real $0), and 'priced' otherwise. workspace_name comes from the Public Preview workspaces_latest
      table and may be null.
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/cost/cost_by_job.sql
    order_by: net_usage_quantity DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - usage_date
        - cloud
        - workspace_id
        - billing_origin_product
        - job_id
        - is_serverless
