- name: f_overview_spend_estimate
  description: One row = a workspace's total net DBU usage and list-price dollar estimate over the window
    (currency_code is always USD, the only currency the shared price step keeps). price_basis (free/priced/unpriced)
    discloses whether net_list_cost_usd mixes free-usage SKUs (a real $0) or is understated by a pricing-coverage
    gap.
  meta:
    query_id: overview_spend_estimate
    title: Estimated net spend - net DBUs x list price by workspace
    domain: cost
    tier: lite
    stars: false
    origin: app
    windowed: true
    is_finding: false
    empty_if: []
    reads:
    - system.billing.usage
    - system.billing.list_prices
    requires: SELECT on system.billing; GA
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    confidence: needs_confirmation
    confidence_note: Ported from the reference overview set, not yet run live; confirm SUM(usage_quantity)
      across all record_types matches the usage dashboard total for the same window. Dollarizes at pricing.effective_list.default,
      DEC-66.1's one effective-list-price basis used everywhere in this app (no negotiated-rate source
      exists; see cost_actual_vs_list_by_sku for why an "actual" figure can never be produced).
    healthy: n/a - inventory
    investigate_if: n/a - inventory
    actions: []
    next:
    - query_id: overview_list_prices_raw
      if: for the safe raw JSON pricing basis
    - query_id: cost_dollarized_by_sku_day
      if: for the same cut by day and product
    caveats: The effective list price (DEC-66.1) only - never a negotiated rate, DBU-only, excludes cloud
      infra/egress. NEVER present net_list_cost_usd as a billed dollar; it is a list estimate, never negotiated
      (no negotiated-rate source exists in system.billing). If pricing.effective_list.default ever errors
      or looks wrong on your workspace, dollarize in-engine off the raw JSON via overview_list_prices_raw.csv.
      Net DBUs SUM across ALL record_types (never filter to ORIGINAL only). usage_quantity is DBU, not
      dollars. The current day is excluded. price_basis is 'unpriced' when any non-free-usage SKU in this
      workspace had no matching list_prices row (net_list_cost_usd then understates cost), 'free' when
      every matched SKU is a FREE_USAGE SKU (a real $0), and 'priced' otherwise. Ported from the MIT-licensed
      reference (c) 2026 darshanmeel.
    sql_url: app/queries/app/cost/overview_spend_estimate.sql
