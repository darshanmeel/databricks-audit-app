          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - usage_date
        - cloud
        - workspace_id
        - sku_name
        - billing_origin_product
        - is_serverless
        - is_photon
        - jobs_tier
        - sql_tier
        - dlt_tier
        - performance_target
- name: f_cost_restatement_trust_metric
  description: One row = a workspace + cloud's usage totals for the window, split by record_type. The
    columns that matter are net_usage_quantity (the true net, corrections already applied) versus original_usage_quantity/retracted_abs_quantity/restatement_usage_quantity
    (how much of that net was corrected after the fact) - this is a trust/QA check on the billing data
    itself, not a cost or waste signal.
  meta:
    query_id: cost_restatement_trust_metric
    title: Billing restatement / trust metric
    domain: cost
    tier: lite
    stars: false
    origin: vendored
    windowed: true
    is_finding: false
    empty_if:
    - ingestion_lag
    reads:
    - system.billing.usage
    requires: SELECT on system.billing; GA (system.billing.usage is generally available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    confidence: confirmed
    confidence_note: The record_type enum (ORIGINAL/RETRACTION/RESTATEMENT) and ingestion_date are documented
      system.billing.usage columns.
    healthy: n/a - inventory
    investigate_if: n/a - inventory
    actions: []
    next:
    - query_id: cost_totals_by_sku_day
      if: for the same net-corrected totals broken out by SKU/workspace
    - query_id: cost_by_billing_origin_product
      if: for the net totals by product line
    caveats: 'This produces the "% of usage later restated" trust metric (retracted_abs_quantity + restatement_usage_quantity
      against original_usage_quantity) and demonstrates that net_usage_quantity does not double-count
      corrections - it is not itself a cost or misconfiguration finding, so there is no healthy/investigate_if
      band. ingestion_date (distinct from usage_date) supports incremental loads and is the basis for
      a data-freshness/lag check: max_ingestion_date tells you how current your last load is. workspace_id
      is a genuine account-level usage row when NULL, never dropped.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/cost/cost_restatement_trust_metric.sql
    order_by: cloud
  columns:
