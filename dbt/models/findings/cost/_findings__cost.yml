- name: f_cost_monthly_actuals
  description: 'One row = a workspace + billing_origin_product''s total list-priced spend for one calendar
    month. month_start is the first day of that month; is_partial_month is TRUE for the current, still-in-progress
    calendar month AND for the export''s own oldest month if the snapshot''s history starts partway through
    it - read either kind''s total as partial, never as the month''s final number (DEC-62: no forecast,
    no scaling a partial month up to a full one). partial_reason says which kind (''month_in_progress''
    or ''export_starts_mid_month''). days_captured is how many distinct days that month actually have
    a usage row for this workspace/product, a quick honesty check on how complete the month''s total is;
    first_day/last_day are that range''s own earliest/latest usage_date, so a partial month can be labelled
    honestly (e.g. "16-22 Sep") instead of implied as the whole month.'
  meta:
    query_id: cost_monthly_actuals
    title: Dollars per calendar month, by workspace and product line
    domain: cost
    tier: standard
    stars: false
    origin: app
    windowed: false
    is_finding: false
    empty_if:
    - ingestion_lag
    reads:
    - system.billing.usage
    - system.billing.list_prices
    requires: SELECT on system.billing; GA (system.billing.usage and system.billing.list_prices are generally
      available)
    params: []
    confidence: needs_confirmation
    confidence_note: New app-owned query, not yet run live. Uses the same pricing.effective_list.default
      join (DEC-66.1) and price_basis CASE every priced cost query here already uses; confirm month_start
      groups usage_date the way your calendar expects (month_start is the first day of the month, in the
      export's own dates - no timezone shift).
    healthy: n/a - inventory (actuals, not a verdict)
    investigate_if: n/a - inventory (actuals, not a verdict); pair with cost_period_over_period for a
      judged comparison
    actions: []
    next:
    - query_id: cost_period_over_period
      if: for a judged current-vs-previous comparison with WARN/CRITICAL bands
    - query_id: cost_dollarized_by_sku_day
      if: for the same dollars broken out by day and SKU
    - query_id: overview_spend_estimate
      if: for the account's current headline number
    caveats: 'DEC-66.1 - the effective list price only, never a negotiated rate; DEC-62 - this is the
      actual dollars the export captured for each month, never a forecast or a partial month scaled up
      to a full one - a partial month is labelled is_partial_month and left as-is. is_partial_month is
      TRUE for the CURRENT calendar month (month_start equals the first of this month, partial_reason
      ''month_in_progress'') AND, separately (DEC-64), for whichever month holds the WHOLE account''s
      own earliest recorded usage_date across system.billing.usage, if that date is not itself the 1st
      - the export''s own history starts partway through that month, so its total is genuinely incomplete
      no matter how many days it shows (partial_reason ''export_starts_mid_month''); a 365-day export
      starting in mid-September, for example, makes its oldest month (September of the year before) partial
      even though most of its dollars are real. Any OTHER older month is still only as complete as days_captured
      shows - a full month rarely shows fewer than ~28-31 distinct days, and a workload can be legitimately
      intermittent. Windowless: every calendar month system.billing.usage carries is returned (no :period_days),
      the same "snapshot-type" shape as overview_list_prices_raw and cost_workspace_names, so this query
      is unaffected by the app''s 7/30/90-day window selector - it always reads the export''s own full
      history. Unlike cost_dollarized_by_sku_day this rolls SKU/usage_type/usage_unit all the way up to
      one dollar figure per workspace/product/month - use cost_dollarized_by_sku_day for the SKU-level
      detail behind any one month. price_basis is computed over the WHOLE month - ''unpriced'' when any
      non-free-usage SKU that month had no matching list_prices row (net_list_cost_usd then understates
      that month), ''free'' when every matched SKU is a FREE_USAGE SKU (a real $0), ''priced'' otherwise.
      Corrections are netted (SUM across all record_types - never filter to ORIGINAL only). The in-flight
      day (today) is EXCLUDED - the same `usage_date < current_date()` cut-off every other windowed cost
      query in this app uses (cost_dollarized_by_sku_day, cost_period_over_period, overview_spend_estimate,
      ...), so this month''s total, for the days it actually has, always reconciles to the cent with a
      window total (e.g. cost_dollarized_by_sku_day) summed over the same complete days - never two different-looking
      dollar figures on the same screen for the same days. is_partial_month is still TRUE for the current
      month (it is still short whatever days have not finished yet); first_day, last_day and days_captured
      say exactly which days are counted so far. billing.usage also lands with ingestion lag, so the last
      day or two of an otherwise-"complete" month can still be under-counted.'
    sql_url: app/queries/app/cost/cost_monthly_actuals.sql
    order_by: month_start DESC, workspace_id, billing_origin_product
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - billing_origin_product
        - month_start
