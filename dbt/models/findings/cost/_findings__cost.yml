- name: f_cost_serving_mode_by_endpoint
  description: One row = a workspace + endpoint + day + usage_type's model-serving usage with an inferred
    cost mode. The columns that matter are is_launch_sku (a TRUE-heavy endpoint is repeatedly cold-starting
    from scale-to-zero, which is itself a cost signal) and net_list_cost (est_usd_list, the estimated
    dollar exposure that drives the PER-DAY band below). price_basis (free/priced/unpriced) discloses
    whether net_list_cost is a real $0 (free-usage SKU) or understated by a pricing-coverage gap.
  meta:
    query_id: cost_serving_mode_by_endpoint
    title: Model-serving spend by endpoint and inferred cost mode
    domain: cost
    tier: deep
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - no_activity
    reads:
    - system.billing.usage
    - system.billing.list_prices
    requires: SELECT on system.billing; GA (system.billing.usage and system.billing.list_prices are generally
      available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_endpoint_usd_per_day
      default: 50
      meaning: estimated list-price $/day on a single workspace + endpoint + day + usage_type that flags
        WARN
    - name: crit_endpoint_usd_per_day
      default: 250
      meaning: $/day that flags CRITICAL
    confidence: confirmed
    confidence_note: The billing columns (billing_origin_product, product_features.serving_type, usage_type,
      usage_metadata.endpoint_name/endpoint_id, the LAUNCH SKU pattern) are all doc-confirmed; pricing.effective_list.default
      (the effective, post-promotion list price - DEC-66.1) is the one dollar basis used across this app,
      so net_list_cost is a directional estimate at that price, not a negotiated or billed dollar figure.
    healthy: net_list_cost below :warn_endpoint_usd_per_day est_usd_list/day per workspace + endpoint
      + day + usage_type (field heuristic - tune for your account).
    investigate_if: net_list_cost at/above :warn_endpoint_usd_per_day (WARN) or :crit_endpoint_usd_per_day
      (CRITICAL) est_usd_list/day on a SINGLE usage_date (field heuristic); or net_list_cost is NULL on
      a row whose price_basis is unpriced (NOT_ASSESSED - a pricing-coverage gap, not $0). A high is_launch_sku
      share alongside a high band is the strongest signal of scale-to-zero churn.
    actions:
    - confirm the endpoint's traffic pattern actually needs to scale from zero this often, or whether
      a minimum-provisioned-throughput floor would be cheaper (free);
    - switch a steadily-busy endpoint from pay-per-token/scale-to-zero to provisioned throughput, or the
      reverse for a bursty one (config);
    - right-size the endpoint's provisioned capacity or model choice (spend).
    next:
    - query_id: cost_by_serving_endpoint
      if: for the raw, non-dollarized per-endpoint usage split by usage_type
    - query_id: compute_serving_endpoint_cost_status
      if: to check whether a CRITICAL endpoint is actually seeing real traffic
    caveats: 'All billing columns here are doc-confirmed: billing_origin_product=''MODEL_SERVING''; product_features.serving_type
      enum {MODEL, GPU_MODEL, FOUNDATION_MODEL, FEATURE, null}; usage_type enum includes COMPUTE_TIME/GPU_TIME/TOKEN/ANSWER;
      usage_metadata.endpoint_name/endpoint_id; the SKU pattern ''%SERVERLESS_REAL_TIME_INFERENCE_LAUNCH%''
      identifies scale-from-zero cold-start launches per the model-serving-cost monitoring documentation.
      The cost mode is inferred from these billed signals, not read from a config column - Databricks
      does not expose workload_type/workload_size/scale_to_zero_enabled in system tables (those are serving-endpoints
      API fields only). list_rate is pricing.effective_list.default, the effective (post-promotion) list
      price - DEC-66.1''s one basis, used everywhere else in this app; net_list_cost is NULL when the
      price join found no match, and that degrades to "list cost unavailable," never an invented rate.
      net_list_cost is an estimate at the effective list price (est_usd_list), never the negotiated/invoice
      rate (no negotiated-rate source exists, see cost_actual_vs_list_by_sku). Empty result means model
      serving is not in use in the window, a real result, not $0. usage_date is now in the SELECT and
      GROUP BY, matching read_this''s "workspace + endpoint + day + usage_type" grain and the :warn_endpoint_usd_per_day
      / :crit_endpoint_usd_per_day param names, which are both PER-DAY thresholds -- an earlier version
      of this query grouped by endpoint + usage_type only and compared that whole-window total against
      the per-day threshold, which overstated the daily rate by roughly the window length, so an endpoint
      spending only about 1/7 (7-day window) to 1/90 (90-day window) of the per-day threshold per day
      was flagged WARN/CRITICAL (false flags). See cost_vector_search_spend, which never had this bug,
      for the same per-day shape. The price join is keyed on sku_name + cloud + usage_unit, same as cost_dollarized_by_sku_day,
      so a SKU priced in two units cannot fan out. price_basis is ''unpriced'' when this endpoint/day/usage_type/SKU
      row had no matching list_prices row and is not a FREE_USAGE SKU (net_list_cost is then NULL, a coverage
      gap, never $0), ''free'' when the SKU is a FREE_USAGE SKU with no price row by design (a real $0),
      and ''priced'' otherwise. workspace_id is added to the SELECT and GROUP BY so the app''s workspace
      filter can narrow this check; it never changes the endpoint + day + usage_type grain, since one
      endpoint bills to one workspace. This scopes to billing_origin_product=''MODEL_SERVING'', so Vector
      Search endpoint spend (billed separately under VECTOR_SEARCH) is not counted here; feature/function
      and agent endpoints do bill under MODEL_SERVING and are included. See cost_vector_search_spend for
      vector-search cost.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/cost/cost_serving_mode_by_endpoint.sql
    order_by: net_list_cost DESC NULLS LAST
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - usage_date
        - endpoint_id
        - cloud
        - sku_name
        - usage_type
        - usage_unit
        - serving_type
        - is_launch_sku
        - endpoint_name
- name: f_cost_sku_trend_12m
  description: 'One row = one workspace_id + sku_name in one calendar month, over the last 12 full months
    plus the current partial month (a NULL workspace_id is a genuine account-level usage row, its own
    group like any workspace''s, never dropped or blended into one). is_partial_month is TRUE only for
    the current, still-in-progress month - never compare it to a full month. net_list_cost_usd/price_basis
    are that one workspace/month''s own dollars, priced the same way cost_monthly_actuals prices a month.
    The remaining columns are the SKU''s OWN trend WITHIN THAT WORKSPACE, repeated identically on every
    one of that workspace+SKU''s rows (this grain keeps one row shape for the whole table - no separate
    month=NULL summary row): usd_last_3m_avg / usd_prior_3m_avg are its average monthly dollars over the
    last 3 full months and the 3 before that; growth_3m_pct compares them. usd_first_3m_avg is its average
    over the OLDEST 3 of the 12 full months; growth_12m_pct compares the last 3 to that. share_of_total_last_3m
    is this SKU''s share of every SKU''s usd_last_3m_avg combined WITHIN THE SAME WORKSPACE (read it off
    any one of the workspace+SKU''s own rows, not summed across rows - it repeats). new_this_year is TRUE
    when usd_first_3m_avg is a real 0 (no spend at all in the oldest 3 months, in that workspace) - a
    plain fact, independent of size; see status for when that also reads WARN.'
  meta:
    query_id: cost_sku_trend_12m
    title: Fastest-growing SKUs, last 12 months
    domain: cost
    tier: standard
    stars: false
    origin: app
    windowed: false
    is_finding: true
    empty_if: []
    reads:
    - system.billing.usage
    - system.billing.list_prices
    requires: SELECT on system.billing; GA (system.billing.usage and system.billing.list_prices are generally
      available)
    params:
    - name: warn_growth_pct
      default: 50
      meaning: growth_3m_pct (last 3 full months' average vs the 3 before) at/above which WARN
    - name: crit_growth_pct
      default: 100
      meaning: growth_3m_pct at/above which CRITICAL
    - name: warn_min_usd
      default: 500
      meaning: usd_last_3m_avg floor a WARN growth also needs
    - name: crit_min_usd
      default: 1000
      meaning: usd_last_3m_avg floor a CRITICAL growth also needs
    - name: new_sku_min_usd
      default: 500
      meaning: usd_last_3m_avg floor above which a SKU with no spend in its first 3 months reads WARN.
        Not windowed by :period_days - this check always covers the last 12 full calendar months plus
        the current partial month, regardless of the app's 7/30/90-day selector.
    confidence: needs_confirmation
    confidence_note: New app-owned query, not yet run live. Reuses the same pricing.effective_list.default
      join (DEC-66.1) and price_basis CASE cost_monthly_actuals already uses, and the "measured, never
      forecast" rule DEC-62 established. product_label's CASE only names the billing_origin_product values
      already seen elsewhere in this app (ALL_PURPOSE, JOBS, SQL, DLT, MODEL_SERVING, VECTOR_SEARCH, DEFAULT_STORAGE/STORAGE)
      - confirm it against your own account's values. Confirm a SKU you know grew this year (Genie, Model
      Serving, a serverless SKU) shows a matching growth_3m_pct/growth_12m_pct here.
    healthy: status OK - growth_3m_pct below :warn_growth_pct, or usd_last_3m_avg below :warn_min_usd
      (a percentage on a small base is noise), and not a material new_this_year SKU.
    investigate_if: CRITICAL - growth_3m_pct at/above :crit_growth_pct with usd_last_3m_avg at/above :crit_min_usd.
      WARN - growth_3m_pct at/above :warn_growth_pct with usd_last_3m_avg at/above :warn_min_usd, OR new_this_year
      with usd_last_3m_avg at/above :new_sku_min_usd (a SKU with nothing 10-12 months ago that is already
      spending real money now).
    actions:
    - open cost_chargeback_by_allocation_tag or the Cost > Allocation tab for this workspace and SKU's
      billing_origin_product to see which tag started using it (free);
    - if the growth is deliberate, set or tighten a budget policy for that workspace/tag before it compounds
      another quarter (config, not code).
    next:
    - query_id: cost_chargeback_by_allocation_tag
      if: for the workspace/tag behind the growth
    - query_id: overview_dbu_by_sku
      if: for the same SKU's workspace-level DBUs
    - query_id: cost_monthly_actuals
      if: for the account's full month-by-month actuals, every product, not just the growing ones
    caveats: 'DEC-66.1 - the effective list price only, never a negotiated rate. DEC-62 - every figure
      here is a measured average of real months, never a forecast or an annualised number; the current
      partial month is excluded from every 3-month average (last/prior/first) and is never itself compared
      to a full month, only shown for reference with is_partial_month=TRUE. GRAIN - the SKU-level columns
      (usd_last_3m_avg onward, including status) are computed once per workspace_id + sku_name and repeated
      on that workspace+SKU''s own month rows, chosen over a separate month=NULL summary row so every
      row in this table has the same shape. A SKU whose real history is shorter than 12 months (a young
      account, or an export that only recently started capturing this SKU) shows the same zeros in its
      oldest months as a genuine new_this_year SKU would - this query cannot tell the two apart; check
      cost_monthly_actuals for how far back your own export''s history actually reaches. workspace_id
      narrows this to one workspace at a time, the same as every other per-workspace finding; a NULL workspace_id
      is a genuine account-level usage row (some SKUs bill with no workspace_id at all), kept as its own
      group, never merged into a real workspace''s numbers or dropped - the actions above are how to get
      the tag-level cut within a workspace. Corrections are netted (SUM across all record_types - never
      filter to ORIGINAL only), the same as every other cost_* query. price_basis is computed per workspace/SKU/month:
      ''unpriced'' when any non-free-usage row that month had no matching list_prices row (net_list_cost_usd
      then understates that month), ''free'' when every matched SKU is a FREE_USAGE SKU (a real $0), ''priced''
      otherwise. The in-flight day (today) is excluded, same as every other cost query here.'
    sql_url: app/queries/app/cost/cost_sku_trend_12m.sql
    order_by: CASE WHEN sm.growth_3m_pct >= :crit_growth_pct AND sm.usd_last_3m_avg >= :crit_min_usd THEN
      0 WHEN sm.growth_3m_pct >= :warn_growth_pct AND sm.usd_last_3m_avg >= :warn_min_usd THEN 1 WHEN
      sm.new_this_year AND sm.usd_last_3m_avg >= :new_sku_min_usd THEN 1 ELSE 2 END, sm.usd_last_3m_avg
      DESC, m.workspace_id, m.sku_name, m.month_start DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - sku_name
        - month_start
- name: f_cost_totals_by_sku_day
  description: One row = a day + cloud + workspace + SKU + product + usage type's net usage. The columns
    that matter are net_usage_quantity (the corrected net) and workspace_id (NULL means an account-level
    SKU, not a missing value) - this is the finest-grain total this repo collects, and most other cost
    cuts are a slice of it.
  meta:
    query_id: cost_totals_by_sku_day
    title: Cost totals by SKU and day
    domain: cost
    tier: standard
    stars: false
    origin: vendored
    windowed: true
    is_finding: false
    empty_if:
    - ingestion_lag
    reads:
    - system.billing.usage
    requires: SELECT on system.billing; GA (system.billing.usage is generally available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    confidence: confirmed
    confidence_note: The record_type enum and product_features.is_serverless are documented system.billing.usage
      columns.
    healthy: n/a - inventory
    investigate_if: n/a - inventory
    actions: []
    next:
    - query_id: cost_by_billing_origin_product
      if: for the same window rolled up to product line only
    - query_id: cost_workspace_names
      if: to resolve workspace_id to a human name
    caveats: 'Corrections are netted by summing usage_quantity across all record_types - never filter
      to ORIGINAL only. usage_quantity is DBU/units, not dollars. usage_date is the recommended date-partition
      column. workspace_id is NULL for account-level SKUs (some MODEL_SERVING/account services) - keep
      those NULL rows, they roll up as "account-level, not workspace-attributable." SKU/product totals
      are unaffected by the finer workspace grain: sum across it to get the coarser total. Workspace names
      are not in billing.usage - resolve workspace_id to a name via cost_workspace_names or the account
      console/API. billing.usage lands with ingestion lag, so the most recent day or two in the window
      can be under-counted and appear artificially low until usage fully materializes - treat the trailing
      edge as provisional.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/cost/cost_totals_by_sku_day.sql
    order_by: usage_date DESC, workspace_id, sku_name
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - usage_date
        - cloud
        - workspace_id
        - sku_name
        - billing_origin_product
        - usage_type
        - usage_unit
        - is_serverless
- name: f_cost_unnamed_workspaces
  description: One row = a workspace billed in the last 365 days with no name in workspaces_latest - a
    deleted or inaccessible workspace. dbus_365d and net_list_cost_usd_365d are its 365-day totals; net_list_cost_usd
    is the same effective-list dollar figure but only for the selected window (:period_days) - the number
    that says whether money is still moving today. lifetime_days is last_used minus first_used plus one
    day; short_lived flags one under 30 days (spun up and torn down quickly, rather than a long-lived
    workspace that later dropped out of the account).
  meta:
    query_id: cost_unnamed_workspaces
    title: Spend on workspaces without a name
    domain: cost
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: true
    empty_if:
    - no_activity
    reads:
    - system.billing.usage
    - system.billing.list_prices
    - system.access.workspaces_latest
    requires: SELECT on system.billing, system.access; GA (system.billing.usage, system.billing.list_prices
      and system.access.workspaces_latest are generally available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days for net_list_cost_usd, priced at the effective list price the same
        way every other cost_* query here is (the 365-day totals and the 90-day WARN check are both fixed,
        not driven by this parameter)
    confidence: needs_confirmation
    confidence_note: New app-owned query, not yet run live. Builds on the effective-list-price join every
      priced cost query in this app already uses (DEC-66.1) and on cost_workspace_names's own "one row
      per system.access.workspaces_latest workspace" read; confirm on your account that a workspace_id
      you know is billed but absent from workspaces_latest (a deleted workspace, or one outside what this
      account can see) shows up here, and that an ordinary, named workspace never does.
    healthy: status = OK - no billed spend in the selected window, and last_used is more than 90 days
      ago (a closed-down workspace, kept here for reference only)
    investigate_if: status = CRITICAL - it has billed spend in the selected window (money is still going
      to a workspace nobody can see by name); WARN - no spend in the window, but last_used is within the
      last 90 days (recently active, worth a look even though nothing billed this window)
    actions:
    - look the workspace_id up in the Azure/AWS/GCP portal or the Databricks account console to find who
      owns it (free);
    - if it still exists, get it added back to this account's identity so system.access.workspaces_latest
      picks it up, or confirm it belongs to a different account or region entirely (free);
    - if it is deleted, confirm with your cloud biller that nothing still charges to it, and close out
      any resource still attached to it (config)
    next:
    - query_id: cost_workspace_names
      if: every workspace this account can see, by name
    - query_id: cost_monthly_actuals
      if: this workspace_id's own month-by-month total, run with a workspace filter
    caveats: 'POPULATION - system.billing.usage, last 365 days (datediff(current_date(), usage_date) <=
      365), workspace_id IS NOT NULL (an account-level row with no workspace_id is never a "workspace"
      and is excluded), matched against system.access.workspaces_latest on workspace_id with a LEFT JOIN
      ... IS NULL: a workspace with ANY row there, however old, never appears here. The 365-day population
      window and the 90-day WARN check are both fixed constants, not :period_days - only net_list_cost_usd
      moves with the window selector. PRICE - net_list_cost_usd and net_list_cost_usd_365d are SUM(usage_quantity
      * list_prices.pricing.effective_list.default) (DEC-66.1, the one dollar basis this app uses), never
      a negotiated or billed dollar; a SKU with no matching price row is left out of the sum (a coverage
      gap, never forced to 0), so a fully unpriced window can understate net_list_cost_usd - there is
      no price_basis column on this query, since every value here is either a real dollar estimate or
      a genuine gap, and the point of the check (is money still moving here) is unaffected either way.
      dbus_365d counts only usage_unit = ''DBU'' rows (DEC-24: a DBU and a GB-month or a token are not
      comparable quantities), while the dollar columns sum every usage_unit together (DEC-66.1: dollars
      are comparable across units). GRAIN - one row per workspace_id; first_used/last_used/active_days
      come from DISTINCT usage_date, not from any create/delete timestamp (a deleted workspace carries
      none here). SCOPE - both source tables are account-wide (GLOBAL_SOURCES), so this check is unaffected
      by which single workspace tools/snapshot.py connected through to pull the regional tables. The in-flight
      day (today) is excluded, the same `usage_date < current_date()` cut-off every other windowed cost
      query in this app uses.'
    sql_url: app/queries/app/cost/cost_unnamed_workspaces.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 ELSE 2 END, net_list_cost_usd DESC
      NULLS LAST, b.last_used DESC, b.workspace_id
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
- name: f_cost_usage_policy_coverage
  description: One row = a day + workspace + product's serverless usage cut by policy and tag coverage.
    The columns that matter are policy_coverage ('none' on a serverless row is the uncovered gap) and
    is_serverless (coverage is only meaningful for serverless spend) - tag_coverage is tracked separately,
    so a warehouse can be tagged yet still show 'none' on policy.
  meta:
    query_id: cost_usage_policy_coverage
    title: Usage policy coverage for serverless spend
    domain: cost
    tier: standard
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if: []
    reads:
    - system.billing.usage
    requires: SELECT on system.billing; GA (system.billing.usage is generally available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    confidence: confirmed
    confidence_note: usage_metadata.{usage_policy_id, budget_policy_id} and product_features.is_serverless
      are documented system.billing.usage columns.
    healthy: is_serverless = true rows show policy_coverage in ('usage_policy', 'budget_policy_legacy')
      - field heuristic.
    investigate_if: is_serverless = true AND policy_coverage = 'none' (WARN) - field heuristic; the fix
      differs by product, an uncovered notebook/job needs a usage policy attached, an uncovered SQL warehouse
      needs a tag.
    actions:
    - identify the workspace/product combination driving the uncovered DBUs from this result directly
      (free);
    - attach a usage policy to uncovered INTERACTIVE/JOBS serverless compute, or a tag to an uncovered
      SQL warehouse (config);
    - make policy/tag attachment a provisioning gate (for example via Terraform or a cluster policy) so
      new serverless usage cannot go uncovered (spend, in the sense of process investment).
    next:
    - query_id: cost_chargeback_by_tag
      if: tag coverage is tracked separately from policy coverage here
    - query_id: cost_totals_by_sku_day
      if: for the total DBU denominator
    caveats: 'usage_policy_id is current; budget_policy_id is deprecated ("use usage_policy_id instead")
      and is kept only as a fallback for older rows. Policy IDs populate only for serverless usage, so
      compute coverage is a % over serverless spend only (is_serverless = true) - non-serverless rows
      are not part of this coverage story. No system table lists policy definitions (name/owner) - that
      is Budget Policy API only. tag_coverage (whether custom_tags is non-empty) is tracked separately
      from policy_coverage on purpose: a warehouse can be tagged yet still show ''none'' on policy, so
      do not read a tagged-but-policy-uncovered SQL row as "uncovered" in the tagging sense - the fix
      differs by product (notebook/job -> policy, warehouse -> tag). workspace_id lets the gap be closed
      workspace by workspace. Restricted to usage_unit = ''DBU'', so net_usage_quantity is comparable
      across rows.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/cost/cost_usage_policy_coverage.sql
    order_by: status DESC, net_usage_quantity DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - usage_date
        - cloud
        - workspace_id
        - billing_origin_product
        - is_serverless
        - policy_coverage
        - tag_coverage
- name: f_cost_vector_search_spend
  description: One row = a workspace + Vector Search endpoint + day + usage type's spend. The columns
    that matter are usage_type (STORAGE_SPACE is DSU storage, everything else is serving DBUs - different
    units) and net_list_cost (est_usd_list, the dollarized driver behind the band, which is safe to compare
    across usage_type because it is already in dollars). price_basis (free/priced/unpriced) discloses
    whether net_list_cost is a real $0 (free-usage SKU) or understated by a pricing-coverage gap.
  meta:
    query_id: cost_vector_search_spend
    title: Vector Search spend by endpoint
    domain: cost
    tier: deep
    stars: false
    origin: vendored
    windowed: true
    is_finding: true
    empty_if:
    - no_activity
    - ingestion_lag
    reads:
    - system.billing.usage
    - system.billing.list_prices
    requires: SELECT on system.billing; GA (system.billing.usage and system.billing.list_prices are generally
      available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_endpoint_usd_per_day
      default: 25
      meaning: estimated list-price $/day on a single Vector Search endpoint that flags WARN
    - name: crit_endpoint_usd_per_day
      default: 100
      meaning: $/day that flags CRITICAL
    confidence: confirmed
    confidence_note: billing_origin_product='VECTOR_SEARCH', usage_metadata.endpoint_name, and the usage_type
      enum are confirmed in docs; pricing.effective_list.default (the effective, post-promotion list price
      - DEC-66.1) is the one dollar basis used across this app, so net_list_cost is a directional estimate
      at that price.
    healthy: net_list_cost below :warn_endpoint_usd_per_day est_usd_list/day per endpoint (field heuristic
      - tune for your account).
    investigate_if: net_list_cost at/above :warn_endpoint_usd_per_day (WARN) or :crit_endpoint_usd_per_day
      (CRITICAL) est_usd_list/day (field heuristic); or net_list_cost is NULL on a row whose price_basis
      is unpriced (NOT_ASSESSED - a pricing-coverage gap, not $0).
    actions:
    - confirm the endpoint's index is still queried by something (free) - cross-check against real traffic
      before assuming it is idle;
    - shrink or consolidate an oversized/underused index, or right-size its DSU tier (config);
    - if traffic genuinely justifies the spend, budget for it deliberately (spend).
    next:
    - query_id: cost_by_serving_endpoint
      if: for the raw, non-dollarized MODEL_SERVING + VECTOR_SEARCH usage
    - query_id: compute_serving_endpoint_cost_status
      if: to check whether a CRITICAL endpoint is actually receiving traffic before you shrink it
    caveats: 'billing_origin_product=''VECTOR_SEARCH'', usage_metadata.endpoint_name (the Vector Search
      endpoint), and the usage_type enum (STORAGE_SPACE = DSU storage, everything else = serving DBUs)
      are confirmed in the billing and vector-search cost-management documentation. STORAGE_SPACE rows
      are DSU-denominated and serving rows are DBU-denominated - different units, never summed directly;
      net_list_cost dollarizes both onto the same $ scale, which is why it (not net_usage_quantity) drives
      the band. net_list_cost uses list_prices.pricing.effective_list.default (DEC-66.1''s one basis,
      same path as cost_dollarized_by_sku_day) - this is a list/pre-discount estimate (est_usd_list);
      apply your own discount factor and never promote it to a billed headline. The price window is open-interval:
      price_end_time NULL means the currently effective price. The price join is keyed on sku_name + cloud
      + usage_unit, same as cost_dollarized_by_sku_day, so a SKU priced in two units cannot fan out. price_basis
      is ''unpriced'' when this endpoint/day/usage_type/SKU row had no matching list_prices row and is
      not a FREE_USAGE SKU (net_list_cost is then NULL, a coverage gap, never $0), ''free'' when the SKU
      is a FREE_USAGE SKU with no price row by design (a real $0), and ''priced'' otherwise. workspace_id
      is added to the SELECT and GROUP BY so the app''s workspace filter can narrow this check; it never
      changes the endpoint + day + usage_type grain, since one endpoint bills to one workspace.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/cost/cost_vector_search_spend.sql
    order_by: net_list_cost DESC NULLS LAST
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - usage_date
        - cloud
        - sku_name
        - usage_type
        - usage_unit
        - endpoint_name
        - endpoint_id
        - currency_code
