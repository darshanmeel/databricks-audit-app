- name: f_cost_failed_statement_waste
  description: 'One row = one SQL warehouse (workspace_id, warehouse_id) with at least one FAILED statement
    in the window. est_wasted_usd_list is the POSSIBLE waste: the compute Databricks attributed to those
    failed statements, at the effective list price; for a warehouse with no attributed_usage rows, their
    share of each billed hour of the warehouse, by task time (the split query_top_by_cost uses; cost_basis
    says which). Some of this is unavoidable - a statement can fail on bad input or a permission change
    - but a warehouse where failures keep costing money points at something to fix. A failed statement
    with no attributed row counts $0 (it failed before using compute). Cancelled statements are shown
    (est_canceled_usd_list) and NOT counted: cancelling a runaway query is often the fix. waste_reason
    says it in one line.'
  meta:
    query_id: cost_failed_statement_waste
    title: Failed SQL statements and the compute they used (possible waste)
    domain: cost
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: true
    empty_if:
    - schema_not_enabled
    - compute_scope_gap
    - no_activity
    reads:
    - system.query.history
    - system.billing.attributed_usage
    - system.billing.usage
    - system.billing.list_prices
    requires: 'SELECT on system.query, system.billing; GA. SCOPE: SQL warehouse statements only - serverless
      notebook and job statements have no warehouse and are not priced here'
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_waste_usd
      default: 5
      meaning: dollars of compute used by failed statements on one warehouse that flags WARN
    - name: crit_waste_usd
      default: 50
      meaning: the same that flags CRITICAL
    confidence: needs_confirmation
    confidence_note: 'active_usage_quantity and usage_metadata.dbsql_statement_id are in the system-catalog
      schema dump (T-48), but whether attributed_usage is populated on an account, and whether dbsql_statement_id
      equals query.history''s statement_id, are not yet confirmed on a live workspace (P4-04). Confirm
      on your account: 1) a statement you ran has an attributed_usage row with the same statement id;
      2) a statement that failed after running for a while has one too.'
    healthy: status = OK - failed statements on the warehouse used under :warn_waste_usd dollars of compute
      in the window (field heuristic).
    investigate_if: 'status = WARN (at/above :warn_waste_usd) or CRITICAL (at/above :crit_waste_usd) dollars
      of compute used by failed statements (field heuristic). NOT_ASSESSED is not a pass: read not_assessed_reason.'
    actions:
    - find the failing statements and their error in query_failed_queries_daily, and fix the SQL, permission
      or schema problem they point to (free);
    - add a statement timeout or a fail-fast check in the calling job or app, so a statement bound to
      fail stops early (config);
    - when the failures are out-of-memory, size the warehouse up (spend).
    next:
    - query_id: query_failed_queries_daily
      if: the failed statements by day, user and error
    - query_id: cost_dbsql_allocation_gap
      if: how much of the warehouse's usage attributed_usage covers
    caveats: 'FAILED only: execution_status FAILED counts as waste; CANCELED is shown, not counted; a
      statement''s cost is the sum of its system.billing.attributed_usage active_usage_quantity rows (usage_metadata.dbsql_statement_id
      = statement_id, same workspace), DBU only, at the effective list price (DEC-66.1) - an estimate,
      not your invoice. attributed_usage covers SQL warehouses only, so statements with no warehouse_id
      are left out. A warehouse with no attributed_usage row at all in the window is priced by run time
      instead (cost_basis = run_time_share): each billed hour''s DBUs at list price are split across the
      statements running in it by total_task_duration_ms (execution_duration_ms where missing), as query_top_by_cost
      does. Hours with no statement stay unsplit, but idle minutes inside a busy hour are shared, so on
      those warehouses it can overlap compute_warehouse_idle_minutes a little; with attributed rows it
      never does. A warehouse with neither reads NOT_ASSESSED (no_billing_rows). Statements and usage
      rows are both taken from the window''s days, so a statement that ran across midnight into today
      counts only its in-window part. Regional (query.history). No identities are emitted.'
    sql_url: app/queries/app/cost/cost_failed_statement_waste.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 WHEN 'NOT_ASSESSED' THEN 2 ELSE 3
      END, est_wasted_usd_list DESC NULLS LAST, failed_statements DESC, workspace_id, warehouse_id
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - warehouse_id
