      or its name was never captured; join cluster_id -> classic_clusters_config_current and warehouse_id
      -> sql_warehouse_config_current for full config detail. usage_quantity is DBU; usd_list is an ESTIMATE
      AT THE EFFECTIVE LIST PRICE (usage_quantity x list_prices.pricing.effective_list.default - DEC-66.1),
      not your negotiated invoice rate, priced the same way every other cost_* query in this set prices.
      price_basis is ''unpriced'' when any non-free-usage SKU billed to this resource/day had no matching
