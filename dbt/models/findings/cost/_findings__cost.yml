- name: f_cost_chargeback_by_tag
  description: One row = a day + workspace + product + tag key/value pair's DBU usage, including a row
    per tag_key = NULL where a resource carried no tags at all. The columns that matter are tag_key/tag_value
    (a real chargeback cut needs a key whose values actually vary) and net_usage_quantity - pair the NULL-tag
    rows against cost_totals_by_sku_day's total for the same window to get the untagged share.
  meta:
    query_id: cost_chargeback_by_tag
    title: DBU usage by custom tag (chargeback + coverage)
    domain: cost
    tier: standard
    stars: true
    origin: vendored
    windowed: true
    is_finding: false
    empty_if: []
    reads:
    - system.billing.usage
    requires: SELECT on system.billing; GA (system.billing.usage is generally available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    confidence: confirmed
    confidence_note: custom_tags is a documented map column on system.billing.usage.
    healthy: n/a - inventory
    investigate_if: n/a - inventory
    actions: []
    next:
    - query_id: cost_totals_by_sku_day
      if: for the total DBU denominator to compute an untagged %
    - query_id: cost_usage_policy_coverage
      if: for the serverless-specific coverage gap, tracked separately from tags
    caveats: The tag explode uses OUTER so rows with empty/NULL custom_tags still appear - that is what
      drives the "% untagged" calculation; pair with cost_totals_by_sku_day for the total. custom_tags
      keys vary per customer (it is a dynamic map) - do not hardcode key names when reading this. Tags
      originate from both compute-resource tags and serverless usage policies. Watch for the case where
      one umbrella tag key covers close to 100% of DBUs yet gives no team-level chargeback because it
      only ever takes a single value - a tag key is only chargeback-usable if it has more than one distinct
      tag_value in your results, so do not read "100% tagged" alone as "100% chargeback-ready"; count
      distinct tag_values per tag_key yourself. workspace_id lets chargeback be cut per workspace.
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/cost/cost_chargeback_by_tag.sql
    order_by: usage_date DESC, workspace_id, tag_key, tag_value
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - usage_date
        - cloud
        - workspace_id
        - billing_origin_product
        - tag_key
        - tag_value
- name: f_cost_chargeback_by_tag_value
  description: One row = one workspace's value of one custom_tags key (tag_key, tag_value), with usage
    in the window, OR that workspace + key's own "(other)" rollup (every value beyond the top :top_values_per_key
    by current-period spend), OR its own "(untagged)" row (usage whose custom_tags map has no entry for
    this key at all, even when the resource carries other, unrelated tags) - every real tag key found
    anywhere in a workspace during the window gets its own top values + (other) + (untagged) set there,
    so a multi-tagged resource (env AND cost_center AND team, say) contributes to every one of those keys'
    own totals, not just one. A NULL workspace_id is a genuine account-level usage row (some networking/storage
    SKUs bill with no workspace_id at all), kept as its own line. pooled_count is how many distinct values
    an "(other)" row folds in (NULL on every other row, including "(untagged)", which is one value, not
    a pool). usd_list is this row's current-period dollars at the effective list price (DEC-66.1), summed
    across every usage_unit (already-priced dollars, unlike a raw quantity, add up fine across units);
    share_of_total_pct is its share of the account's WHOLE current-period spend (across every workspace,
    unchanged by this row now being workspace-scoped - see caveats). prev_usd_list / change_usd_list /
    change_pct compare it against the equal-length window right before. price_basis discloses pricing
    coverage across both windows combined; not_assessed_reason explains a NOT_ASSESSED row.
  meta:
    query_id: cost_chargeback_by_tag_value
    title: Chargeback by every custom tag value, current period versus the one before it
    domain: cost
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: true
    empty_if:
    - no_activity
    reads:
    - system.billing.usage
    - system.billing.list_prices
    requires: SELECT on system.billing; GA (system.billing.usage and system.billing.list_prices are generally
      available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days - the current period is the most recent N days, the previous period
        is the equal-length N days immediately before it
    - name: top_values_per_key
      default: 10
      meaning: the most expensive tag values kept per tag_key before the rest are rolled into that key's
        own "(other)" row
    - name: warn_increase_pct
      default: 25
      meaning: percent increase in a row's list-priced spend, current period over previous, at/above which
        WARN
    - name: crit_increase_pct
      default: 50
      meaning: percent increase at/above which CRITICAL
    - name: min_spend_usd
      default: 20
      meaning: the current period's own list-priced spend must be at least this before a percent change
        is judged
    confidence: needs_confirmation
    confidence_note: New app-owned query, not yet run live. Generalises cost_chargeback_by_allocation_tag's
      cost_center/team mechanism to every tag key an account actually uses (no per-account key configuration
      needed), reusing the same custom_tags explode cost_chargeback_by_tag already proves works against
      a live workspace and the exact current-vs-previous-window contract cost_period_over_period established;
      confirm on your account that a tag key/value you know carries real spend shows up with the right
      dollar figure and the right (other)/(untagged) split.
    healthy: status OK - no increase at/above :warn_increase_pct, or the row's own current-period spend
      (a real $0 counts) sits below :min_spend_usd. The comparison is judged per workspace, not account-wide
      (see caveats), so a tag value's account-wide swing may not itself flag.
    investigate_if: 'CRITICAL - the increase is at/above :crit_increase_pct on at least :min_spend_usd
      of current spend, or the row is brand-new spend above the floor with nothing in the previous period
      to compare against; WARN - at/above :warn_increase_pct - this applies to a growing "(untagged)"
      row exactly like any real value, so a widening tagging gap shows up as a real WARN/CRITICAL, not
      just a percentage aside. NOT_ASSESSED - read not_assessed_reason: ''previous_window_not_covered''
      when the account''s own earliest recorded usage does not reach back far enough to cover the previous
      window; ''current_period_unpriced'' / ''previous_period_ unpriced'' when that side''s whole spend
      for this row could not be priced at all.'
    actions:
    - open cost_chargeback_by_allocation_tag for the canonical cost_center/team cut of the same spend,
      or cost_chargeback_by_job / cost_chargeback_by_cluster to find which resource is driving a growing
      (untagged) row (free);
    - tag the untagged resource, or fix a value that is really the same team spelled two ways (config);
    - if the growth on a real value is deliberate, set or tighten a budget policy for it before it compounds
      another period (config).
    next:
    - query_id: cost_chargeback_by_allocation_tag
      if: the canonical cost_center/team roll-up of the same data
    - query_id: cost_chargeback_reconcile
      if: this view's own total against the account's billing total
    - query_id: cost_chargeback_by_job
      if: the job behind a growing value
    caveats: DEC-66.1 - the effective list price only, never a negotiated rate; the same basis on both
      windows. WORKSPACE - the grain is now workspace + tag_key + tag_value, so the same tag value appears
      once per workspace that used it; share_of_total_pct's own denominator stays the account's whole
      current-period spend across every usage_unit combined (unchanged from before this split - summing
      a value's rows back across workspaces reproduces its old account-wide share), but the (untagged)
      row's own subtraction is now done within ONE workspace (that workspace's own total minus that workspace's
      own tagged-with-this-key total), so an "(untagged)" row reads "untagged spend in this workspace",
      not "this workspace's share of the account's untagged pool". :top_values_per_key is likewise applied
      per (workspace, tag_key), so a value ranked in the top N for one workspace can still be folded into
      another workspace's own (other) row. Both totals are safe to sum across usage_unit because dollars,
      unlike a raw usage_quantity, add up across units; a tag search over the raw quantity would need
      to stay scoped per usage_unit instead. An account with NO custom_tags at all anywhere in the window
      returns no rows (there is no key to report on) - see cost_totals_by_sku_day or overview_spend_estimate
      for the account's raw total in that case. The literal tag values "(other)" and "(untagged)" are
      this query's own rollup markers, not real tag values - a genuine tag value that happens to be spelled
      exactly "(other)" or "(untagged)" would collide with them (use is_other / is_untagged, never a string
      match on tag_value, to tell them apart). is_other always reads status OK - a rollup of many small
      values, some past :top_values_per_key, should never itself become a finding; only individual values
      and (untagged) are flagged. This is a chargeback reference, not a fix for a listed problem. Corrections
      are netted (SUM across all record_types - never filter to ORIGINAL only). The current day is excluded
      from both windows, same as every other windowed cost query.
    sql_url: app/queries/app/cost/cost_chargeback_by_tag_value.sql
    order_by: workspace_id, tag_key, is_untagged, is_other, CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN'
      THEN 1 WHEN 'NOT_ASSESSED' THEN 2 ELSE 3 END, usd_list DESC NULLS LAST
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - tag_key
        - tag_value
- name: f_cost_chargeback_by_warehouse
  description: 'One row = one SQL warehouse''s spend in the selected window against the equal-length window
    right before it, both at the effective list price (DEC-66.1), plus billed_hours (how many distinct
    hourly billing buckets it billed something in) and queries/usd_per_1000_queries (a cost-per-query
    efficiency figure, from system.query.history). usd_list and prev_usd_list are the two totals; change_usd_list
    and change_pct compare them. price_basis discloses pricing coverage across both windows combined;
    not_assessed_reason explains a NOT_ASSESSED row. is_other=true marks up to two pooled rows: one for
    every status=OK warehouse ranked below :top_n by current spend (reads status OK), one for every status=NOT_ASSESSED
    warehouse ranked below :top_n (reads status NOT_ASSESSED, not_assessed_reason NULL - the pooled rows
    can carry different reasons); either is present only when pooled_count > 0 for that status (workspace_id/warehouse_id
    NULL on both). share_of_total_pct still adds up to ~100% across every row including these. Warehouse
    name/type/size are not resolved here - join sql_warehouse_config_current on warehouse_id.'
  meta:
    query_id: cost_chargeback_by_warehouse
    title: Chargeback by SQL warehouse, with change vs the previous period
    domain: cost
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: true
    empty_if:
    - ingestion_lag
    - no_activity
    reads:
    - system.billing.usage
    - system.billing.list_prices
    - system.query.history
    requires: SELECT on system.billing and system.query; GA (system.billing.usage/list_prices are generally
      available; system.query.history is GA but covers SQL warehouses only - the queries and usd_per_1000_queries
      columns are NULL/0 for a warehouse with no captured query history)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days - the current period is the most recent N days, the previous period
        the equal-length N days before it
    - name: warn_increase_pct
      default: 25
      meaning: percent increase in list-priced spend, current period over previous, at/above which WARN
    - name: crit_increase_pct
      default: 50
      meaning: percent increase at/above which CRITICAL
    - name: min_spend_usd
      default: 20
      meaning: the current period's own list-priced spend must be at least this before a percent change
        is judged
    - name: top_n
      default: 20
      meaning: how many status=OK, and separately how many status=NOT_ASSESSED, warehouses ranked by current-period
        usd_list descending are kept as their own row before the rest of that same status are pooled into
        their own is_other=true row - a real finding (WARN/CRITICAL) is always kept as its own row, never
        pooled, so it can never be hidden behind the cap. Needs 2x :period_days of billing history in
        the account for the previous-period comparison
    confidence: needs_confirmation
    confidence_note: New app-owned query, not yet run live. Reuses the effective-list-price join every
      priced cost query in this app already uses (DEC-66.1) and cost_period_over_period's own WARN/CRITICAL
      band and NOT_ASSESSED coverage guard (DEC-62/DEC-64), at the (workspace_id, warehouse_id) grain;
      billed_hours is COUNT(DISTINCT usage_start_time) over ORIGINAL billing rows only (one hourly billing-bucket
      boundary counted once, however many SKU rows - a base-DBU row and a serverless/photon surcharge
      row for the same hour - bill inside it), never SUM(usage_end_time - usage_start_time), which double-counts
      a hour with more than one billed SKU row. Confirm on your account that a warehouse you know grew
      or shrank between two recent equal periods matches change_pct, and that a warehouse's own billed_hours
      matches its known up-time in whole billed hours.
    healthy: status OK - no increase at/above :warn_increase_pct, or the row's own current-period spend
      (a real $0 counts) sits below :min_spend_usd.
    investigate_if: 'CRITICAL - the increase is at/above :crit_increase_pct on at least :min_spend_usd
      of current spend, or brand-new spend above the floor with nothing in the previous period to compare
      against. WARN - at/above :warn_increase_pct. NOT_ASSESSED - read not_assessed_reason: ''previous_window_not_covered''
      when the account''s own earliest recorded usage does not reach back far enough to cover the previous
      window at this window length; ''current_period_unpriced'' / ''previous_period_unpriced'' when that
      side''s whole spend could not be priced at all. A row with is_other=true is always OK or NOT_ASSESSED,
      never WARN/CRITICAL (see caveats).'
    actions:
    - open sql_warehouse_config_current for this warehouse_id to see its size, auto-stop and channel (free);
    - open compute_warehouse_idle_gaps for the same warehouse to see whether the spend increase tracks
      more real query load or more idle running time (free);
    - if the growth is deliberate, right-size or scale down the warehouse's config, or set a budget policy,
      before it compounds another period (config, or spend if intentional).
    next:
    - query_id: sql_warehouse_config_current
      if: to resolve warehouse_id to a name, size and config
    - query_id: compute_warehouse_idle_gaps
      if: for this warehouse's own idle-time detail
    - query_id: cost_period_over_period
      if: for the same window cut by workspace and product line instead
    caveats: DEC-66.1 - the effective list price only, never a negotiated rate; the same basis on both
      windows. DEC-62 - both windows are measured, never projected or scaled. This needs the account's
      own billing history to reach back 2x :period_days for a real previous-period comparison (DEC-64);
      short of that, every individual warehouse row reads NOT_ASSESSED (previous_window_not_covered) -
      the NOT_ASSESSED is_other row then pools all but the top :top_n of them by current spend, same as
      an OK list would. POOLING - the OK is_other row only ever pools warehouses that were ALREADY status=OK
      on their own, and always reads status OK itself, however large the combined dollars; the NOT_ASSESSED
      is_other row only ever pools warehouses that were ALREADY status=NOT_ASSESSED. Neither can hide
      a WARN/CRITICAL warehouse, which always keeps its own row regardless of :top_n. billed_hours/queries
      on either is_other row are the SUM of the pooled warehouses' own billed_hours/queries (a plain total,
      not a deduplicated hour count across warehouses). price_basis is computed over BOTH windows combined
      - 'unpriced' when any non-free-usage SKU in either window had no matching list_prices row, 'free'
      when every matched SKU is a FREE_USAGE SKU, 'priced' otherwise. Corrections are netted (SUM across
      all record_types - never filter to ORIGINAL only, except billed_hours which is ORIGINAL-only by
      design - see confidence_note). The current day is excluded from both windows, since billing.usage
      lands with ingestion lag and the trailing day is provisional.
    sql_url: app/queries/app/cost/cost_chargeback_by_warehouse.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 WHEN 'NOT_ASSESSED' THEN 2 ELSE 3
      END, is_other, change_usd_list DESC NULLS LAST, workspace_id, warehouse_id
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - warehouse_id
        - status
