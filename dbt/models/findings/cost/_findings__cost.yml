- name: f_cost_period_over_period
  description: One row = a workspace + billing_origin_product's spend in the selected window against the
    equal-length window immediately before it, both priced at the effective list price (DEC-66.1). est_current_usd_list
    and est_previous_usd_list are the two totals; est_change_usd_list and change_pct compare them. price_basis
    (free/priced/unpriced) discloses pricing coverage across both windows combined; not_assessed_reason
    explains a NOT_ASSESSED row.
  meta:
    query_id: cost_period_over_period
    title: Spend this period versus the equal-length period before it, by workspace and product line
    domain: cost
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: true
    empty_if:
    - ingestion_lag
    - no_activity
    reads:
    - system.billing.usage
    - system.billing.list_prices
    requires: SELECT on system.billing; GA (system.billing.usage and system.billing.list_prices are generally
      available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days - the current period is the most recent N days, the previous period
        is the equal-length N days immediately before it
    - name: warn_increase_pct
      default: 25
      meaning: percent increase in list-priced spend, current period over previous, at/above which WARN
    - name: crit_increase_pct
      default: 50
      meaning: percent increase at/above which CRITICAL
    - name: min_spend_usd
      default: 50
      meaning: the current period's own list-priced spend must be at least this before a percent change
        is judged - below it the row reads OK regardless of the swing, since a percent figure on a tiny
        base is noise
    confidence: needs_confirmation
    confidence_note: New app-owned query, not yet run live. Builds on the effective-list-price join every
      priced cost query in this app already uses (DEC-66.1) and on the "compare two measured periods,
      never scale one" rule DEC-62 and lakeflow_job_duration_regression already established for a within-window
      split; confirm on your account that a workspace/product pair you know grew or shrank between two
      recent equal periods matches this query's change_pct.
    healthy: status OK - no increase at/above :warn_increase_pct, or the row's own current-period spend
      (a real $0 counts) sits below :min_spend_usd
    investigate_if: 'CRITICAL - the increase is at/above :crit_increase_pct on at least :min_spend_usd
      of current spend, or the row is brand-new spend above the floor with nothing in the previous period
      to compare against (there is no honest percentage for a jump from zero, so it reads CRITICAL outright);
      WARN - at/above :warn_increase_pct. NOT_ASSESSED - read not_assessed_reason: ''previous_window_not_covered''
      when the whole account''s own earliest recorded usage (across every workspace and product, not just
      this row) does not reach back far enough to cover the previous window (DEC-64), so no comparison
      anywhere can be trusted at this window length; ''current_period_unpriced'' when ANY of this row''s
      current-period usage could not be priced (at least one current-period SKU was unmatched in list_prices
      and was not FREE_USAGE), so est_current_usd_list understates the true figure and no verdict is safe
      to judge on it, even when the rest of the period priced fine; ''previous_period_unpriced'' is the
      same gap on the previous period''s own side.'
    actions:
    - open cost_dollarized_by_sku_day for this workspace and window, sorted by day and SKU, to see which
      SKU actually moved (free);
    - check cost_monthly_actuals for the same workspace/product to see whether this is a genuine trend
      or one busy stretch inside an otherwise flat month (free);
    - if the increase is real usage rather than a one-off backfill or restatement, the matching domain
      tab (Jobs, Serving, Compute) names the resource driving it, and right-sizing or scaling it down
      is the fix (config, or spend if the extra usage is deliberate growth).
    next:
    - query_id: cost_dollarized_by_sku_day
      if: for the SKU behind the move
    - query_id: cost_monthly_actuals
      if: for the calendar-month trend
    - query_id: overview_spend_estimate
      if: for the account's current headline number
    caveats: 'DEC-66.1 - the effective list price only, never a negotiated rate; the same basis on both
      windows, so the comparison is apples-to-apples even though neither total is a real bill. DEC-62
      - both windows are measured, never projected or scaled; a 7-day window is compared against the 7
      days before it, never annualized. DEC-64 - NOT_ASSESSED (previous_window_not_covered) fires from
      the WHOLE ACCOUNT''s own earliest recorded usage_date across system.billing.usage (never a single
      workspace/product''s own history, so a genuinely brand-new product or workspace is judged the same
      as everything else, never withheld just because it personally lacks older rows): when that account-wide
      date is more recent than the previous window''s start, the export itself cannot cover the comparison
      for ANY row at this window length, and every row reads NOT_ASSESSED rather than a percent jump built
      on a partial history. A workspace/product with usage in only one of the two windows still gets a
      real row once the account-wide history clears the coverage check: the missing side sums to a genuine
      $0, never NOT_ASSESSED - that is an actual appearance or disappearance of spend, not a coverage
      gap: a side''s own SUM is resolved to a real 0 whenever it has no matching rows at all (that side''s
      own unpriced-quantity is 0 too), never left as the NULL an empty SQL SUM naturally produces. NOT_ASSESSED
      (current_period_unpriced / previous_period_unpriced) fires separately, per row and per side, whenever
      that side has ANY unpriced usage at all (see investigate_if) - even a side that is mostly priced,
      since a partially-priced total is a coverage gap, not a trustworthy figure to judge or compare,
      so it is withheld rather than shown as a misleading verdict on an understated number. price_basis
      is computed over BOTH windows combined - ''unpriced'' when any non-free-usage SKU in either window
      had no matching list_prices row (the totals then understate cost), ''free'' when every matched SKU
      is a FREE_USAGE SKU (a real $0), ''priced'' otherwise. Corrections are netted (SUM across all record_types
      - never filter to ORIGINAL only). The current day is excluded from both windows, same as every other
      windowed cost query, since billing.usage lands with ingestion lag and the trailing day is provisional.'
    sql_url: app/queries/app/cost/cost_period_over_period.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 WHEN 'NOT_ASSESSED' THEN 2 ELSE 3
      END, est_change_usd_list DESC, workspace_id, billing_origin_product
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - billing_origin_product
- name: f_cost_premium_serverless_photon
  description: One row = a workspace + day + cloud + SKU + product's usage cut by serverless/Photon/tier
    choice. The columns that matter are is_serverless, is_photon, and the *_tier columns (which premium
    lever, if any, applied) against net_usage_quantity (how much usage ran through that lever).
  meta:
    query_id: cost_premium_serverless_photon
    title: Usage by serverless / Photon / tier premium lever
    domain: cost
    tier: standard
    stars: true
    origin: vendored
    windowed: true
    is_finding: false
    empty_if: []
    reads:
    - system.billing.usage
    requires: SELECT on system.billing; GA (system.billing.usage is generally available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    confidence: confirmed
    confidence_note: product_features.{is_serverless, is_photon, jobs_tier, sql_tier, dlt_tier, performance_target}
      are documented system.billing.usage columns.
    healthy: The lever columns (is_serverless / is_photon / *_tier / performance_target) mostly null or
      false for a workload that has not opted into a premium path, with net_usage_quantity concentrated
      on the classic/base rows - a qualitative judgement call, since usage_unit is not restricted here
      and volumes are not comparable across different sku_name families.
    investigate_if: A sku_name/product with a large, growing net_usage_quantity on rows where is_serverless/is_photon
      = true or a *_tier is a premium tier - compare it against that SAME sku_name's classic rows before
      assuming the premium is unjustified, since raw volumes are not comparable across different SKUs'
      units.
    actions:
    - confirm the workload actually needs the premium tier (serverless start-up latency, Photon vectorization,
      DLT Advanced) rather than defaulting to it (free);
    - step a workload down to Standard tier or classic compute where the premium is not earning its keep
      (config);
    - if the premium genuinely pays for itself in latency/throughput, budget for it deliberately rather
      than discovering it after the fact (spend).
    next:
    - query_id: cost_by_compute_resource
      if: to see which specific clusters/warehouses carry the premium usage
    - query_id: cost_serving_mode_by_endpoint
      if: for the model-serving-specific premium/cost-mode cut
    caveats: product_features is sparse - subfields are null where the serverless/classic/Photon/tier
      choice does not apply; non-serverless workloads have performance_target = null. is_photon can be
      cross-checked via sku_name LIKE '%(PHOTON)%' as a string-pattern heuristic. Restricted to usage_unit
      = 'DBU', so net_usage_quantity is comparable across sku_name families within this result - there
      is still no single dollar threshold that is safe to apply uniformly here, so no automated status
      band is computed and rows are ordered for readability, not severity. Pair with list_prices to dollarize
      the premium delta yourself. workspace_id is added to the SELECT and GROUP BY so the app's workspace
      filter can narrow this check; it does not change any other column's meaning.
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/cost/cost_premium_serverless_photon.sql
    order_by: usage_date DESC, sku_name, cloud
  columns:
