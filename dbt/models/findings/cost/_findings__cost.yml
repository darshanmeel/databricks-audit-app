- name: f_cost_by_compute_resource
  description: 'One row = a day + workspace + compute resource''s DBU cost. The columns that matter are
    cluster_id/warehouse_id/instance_pool_id (which resource, resolved to a name alongside it) and net_usage_quantity
    (its DBU burn for that day, priced at usd_list) - a resource that stays above the WARN/CRITICAL band
    day after day is the one worth right-sizing or decommissioning first. status is a SPEND-MAGNITUDE
    rank, not a waste signal: cross-check compute_idle_node_ratio (clusters) or compute_warehouse_idle_minutes
    (warehouses) before treating a flagged row as wasteful rather than simply large.'
  meta:
    query_id: cost_by_compute_resource
    title: DBU cost by cluster, warehouse, and pool
    domain: cost
    tier: standard
    stars: false
    origin: vendored
    windowed: true
