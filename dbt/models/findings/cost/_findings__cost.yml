- name: f_cost_chargeback_identity_by_source
  description: 'One row = one (identity_run_as, source) - PLUS workspace_id/warehouse_id on sql_warehouse
    rows - with attributed spend in the current window against the equal-length window right before it.
    There is no separate ''total'' row per identity: sum this query''s own rows for a given identity_run_as
    yourself if you want one. identity_run_as is the RAW, UNMASKED principal (unlike cost_chargeback_by_identity''s
    hashed run_as) - this is a raw chargeback/billing extract, meant to run under the same SELECT on system.billing
    a masked report would also need. usd_list/prev_usd_list are the two totals; change_usd_list and change_pct
    compare them. is_other=true marks up to two pooled rows: one for every status=OK row ranked below
    :top_n by current spend (reads status OK), one for every status=NOT_ASSESSED row ranked below :top_n
    (reads status NOT_ASSESSED, not_assessed_reason NULL); either is present only when pooled_count >
    0 for that status (identity_run_as/source/workspace_id/ warehouse_id all NULL on both). share_of_total_pct
    still adds up to ~100% including these. Warehouse name is not resolved here - join sql_warehouse_config_current
    on warehouse_id.'
  meta:
    query_id: cost_chargeback_identity_by_source
    title: Chargeback by identity (user or service principal), split by source, with change vs the previous
      period
    domain: cost
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: true
    empty_if:
    - ingestion_lag
    - no_activity
    reads:
    - system.billing.usage
    - system.billing.list_prices
    - system.query.history
    - system.compute.clusters
    requires: 'SELECT on system.billing, system.query and system.compute; GA (system.billing.usage/ list_prices
      and system.compute.clusters are generally available; system.query.history is GA but SCOPE: SQL warehouses
      only - classic, pro and serverless. Serverless compute for notebooks and jobs has no warehouse_id
      and is not covered by the sql_warehouse source''s duration split)'
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_increase_pct
      default: 25
      meaning: percent increase in list-priced spend, current period over previous, at/above which WARN
    - name: crit_increase_pct
      default: 50
      meaning: percent increase at/above which CRITICAL
    - name: min_spend_usd
      default: 20
      meaning: the current period's own list-priced spend must be at least this before a percent change
        is judged
    - name: top_n
      default: 20
      meaning: how many status=OK, and separately how many status=NOT_ASSESSED, (identity, source[, warehouse])
        rows ranked by current-period usd_list descending are kept as their own row before the rest of
        that same status are pooled into their own is_other=true row - a real finding (WARN/CRITICAL)
        is always kept as its own row, never pooled. Needs 2x :period_days of billing history in the account
        for the previous-period comparison
    confidence: needs_confirmation
    confidence_note: 'New app-owned query, not yet run live. Splits spend across three sources that never
      overlap so nothing is double-counted: sql_warehouse (a SQL warehouse''s DBU cost split across identities
      by their share of that warehouse-day''s SUMMED system.query.history total_duration_ms, keeping workspace_id/warehouse_id
      as its own dimension), jobs (billed jobs-compute DBU usage, identity via COALESCE(owned_by, run_as,
      ''unknown'')), and other (everything else - serverless/notebook/all-purpose-interactive - identity
      via COALESCE(owned_by, run_as, the cluster''s own latest owned_by for an all-purpose cluster_id,
      ''unknown'')). Reuses the effective-list-price join every priced cost query in this app already
      uses (DEC-66.1) and cost_period_over_period''s own WARN/CRITICAL band (DEC-62); the NOT_ASSESSED
      pricing-coverage gate is computed once per SOURCE (not per identity - see caveats), unlike the other
      cost_chargeback_by_* checks in this app, which compute it per row. Confirm on your account: an identity
      you know grew spend between two recent equal periods matches change_pct, and that all-purpose-cluster
      usage (identity_metadata.run_as blank there per Databricks'' own documentation) resolves through
      owned_by or the cluster fallback instead of collapsing to ''unknown''.'
    healthy: status OK - no increase at/above :warn_increase_pct, or the row's own current-period spend
      (a real $0 counts) sits below :min_spend_usd, and its source's pricing coverage is not a full gap
      (see investigate_if).
    investigate_if: 'CRITICAL - the increase is at/above :crit_increase_pct on at least :min_spend_usd
      of current spend, or brand-new spend above the floor with nothing in the previous period to compare
      against - a growing ''unknown'' identity is judged the same way, so a widening attribution gap shows
      up as a real WARN/CRITICAL. WARN - at/above :warn_increase_pct. NOT_ASSESSED - read not_assessed_reason:
      ''previous_window_not_covered'' when the account''s own earliest recorded usage does not reach back
      far enough to cover the previous window at this window length (every row, every source); ''current_period_unpriced''
      / ''previous_period_unpriced'' when that ROW''s OWN SOURCE had no priced spend at all, account-wide,
      on that side of the window - every row of that source reads NOT_ASSESSED together (see caveats).
      A row with is_other=true is always OK or NOT_ASSESSED, never WARN/CRITICAL.'
    actions:
    - open cost_chargeback_by_allocation_tag or the Cost > Allocation tab to see which cost_center/team
      this identity's spend rolls up under (free);
    - for a sql_warehouse row, open sql_warehouse_config_current for warehouse_id to see the warehouse's
      own size/config (free);
    - if the growth is deliberate, confirm the identity still needs that level of access/spend, or set
      a budget policy, before it compounds another period (config, or spend if intentional).
    next:
    - query_id: cost_chargeback_by_identity
      if: the masked, day-level cut of the same identities
    - query_id: sql_warehouse_config_current
      if: to resolve a sql_warehouse row's warehouse_id
    - query_id: cost_chargeback_by_allocation_tag
      if: the cost_center/team cut of the same spend
    caveats: 'MASKING - no masking is applied here (unlike cost_chargeback_by_identity''s hash): a chargeback-by-person
      report is meaningless once the person is hashed, so this is a raw extract for FinOps/billing use,
      gated on the same SELECT on system.billing a masked report would also need; the app''s own optional
      display-time user-masking setting (off by default) still applies when it renders this query''s identity_run_as/identity_type
      columns, exactly as it would any other user-identity column. SHARE OF BUSY TIME (sql_warehouse source)
      - each identity''s share of a warehouse-day is its share of that day''s SUMMED query.history total_duration_ms
      (concurrent queries are not merged into wall-clock time) - a proportional-use estimate, not a wall-clock
      idle/busy split (see compute_warehouse_idle_minutes for that); a warehouse-day with billed dollars
      but no recorded query at all attributes that whole day to ''unknown'' rather than dropping it. PRICING
      GATE - price_basis and the current_period_unpriced/previous_period_unpriced NOT_ASSESSED reasons
      are computed ONCE PER SOURCE (sql_warehouse/jobs/other), from that source''s own raw usage rows,
      BEFORE any identity split - never per identity - because splitting an already-summed unpriced/priced
      quantity by duration share would misrepresent it; every row of one source therefore shares that
      source''s own price_basis and NOT_ASSESSED gate, the same design cost_chargeback_by_identity''s
      three-source split already used, now extended to also gate the PREVIOUS window (the earlier version
      of this check only checked the current window, which could misread a genuinely unpriced previous
      period as brand-new CRITICAL spend). POOLING - the OK is_other row only ever pools rows that were
      ALREADY status=OK on their own, and always reads status OK itself, however large the combined dollars;
      the NOT_ASSESSED is_other row only ever pools rows that were ALREADY status=NOT_ASSESSED (its own
      not_assessed_reason is NULL - the pooled rows can carry different reasons; raise :top_n to see them
      individually). Neither can hide a WARN/CRITICAL row. Each one''s own price_basis is ''unpriced''
      if any pooled row''s own source was partially unpriced, ''free'' only if every pooled row was ''free'',
      else ''priced''. Corrections are netted (SUM across all record_types - never filter to ORIGINAL
      only). The current day is excluded from every window, since billing.usage lands with ingestion lag
      and the trailing day is provisional. This is account-wide (no separate per-workspace identity total)
      except that sql_warehouse rows keep their own workspace_id/warehouse_id.'
    sql_url: app/queries/app/cost/cost_chargeback_identity_by_source.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 WHEN 'NOT_ASSESSED' THEN 2 ELSE 3
      END, is_other, change_usd_list DESC NULLS LAST, identity_run_as, source
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - identity_run_as
        - source
        - workspace_id
        - warehouse_id
        - status
- name: f_cost_chargeback_reconcile
  description: 'One row = one named chargeback cut''s own recomputed total against ONE workspace''s own
    billing total for the window (both priced at the effective list price, DEC-66.1), or the account-level
    bucket for usage that carries no workspace_id at all. Only two checks have coverage_type ''full''
    and a real gap verdict: price_join_fanout (not a named chargeback view but the shared price join itself
    - it compares the plain join every chargeback query in this set uses against a de-duplicated, at-most-one-price-match-per-usage-row
    version of the same total; every priced total in this app already dollarizes each usage row once,
    at its one latest-matching price, so a positive gap here measures overlapping rows in Databricks''
    own system.billing.list_prices - a source data-quality signal, not an error in this app''s own totals)
    and by_user (the coarse warehouse-DBU / job-DBU / neither three-bucket split - a positive gap means
    a usage row matched more than one bucket, most often a job task billed on a SQL warehouse carrying
    both a warehouse_id and a job_id). by_service/by_sku/by_workspace are not checked here: each simply
    re-sums the exact same priced rows this file already sums by a different key, so their own gap is
    always algebraically 0 - a passing check with no power to catch anything, dropped rather than kept
    for a false sense of coverage. ''overlapping'' (by_tag_value) means a usage row can legitimately land
    in more than one group (a resource with several tags), so view_total is EXPECTED to exceed the billing
    total - coverage_pct over 100% there is normal, not a bug; ''partial'' (by_warehouse, by_job, by_cluster)
    means the cut is scoped to only some compute by design - coverage_pct shows how much of the account''s
    total it reaches, with no gap verdict.'
  meta:
    query_id: cost_chargeback_reconcile
    title: Chargeback self-check - the shared price join and the by-user split against the billing total
    domain: cost
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: true
    empty_if: []
    reads:
    - system.billing.usage
    - system.billing.list_prices
    requires: SELECT on system.billing; GA (system.billing.usage and system.billing.list_prices are generally
      available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days, this single-window check only (no previous-period comparison)
    - name: gap_warn_pct
      default: 1
      meaning: percent of the billing total a full-coverage check's own gap must reach before WARN
    - name: gap_crit_pct
      default: 5
      meaning: percent at/above which CRITICAL
    confidence: needs_confirmation
    confidence_note: New app-owned query, not yet run live. Reuses the effective-list-price join every
      priced cost query in this app already uses (DEC-66.1); confirm each 'full' check reads 0.0 gap_usd_list
      on a live account (algebraically guaranteed for a bug-free implementation - each is the same priced
      usage rows, grouped a different way, with no extra row filter).
    healthy: a 'full' check with gap_usd_list at/below :gap_warn_pct of that row's own billing total;
      any 'overlapping' or 'partial' check (informational only, always OK)
    investigate_if: CRITICAL - a 'full' check's |gap_pct| at/above :gap_crit_pct; WARN - at/above :gap_warn_pct.
      Judged per workspace (see caveats), so a small per-workspace billing total can swing gap_pct further
      than the same dollar gap would account-wide. NOT_ASSESSED - that row's own billing total is NULL
      or 0 (nothing to reconcile against, at any window length).
    actions:
    - a nonzero gap on by_user means the three-bucket split (warehouse DBU + job DBU + neither) no longer
      partitions every priced row - check for a usage row carrying both a warehouse_id and a job_id, and
      compare against cost_chargeback_by_allocation_tag's usage_unit grouping for a sanity check (free);
    - a positive price_join_fanout gap means system.billing.list_prices has an overlapping validity window
      for some sku_name/cloud/ usage_unit - report it as a system-table data-quality issue; every chargeback
      total in this app already prices each usage row once, at the latest matching price, so this gap
      is never an error in those totals to go fix (free).
    next:
    - query_id: cost_chargeback_by_job
      if: ''
    - query_id: cost_chargeback_by_cluster
      if: ''
    - query_id: cost_chargeback_by_tag_value
      if: ''
    - query_id: cost_chargeback_by_allocation_tag
      if: the individual cuts this file cross-checks
    caveats: Every check here recomputes its OWN total from THIS file's own raw_priced CTE, grouped the
      SAME way the named cut groups it - it proves that cut's own grouping logic still partitions (or,
      for by_tag_value, still legitimately overlaps) the same rows this file sees, not that raw_priced's
      own dollar-per-row math is correct (a bug baked into how many dollars a row is worth in the first
      place would pass every check here identically, since they all share this same CTE). by_user here
      is the coarse three-bucket split only (warehouse DBU + job DBU + neither), not a reproduction of
      any per-identity duration-weighted split a richer by_user chargeback view might compute - a bug
      inside such a split, if one exists elsewhere in this app, would not surface as a gap here. WORKSPACE
      - every total here is now computed per workspace_id (a NULL workspace_id is the same genuine account-level
      bucket the chargeback cuts themselves keep), so this file reconciles cost_chargeback_by_service's
      or cost_chargeback_by_sku's own workspace-scoped rows against THAT workspace's own billing total,
      not the account's whole total; summing gap_usd_list back across every workspace for a 'full' check
      reproduces the old account-wide gap. DEC-66.1 - the effective list price only, never a negotiated
      rate. Corrections are netted (SUM across all record_types - never filter to ORIGINAL only). The
      current day is excluded, same as every other windowed cost query.
    sql_url: app/queries/app/cost/cost_chargeback_reconcile.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 WHEN 'NOT_ASSESSED' THEN 2 ELSE 3
      END, c.coverage_type, c.check_name, c.workspace_id
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - check_name
- name: f_cost_cloud_infra
  description: One row = a workspace + day + cloud + currency's estimated cost at the effective list price.
    The column that matters is net_list_cost, an estimate = usage_quantity x list_prices.pricing.effective_list.default
    matched to the price row that was active on that usage row - not a substitute for your cloud provider's
    own cost export. price_basis (free/priced/unpriced) discloses whether that day's total mixes free-usage
    SKUs or a pricing-coverage gap.
  meta:
    query_id: cost_cloud_infra
    title: Estimated list-price cost by cloud (DBU-derived)
    domain: cost
    tier: deep
    stars: false
    origin: vendored
    windowed: true
    is_finding: false
    empty_if: []
    reads:
    - system.billing.usage
    - system.billing.list_prices
    requires: SELECT on system.billing; GA (system.billing.usage and system.billing.list_prices are generally
      available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    confidence: needs_confirmation
    confidence_note: system.billing.cloud_infra_cost does not exist in this workspace; this query substitutes
      a DBU-derived estimate at the effective list price (DEC-66.1), so the dollar figures here are an
      estimate, not a reconciled cloud bill, and they exclude non-DBU cloud infra/instance/egress cost
      entirely.
    healthy: n/a - inventory
    investigate_if: n/a - inventory
    actions: []
    next:
    - query_id: cost_totals_by_sku_day
      if: for the same window broken out by SKU/workspace instead of cloud/currency
    - query_id: cost_networking_egress
      if: for the DBU-billed egress slice specifically
    caveats: system.billing.cloud_infra_cost does not exist in this workspace - system.billing contains
      only usage, list_prices, and attributed_usage. Cloud-provider infra/instance/egress cost outside
      DBUs is not available as a system table here and must be treated as not_assessed, never fabricated.
      As a real substitute, this query estimates dollar cost as usage_quantity x list_prices.pricing.effective_list.default
      (DEC-66.1's one basis - the effective, post-promotion list price; no negotiated-rate source exists,
      see cost_actual_vs_list_by_sku), matched on sku_name + cloud + usage_unit within the price's effective
      window (price_end_time IS NULL = currently effective). currency_code comes from list_prices because
      system.billing.usage has no currency column. This aggregates by workspace_id / usage_date / cloud
      / currency_code (workspace_id comes from system.billing.usage, the only side of the join that carries
      it - list_prices has no workspace column) and deliberately does not join the compute.warehouses
      / clusters change-history tables, which would fan out rows and double-count the SUM. An empty result
      means "not assessed," never $0. price_basis is 'unpriced' when any non-free-usage SKU in that day/cloud/currency
      group had no matching price row (the total then understates cost), 'free' when every matched SKU
      is a FREE_USAGE SKU (a real $0, not a gap), and 'priced' otherwise.
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/cost/cost_cloud_infra.sql
    order_by: u.usage_date DESC, u.cloud, p.currency_code
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - usage_date
        - cloud
        - currency_code
- name: f_cost_daily_by_resource
  description: 'One row = one day''s usage for one resource. resource_type is workspace, warehouse, job,
    cluster (an all-purpose cluster: usage with a cluster_id but no job or pipeline) or pipeline. resource_key
    is the workspace_id for a workspace row, else workspace_id:resource_id. Per type, the 100 resources
    with the most list-price dollars in the window keep their own rows; the rest are pooled per workspace
    and day into one row with is_other TRUE, resource_key workspace_id:other and pooled_count resources.
    dbus are net DBUs; usd_list prices every usage unit at the effective list rate (free-tier usage is
    a real $0, unpriced usage adds nothing and is counted in unpriced_quantity). billed_hours (warehouse
    and cluster) counts the hours it billed; billed_runs counts the job runs (job) or pipeline updates
    (pipeline) that billed that day. Use it to compare a resource''s average day before and after a change,
    and to split a change into how long or how often it ran against what each hour or run cost. warehouse_id,
    job_id, pipeline_id and cluster_id repeat resource_id for that type, so a tag filter reaches the resource''s
    own tags.'
  meta:
    query_id: cost_daily_by_resource
    title: Daily DBUs and list-price dollars per workspace, warehouse, job, all-purpose cluster and pipeline
    domain: cost
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: false
    empty_if:
    - no_activity
    reads:
    - system.billing.usage
    - system.billing.list_prices
    requires: SELECT on system.billing; GA
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    confidence: needs_confirmation
    confidence_note: New app-owned query, not yet run live. Confirm that one warehouse's days add up to
      its total in cost_chargeback_by_warehouse for the same window.
    healthy: n/a - inventory
    investigate_if: n/a - inventory
    actions: []
    next:
    - query_id: cost_chargeback_by_warehouse
      if: ''
    - query_id: cost_chargeback_by_job
      if: ''
    - query_id: cost_chargeback_by_cluster
      if: the same resources as one total for this period and the one before
    caveats: 'GRAIN - usage_date, resource_type, resource_key. The types overlap: a job''s usage is also
      in its workspace''s rows, so never add rows of different types together. A job includes its serverless
      and job-cluster usage. A run or hour that spans midnight counts on both days. A workspace_id NULL
      row is account-level usage, resource_key ''account''. Corrections are netted (SUM across every record_type);
      billed_hours counts ORIGINAL records only. The current day is excluded, since billing.usage lands
      with ingestion lag. DEC-66.1 - the effective list price only, never a negotiated rate.'
    sql_url: app/queries/app/cost/cost_daily_by_resource.sql
    order_by: usage_date DESC, resource_type, resource_key
  columns:
