- name: f_cost_daily_spikes
  description: One row = one day this workspace/product's own spend cleared :spike_ratio times its own
    trailing :baseline_days median, at or above the :min_spend_usd floor. est_day_usd_list is that day's
    total; est_baseline_usd_list is the trailing median it is judged against; spike_ratio_actual is est_day_usd_list
    over that median; top_skus names the SKUs that made up most of the day (the drivers to look at first).
  meta:
    query_id: cost_daily_spikes
    title: Days a workspace/product's spend jumped well above its own recent trailing baseline
    domain: cost
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: true
    empty_if:
    - ingestion_lag
    - no_activity
    reads:
    - system.billing.usage
    - system.billing.list_prices
    requires: SELECT on system.billing; GA (system.billing.usage and system.billing.list_prices are generally
      available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days - the days scanned for a spike
    - name: baseline_days
      default: 14
      meaning: trailing days, immediately before each scanned day, whose median spend is that day's baseline
    - name: spike_ratio
      default: 2.0
      meaning: a day flags once its own spend is at least this many times its trailing baseline median
    - name: min_spend_usd
      default: 50
      meaning: a day's own spend must be at least this before it can flag, so a jump between two tiny
        dollar figures never reads as a spike
    - name: min_baseline_days
      default: 3
      meaning: fewer trailing days than this makes the median too thin to trust, so the day reads NOT_ASSESSED
        instead of a ratio built on one or two days
    confidence: needs_confirmation
    confidence_note: New app-owned query, not yet run live. Uses the same effective-list-price join (DEC-66.1)
      every priced cost query here already uses; confirm on your account that a day you know had an unusual
      spend jump (a backfill, a burst of job runs, a new SKU turned on) reads WARN here with a spike_ratio_actual
      and top_skus that match what you already know happened.
    healthy: 'status = OK is never itself returned as a row (see caveats: this query emits ONLY WARN or
      NOT_ASSESSED days) - a day whose own spend never clears :min_spend_usd, or that clears the floor
      but not :spike_ratio, or that clears both but has no baseline, simply has no row when the floor
      alone is what stops it, so "no row for a workspace/product in the window" is (mostly) the healthy
      case - see NOT_ASSESSED below for the one exception.'
    investigate_if: 'WARN - every row returned above the floor with a real trailing baseline of at least
      :min_baseline_days days: a real jump on a real amount of money. NOT_ASSESSED - read not_assessed_reason:
      ''no_baseline_history'' when this workspace/product cleared :min_spend_usd on this day but has no
      earlier spend at all in the trailing :baseline_days before it (a brand-new workspace or a SKU that
      only just started billing); ''short_baseline'' when it has some earlier spend but fewer than :min_baseline_days
      days of it, too thin a median to trust - the $ floor is checked first, so a NOT_ASSESSED row always
      represents a day with real money behind it, never a $1 non-event.'
    actions:
    - open cost_dollarized_by_sku_day for this workspace and day and read top_skus against it - a backfill
      or restatement usually shows as one SKU/day, a genuine spike as many (free);
    - check cost_period_over_period for the same workspace/product - one spike day inside an otherwise
      flat period reads differently from a period that is trending up throughout (free);
    - if the spike is real new usage (a job that started running more often, a new endpoint, a bigger
      backfill) rather than a one-off correction, the matching domain tab names the resource and whether
      it is worth scaling down (config) or is deliberate growth (spend).
    next:
    - query_id: cost_dollarized_by_sku_day
      if: for the SKU-level detail behind one spike day
    - query_id: cost_period_over_period
      if: for whether the whole period is trending, not just one day
    - query_id: cost_monthly_actuals
      if: for the calendar-month total the spike day landed in
    caveats: 'DEC-66.1 - the effective list price only, never a negotiated rate. DEC-62 - every number
      here is a measured day against a measured trailing median, never a projection. BASELINE - the median
      is taken over whatever days in the trailing :baseline_days window actually have a usage row for
      this workspace/product; a day with genuinely zero usage has no row there and is silently skipped
      rather than counted as a $0 baseline day, so an intermittent workload''s baseline sits a little
      higher than a true zero-inclusive median would. The $ floor (:min_spend_usd) is checked BEFORE the
      baseline-size cases, so a thin day that could never clear the floor never appears as a NOT_ASSESSED
      row either - NOT_ASSESSED (no_baseline_history) fires when the day clears the floor but has NO usage
      rows at all for this workspace/product anywhere in the trailing window; NOT_ASSESSED (short_baseline)
      fires when it has 1 or more but fewer than :min_baseline_days days of earlier spend - a median over
      that few days is too easily swung by one unusual day to band a verdict on. Account-level usage (workspace_id
      NULL) is judged the same way as any workspace''s own usage - every join here matches workspace_id/billing_origin_product
      null-safely, so an account-level day finds its own account-level baseline and drivers instead of
      always reading no_baseline_history. DRIVERS - top_skus is the top 3 SKUs that day by list-priced
      dollars, each shown with its own rounded dollar figure, or "(no list price)" / "(free)" when that
      SKU could not be priced at all; the list is deduplicated and its internal order is not guaranteed
      to be sorted by dollars - read the per-SKU figures printed in it, not its left-to-right order. price_basis
      is computed over the flagged day only - ''unpriced'' when any non-free-usage SKU that day had no
      matching list_prices row (est_day_usd_list then understates that day), ''free'' when every matched
      SKU is a FREE_USAGE SKU (a real $0), ''priced'' otherwise. Corrections are netted (SUM across all
      record_types - never filter to ORIGINAL only). The current, incomplete day is excluded from both
      the scanned days and the baseline, since billing.usage lands with ingestion lag and a trailing partial
      day would otherwise never be able to clear the floor honestly. This query returns ONLY the days
      that flag or that cannot be assessed - a workspace/product with no spike in the window (including
      a day whose own spend never clears :min_spend_usd) has no row at all, by design (DEC-57): pair it
      with cost_period_over_period or cost_monthly_actuals for the full, unfiltered picture.'
    sql_url: app/queries/app/cost/cost_daily_spikes.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 WHEN 'NOT_ASSESSED' THEN 2 ELSE 3
      END, est_day_usd_list DESC, workspace_id, billing_origin_product, usage_date
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - billing_origin_product
        - usage_date
- name: f_cost_dbsql_allocation_gap
  description: 'One row = either the raw or the attributed DBSQL DBU total for a workspace + warehouse
    + day + cloud, labeled by source_kind. Difference the two source_kind rows for the same workspace/warehouse/day/cloud
    yourself: raw minus attributed is the DBU volume Databricks'' fair-split allocation could not attribute
    back to a consuming entity - a large, persistent gap points at cross-subsidized shared SQL-warehouse
    pools. coverage_status reads NOT_ASSESSED (repeated on every row, a window-wide flag) when the attributed
    side has zero rows anywhere in the window - the gap cannot be computed at all, not "nothing was attributed".'
  meta:
    query_id: cost_dbsql_allocation_gap
    title: DBSQL raw vs attributed DBU allocation gap
    domain: cost
    tier: deep
    stars: false
    origin: vendored
    windowed: true
    is_finding: false
    empty_if: []
    reads:
    - system.billing.usage
    - system.billing.attributed_usage
    requires: SELECT on system.billing; GA (system.billing.usage and system.billing.attributed_usage are
      generally available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    confidence: needs_confirmation
    confidence_note: system.billing.attributed_usage's quantity column is active_usage_quantity, not usage_quantity;
      confirm that column and the billing_origin_product = 'SQL' literal for DBSQL scope on your account
      before trusting the gap.
    healthy: n/a - the gap is a difference you compute between this query's 'raw' and 'attributed' rows
      for the same key, not a single-row band; a small, stable gap is the healthy case (field heuristic).
    investigate_if: a growing or large raw-minus-attributed gap for the same day/cloud - field heuristic;
      this needs the two rows differenced yourself, so no per-row status is computed here (see caveats).
      coverage_status = NOT_ASSESSED means the attributed side was never populated for this window - do
      not read the raw-only rows as "no attribution gap".
    actions:
    - confirm which SQL warehouses are shared/multi-tenant vs single-team, since fair-split allocation
      struggles most on shared pools (free);
    - split a heavily shared warehouse into per-team warehouses, or enable/verify usage-policy tagging
      on it so attribution has more to work with (config);
    - if the gap is small and structural, accept it and document the residual as an allocation cost of
      shared infrastructure (spend, in the sense of accepted overhead).
    next:
    - query_id: cost_usage_policy_coverage
      if: uncovered serverless DBSQL usage is one likely driver of the gap
    - query_id: cost_chargeback_by_identity
      if: for an identity-level cut of the same SQL usage
    caveats: 'attributed_usage carries Databricks'' fair-split allocation of shared-pool DBUs back to
      the consuming entity, but its coverage is DBSQL (SQL warehouses) only - it does not cover jobs/DLT/all-purpose.
      So the gap (raw DBSQL DBUs minus attributed DBSQL DBUs) is meaningful only when both sides are scoped
      to DBSQL, which is why both branches here filter to billing_origin_product = ''SQL''. This deliberately
      does not join the two tables row-to-row - the two source_kind rows are emitted separately via UNION
      ALL precisely so you difference them yourself for the same workspace/warehouse/day/cloud, which
      is also why no per-row status/band is computed in this query: a CRITICAL/WARN verdict belongs on
      the differenced gap, not on either row alone. workspace_id and warehouse_id (usage_metadata.warehouse_id,
      present on both system.billing.usage and system.billing.attributed_usage) narrow the gap down to
      the actual shared warehouse driving it, rather than a whole cloud/day. coverage_status is a WINDOW-WIDE
      flag (computed once over the whole result with a window function, then repeated on every row) that
      reads NOT_ASSESSED when the ''attributed'' source_kind has zero rows anywhere in the window - the
      table exists but was never populated for this scope/window, which otherwise looks identical to "nothing
      to attribute" if you only look at the raw side; ''assessed'' means the attributed side has at least
      one row somewhere in the window (not that every key is covered). In particular this does not join
      run_as = executed_by: those are different identities (run_as is the workload''s principal, executed_by/attributed
      identity is the query author), and equating them would be a real bug. Net DBUs sum usage_quantity
      (raw) / active_usage_quantity (attributed) across all record_types (corrections already netted).
      usage_unit is filtered to DBU. If system.billing.attributed_usage or its active_usage_quantity column
      is absent on your account, this branch errors rather than silently reading zero.'
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/cost/cost_dbsql_allocation_gap.sql
    order_by: usage_date DESC, cloud, billing_origin_product, source_kind
