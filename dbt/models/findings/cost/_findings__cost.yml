    requires: SELECT on system.billing, system.compute, system.access; billing usage/list_prices and system.compute.{clusters,
      warehouses, instance_pools} are GA, workspaces_latest is Public Preview
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days
    - name: warn_resource_dbus_per_day
      default: 50
      meaning: DBUs/day on a single cluster, warehouse, or instance pool that flags WARN
    - name: crit_resource_dbus_per_day
      default: 200
      meaning: DBUs/day that flags CRITICAL
    confidence: confirmed
    confidence_note: usage_metadata.{cluster_id, warehouse_id, instance_pool_id} and product_features.is_serverless
      are documented system.billing.usage columns.
    healthy: net_usage_quantity below :warn_resource_dbus_per_day DBUs/day per resource (field heuristic
      - tune :warn_resource_dbus_per_day for your account).
    investigate_if: net_usage_quantity at/above :warn_resource_dbus_per_day (WARN) or :crit_resource_dbus_per_day
      (CRITICAL) DBUs/day - field heuristic; a single spike day matters less than the same resource showing
      up repeatedly. A CRITICAL/WARN row means "large", not "wasteful".
    actions:
    - confirm the cluster/warehouse/pool is still needed and not an orphaned always-on resource (free);
    - resolve the resource's name via classic_clusters_config_current or sql_warehouse_config_current
