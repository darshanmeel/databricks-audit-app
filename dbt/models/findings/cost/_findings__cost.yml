- name: f_genie_usage
  description: 'One row = one day''s Genie usage for one workspace, surface, channel, Genie agent, run-as
    identity and free/paid split. period says whether the day is in the current window or the equal-length
    window before it. surface is GENIE_CODE (the coding assistant: it writes SQL or Python, a person runs
    it), GENIE_AGENTS (Genie agents, formerly Genie spaces: they answer questions and run SQL themselves;
    agent_id names the agent) or GENIE_ONE (chat). channel is how Genie was reached (UI is the browser).
    identity_type is user, service_principal or unknown, from run_as. dbus are net DBUs; usd_list prices
    them at the effective list rate (free-tier rows are a real $0, unpriced rows add nothing and are counted
    in unpriced_dbus). previous_period_covered is FALSE when the account''s billing history does not reach
    back to the start of the previous period, so a change against it would overstate growth.'
  meta:
    query_id: genie_usage
    title: Genie usage by user, surface and channel - DBUs and list-price dollars, this period and the
      one before
    domain: cost
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: false
    empty_if:
    - no_activity
    reads:
    - system.billing.usage
    - system.billing.list_prices
    requires: SELECT on system.billing; GA. usage_metadata.genie (surface, channel, agent_id) is a newer
      field of system.billing.usage - on an account whose table does not have it yet this query errors
      and reads as not run, never as zero Genie usage
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days - the current period is the most recent N days, the previous period
        is the equal-length N days immediately before it
    confidence: needs_confirmation
    confidence_note: New app-owned query, not yet run live. The field names come from Databricks' Genie
      cost documentation (usage_metadata.genie.surface / channel / agent_id, billing_origin_product =
      'GENIE'); the price join is the effective-list-price join every priced cost query in this app uses
      (DEC-66.1). Confirm on your account that one person's Genie Code use reads surface GENIE_CODE and
      channel UI, and that a Genie agent called from an app or a serving endpoint reads a channel other
      than UI or a service principal in run_as.
    healthy: n/a - inventory
    investigate_if: n/a - inventory
    actions: []
    next:
    - query_id: query_provenance_by_source
      if: the SQL statements Genie agents ran on warehouses, source_kind = 'genie'
    - query_id: cost_chargeback_by_service
      if: Genie against every other product
    caveats: 'GRAIN - usage_date, workspace_id, surface, channel, agent_id, run_as, is_free; NULL is its
      own value in every key (an older row with no genie struct reads surface, channel and agent_id NULL).
      DEC-66.1 - the effective list price only, never a negotiated rate. Free tier - a SKU whose name
      contains FREE (for example GENIE_FREE_USAGE) is free-tier usage, priced at a real $0. DBU usage
      only (usage_unit = ''DBU''). Corrections are netted (SUM across every record_type). The current
      day is excluded from both periods, since billing.usage lands with ingestion lag. "Built into apps
      or agents" is not a column: read it as channel other than UI, or a service principal in run_as.
      Genie called from inside another product (for example a supervisor agent) is billed to that product,
      not here. run_as is masked the same way as every other identity column when identity masking is
      on.'
    sql_url: app/queries/app/cost/genie_usage.sql
    order_by: a.usage_date DESC, a.workspace_id, usd_list DESC
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - usage_date
        - workspace_id
        - surface
        - channel
        - agent_id
        - run_as
        - is_free
