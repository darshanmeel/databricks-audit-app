- name: f_cost_chargeback_by_job
  description: One row = one job's (workspace_id, job_id) billed jobs-compute DBU usage (usage_metadata.job_id),
    at the effective list price (DEC-66.1), in the selected window versus the equal-length window right
    before it. est_current_usd_list / est_previous_usd_list are the two totals; est_change_usd_list and
    change_pct compare them. share_of_total_pct is this job's share of every job's current-period spend
    combined. price_basis discloses pricing coverage across both windows combined; not_assessed_reason
    explains a NOT_ASSESSED row. is_other=true is the one pooled row for every status=OK job ranked below
    :top_n by current spend (every other column NULL on that row, pooled_count says how many); it always
    reads status OK (see caveats).
  meta:
    query_id: cost_chargeback_by_job
    title: Chargeback by job at list price, current period versus the one before it
    domain: cost
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: true
    empty_if:
    - no_activity
    reads:
    - system.billing.usage
    - system.billing.list_prices
    - system.lakeflow.jobs
    requires: SELECT on system.billing and system.lakeflow; GA (system.billing.usage, system.billing.list_prices
      and system.lakeflow.jobs are generally available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days - the current period is the most recent N days, the previous period
        is the equal-length N days immediately before it
    - name: warn_increase_pct
      default: 25
      meaning: percent increase in a job's list-priced spend, current period over previous, at/above which
        WARN
    - name: crit_increase_pct
      default: 50
      meaning: percent increase at/above which CRITICAL
    - name: min_spend_usd
      default: 20
      meaning: the current period's own list-priced spend must be at least this before a percent change
        is judged - below it the row reads OK regardless of the swing, since a percent figure on a tiny
        base is noise
    - name: top_n
      default: 20
      meaning: how many status=OK jobs, ranked by current-period spend descending, are kept as their own
        row before the rest are pooled into one is_other=true row - every WARN/CRITICAL/NOT_ASSESSED job
        is always kept as its own row, never pooled, so a real finding on a small job can never be hidden
        behind the cap
    confidence: needs_confirmation
    confidence_note: New app-owned query, not yet run live. Reuses the effective-list-price join every
      priced cost query in this app already uses (DEC-66.1) and the exact current-vs-previous- window
      contract cost_period_over_period already established (same NOT_ASSESSED / price_basis rules, applied
      per job instead of per workspace+product); confirm on your account that a job you know grew or shrank
      between two recent equal periods matches this query's change_pct, and that job_name/run_as resolve
      for a job you recognise.
    healthy: status OK - no increase at/above :warn_increase_pct, or the job's own current-period spend
      (a real $0 counts) sits below :min_spend_usd
    investigate_if: 'CRITICAL - the increase is at/above :crit_increase_pct on at least :min_spend_usd
      of current spend, or the job is brand-new spend above the floor with nothing in the previous period
      to compare against (there is no honest percentage for a jump from zero, so it reads CRITICAL outright);
      WARN - at/above :warn_increase_pct. NOT_ASSESSED - read not_assessed_reason: ''previous_window_not_covered''
      when the account''s own earliest recorded usage does not reach back far enough to cover the previous
      window at this window length; ''current_period_unpriced'' when this job''s current-period spend
      could not be priced at all (every current-period SKU unmatched in list_prices, none FREE_USAGE)
      - no dollar figure, priced or a real free $0, to judge; ''previous_period_unpriced'' is the same
      gap on the previous period''s own side.'
    actions:
    - open cost_chargeback_by_cluster for this job's workspace to see which cluster ran it, or cost_chargeback_by_tag_value
      for the tag behind the growth (free);
    - if the growth is deliberate, set or tighten a budget policy for the job before it compounds another
      period (config, not code);
    - check lakeflow_job_duration_regression for the same job to rule out a runtime regression rather
      than a genuine workload increase (free).
    next:
    - query_id: cost_chargeback_by_cluster
      if: the cluster/job-cluster cut of the same spend
    - query_id: cost_chargeback_reconcile
      if: this view's own total against the account's billing total
    - query_id: lakeflow_job_duration_regression
      if: a runtime regression behind the same job
    caveats: DEC-66.1 - the effective list price only, never a negotiated rate; the same basis on both
      windows. job_name / creator_user_name / run_as are NULL for a one-time SUBMIT_RUN / WORKFLOW_RUN
      execution, which never writes a row to system.lakeflow.jobs (same gap lakeflow_job_run_cost.sql
      documents) - the row itself is still charged back correctly by job_id, only the label is missing.
      Scoped to jobs-compute DBU usage only (usage_metadata.job_id populated, usage_unit = 'DBU'); a job's
      serverless SQL or model-serving spend is not attributed here - this is a chargeback reference, not
      a fix for a listed problem. Corrections are netted (SUM across all record_types - never filter to
      ORIGINAL only). The current day is excluded from both windows, same as every other windowed cost
      query, since billing.usage lands with ingestion lag and the trailing day is provisional. POOLING
      - the is_other row only ever pools jobs that were ALREADY status=OK on their own, and it always
      reads status OK itself, however large the combined dollars - a rollup of small, healthy jobs is
      never itself a finding; it can never hide a WARN/CRITICAL/NOT_ASSESSED job, which always keeps its
      own row regardless of :top_n.
    sql_url: app/queries/app/cost/cost_chargeback_by_job.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 WHEN 'NOT_ASSESSED' THEN 2 ELSE 3
      END, is_other, est_change_usd_list DESC NULLS LAST, workspace_id, job_id
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - job_id
- name: f_cost_chargeback_by_service
  description: One row = one workspace's spend on one product line in the selected window against the
    equal-length window right before it, both at the effective list price (DEC-66.1). A NULL billing_origin_product
    is a genuine unattributed-usage row, kept as its own line (service_label 'Unattributed'), never dropped;
    a NULL workspace_id is a genuine account-level usage row (some networking/storage SKUs bill with no
    workspace_id at all), also kept as its own line. usd_list and prev_usd_list are the two totals; change_usd_list
    and change_pct compare them. price_basis discloses pricing coverage across both windows combined;
    not_assessed_reason explains a NOT_ASSESSED row.
  meta:
    query_id: cost_chargeback_by_service
    title: Chargeback by product line (billing_origin_product), with change vs the previous period
    domain: cost
    tier: standard
    stars: false
    origin: app
    windowed: true
    is_finding: true
    empty_if:
    - ingestion_lag
    - no_activity
    reads:
    - system.billing.usage
    - system.billing.list_prices
    requires: SELECT on system.billing; GA (system.billing.usage and system.billing.list_prices are generally
      available)
    params:
    - name: period_days
      default: 30
      meaning: rolling window in days - the current period is the most recent N days, the previous period
        the equal-length N days before it
    - name: warn_increase_pct
      default: 25
      meaning: percent increase in list-priced spend, current period over previous, at/above which WARN
    - name: crit_increase_pct
      default: 50
      meaning: percent increase at/above which CRITICAL
    - name: min_spend_usd
      default: 20
      meaning: the current period's own list-priced spend must be at least this before a percent change
        is judged - below it the row reads OK regardless of the swing. Needs 2x :period_days of billing
        history in the account for the previous-period comparison
    confidence: needs_confirmation
    confidence_note: New app-owned query, not yet run live. Reuses the effective-list-price join every
      priced cost query in this app already uses (DEC-66.1), cost_period_over_period's own WARN/CRITICAL
      band and NOT_ASSESSED coverage guard (DEC-62/DEC-64), and the service_label naming cost_sku_trend_12m's
      product_label CASE already uses for the billing_origin_product values seen elsewhere in this app
      - confirm both against your own account's values, and that a product line you know grew or shrank
      between two recent equal periods matches change_pct.
    healthy: status OK - no increase at/above :warn_increase_pct, or the row's own current-period spend
      (a real $0 counts) sits below :min_spend_usd. The comparison is judged per workspace, not account-wide
      (see caveats), so a product line's account-wide swing may not itself flag.
    investigate_if: 'CRITICAL - the increase is at/above :crit_increase_pct on at least :min_spend_usd
      of current spend, or brand-new spend above the floor with nothing in the previous period to compare
      against. WARN - at/above :warn_increase_pct. NOT_ASSESSED - read not_assessed_reason: ''previous_window_not_covered''
      when the account''s own earliest recorded usage does not reach back far enough to cover the previous
      window at this window length; ''current_period_unpriced'' / ''previous_period_unpriced'' when that
      side''s whole spend could not be priced at all.'
    actions:
    - open cost_by_billing_origin_product for the same window to see the raw DBU/byte volume behind the
      dollar move (free);
    - open cost_sku_trend_12m to see which SKU inside this product line is driving the 12-month trend
      (free);
    - if the increase is deliberate growth, set or tighten a budget policy for that product line before
      it compounds another period (config, or spend if intentional).
    next:
    - query_id: cost_by_billing_origin_product
      if: for the raw usage volume behind the move
    - query_id: cost_period_over_period
      if: for the same window cut by workspace instead
    - query_id: cost_sku_trend_12m
      if: for the SKU-level 12-month trend inside a growing product line
    caveats: DEC-66.1 - the effective list price only, never a negotiated rate; the same basis on both
      windows. DEC-62 - both windows are measured, never projected or scaled. This needs the account's
      own billing history to reach back 2x :period_days for a real previous-period comparison (DEC-64);
      short of that, every row reads NOT_ASSESSED (previous_window_not_covered) rather than a false CRITICAL
      "infinite increase" from an empty previous window - the same guard cost_period_over_period uses.
      service_label is a best-effort, hand-written mapping of billing_origin_product to a plain name (the
      same pairs cost_sku_trend_12m's product_label uses); an unrecognised value falls back to a lower-cased
      version of the raw string rather than being dropped or shown blank - check billing_origin_product
      itself for the true value. price_basis is computed over BOTH windows combined - 'unpriced' when
      any non-free-usage SKU in either window had no matching list_prices row (the totals then understate
      cost), 'free' when every matched SKU is a FREE_USAGE SKU (a real $0), 'priced' otherwise. Corrections
      are netted (SUM across all record_types - never filter to ORIGINAL only). The current day is excluded
      from both windows, since billing.usage lands with ingestion lag and the trailing day is provisional.
      Product-line count is small and fixed (Databricks' own enum), so this query is never top-N'd or
      pooled into an "other" row, unlike cost_chargeback_by_warehouse. WORKSPACE - the grain is now workspace
      + product line, so the same product line appears once per workspace; share_of_total_pct and total_usd_list
      stay account-wide (a row's share of the WHOLE account's spend, unchanged from before this split),
      never a per-workspace share.
    sql_url: app/queries/app/cost/cost_chargeback_by_service.sql
    order_by: CASE status WHEN 'CRITICAL' THEN 0 WHEN 'WARN' THEN 1 WHEN 'NOT_ASSESSED' THEN 2 ELSE 3
      END, a.workspace_id, change_usd_list DESC NULLS LAST, a.billing_origin_product
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  - name: status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - OK
          - WARN
          - CRITICAL
          - NOT_ASSESSED
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - workspace_id
        - billing_origin_product
