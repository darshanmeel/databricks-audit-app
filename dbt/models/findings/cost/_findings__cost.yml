- name: f_pricing_list_prices_raw
  description: One row = a SKU's price at a point in time, with the full pricing struct preserved as JSON.
    pricing_default is the pre-promotion (sticker) list rate; pricing_effective_list_json parses to the
    effective (post-promotion) list rate that DEC-66.1 uses as this app's one dollar basis. price_end_time
    NULL means this is the currently active price. pricing_promotional_json carries the raw promotional
    struct for you to parse yourself. Neither price is negotiated or account-specific - no negotiated-rate
    source exists anywhere in system.billing.
  meta:
    query_id: pricing_list_prices_raw
    title: Raw Databricks list price history
    domain: cost
    tier: lite
    stars: false
    origin: vendored
    windowed: false
    is_finding: false
    empty_if: []
    reads:
    - system.billing.list_prices
    requires: SELECT on system.billing; GA (system.billing.list_prices is generally available)
    params: []
    confidence: confirmed
    confidence_note: pricing.default, pricing.effective_list, and pricing.promotional are documented system.billing.list_prices
      columns.
    healthy: n/a - inventory
    investigate_if: n/a - inventory
    actions: []
    next:
    - query_id: cost_actual_vs_list_by_sku
      if: for a ready-made actual-vs-list comparison built from this same table
    - query_id: cost_dollarized_by_sku_day
      if: for a ready-made dollarized cost series, though its list_rate path is less confirmed than dollarizing
        from this raw table yourself
    caveats: This is a small table (one row per SKU price change) - it is collected raw with no aggregation
      so you can pick the right [price_start_time, price_end_time) window per usage row yourself, and
      so this collection survives any drift in the pricing struct's internal shape. effective_list and
      promotional are serialized to JSON strings precisely so collection never breaks if their internal
      shape changes - parse them defensively. price_end_time NULL means the currently active price. pricing.default
      is typed STRING in the documentation - confirm it is numerically castable before using it in arithmetic.
    sql_url: https://github.com/darshanmeel/crosshire-audit-databricks-admin/blob/master/queries/cost/pricing_list_prices_raw.sql
    order_by: sku_name, cloud, currency_code, price_start_time
  columns:
  - name: window_days
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - 0
          - 7
          - 30
          - 90
          quote: false
  data_tests:
  - unique_grain:
      arguments:
        columns:
        - window_days
        - sku_name
        - cloud
        - currency_code
        - price_start_time
