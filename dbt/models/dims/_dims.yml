# dbt/models/dims/_dims.yml -- T-40. Hand-written (not generated by tools/generate_models.py,
# which only ever touches dbt/models/findings/**, T-06). No _dims.yml existed before this task
# (T-23's dim_workspace/int_workspace_tag_hints/dim_list_prices were never given schema tests --
# "no dims/seed yml was named by this task file, so none was created", tasks/T-23-dims-models-and
# -seeds.md Hand-off notes); T-40 owns creating the file and covers only the 4 dims it adds,
# leaving the 3 earlier ones exactly as they were (out of scope -- retrofitting them is a
# follow-up task, not this one's).
#
# not_null on every key column, plus unique_grain (dbt/tests/generic/test_unique_grain.sql, the
# same generic test every generated findings model uses) on each dim's own grain -- job_id/
# pipeline_id are unique only WITHIN a workspace (every vendored query that joins on them says
# so), so their grain is [workspace_id, job_id] / [workspace_id, pipeline_id]; cluster_id/
# warehouse_id are globally-unique GUIDs (the vendored library's own caveats, and
# classic_clusters_config_current.sql / sql_warehouse_config_current.sql's own ROW_NUMBER
# partitions confirm it), so their grain is the bare id, matching each model's own SQL.
#
# int_workspace_tag_hints added by T-63 (DEC-60): its grain is [workspace_id, canonical_key],
# where canonical_key is legitimately NULL on the one T-23 env-hint row per workspace (no
# not_null test on that column for exactly that reason) and non-NULL on the one row per
# (workspace_id, configured canonical key) it also carries.
version: 2
models:
  - name: dim_job
    description: >
      One row per job_id (unique within a workspace, so keyed on workspace_id + job_id) --
      the latest known name from system.lakeflow.jobs (SCD2, latest row by change_time).
      Object name only; no identity column (creator/run_as and friends) is carried here.
    columns:
      - name: workspace_id
        data_tests:
          - not_null
      - name: job_id
        data_tests:
          - not_null
    data_tests:
      - unique_grain:
          arguments:
            columns:
              - workspace_id
              - job_id

  - name: dim_cluster
    description: >
      One row per cluster_id (a globally-unique GUID, so keyed on cluster_id alone) -- the
      latest known cluster_name/cluster_source from system.compute.clusters (SCD2, latest row
      by change_time). Object name only; owned_by is not carried here.
    columns:
      - name: cluster_id
        data_tests:
          - not_null
    data_tests:
      - unique_grain:
          arguments:
            columns:
              - cluster_id

  - name: dim_warehouse
    description: >
      One row per warehouse_id (a globally-unique GUID, so keyed on warehouse_id alone) --
      the latest known warehouse_name from system.compute.warehouses (SCD2, latest row by
      change_time). Object name only; created_by is not carried here.
    columns:
      - name: warehouse_id
        data_tests:
          - not_null
    data_tests:
      - unique_grain:
          arguments:
            columns:
              - warehouse_id

  - name: dim_pipeline
    description: >
      One row per pipeline_id (unique within a workspace, so keyed on workspace_id +
      pipeline_id) -- the latest known pipeline_name from system.lakeflow.pipelines (SCD2,
      latest row by change_time). Object name only; created_by/run_as are not carried here.
    columns:
      - name: workspace_id
        data_tests:
          - not_null
      - name: pipeline_id
        data_tests:
          - not_null
    data_tests:
      - unique_grain:
          arguments:
            columns:
              - workspace_id
              - pipeline_id

  - name: int_workspace_tag_hints
    description: >
      T-23 / T-63 (DEC-60). One row per workspace_id for the legacy env-ish tag_hint
      (canonical_key IS NULL), plus one row per (workspace_id, canonical_key) for every key in
      the `tag_aliases` dbt var -- value/share/coverage/dbus/reason, ranked by summed DBUs, never
      row count. `share` is DOMINANCE (top value's DBUs / the DBUs carrying that key) and drives
      the label; `coverage` is how much of the workspace carries the key at all. They are separate
      because a value at 100% dominance on 3% coverage is not the same fact as 100% on 99%, and
      folding the second into the word "mixed" made an unambiguous single-value workspace read as
      ambiguous. dim_workspace pivots the canonical_key rows into its own <key>/<key>_share/
      <key>_reason columns.
    columns:
      - name: workspace_id
        data_tests:
          - not_null
    data_tests:
      - unique_grain:
          arguments:
            columns:
              - workspace_id
              - canonical_key
